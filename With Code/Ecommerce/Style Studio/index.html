#stage{position:fixed;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:50% 50%}

/* ---------- model ---------- */
#modelWrap{position:absolute;left:800px;top:72px;width:440px;height:663px;margin-left:-220px;transform-origin:50% 100%;
  transition:transform 1s cubic-bezier(.65,0,.2,1)}
#modelWrap.mid{transform:translateY(345px) scale(1.5)}
#modelWrap.portrait{transform:translateY(940px) scale(2.4)}
#modelInner{position:absolute;inset:0;transform:translate3d(var(--mx,0),0,0) scaleX(var(--build,1)) scaleY(var(--height,1));transform-origin:50% 100%;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
#breath{position:absolute;inset:0;animation:breath 5.5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.006)}}
.fig{position:absolute;inset:0;background:center bottom/contain no-repeat;filter:var(--real)}
.fig.in{clip-path:inset(0 0 100% 0);animation:wipe 1.05s cubic-bezier(.7,0,.25,1) forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
#scan{position:absolute;left:-10%;right:-10%;height:2px;top:0;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,transparent,#fff 25%,#fff 75%,transparent);box-shadow:0 0 22px 6px rgba(255,255,255,.55),0 0 60px 18px rgba(214,226,255,.35)}
#scan.go{animation:scan 1.05s cubic-bezier(.7,0,.25,1) forwards}
@keyframes scan{0%{top:0;opacity:1}92%{opacity:1}100%{top:100%;opacity:0}}
#shadow{position:absolute;left:50%;bottom:-6px;width:300px;height:34px;margin-left:-150px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(30,28,26,.55),rgba(30,28,26,0));filter:blur(4px)}
#hotspots{position:absolute;inset:0}
.hot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(255,255,255,.25);border:1px solid #fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:grid;place-items:center;transition:transform .3s, opacity .4s}
.hot::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.hot::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(255,255,255,.6);animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
.hot:hover{transform:scale(1.18)}
.hot .tip{position:absolute;left:34px;top:50%;transform:translateY(-50%) translateX(-6px);white-space:nowrap;padding:7px 12px;border-radius:10px;font-size:13px;
  background:rgba(30,30,34,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);opacity:0;pointer-events:none;transition:.25s}
.hot:hover .tip{opacity:1;transform:translateY(-50%)}
.hot .tip b{font-weight:600}
#modelWrap:not(.full) #hotspots{opacity:0;pointer-events:none}

/* ---------- glass ---------- */
.glass{position:absolute;background:var(--glass);border:1px solid var(--line);border-radius:22px;
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 18px 40px -18px rgba(0,0,0,.35)}
.pill-on{box-shadow:var(--glow);background:rgba(255,255,255,.14)}
.lbl{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}

/* top bar */
#logo{position:absolute;left:30px;top:22px;display:flex;align-items:baseline;gap:18px}
#logo b{font:800 46px/1 Syne,Figtree,sans-serif;letter-spacing:-.02em}

#tabs{left:410px;top:22px;width:720px;height:54px;border-radius:30px;display:flex;align-items:center;padding:4px;gap:0}

.ib.glass{position:relative}
.ib:hover{background:rgba(255,255,255,.18)}
.badge{position:absolute;right:-3px;top:-3px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#fff;color:#222;font-size:12px;font-weight:600;display:grid;place-items:center;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.badge.on{transform:scale(1)}
.badge.bump{animation:bump .45s}

#menu{position:absolute;right:28px;top:84px;width:210px;padding:8px;border-radius:16px;transform-origin:top right;transform:scale(.9);opacity:0;pointer-events:none;transition:.25s}

#menu button{display:flex;width:100%;padding:10px 12px;border-radius:10px;font-size:14px;gap:10px;align-items:center}

/* profile */
#profile{left:24px;top:96px;width:476px;height:124px;display:flex;align-items:center;gap:20px;padding:0 16px}
#avatar{width:98px;height:98px;border-radius:18px;border:1.5px solid rgba(255,255,255,.85);background-repeat:no-repeat;background-color:rgba(255,255,255,.2);flex:none;box-shadow:0 0 16px rgba(255,255,255,.25);transition:background-image .3s}
#pname{display:flex;align-items:center;gap:12px}

#name[contenteditable=true]{background:rgba(255,255,255,.14);box-shadow:0 0 0 1px rgba(255,255,255,.6)}

.cib:hover{background:rgba(255,255,255,.18)}
#meta{margin-top:12px;display:flex;align-items:center;gap:12px;font-size:16px;color:var(--ink-2)}

#weather{display:flex;align-items:center;gap:6px;position:relative}
#weather .wtip{position:absolute;left:50%;top:30px;transform:translateX(-50%);white-space:nowrap;font-size:12px;padding:6px 10px;border-radius:8px;background:rgba(30,30,34,.6);opacity:0;transition:.2s;pointer-events:none}
#weather:hover .wtip{opacity:1}

/* left menu */
#side{left:24px;top:236px;width:172px;height:470px;padding:10px;display:flex;flex-direction:column;gap:2px;transition:transform .6s cubic-bezier(.7,0,.2,1)}
#side.away{transform:translateX(-240px)}
#side button{position:relative;z-index:1;display:flex;align-items:center;gap:14px;height:54px;padding:0 14px;border-radius:16px;font-size:16px;color:var(--ink-2);transition:color .25s}
#side button:hover{color:#fff}
#side button.on{color:#fff}
#sideInd{position:absolute;left:10px;width:152px;height:54px;border-radius:16px;transition:top .45s cubic-bezier(.7,0,.2,1)}
#rand{left:24px;top:722px;width:220px;height:52px;display:flex;align-items:center;gap:14px;padding:0 18px;border-radius:16px;font-size:16px;transition:transform .6s cubic-bezier(.7,0,.2,1)}
#rand:hover{background:rgba(255,255,255,.12)}
#rand.away{transform:translateX(-280px)}
#rand svg{transition:transform .8s cubic-bezier(.5,0,.2,1)}

/* right panel */
#panel{left:1112px;top:96px;width:464px;height:680px;padding:22px 18px 18px;overflow:hidden}
.view{position:absolute;inset:22px 18px 18px;display:flex;flex-direction:column;transition:transform .55s cubic-bezier(.7,0,.2,1),opacity .4s}
.view.hide{opacity:0;transform:translateX(30px);pointer-events:none}
.view h3{font-weight:400;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.view h3 small{font-size:12px;letter-spacing:.04em;color:var(--ink-3);text-transform:none}
#chips{display:flex;gap:6px;justify-content:space-between}
.chip{width:58px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.chip .cbox{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--line);transition:.25s}
.chip:hover .cbox{background:rgba(255,255,255,.2)}
.chip.on{color:#fff}
.chip.on .cbox{box-shadow:var(--glow);background:rgba(255,255,255,.2)}
#grid{margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;height:296px;align-content:start}
.card{position:relative;height:142px;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.06));border:1px solid var(--line);
  transition:transform .45s cubic-bezier(.3,1.4,.5,1),box-shadow .3s,opacity .35s}
.card .im{position:absolute;left:-20%;right:-20%;top:4px;bottom:-4px;background:center top/auto 104% no-repeat;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover{transform:translateY(-3px)}
.card:hover .im{transform:scale(1.06)}
.card.on{box-shadow:var(--glow),0 0 0 3px rgba(255,255,255,.25)}
.card .fav{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(20,20,24,.3);opacity:0;transform:scale(.6);transition:.3s cubic-bezier(.3,1.6,.5,1)}
.card .fav.on{opacity:1;transform:none}
.card .fav.on path{fill:#fff}
.card .nm{position:absolute;left:6px;right:6px;bottom:6px;font-size:11px;padding:3px 6px;border-radius:7px;background:rgba(20,20,24,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transform:translateY(130%);transition:transform .3s}
.card:hover .nm{transform:none}
.card.out{opacity:0;transform:scale(.85)}
.card.gone{display:none}
#acc{margin-top:auto;display:flex;flex-direction:column;gap:7px}
.row{border-radius:12px;background:var(--glass-2);border:1px solid var(--line);overflow:hidden;transition:background .25s}
.row:hover{background:rgba(255,255,255,.16)}
.row>button{width:100%;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.row>button svg{transition:transform .35s}
.row.open>button svg{transform:rotate(180deg)}
.row .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.7,0,.2,1)}
.row.open .body{grid-template-rows:1fr}
.row .body>div{overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:14px;color:var(--ink-2);border-top:1px solid rgba(255,255,255,.12)}
.item span{flex:1}
.item em{font-style:normal;color:#fff}
.add{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:.25s}
.add:hover{background:#fff;color:#222}
.add.done{background:#fff;color:#222}

/* tuning / tab views */
.sl{margin:10px 0 18px}
.sl label{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);margin-bottom:10px}
.sl label b{color:#fff;font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(90deg,#fff var(--p,50%),rgba(255,255,255,.28) var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.55);background-clip:padding-box;box-shadow:0 0 12px rgba(255,255,255,.6);cursor:grab}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.opt{padding:9px 14px;border-radius:12px;background:var(--glass-2);border:1px solid var(--line);font-size:14px;color:var(--ink-2);transition:.25s}
.opt:hover{background:rgba(255,255,255,.18);color:#fff}
.opt.on{box-shadow:var(--glow);color:#fff;background:rgba(255,255,255,.18)}
.sw{display:flex;gap:10px;margin-bottom:18px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.35);transition:.25s}
.sw button.on{box-shadow:0 0 0 3px rgba(255,255,255,.85)}
.sub{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin:2px 0 10px}
#radar{display:block;margin:0 auto 10px}
#radar polygon.val{transition:all .5s cubic-bezier(.2,.7,.2,1)}
#story{font-size:16px;line-height:1.6;color:#fff;min-height:220px;padding:16px;border-radius:14px;background:var(--glass-2);border:1px solid var(--line)}
#story .cur{display:inline-block;width:2px;height:1em;background:#fff;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.btn{height:46px;padding:0 20px;border-radius:14px;border:1.5px solid var(--line-strong);font-size:15px;letter-spacing:.05em;text-transform:uppercase;transition:.25s}
.btn:hover{background:#fff;color:#222}
.dnaRow{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:15px;color:var(--ink-2)}
.dnaRow b{color:#fff;font-weight:500}
#helix{margin:6px auto 16px}

/* bottom */
#ctrl{left:504px;top:742px;width:592px;height:54px;border-radius:18px;display:flex;align-items:center;padding:4px;gap:4px}
#ctrl button{flex:1;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:17px;transition:background .25s,opacity .25s}
#ctrl button:hover{background:rgba(255,255,255,.14)}
#ctrl button:disabled{opacity:.4;pointer-events:none}
#ctrl button.on{box-shadow:var(--glow);background:rgba(255,255,255,.14)}
#real{left:24px;top:796px;width:452px;height:88px;padding:16px 20px}
#real .t{font-size:16px}
#real .sl{margin:10px 0 0;display:grid;grid-template-columns:1fr 46px;gap:14px;align-items:center}
#real .ends{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-top:6px;padding-right:60px}
#filt{left:494px;top:796px;width:640px;height:88px;padding:12px 16px;display:flex;align-items:center;gap:16px}
#filt .t{font-size:16px;margin-bottom:8px}
#dd{position:relative}
#ddBtn{width:156px;height:38px;border-radius:12px;background:var(--glass-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:15px}
#ddBtn svg{transition:transform .3s}
#dd.open #ddBtn svg{transform:rotate(180deg)}
#ddList{position:absolute;left:0;bottom:46px;width:180px;padding:6px;border-radius:14px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s}
#dd.open #ddList{opacity:1;transform:none;pointer-events:auto}
#ddList button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px;font-size:14px}
#ddList button:hover,#ddList button.on{background:rgba(255,255,255,.16)}
#thumbs{display:flex;gap:8px;align-self:center}
.th{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background-repeat:no-repeat;transition:transform .3s,box-shadow .3s}
.th:hover{transform:translateY(-3px)}
.th.on{box-shadow:var(--glow)}
.th i{position:absolute;inset:0;mix-blend-mode:soft-light}
#next{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
#next:hover{background:rgba(255,255,255,.16)}
#save{left:1302px;top:796px;width:274px;height:88px;padding:14px;display:grid}
#saveBtn{border-radius:16px;border:1.5px solid rgba(255,255,255,.9);font-size:17px;letter-spacing:.06em;box-shadow:0 0 18px rgba(255,255,255,.35),inset 0 0 14px rgba(255,255,255,.15);transition:.3s;overflow:hidden;position:relative}
#saveBtn:hover{background:#fff;color:#222}
#saveBtn .shine{position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg)}
#saveBtn.go .shine{animation:shine .9s}
@keyframes shine{to{left:120%}}

/* library drawer */
#lib{left:504px;top:560px;width:592px;height:170px;padding:16px 18px;transform:translateY(20px) scale(.97);opacity:0;pointer-events:none;transition:.4s cubic-bezier(.7,0,.2,1)}
#lib.open{transform:none;opacity:1;pointer-events:auto}
#lib h3{font-weight:400;font-size:14px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;margin-bottom:12px}
#libRow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
#libRow .lc{flex:none;width:72px;height:104px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.12) center top/auto 104% no-repeat;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4)}}
#libEmpty{font-size:14px;color:var(--ink-2)}
.flyer{position:fixed;z-index:50;border-radius:14px;border:1px solid #fff;background:rgba(255,255,255,.2) center top/auto 104% no-repeat;pointer-events:none;transition:all .8s cubic-bezier(.7,0,.2,1)}

/* toast */
#toast{position:absolute;left:50%;top:96px;transform:translate(-50%,-20px);padding:12px 20px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:.35s cubic-bezier(.3,1.4,.5,1);display:flex;gap:10px;align-items:center;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* cursor ring for recordings (hidden normally) */
#cur{position:fixed;left:0;top:0;width:58px;height:58px;pointer-events:none;z-index:99;display:none}

/* ================= state + history ================= */

function commit(){hist.length=hi+1;hist.push({...S});hi++;syncHist();}
function syncHist(){$('#undo').disabled=hi===0;$('#redo').disabled=hi===hist.length-1;}
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];

/* ================= fit stage + parallax ================= */
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);document.documentElement.style.setProperty('--s',s);}
addEventListener('resize',fit);fit();
$('#bg').style.backgroundImage=`url("${H(BG,2400)}")`;
addEventListener('pointermove',e=>{
  const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
  $('#bg').style.setProperty('--bx',(-x*22)+'px');$('#bg').style.setProperty('--by',(-y*12)+'px');

});

/* ================= model ================= */
const figs=$('#figs');
const IMGS=LOOKS.map(l=>{const im=new Image();im.src=l.big;return im;});
let showTok=0;
async function showLook(i,anim=true){
  const l=LOOKS[i],tok=++showTok;
  $$('.card').forEach(c=>c.classList.toggle('on',+c.dataset.i===i));
  try{await IMGS[i].decode();}catch(e){}
  if(tok!==showTok)return;
  const d=document.createElement('div');d.className='fig'+(anim?' in':'');d.style.backgroundImage=`url("${l.big}")`;
  figs.appendChild(d);
  if(anim){const sc=$('#scan');sc.classList.remove('go');void sc.offsetWidth;sc.classList.add('go');
    d.addEventListener('animationend',()=>{[...figs.children].forEach(c=>c!==d&&c.remove());d.classList.remove('in');},{once:true});}
  else [...figs.children].forEach(c=>c!==d&&c.remove());
  $$('.card').forEach(c=>c.classList.toggle('on',+c.dataset.i===i));
  renderAcc();renderHot();syncFav();
}
function rescan(){const sc=$('#scan');sc.classList.remove('go');void sc.offsetWidth;sc.classList.add('go');}

/* hotspots on the figure (fractions of 1360x2048 canvas) */
const HOT_Y={tops:.24,bottoms:.47,full:.38,shoes:.95,acc:.14};
function renderHot(){
  const l=LOOKS[S.look],box=$('#hotspots');box.innerHTML='';
  [['tops',.60],['full',.60],['bottoms',.38],['shoes',.40],['acc',.56]].forEach(([k,x])=>{
    const it=l.p[k];if(!it||!it.length)return;
    const h=document.createElement('button');h.className='hot';h.style.left=(x*100)+'%';h.style.top=(HOT_Y[k]*100)+'%';
    h.innerHTML=`<span class="tip"><b>${it[0][0]}</b> · ${it[0][1]} · $${it[0][2]}</span>`;
    h.onclick=()=>{openRow(k);};
    box.appendChild(h);
  });
}

/* ================= avatar & thumbs ================= */
function faceBg(el,size,look=0){
  const crop=360,k=size/crop,url=LOOKS[look].big;
  el.style.backgroundImage=`url("${url}")`;
  el.style.backgroundSize=`${IMG_W*k}px ${IMG_H*k}px`;
  el.style.backgroundPosition=`${-500*k}px ${-46*k}px`;
}
faceBg($('#avatar'),98);

/* ================= grades (filters) ================= */
const GRADES=[
 {n:'Daylight',f:'none',t:'transparent'},
 {n:'Soft Film',f:'contrast(.92) saturate(.85) brightness(1.06)',t:'linear-gradient(180deg,rgba(255,226,214,.35),rgba(180,200,220,.35))'},
 {n:'Cool Studio',f:'saturate(.9) brightness(1.06) contrast(1.04)',t:'linear-gradient(180deg,rgba(150,190,255,.55),rgba(200,220,255,.3))'},
 {n:'Blue Hour',f:'brightness(.82) contrast(1.1) saturate(1.1)',t:'linear-gradient(180deg,rgba(70,60,170,.75),rgba(150,90,170,.55))'},
 {n:'Mono',f:'grayscale(1) contrast(1.12) brightness(1.03)',t:'transparent'},
 {n:'Golden Hour',f:'saturate(1.1) brightness(1.02)',t:'linear-gradient(180deg,rgba(255,180,90,.6),rgba(255,140,80,.4))'},
];

GRADES.forEach((g,i)=>{
  const b=document.createElement('button');b.textContent=g.n;b.onclick=()=>{setGrade(i);commit();$('#dd').classList.remove('open');};dl.appendChild(b);
});
let thumbStart=0;
function renderThumbs(){
  th.innerHTML='';

    const t=document.createElement('button');t.className='th'+(i===S.grade?' on':'');t.title=g.n;faceBg(t,64,S.look);t.style.filter=g.f;
    t.innerHTML=`<i style="background:${g.t}"></i>`;t.onclick=()=>{setGrade(i);commit();};th.appendChild(t);}
}
function setGrade(i){S.grade=i;const g=GRADES[i];$('#grade').style.filter=g.f;$('#tint').style.background=g.t;$('#ddL').textContent=g.n;
  $$('#ddList button').forEach((b,k)=>b.classList.toggle('on',k===i));renderThumbs();}
$('#ddBtn').onclick=e=>{e.stopPropagation();$('#dd').classList.toggle('open');};
$('#next').onclick=()=>{thumbStart=(thumbStart+1)%GRADES.length;th.animate([{transform:'translateX(-14px)'},{transform:'none'}],{duration:350,easing:'cubic-bezier(.2,.7,.2,1)'});renderThumbs();};

/* ================= realism ================= */
function setReal(v){S.real=v;const r=$('#realR');r.value=v;r.style.setProperty('--p',v+'%');$('#realV').textContent=v+'%';
  const k=Math.max(0,(80-v)/80); // 1 = stylized
  document.documentElement.style.setProperty('--real',`saturate(${1+k*.9}) contrast(${1+k*.25}) blur(${k*1.4}px) brightness(${1+k*.05})`);
  $('#bg').style.filter=`blur(${k*5}px) saturate(${1+k*.5})`;}
$('#realR').oninput=e=>setReal(+e.target.value);$('#realR').onchange=()=>commit();

/* ================= tabs ================= */
const TAB_VIEW={style:'outfits',dna:'dna',body:'body',personality:'personality',story:'story'};
function moveInd(btn,ind){ind.style.left=btn.offsetLeft+'px';ind.style.width=btn.offsetWidth+'px';}

 ['Hair','<path d="M5 20v-8a7 7 0 0 1 14 0v8"/><path d="M8.5 20v-6.5M15.5 20v-6.5M8.5 13.5c2-2.5 5-2.5 7 0"/>'],
 ['Makeup','<path d="M10 21h4V11h-4zM10 11l1-6h2l1 6"/>'],

SIDE.forEach(([n,ic],i)=>{const b=document.createElement('button');b.innerHTML=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${n}`;

/* tuning panels for Face/Hair/Makeup/Accessories/Tattoos/Details */
const TUNE={
 Face:{s:[['Smile',35],['Jawline',50],['Freckles',10]],o:['Soft','Defined','Natural','Sculpted'],sw:null},
 Hair:{s:[['Volume',60],['Shine',70]],o:['High bun','Low bun','Long straight','Bob','Ponytail'],sw:['#14110f','#3b2a20','#6b4a35','#a07c5a','#d9c3a1']},
 Makeup:{s:[['Blush',30],['Lip tint',45],['Glow',55]],o:['No-makeup','Glass skin','Soft glam','Editorial'],sw:['#e8b4a8','#d98c8c','#b5525e','#8e3c4a']},
 Accessories:{s:[],o:['Gold hoops','Silver chain','Shoulder bag','Sunglasses','Watch','Hair clip'],sw:null,multi:true},
 Tattoos:{s:[['Opacity',40]],o:['None','Fine line','Floral','Script','Minimal dots'],sw:null},
 Details:{s:[['Skin texture',70],['Fabric detail',80],['Lighting softness',60]],o:['Studio','Natural','Cinematic'],sw:null},
};
const tuneState={};
function slider(lbl,v,on){return `<div class="sl"><label>${lbl}<b>${v}</b></label><input type="range" min="0" max="100" value="${v}" style="--p:${v}%" data-l="${lbl}"></div>`;}
function renderTune(n){
  const t=TUNE[n],st=tuneState[n]||(tuneState[n]={o:t.multi?[t.o[0]]:[t.o[0]],sw:0,s:Object.fromEntries(t.s)});
  $('#tuneT').innerHTML=`${n} <small>changes re-render the model</small>`;
  let h='';
  if(t.sw)h+=`<div class="sub">Colour</div><div class="sw">${t.sw.map((c,i)=>`<button data-sw="${i}" class="${i===st.sw?'on':''}" style="background:${c}"></button>`).join('')}</div>`;
  h+=`<div class="sub">${t.multi?'Add items':'Preset'}</div><div class="opts">${t.o.map(o=>`<button class="opt ${st.o.includes(o)?'on':''}" data-o="${o}">${o}</button>`).join('')}</div>`;
  h+=t.s.map(([l])=>slider(l,st.s[l])).join('');
  $('#tuneB').innerHTML=h;
  $$('#tuneB .opt').forEach(b=>b.onclick=()=>{const o=b.dataset.o;
    if(t.multi){st.o.includes(o)?st.o.splice(st.o.indexOf(o),1):st.o.push(o);}else st.o=[o];
    renderTune(n);rescan();toast(`${n}: ${o}`);});
  $$('#tuneB .sw button').forEach(b=>b.onclick=()=>{st.sw=+b.dataset.sw;renderTune(n);rescan();});
  $$('#tuneB input').forEach(r=>{r.oninput=()=>{r.style.setProperty('--p',r.value+'%');r.previousElementSibling.querySelector('b').textContent=r.value;st.s[r.dataset.l]=+r.value;};r.onchange=rescan;});
}

  c.onclick=()=>pickLook(i);
  c.ondblclick=()=>toggleFav(i);
  grid.appendChild(c);});
function pickLook(i){if(i===S.look)return;S.look=i;showLook(i);faceBg($('#avatar'),98,i);renderThumbs();commit();}
function filterGrid(){
  const cards=$$('.card');let n=0;

    if(ok){c.classList.remove('gone');requestAnimationFrame(()=>c.classList.remove('out'));}else{c.classList.add('out');setTimeout(()=>c.classList.contains('out')&&c.classList.add('gone'),300);} });
  $('#count').textContent=n+(n===1?' look':' looks');
  // FLIP-lite: stagger in
  cards.filter(c=>!c.classList.contains('out')).forEach((c,k)=>c.animate([{transform:'translateY(14px) scale(.96)'},{transform:'none'}],{duration:500,delay:k*45,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'}));
}

/* accordion */
const ROWS=[['tops','Tops'],['bottoms','Bottoms'],['full','Full body'],['shoes','Shoes'],['acc','Accessories']];
const bag=new Set();let openKey=null;
function renderAcc(){
  const l=LOOKS[S.look],acc=$('#acc');acc.innerHTML='';
  ROWS.forEach(([k,n])=>{const it=l.p[k];
    const r=document.createElement('div');r.className='row'+(openKey===k?' open':'');r.dataset.k=k;
    r.innerHTML=`<button><span>${n}${it.length?` <small style="color:var(--ink-3);font-size:12px;letter-spacing:.02em;text-transform:none">· ${it.length}</small>`:''}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="body"><div>${it.length?it.map(([a,b,p])=>{const id=a+b;return `<div class="item"><span>${a} <small style="color:var(--ink-3)">${b}</small></span><em>$${p}</em><button class="add ${bag.has(id)?'done':''}" data-id="${id}">${bag.has(id)?'✓':'+'}</button></div>`}).join(''):'<div class="item"><span>Nothing in this look</span></div>'}</div></div>`;
    r.firstElementChild.onclick=()=>openRow(k);
    acc.appendChild(r);});
  $$('#acc .add').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.id;if(bag.has(id))bag.delete(id);else bag.add(id);
    b.classList.toggle('done',bag.has(id));b.textContent=bag.has(id)?'✓':'+';setBadge('#cartN',bag.size);if(bag.has(id))toast('Added to cart');});
}
function openRow(k){openKey=openKey===k?null:k;$$('#acc .row').forEach(r=>r.classList.toggle('open',r.dataset.k===openKey));
  // make sure outfit view visible
  if($('.view[data-v=outfits]').classList.contains('hide')){$$('#tabs button')[2].click();}}

/* favourites */
function toggleFav(i=S.look){favs.has(i)?favs.delete(i):favs.add(i);syncFav();setBadge('#favN',favs.size);toast(favs.has(i)?`♥ ${LOOKS[i].n} saved to favourites`:'Removed from favourites');}
function syncFav(){$$('.card').forEach(c=>c.querySelector('.fav').classList.toggle('on',favs.has(+c.dataset.i)));$('#heartBtn').classList.toggle('on',favs.has(S.look));}
$('#heartBtn').onclick=()=>toggleFav();
function setBadge(q,n){const b=$(q);b.textContent=n;b.classList.toggle('on',n>0);b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}
$('#cartBtn').onclick=()=>{openRow(openKey||'tops');toast(bag.size?`${bag.size} item${bag.size>1?'s':''} in cart · $${[...bag].length&&LOOKS.flatMap(l=>Object.values(l.p).flat()).filter(x=>bag.has(x[0]+x[1])).reduce((s,x,i,a)=>s+x[2],0)}`:'Cart is empty — add pieces from the look');};

/* ================= dna / body / personality / story ================= */
const NAMES=[['Han Seo-yeon',23,'Seoul, KR','14°C'],['Kim Ha-eun',22,'Busan, KR','17°C'],['Yoon Ji-woo',25,'Seoul, KR','12°C'],['Park Min-ji',24,'Incheon, KR','13°C'],['Lee Soo-ah',21,'Daegu, KR','15°C']];
let ni=0;
$('.view[data-v=dna]').innerHTML=`<h3>DNA <small>identity seed</small></h3>
<svg id="helix" width="300" height="120" viewBox="0 0 300 120"></svg>
<div class="dnaRow"><span>Seed</span><b id="seed">VL-0423-KR</b></div>
<div class="dnaRow"><span>Heritage</span><b>Korean</b></div>
<div class="dnaRow"><span>Age</span><b id="dAge">23</b></div>
<div class="dnaRow"><span>Eye colour</span><b>Dark brown</b></div>
<div class="dnaRow"><span>Hair</span><b>Black · high bun</b></div>
<div style="margin-top:auto;display:flex;gap:10px"><button class="btn" id="reseed" style="flex:1">Re-seed identity</button></div>`;
(function helix(){const s=$('#helix');let t=0;function f(){let h='';for(let i=0;i<26;i++){const x=12+i*11,a=i*.42+t,y1=60+Math.sin(a)*38,y2=60-Math.sin(a)*38,z=(Math.cos(a)+1)/2;
  h+=`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="rgba(255,255,255,${.15+z*.25})" stroke-width="1.5"/><circle cx="${x}" cy="${y1}" r="${2+z*2.4}" fill="rgba(255,255,255,${.4+z*.6})"/><circle cx="${x}" cy="${y2}" r="${2+(1-z)*2.4}" fill="rgba(255,255,255,${.4+(1-z)*.6})"/>`;}
  s.innerHTML=h;t+=.03;requestAnimationFrame(f);}f();})();
$('.view[data-v=body]').innerHTML=`<h3>Body <small>proportions</small></h3>
${slider('Height (cm)',168)}${slider('Build',50)}
<div class="sub">Posture</div><div class="opts"><button class="opt on">Relaxed</button><button class="opt">Confident</button><button class="opt">Editorial</button></div>
<div class="sub">Framing</div><div class="opts" id="frameOpts"><button class="opt on" data-f="0">Full body</button><button class="opt" data-f="1">Mid shot</button><button class="opt" data-f="2">Portrait</button></div>`;
(function(){const [h,b]=$$('.view[data-v=body] input');h.min=150;h.max=185;h.value=168;h.style.setProperty('--p',(18/35*100)+'%');
  h.oninput=()=>{setHeight(+h.value);};h.onchange=commit;b.oninput=()=>{setBuild(+b.value);};b.onchange=commit;
  $$('.view[data-v=body] .opts:not(#frameOpts) .opt').forEach(o=>o.onclick=()=>{$$('.view[data-v=body] .opts:not(#frameOpts) .opt').forEach(x=>x.classList.toggle('on',x===o));rescan();});
  $$('#frameOpts .opt').forEach(o=>o.onclick=()=>setFrame(+o.dataset.f));})();
function setHeight(v){S.height=v;const r=$$('.view[data-v=body] input')[0];r.value=v;r.style.setProperty('--p',((v-150)/35*100)+'%');r.previousElementSibling.querySelector('b').textContent=v;
  $('#modelInner').style.setProperty('--height',(1+(v-168)/168*.9).toFixed(3));}
function setBuild(v){S.build=v;const r=$$('.view[data-v=body] input')[1];r.value=v;r.style.setProperty('--p',v+'%');r.previousElementSibling.querySelector('b').textContent=v;
  $('#modelInner').style.setProperty('--build',(1+(v-50)/50*.07).toFixed(3));}
const TRAITS=['Curious','Bold','Calm','Witty','Romantic','Driven','Playful','Gentle','Creative','Loyal'];
const AX=['Openness','Energy','Warmth','Focus','Humour'];let axv=[70,55,80,60,65];let traits=new Set(['Curious','Creative','Gentle']);
$('.view[data-v=personality]').innerHTML=`<h3>Personality <small>pick up to 3</small></h3><div class="opts" id="traits"></div>
<svg id="radar" width="250" height="210" viewBox="-125 -105 250 210"></svg><div id="axes"></div>`;
function drawRadar(){const R=78;let g='';for(let k=1;k<=4;k++)g+=`<polygon points="${AX.map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/5;return [Math.cos(a)*R*k/4,Math.sin(a)*R*k/4].join(',')}).join(' ')}" fill="none" stroke="rgba(255,255,255,.2)"/>`;
  AX.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/5;g+=`<line x1="0" y1="0" x2="${Math.cos(a)*R}" y2="${Math.sin(a)*R}" stroke="rgba(255,255,255,.2)"/><text x="${Math.cos(a)*(R+14)}" y="${Math.sin(a)*(R+14)+4}" fill="rgba(255,255,255,.75)" font-size="11" text-anchor="middle">${n}</text>`;});
  g+=`<polygon class="val" points="${axv.map((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/5;return [Math.cos(a)*R*v/100,Math.sin(a)*R*v/100].join(',')}).join(' ')}" fill="rgba(255,255,255,.28)" stroke="#fff" stroke-width="1.5"/>`;
  $('#radar').innerHTML=g;}
function renderTraits(){$('#traits').innerHTML=TRAITS.map(t=>`<button class="opt ${traits.has(t)?'on':''}">${t}</button>`).join('');
  $$('#traits .opt').forEach(b=>b.onclick=()=>{const t=b.textContent;if(traits.has(t))traits.delete(t);else{if(traits.size>=3)traits.delete([...traits][0]);traits.add(t);}
    axv=AX.map((_,i)=>30+([...traits].reduce((s,x)=>s+x.charCodeAt(i%x.length)*(i+3),0)%65));renderTraits();drawRadar();});}
renderTraits();drawRadar();
$('#axes').innerHTML=AX.slice(0,2).map((a,i)=>slider(a,axv[i])).join('');
$$('#axes input').forEach((r,i)=>r.oninput=()=>{axv[i]=+r.value;r.style.setProperty('--p',r.value+'%');r.previousElementSibling.querySelector('b').textContent=r.value;drawRadar();});
$('.view[data-v=story]').innerHTML=`<h3>Story <small>auto-written from your choices</small></h3><div id="story"></div>
<div style="margin-top:auto;display:flex;gap:10px"><button class="btn" id="regen" style="flex:1">Rewrite story</button></div>`;
let typing=0;
function typeStory(){const tok=++typing;const nm=$('#name').textContent,[c]=$('#city').textContent.split(','),l=LOOKS[S.look],tr=[...traits].map(t=>t.toLowerCase());
  const lines=[`${nm} is ${S.height} cm of ${tr[0]||'quiet'} energy from ${c}.`,` Mornings start with a long walk along the river in her ${l.n.toLowerCase()} look;`,` friends call her ${tr[1]||'kind'} and a little ${tr[2]||'mysterious'}.`,` She collects film cameras, keeps a sketchbook of strangers' outfits, and is saving for a studio of her own.`];
  const txt=lines.join(''),el=$('#story');let i=0;el.innerHTML='<span class="cur"></span>';
  (function step(){if(tok!==typing)return;i+=2;el.innerHTML=txt.slice(0,i)+'<span class="cur"></span>';if(i<txt.length)setTimeout(step,22);})();}
$('#regen').onclick=()=>{traits=new Set(TRAITS.slice().sort(()=>Math.random()-.5).slice(0,3));renderTraits();drawRadar();typeStory();};

/* identity shuffle / edit */
function scramble(el,to){const ch='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-';let f=0;const n=14;
  (function s(){f++;el.textContent=to.split('').map((c,i)=>c===' '||f>n*(i+1)/to.length?c:ch[Math.random()*ch.length|0]).join('');if(f<=n)requestAnimationFrame(()=>setTimeout(s,30));else el.textContent=to;})();}
function setIdentity(k){ni=k;const [n,a,c,t]=NAMES[k];scramble($('#name'),n);$('#age').textContent=a;$('#dAge').textContent=a;$('#city').textContent=c;$('#temp').textContent=t;
  $('#seed').textContent='VL-0'+(400+k*37)+'-KR';}
$('#shufBtn').onclick=()=>{const b=$('#shufBtn');b.style.transform=`rotate(${(b._r=(b._r||0)+180)}deg)`;setIdentity((ni+1)%NAMES.length);};
$('#reseed').onclick=()=>{setIdentity((ni+1)%NAMES.length);rescan();};
$('#editBtn').onclick=()=>{const n=$('#name');const on=n.contentEditable!=='true';n.contentEditable=on;if(on){n.focus();document.getSelection().selectAllChildren(n);}else toast('Name updated');};
$('#name').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#editBtn').click();}};

/* ================= controls ================= */
const FR=['full','mid','portrait'],FRL=['Full','Mid','Portrait'];let frame=0;
function setFrame(f){frame=f;const w=$('#modelWrap');w.classList.remove(...FR);w.classList.add(FR[f]);$('#poseL').textContent=FRL[f];
  $$('#frameOpts .opt').forEach(o=>o.classList.toggle('on',+o.dataset.f===f));}
$('#pose').onclick=()=>setFrame((frame+1)%3);
function apply(st,anim=true){const lookChanged=st.look!==S.look;S={...st};if(lookChanged){showLook(S.look,anim);faceBg($('#avatar'),98,S.look);}
  setGrade(S.grade);setReal(S.real);setHeight(S.height);setBuild(S.build);}
$('#undo').onclick=()=>{if(hi>0){hi--;apply(hist[hi]);syncHist();}};
$('#redo').onclick=()=>{if(hi<hist.length-1){hi++;apply(hist[hi]);syncHist();}};
$('#reset').onclick=()=>{apply({...DEF});setFrame(0);commit();toast('Reset to default');};
$('#rand').onclick=()=>{const r=$('#rand svg');r.style.transform=`rotate(${(r._r=(r._r||0)+360)}deg)`;
  let k=0,cards=$$('.card:not(.gone)');
  // roulette highlight
  (function spin(){cards.forEach((c,j)=>c.classList.toggle('on',j===k%cards.length));k++;if(k<12)setTimeout(spin,50+k*8);else{
    let t=(S.look+1+(Math.random()*7|0))%8;S.look=t;showLook(t);faceBg($('#avatar'),98,t);setGrade(Math.random()*4|0);setReal(55+(Math.random()*45|0));commit();}})();};
$('#moreBtn').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('open');};
$$('#menu button').forEach(b=>b.onclick=()=>{$('#menu').classList.remove('open');toast(b.dataset.m);});
document.addEventListener('click',e=>{if(!e.target.closest('#dd'))$('#dd').classList.remove('open');if(!e.target.closest('#menu,#moreBtn'))$('#menu').classList.remove('open');if(!e.target.closest('#lib,#bagBtn,#saveBtn'))$('#lib').classList.remove('open');});

/* save to library: card flies into drawer */
const saved=[];
$('#bagBtn').onclick=()=>$('#lib').classList.toggle('open');
$('#saveBtn').onclick=()=>{const b=$('#saveBtn');b.classList.remove('go');void b.offsetWidth;b.classList.add('go');
  const lib=$('#lib');lib.classList.add('open');
  const src=$('#modelWrap').getBoundingClientRect();const fl=document.createElement('div');fl.className='flyer';fl.style.backgroundImage=`url('${LOOKS[S.look].sm}')`;
  Object.assign(fl.style,{left:src.left+src.width*.25+'px',top:src.top+'px',width:src.width*.5+'px',height:src.height+'px',filter:$('#grade').style.filter});document.body.appendChild(fl);
  setTimeout(()=>{const row=$('#libRow').getBoundingClientRect(),s=+getComputedStyle(document.documentElement).getPropertyValue('--s');
    Object.assign(fl.style,{left:row.left+saved.length*82*s+'px',top:row.top+'px',width:72*s+'px',height:104*s+'px'});},30);
  setTimeout(()=>{fl.remove();$('#libEmpty')?.remove();saved.push(S.look);const c=document.createElement('div');c.className='lc';c.style.backgroundImage=`url('${LOOKS[S.look].sm}')`;c.style.filter=$('#grade').style.filter;c.title=LOOKS[S.look].n;
    c.onclick=()=>pickLook(+c.dataset.i);c.dataset.i=S.look;$('#libRow').appendChild(c);$('#libC').textContent=saved.length+' saved';setBadge('#libN',saved.length);toast('Saved to library');},860);};

/* toast */
let tt;function toast(m){const t=$('#toast');t.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="m5 12 5 5 9-10"/></svg>${m}`;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800);}

/* keyboard: arrows switch looks */
addEventListener('keydown',e=>{if(document.activeElement.isContentEditable)return;
  if(e.key==='ArrowRight')pickLook((S.look+1)%8);if(e.key==='ArrowLeft')pickLook((S.look+7)%8);
  if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();(e.shiftKey?$('#redo'):$('#undo')).click();}});

/* init */
showLook(0,false);setGrade(0);setReal(75);setHeight(168);setBuild(50);syncHist();
requestAnimationFrame(()=>{moveInd($('#tabs .on'),$('#tabInd'));$('#sideInd').style.top=$('#side button.on').offsetTop+'px';});
addEventListener('load',()=>{moveInd($('#tabs .on'),$('#tabInd'));});
</script>
</body>
</html>
