body{background:var(--page);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-size:clamp(11px,.86vw,13px);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
svg{display:block}
/* product-sheet thumbnails, pure CSS: each element shows one 523x537 tile, stretched to fit */
.pt{background-repeat:no-repeat;background-color:var(--tile);background-size:333.46% 435.01%}

/* ---------- layout: proportions taken from option 1 (1344x752) ---------- */
#app{height:100vh;display:grid;grid-template-columns:minmax(0,357fr) minmax(0,500fr) minmax(0,292fr);padding:0 7.3vw;position:relative}
#left{display:flex;flex-direction:column;min-height:0;padding:2.6vh 0 3.4vh}
#left .top{height:6vh;display:flex;align-items:center;justify-content:space-between;padding:0 .4vw 0 .6vw;margin-bottom:1.6vh}
.logo{font-family:"Bodoni Moda",Didot,"Times New Roman",serif;font-weight:500;font-size:clamp(20px,2.15vw,32px);letter-spacing:.035em;line-height:1}
.icn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:background .2s}
.icn:hover{background:var(--tile)}
.panel{background:var(--panel);border-radius:14px;box-shadow:0 1px 1px rgba(0,0,0,.02),0 10px 30px -18px rgba(40,30,20,.18)}
#shop{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#search{margin:2vh 1.1vw 0;height:clamp(34px,4.6vh,44px);border-radius:22px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:0 2px 8px -4px rgba(0,0,0,.12);border:1px solid transparent;transition:border-color .2s}
#search:focus-within{border-color:#cfcbc4}
#search input{flex:1;border:0;background:none;outline:none;min-width:0}
#search input::placeholder{color:var(--mute)}
#cats{display:flex;gap:clamp(12px,1.75vw,26px);padding:2.4vh 1.1vw 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:relative}
#cats::-webkit-scrollbar{display:none}
#cats button{padding-bottom:1.5vh;color:var(--ink-2);white-space:nowrap;transition:color .2s}
#cats button.on{color:var(--ink);font-weight:500}
#catBar{position:absolute;bottom:-1px;height:2px;background:var(--ink);transition:left .4s cubic-bezier(.6,0,.2,1),width .4s cubic-bezier(.6,0,.2,1)}
#shopScroll{flex:1;overflow-y:auto;padding:0 1.1vw 1.4vh;scrollbar-width:none}
#shopScroll::-webkit-scrollbar{display:none}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:2.4vh 0 1.4vh}
.sh h3{font-size:1.18em;font-weight:500}
.sh button,.sh span{font-size:.92em;color:var(--ink-2)}
#stores{display:grid;grid-template-columns:repeat(4,1fr);gap:.6vw}
.store{height:clamp(40px,7.6vh,58px);border-radius:8px;background:var(--tile);display:grid;place-items:center;text-align:center;border:1.5px solid transparent;transition:border-color .25s,background .25s,transform .2s}
.store:hover{transform:translateY(-2px)}
.store.on{border-color:var(--ink);background:#fff}
.store .w1{font-family:"Bodoni Moda",serif;font-size:clamp(12px,1.3vw,18px);letter-spacing:.04em}
.store .w2{font-weight:600;letter-spacing:.2em;font-size:clamp(9px,.85vw,12px)}
.store .w3{font-style:italic;font-family:"Bodoni Moda",serif;font-size:clamp(12px,1.25vw,17px)}
.store .w4{font-weight:600;letter-spacing:.04em;font-size:clamp(10px,1vw,14px);line-height:1.05}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:2vh 1.1vw}
.prod{position:relative;cursor:pointer}
.prod .ph{position:relative;aspect-ratio:523/400;border-radius:8px;overflow:hidden;border:1.5px solid transparent;transition:border-color .25s}
.prod .ph.pt{background-size:333.46% 584%}
.prod:hover .ph{border-color:#d3cfc8}
.prod.worn .ph{border-color:var(--ink)}
.prod .worn-tag{position:absolute;left:7px;bottom:7px;font-size:9px;font-weight:600;letter-spacing:.08em;background:var(--ink);color:#fff;padding:3px 6px;border-radius:5px;transform:translateY(180%);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.prod.worn .worn-tag{transform:none}
.prod .try{position:absolute;right:7px;bottom:7px;font-size:10px;font-weight:500;background:#fff;padding:4px 8px;border-radius:6px;opacity:0;transform:translateY(5px);transition:.25s;box-shadow:0 4px 10px -4px rgba(0,0,0,.2)}
.prod:hover .try{opacity:1;transform:none}
.prod.worn .try{display:none}
.heart{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;z-index:2;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.heart:active{transform:scale(.8)}
.heart.on path{fill:var(--ink)}
.prod .st{margin-top:1.2vh;font-size:.86em;font-weight:600;letter-spacing:.04em}
.prod .nm{font-size:.92em;color:var(--ink-2);margin-top:2px}
.prod .pr{font-size:1.04em;font-weight:500;margin-top:4px}
.prod.hide{display:none}
#empty{display:none;color:var(--mute);padding:20px 0}
#tabbar{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:1.3vh 6px 1.5vh}
#tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8em;color:var(--ink-2);transition:color .2s}
#tabbar button.on{color:var(--ink);font-weight:600}

/* ---------- stage: model straight on the page ---------- */
#stage{position:relative;min-width:0}
#room{position:absolute;left:4%;right:4%;top:2.6vh;bottom:3.4vh;border-radius:16px;background:center/cover no-repeat;opacity:0;transform:scale(.97);transition:opacity .6s ease,transform .9s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#stage.ar #room{opacity:1;transform:none}
#arUI{position:absolute;left:6%;right:6%;top:4.4vh;bottom:5vh;pointer-events:none;opacity:0;transition:opacity .5s .2s;z-index:6}
#stage.ar #arUI{opacity:1}
#arUI i{position:absolute;width:30px;height:30px;border:2px solid #fff}
#arUI i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:9px 0 0 0}
#arUI i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 9px 0 0}
#arUI i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 9px}
#arUI i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 9px 0}
#arUI .scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 14px rgba(255,255,255,.8);top:0;opacity:0}
#stage.ar #arUI .scan{animation:arscan 1.4s cubic-bezier(.6,0,.3,1) .1s 1 forwards}
@keyframes arscan{0%{top:0;opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
#arUI .lbl{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:11px;font-weight:500;color:#fff;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 12px;border-radius:14px;display:flex;gap:7px;align-items:center;white-space:nowrap}
#arUI .lbl b{width:7px;height:7px;border-radius:50%;background:#ff4d4d;animation:rec 1.2s infinite}
@keyframes rec{50%{opacity:.3}}
/* model: head at ~4% of viewport, feet at ~93%; centred at 45% of the column like option 1 */
#figure{position:absolute;left:45%;top:3.6vh;height:85.5vh;aspect-ratio:1360/2048;transform:translateX(-50%);z-index:2}
#tt{position:absolute;left:50%;top:calc(98.6% - var(--tth) * .40);width:var(--ttw);height:var(--tth);transform:translateX(-50%);z-index:0}
#figure{--ttw:112%;--tth:calc(85.5vh * 1360 / 2048 * 1.12 / 3.3)}
#tt .top{position:absolute;inset:0 0 16% 0;border-radius:50%;background:radial-gradient(ellipse at 50% 38%,#fdfcfb 0%,#f3f1ee 60%,#e7e4df 100%)}
#tt .side{position:absolute;inset:16% 0 0 0;border-radius:50%;background:linear-gradient(180deg,#e2dfda,#d3cfc8);z-index:-1}
#tt .ring{position:absolute;left:8%;top:8%;width:84%;height:62%;overflow:visible}
#tt .deg{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;font-size:.92em;color:var(--ink-2);user-select:none;white-space:nowrap}
#tt .deg svg{transition:transform .3s}
#figure:hover #tt .deg .l{transform:translateX(-3px)}
#figure:hover #tt .deg .r{transform:translateX(3px)}
#body{position:absolute;inset:0;perspective:1600px;z-index:1;cursor:grab;touch-action:pan-y}
#body.drag{cursor:grabbing}
#spin{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(var(--ry,0deg));transform-origin:50% 100%}
#spin canvas{position:absolute;left:0;top:0;width:100%;height:auto;aspect-ratio:1360/2048}
#cNew{clip-path:inset(0 0 100% 0)}
#glint{position:absolute;left:-6%;right:-6%;height:2px;top:0;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,#fff 30%,#fff 70%,transparent);box-shadow:0 0 18px 4px rgba(255,255,255,.9),0 0 50px 10px rgba(255,255,255,.4);z-index:3}
#shadow{position:absolute;left:50%;top:96.6%;width:46%;height:3.4%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.26),transparent);z-index:1;filter:blur(2px)}
/* rail (left of model), strip + toggle (right of model) — positions from option 1 */
#rail{position:absolute;left:8.4%;top:8.6vh;display:flex;flex-direction:column;gap:clamp(6px,1.2vh,10px);z-index:5}
.rb{position:relative;width:clamp(30px,5.2vh,40px);height:clamp(30px,5.2vh,40px);border-radius:50%;background:#fbfaf8;box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 12px -6px rgba(0,0,0,.2);display:grid;place-items:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s}
.rb:hover{transform:scale(1.08)}
.rb.on{background:var(--ink)}
.rb.on svg{stroke:#fff}
.rb .tip{position:absolute;left:calc(100% + 10px);white-space:nowrap;font-size:11px;background:var(--ink);color:#fff;padding:5px 9px;border-radius:7px;opacity:0;transform:translateX(-4px);pointer-events:none;transition:.2s}
.rb:hover .tip{opacity:1;transform:none}
.rb:disabled{opacity:.4;pointer-events:none}
#strip{position:absolute;left:75.4%;top:10.8vh;z-index:5;background:#fbfaf8;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 20px -12px rgba(0,0,0,.25);padding:.8vh .5vw;display:flex;flex-direction:column;gap:1vh}
#strip button{width:clamp(36px,4vw,56px);aspect-ratio:523/537;border-radius:7px;border:1.5px solid transparent;transition:border-color .2s,transform .3s}
#strip button.pt{background-color:transparent}
#strip button:hover,#strip button.hl{border-color:var(--ink)}
#strip button.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:none}}
#mode{position:absolute;left:72%;top:4vh;z-index:5;display:flex;background:#fbfaf8;border-radius:16px;padding:3px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 12px -6px rgba(0,0,0,.2)}
#mode button{position:relative;z-index:1;width:clamp(34px,2.9vw,42px);height:clamp(22px,3.3vh,26px);border-radius:13px;font-size:.9em;font-weight:500;text-align:center;transition:color .3s}
#mode button.on{color:#fff}
#modeInd{position:absolute;top:3px;left:3px;width:clamp(34px,2.9vw,42px);height:clamp(22px,3.3vh,26px);border-radius:13px;background:var(--ink);transition:transform .35s cubic-bezier(.6,0,.2,1)}
#stage.ar #modeInd{transform:translateX(100%)}

/* ---------- right column ---------- */
#right{display:flex;flex-direction:column;gap:1.4vh;min-height:0;padding:8.6vh 0 3.4vh}
#look{padding:2.2vh 1.2vw 2vh;display:flex;flex-direction:column;flex:1;min-height:0}
.lbl{font-size:.86em;font-weight:500;letter-spacing:.2em;color:var(--ink)}
#look .lhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2vh}
#total{font-size:.92em;font-weight:600;color:var(--ink-2)}
#items{display:flex;flex-direction:column;gap:.9vh;min-height:0;flex:1;justify-content:space-between;max-height:44vh}
.it{display:flex;align-items:center;gap:.9vw;padding:0 4px 0 0;border-radius:10px;transition:background .2s;cursor:pointer;min-height:0}
.it:hover,.it.hl{background:#efedea}
.it .th{height:min(9vh,100%);aspect-ratio:523/450;border-radius:8px;flex:none}
.it .th.pt{background-size:333.46% 519%}
.it.swap .th{animation:swapIn .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes swapIn{0%{transform:scale(.6) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.it .tx{flex:1;min-width:0}
.it .st{font-size:.86em;font-weight:600;letter-spacing:.04em}
.it .nm{font-size:.86em;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .pr{font-size:.98em;font-weight:500;margin-top:4px}
.it .chev{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .2s}
.it:hover .chev{background:#fff;transform:translateX(2px)}
#fit{margin-top:1.6vh;padding-top:1.8vh;border-top:1px solid var(--line)}
.fr{display:flex;align-items:center;gap:10px;margin-top:1.15vh;font-size:.9em;color:var(--ink-2);position:relative}
.fr .ck{width:15px;height:15px;border-radius:50%;border:1.2px solid #7d7a75;display:grid;place-items:center;transition:background .3s,border-color .3s;flex:none}
.fr .ck svg{stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset .5s .1s}
.fr.ok .ck{background:var(--ink);border-color:var(--ink)}
.fr.ok .ck svg{stroke-dashoffset:0}
.fr .info{width:13px;height:13px;border-radius:50%;border:1px solid #9a9791;font-size:8px;display:grid;place-items:center;color:#7d7a75;font-weight:600;cursor:help;flex:none}
.fr .pc{margin-left:auto;font-size:.92em;font-weight:600;color:var(--ink)}
.fr .bub{position:absolute;left:0;bottom:calc(100% + 6px);background:var(--ink);color:#fff;font-size:11px;padding:6px 9px;border-radius:7px;opacity:0;pointer-events:none;transform:translateY(4px);transition:.2s;white-space:nowrap;z-index:4}
.fr:hover .bub{opacity:1;transform:none}
#shopLook{margin-top:2vh;height:clamp(36px,5.2vh,44px);border-radius:9px;background:#2b2b2b;color:#fff;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;transition:transform .2s,background .3s}
#shopLook:hover{background:#151515}
#shopLook:active{transform:scale(.98)}
#shopLook .fl{position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%)}
#shopLook.go .fl{animation:sweep .8s}
@keyframes sweep{to{transform:translateX(100%)}}
#bagN{min-width:17px;height:17px;border-radius:9px;background:#fff;color:var(--ink);font-size:10px;font-weight:600;display:none;place-items:center;padding:0 5px}
#bagN.on{display:grid}
#rec{padding:1.9vh 1.1vw 1.8vh}
#rec .rh{display:flex;align-items:center;gap:8px;font-weight:500;margin-bottom:1.4vh}
#recRow{display:grid;grid-template-columns:repeat(3,1fr);gap:.7vw}
.rc{display:block;width:100%;min-width:0}
.rc .ph{width:100%;aspect-ratio:523/450;border-radius:8px;border:1.5px solid transparent;transition:border-color .2s,transform .3s}
.rc .ph.pt{background-size:333.46% 519%}
.rc:hover .ph{border-color:#d3cfc8;transform:translateY(-2px)}
.rc .st{font-size:.76em;font-weight:600;letter-spacing:.04em;margin-top:.8vh}
.rc .nm{font-size:.8em;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .pr{font-size:.84em;font-weight:500;margin-top:2px}

#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-14px);background:var(--ink);color:#fff;font-size:12px;padding:9px 15px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s cubic-bezier(.3,1.4,.5,1);z-index:50;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fly{position:fixed;z-index:60;border-radius:8px;background-repeat:no-repeat;background-color:var(--tile);pointer-events:none;transition:all .7s cubic-bezier(.6,0,.2,1)}

/* responsive */
@media (max-width:1100px){#app{padding:0 3vw}}
@media (max-width:860px){
  body{overflow:auto}
  #app{height:auto;grid-template-columns:1fr;padding:0 16px 16px;gap:14px}
  #stage{order:1;height:min(92svh,820px)}
  #right{order:2;padding:0}
  #left{order:3;height:88svh;padding:0}
  #figure{height:84%;top:3%;--tth:calc(min(92svh,820px) * .84 * 1360 / 2048 * 1.12 / 3.3)}
  #rail{left:2%}#strip{left:auto;right:2%}#mode{left:auto;right:2%;top:1%}
  #items{max-height:none}
}
</style>
</head>
<body>
<div id="app">
  <!-- SHOP -->
  <div id="left">
  <div class="top"><div class="logo">MAISON EDIT</div><button class="icn" aria-label="Menu" id="sIcon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
  <section id="shop" class="panel">
    <label id="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8a8883" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="q" placeholder="Search for products, brands or styles..."></label>
    <div id="cats"><span id="catBar"></span></div>
    <div id="shopScroll">
      <div class="sh"><h3>Shop by Store</h3><button id="allStores">See all</button></div>
      <div id="stores"></div>
      <div class="sh"><h3 id="gridTitle">Popular in your style</h3><span id="count" style="font-size:11px;color:var(--mute)"></span></div>
      <div id="grid"></div><div id="empty">Nothing matches — try another filter.</div>
    </div>
    <nav id="tabbar"></nav>
  </section>
  </div>

  <!-- STAGE -->
  <section id="stage">
    <div id="room"></div>
    <div id="arUI"><i></i><i></i><i></i><i></i><span class="scan"></span><span class="lbl"><b></b>AR preview · your room</span></div>
    <div id="rail"></div>
    <div id="mode"><span id="modeInd"></span><button class="on" data-m="3d">3D</button><button data-m="ar">AR</button></div>
    <div id="strip"></div>
    <div id="figure">
      <div id="tt"><div class="side"></div><div class="top"></div><svg class="ring" viewBox="0 0 100 100" preserveAspectRatio="none"><ellipse cx="50" cy="50" rx="49.5" ry="49" fill="none" stroke="rgba(0,0,0,.13)" stroke-width=".5" stroke-dasharray="3 5" vector-effect="non-scaling-stroke" id="ringE" pathLength="300"/></svg>
        <div class="deg"><svg class="l" width="34" height="10" viewBox="0 0 34 10" fill="none" stroke="#3a3a3a" stroke-width="1.1" stroke-linecap="round"><path d="M33 6C22 9 11 8 2 4M2 4l4-3M2 4l4 2"/></svg>360°<svg class="r" width="34" height="10" viewBox="0 0 34 10" fill="none" stroke="#3a3a3a" stroke-width="1.1" stroke-linecap="round"><path d="M1 6c11 3 22 2 31-2M32 4l-4-3M32 4l-4 2"/></svg></div></div>
      <div id="shadow"></div>
      <div id="body"><div id="spin"><canvas id="cOld"></canvas><canvas id="cNew"></canvas><span id="glint"></span></div></div>
    </div>
  </section>

  <!-- RIGHT -->
  <aside id="right">
    <div id="look" class="panel">
      <div class="lhead"><span class="lbl">YOUR LOOK</span><span id="total">$0.00</span></div>
      <div id="items"></div>
      <div id="fit"><span class="lbl">STYLE &amp; FIT</span><div id="fitRows"></div></div>
      <button id="shopLook"><span class="fl"></span><span id="shopL">Shop the Look</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M14 4h6v6M20 4 10 14M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span id="bagN">0</span></button>
    </div>
    <div id="rec" class="panel"><div class="rh"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3l1.6 4.6L18 9l-4.4 1.4L12 15l-1.6-4.6L6 9l4.4-1.4z"/><path d="M18.5 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>Recommended for you</div><div id="recRow"></div></div>
  </aside>
</div>
<div id="toast"></div>

<script>
/* ======================= assets ======================= */
const CDN='https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/';
const H=(f,w)=>'https://images.higgs.ai/?default=1&output=webp&url='+encodeURIComponent(CDN+f)+'&w='+w+'&q=88';

/* style & fit */
const FIT=[['Fits your size',()=>100],['Matches your style',()=>score()],['Complements your body shape',()=>78+(look.k==='k1'?14:look.k==='k3'?10:6)+(look.s!=='s2'?4:0)]];
function score(){const tags=Object.values(look).map(k=>byK[k].tag.split(' ')).flat();const c={};tags.forEach(t=>c[t]=(c[t]||0)+1);return Math.min(99,56+Math.max(...Object.values(c))*9);}
function renderFit(){const box=$('#fitRows');if(!box.children.length){FIT.forEach(([n],i)=>{box.insertAdjacentHTML('beforeend',`<div class="fr"><span class="ck"><svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 6.2 2.3 2.3 4.7-5"/></svg></span>${n}<span class="info">i</span><span class="pc">0%</span><span class="bub"></span></div>`);});}
  const NOTE=['Size M fits your saved measurements','Based on 4 pieces and your saved styles','Mini length + knee height balance your frame'];
  $$('.fr').forEach((r,i)=>{const v=FIT[i][1]();r.classList.remove('ok');void r.offsetWidth;setTimeout(()=>r.classList.toggle('ok',v>=80),120+i*140);countPct(r.querySelector('.pc'),v);r.querySelector('.bub').textContent=NOTE[i]+' · '+v+'%';});}
function countPct(el,v){const from=parseInt(el.textContent)||0,t0=performance.now();(function f(now){const k=Math.min(1,(now-t0)/700),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(v-from)*e)+'%';if(k<1)requestAnimationFrame(f);})(t0);}
function countTo(el,v){const from=parseFloat((el.textContent||'0').replace(/[^0-9.]/g,''))||0,t0=performance.now();(function f(now){const k=Math.min(1,(now-t0)/600),e=1-Math.pow(1-k,3);el.textContent=money(from+(v-from)*e);if(k<1)requestAnimationFrame(f);})(t0);}
/* recommendations: 3 pieces not worn, matching the dominant mood */
function renderRec(){const box=$('#recRow');box.innerHTML='';
  const mood=byK[look.t].tag.split(' ')[0];
  const cands=P.filter(p=>!Object.values(look).includes(p.k)).sort((a,b)=>(b.tag.includes(mood)-a.tag.includes(mood))||a.k.localeCompare(b.k)).slice(0,3);
  cands.forEach(p=>{const st=STORES.find(s=>s.id===p.st);const b=document.createElement('button');b.className='rc';
    b.innerHTML=`<div class="ph"></div><div class="st">${st.n.toUpperCase()}</div><div class="nm">${p.nm}</div><div class="pr">${money(p.pr)}</div>`;
    box.appendChild(b);thumb(b.querySelector('.ph'),p,450);b.onclick=()=>wear(p.k,{from:b.querySelector('.ph')});});}

/* ======================= shop panel ======================= */
const CATS=[['all','All'],['t','Tops'],['k','Bottoms'],['s','Shoes'],['g','Bags'],['acc','Accessories']];
let fCat='all',fStore=null,fQ='',fSaved=false;
CATS.forEach(([id,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.f=id;if(id==='all')b.classList.add('on');
  b.onclick=()=>{fCat=id;$$('#cats button').forEach(x=>x.classList.toggle('on',x===b));moveBar();filter();};$('#cats').appendChild(b);});
function moveBar(){const b=$('#cats button.on');$('#catBar').style.left=b.offsetLeft+'px';$('#catBar').style.width=b.offsetWidth+'px';}
STORES.forEach(s=>{const b=document.createElement('button');b.className='store';b.innerHTML=`<span class="${s.c}">${s.n}</span>`;
  b.onclick=()=>{fStore=fStore===s.id?null:s.id;$$('.store').forEach(x=>x.classList.toggle('on',x===b&&fStore===s.id));filter();};$('#stores').appendChild(b);});
$('#allStores').onclick=()=>{fStore=null;$$('.store').forEach(x=>x.classList.remove('on'));filter();};
P.forEach(p=>{const st=STORES.find(s=>s.id===p.st);const b=document.createElement('div');b.className='prod';b.dataset.k=p.k;
  b.innerHTML=`<button class="heart${saved.has(p.k)?' on':''}" aria-label="Save"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.6"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg></button>
    <div class="ph"><span class="worn-tag">WEARING</span><span class="try">Try on</span></div><div class="st">${st.n.toUpperCase()}</div><div class="nm">${p.nm}</div><div class="pr">${money(p.pr)}</div>`;
  b.style.cursor='pointer';
  b.onclick=e=>{if(e.target.closest('.heart'))return;wear(p.k,{from:b.querySelector('.ph')});};
  b.querySelector('.heart').onclick=e=>{e.stopPropagation();const h=e.currentTarget;saved.has(p.k)?saved.delete(p.k):saved.add(p.k);h.classList.toggle('on',saved.has(p.k));toast(saved.has(p.k)?'Saved to your wishlist':'Removed from wishlist');if(fSaved)filter();};
  $('#grid').appendChild(b);});
function sizeThumbs(){$$('.prod').forEach(b=>thumb(b.querySelector('.ph'),byK[b.dataset.k],400));}
function filter(){let n=0;const q=fQ.trim().toLowerCase();
  $$('.prod').forEach(b=>{const p=byK[b.dataset.k],st=STORES.find(s=>s.id===p.st);
    const ok=(fCat==='all'||p.k[0]===fCat)&&(!fStore||p.st===fStore)&&(!fSaved||saved.has(p.k))&&(!q||(p.nm+' '+st.n+' '+CAT_N[p.k[0]]).toLowerCase().includes(q));
    b.classList.toggle('hide',!ok);if(ok){n++;b.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:380,delay:n*35,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'});}});
  $('#empty').style.display=n?'none':'block';$('#count').textContent=n+' items';
  $('#gridTitle').textContent=fSaved?'Saved pieces':fStore?STORES.find(s=>s.id===fStore).n+' picks':'Popular in your style';}
$('#q').oninput=e=>{fQ=e.target.value;filter();};
$('#sIcon').onclick=()=>$('#q').focus();
const TABS=[['home','Home','<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>'],['explore','Explore','<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>'],['outfits','Outfits','<path d="M12 6a2 2 0 1 0-2-2M12 6v2L3 15h18l-9-7"/>'],['saved','Saved','<path d="M6 4h12v16l-6-4-6 4z"/>'],['profile','Profile','<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/>']];
TABS.forEach(([id,n,ic])=>{const b=document.createElement('button');b.dataset.t=id;if(id==='explore')b.classList.add('on');
  b.innerHTML=`<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${n}`;
  b.onclick=()=>{$$('#tabbar button').forEach(x=>x.classList.toggle('on',x===b));fSaved=id==='saved';
    if(id==='outfits'){stylist();} if(id==='home'){fCat='all';fStore=null;fQ='';$('#q').value='';$$('#cats button').forEach(x=>x.classList.toggle('on',x.dataset.f==='all'));$$('.store').forEach(x=>x.classList.remove('on'));moveBar();}
    filter();$('#shopScroll').scrollTo({top:0,behavior:'smooth'});};$('#tabbar').appendChild(b);});

/* ======================= rail ======================= */
const RAIL=[['back','Undo last change','<path d="M19 12H5M11 6l-6 6 6 6"/>'],['body','Body & size','<circle cx="12" cy="5" r="2"/><path d="M8 9h8l-1.3 6h-1.4l-.6 6h-1.4l-.6-6H9.3z"/>'],
 ['t','','<path d="M8 4 4 7l2 3 2-1v11h8V9l2 1 2-3-4-3c-.6 1.4-2 2.2-4 2.2S8.6 5.4 8 4z"/>'],['k','','<path d="M7 5h10l3 14H4z"/><path d="M7 5h10"/>'],
 ['s','','<path d="M6 4h4v9l7 3c1.5.6 2 1.6 2 3v1H6z"/>'],['g','','<path d="M5 9h14l-1 11H6z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/>'],['ai','AI stylist · surprise me','<path d="M12 3l1.6 4.6L18 9l-4.4 1.4L12 15l-1.6-4.6L6 9l4.4-1.4z"/><path d="M18.5 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>']];
RAIL.forEach(([id,tip,ic])=>{const b=document.createElement('button');b.className='rb';if('tksg'.includes(id))b.dataset.c=id;if(id==='back')b.id='undoBtn';
  b.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ic}</svg><span class="tip">${tip}</span>`;
  b.onclick=()=>{if(id==='back')undo();else if(id==='ai')stylist();else if(id==='body')toast('Size M · 165 cm · fit profile saved');else{cycle(id);setCat(id,true);}};
  $('#rail').appendChild(b);});
$('#undoBtn').disabled=true;
function setCat(cat,keep){fCat=cat;$$('#cats button').forEach(x=>x.classList.toggle('on',x.dataset.f===cat));moveBar();filter();$$('.rb[data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c===cat));}
function undo(){if(!hist.length)return;const prev=hist.pop();const cat=['t','k','s','g'].find(c=>prev[c]!==look[c])||'t';const was={...look};look=prev;render(cat,true,was);syncAll(cat);toast('Undone');$('#undoBtn').disabled=!hist.length;}
const CURATED=[{t:'t2',k:'k1',s:'s1',g:'g1',n:'Monochrome minimal'},{t:'t3',k:'k3',s:'s3',g:'g3',n:'Wine romance'},{t:'t1',k:'k2',s:'s2',g:'g2',n:'Weekend denim'},{t:'t2',k:'k3',s:'s3',g:'g2',n:'Soft contrast'},{t:'t3',k:'k2',s:'s2',g:'g3',n:'Campus cool'}];
let ci=0;
function stylist(){const c=CURATED[ci++%CURATED.length];hist.push({...look});$('#undoBtn').disabled=false;
  const cats=['t','k','s','g'].filter(x=>look[x]!==c[x]);let d=0;
  cats.forEach(cat=>{setTimeout(()=>{const prev={...look};look={...look,[cat]:c[cat]};render(cat,true,prev);syncAll(cat);},d);d+=520;});
  toast(`AI stylist · ${c.n}`);}

/* ======================= turntable rotate ======================= */
let ry=0,vel=0,dragging=null;const spin=$('#spin');
$('#body').addEventListener('pointerdown',e=>{dragging={x:e.clientX,r:ry};$('#body').classList.add('drag');$('#body').setPointerCapture(e.pointerId);});
$('#body').addEventListener('pointermove',e=>{if(!dragging)return;const nr=Math.max(-34,Math.min(34,dragging.r+(e.clientX-dragging.x)*.22));vel=nr-ry;ry=nr;});
$('#body').addEventListener('pointerup',()=>{dragging=null;$('#body').classList.remove('drag');});
let ring=0;
(function loop(){if(!dragging){ry+=( -ry)*.08;}ring+=vel*1.2+0.04;vel*=.9;
  spin.style.setProperty('--ry',ry.toFixed(2)+'deg');$('#ringE').style.strokeDashoffset=(-ring).toFixed(2);
  $('#shadow').style.transform=`translateX(calc(-50% + ${(-ry*.6).toFixed(1)}px)) scaleX(${(1-Math.abs(ry)/180).toFixed(3)})`;
  requestAnimationFrame(loop);})();

/* ======================= mode 3D / AR ======================= */
$$('#mode button').forEach(b=>b.onclick=()=>{const ar=b.dataset.m==='ar';$('#stage').classList.toggle('ar',ar);$$('#mode button').forEach(x=>x.classList.toggle('on',x===b));
  if(ar){const s=$('#arUI .scan');s.style.animation='none';void s.offsetWidth;s.style.animation='';}
});
$('#room').style.backgroundImage=`url('${H(F.room,1800)}')`;

/* ======================= shop the look ======================= */
$('#shopLook').onclick=()=>{const b=$('#shopLook');b.classList.remove('go');void b.offsetWidth;b.classList.add('go');
  $$('.it .th').forEach((t,i)=>setTimeout(()=>flyEl(t,$('#shopLook')),i*90));
  setTimeout(()=>{bag+=4;const n=$('#bagN');n.textContent=bag;n.classList.add('on');$('#shopL').textContent='Added · view bag';setTimeout(()=>$('#shopL').textContent='Shop the Look',1800);},700);
  toast(`4 pieces added · ${$('#total').textContent}`);};

/* fly helpers */
function flyEl(from,to){const r=from.getBoundingClientRect(),t=to.getBoundingClientRect();const f=document.createElement('div');f.className='fly';
  const cs=getComputedStyle(from);Object.assign(f.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',backgroundImage:cs.backgroundImage,backgroundSize:cs.backgroundSize,backgroundPosition:cs.backgroundPosition});
  document.body.appendChild(f);requestAnimationFrame(()=>requestAnimationFrame(()=>Object.assign(f.style,{left:t.left+t.width/2-10+'px',top:t.top+t.height/2-10+'px',width:'20px',height:'20px',borderRadius:'50%',opacity:.3})));setTimeout(()=>f.remove(),720);}
function flyTo(from,cat){const tgt=$(`#strip button[data-c="${cat}"]`)||$('#figure');flyEl(from,tgt);}

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800);}

/* ======================= boot ======================= */
(async()=>{
  const keys=['base','t2','t3','k2','k3','s2','s3','g2','g3'];
  const ims=await Promise.all(keys.map(k=>load(H(F[k],1000))));keys.forEach((k,i)=>IM[k]=ims[i]);
  const mks=await Promise.all(Object.keys(MASK).map(k=>load(MASK[k])));Object.keys(MASK).forEach((k,i)=>MK[k]=mks[i]);
  render('t',false);
})();
syncAll();moveBar();filter();requestAnimationFrame(sizeThumbs);
addEventListener('resize',moveBar);
document.fonts&&document.fonts.ready.then(moveBar);
</script>
</body>
</html>
