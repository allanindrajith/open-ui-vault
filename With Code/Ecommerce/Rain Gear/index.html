/* ---------- 1440x900 frame ---------- */
#frame{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;
  transform:translate(var(--fx),var(--fy)) scale(var(--s))}
.wm{position:absolute;left:var(--wmx,70px);top:var(--wmy,96px);font:900 var(--wmf,326px)/1 "Archivo X",sans-serif;
  letter-spacing:var(--wmls,-.012em);color:var(--ink);white-space:nowrap;pointer-events:none;user-select:none}
.wm .band{position:absolute;left:0;top:0}
.wm .band:first-child{position:relative}
.glass{position:absolute;background:rgba(232,234,236,.34);-webkit-backdrop-filter:blur(11px) saturate(110%);backdrop-filter:blur(11px) saturate(110%);
  border:1px solid rgba(255,255,255,.75);pointer-events:none}
.g1{left:.07em;top:.626em;width:1.03em;height:.26em;border-right:0;
  -webkit-mask:linear-gradient(90deg,#000 80%,transparent);mask:linear-gradient(90deg,#000 80%,transparent)}
.g2{left:2.975em;top:.574em;width:.859em;height:.49em;clip-path:polygon(.11em 0,100% 0,100% 100%,0 100%,0 .11em)}
.g2::before{content:"";position:absolute;inset:0;border-top:1px solid rgba(255,255,255,.85);border-left:1px solid rgba(255,255,255,.85);
  clip-path:polygon(0 .11em,.11em 0,100% 0,100% 2px,.115em 2px,2px .115em,2px 100%,0 100%)}
.g2 .hatch{position:absolute;right:.045em;top:.04em;width:.028em;height:.42em;
  background:repeating-linear-gradient(-45deg,rgba(255,255,255,.95) 0 2px,transparent 2px 6px)}
#model{position:absolute;left:0;top:-28px;width:1440px;height:956px;pointer-events:none}
#model img,#model canvas{position:absolute;inset:0;width:100%;height:100%}
#model canvas{opacity:0}
#model.gl canvas{opacity:1}
#model.gl img{visibility:hidden}
.deco{position:absolute;inset:0;width:1440px;height:900px;pointer-events:none;overflow:visible}
.deco line,.deco path{vector-effect:non-scaling-stroke}

.tag{position:absolute;display:flex;align-items:center;height:var(--th,20px);padding:0 .64em;background:var(--red);color:#fff;
  font:700 var(--tf,11px)/1 "JB Mono",monospace;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;
  clip-path:polygon(0 0,calc(100% - 5px) 0,100% 5px,100% 100%,5px 100%,0 calc(100% - 5px))}
.brk{position:absolute;pointer-events:none;border-color:var(--mid);border-style:solid;opacity:.7}

/* ---------- UI pinned to the viewport ---------- */
.chev{position:absolute;left:0;top:0;width:1440px;height:900px;overflow:visible;pointer-events:none;fill:var(--red)}
#chevL{transform:translateX(var(--clx,0px))}
#chevTR{transform:translateX(var(--crx,0px))}

header{position:absolute;left:0;right:0;top:0;height:calc(64px*var(--k));min-height:52px;pointer-events:none}
.logo{position:absolute;left:max(16px,calc(38px*var(--k)));top:max(14px,calc(22px*var(--k)));width:max(44px,calc(62px*var(--k)));height:max(24px,calc(24px*var(--k)));
  background:var(--panel);display:flex;align-items:center;justify-content:center;gap:3px;pointer-events:auto;
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.logo i{display:block;width:5px;height:9px;background:var(--red);transform:skewX(-20deg)}
nav{position:absolute;left:50%;top:max(12px,calc(18px*var(--k)));transform:translateX(-50%);display:flex;gap:max(18px,calc(44px*var(--k)));
  padding:0 max(14px,calc(22px*var(--k)));height:max(28px,calc(32px*var(--k)));align-items:center;pointer-events:auto;
  border:1px solid rgba(17,16,18,.16);border-radius:0 0 8px 8px;background:rgba(240,241,242,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
nav a{color:var(--ink);text-decoration:none;font:500 max(11px,calc(10px*var(--k)))/1 "JB Mono",monospace;letter-spacing:.12em;text-transform:uppercase;padding:7px 0;display:inline-block}
nav a:hover{color:var(--red)}

.card{position:absolute;right:max(16px,calc(42px*var(--k)));bottom:max(16px,calc(67px*var(--k)));width:min(calc(100vw - 32px),max(250px,calc(435px*var(--k))));
  padding:max(14px,calc(31px*var(--k))) max(14px,calc(24px*var(--k))) max(16px,calc(55px*var(--k))) max(16px,calc(37px*var(--k)));
  background:rgba(236,238,240,.5);-webkit-backdrop-filter:blur(16px) saturate(120%);backdrop-filter:blur(16px) saturate(120%);
  border:1px solid rgba(255,255,255,.85);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.card .eyebrow{font:500 max(11px,calc(10.5px*var(--k)))/1 "JB Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);margin-bottom:max(8px,calc(10px*var(--k)))}
.card h1{font:600 max(17px,calc(33px*var(--k)))/1.09 "Sora",sans-serif;letter-spacing:-.025em;color:var(--ink)}
.card .xh{position:absolute;right:max(10px,calc(20px*var(--k)));top:max(10px,calc(16px*var(--k)));width:max(16px,calc(24px*var(--k)));height:max(16px,calc(24px*var(--k)))}

.hint{position:absolute;left:max(16px,calc(40px*var(--k)));bottom:max(16px,calc(55px*var(--k)));width:max-content;min-width:min(calc(100vw - 32px),calc(418px*var(--k)));max-width:calc(100vw - 32px);
  padding:max(10px,calc(20px*var(--k))) max(14px,calc(20px*var(--k))) max(10px,calc(20px*var(--k))) max(34px,calc(56px*var(--k)));
  background:var(--panel);color:#E9EAEC;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.hint::before{content:"";position:absolute;left:max(10px,calc(16px*var(--k)));top:8px;bottom:8px;width:max(8px,calc(12px*var(--k)));
  background:repeating-linear-gradient(-45deg,#E9EAEC 0 2px,transparent 2px 5px);opacity:.9}
.hint p{font:500 max(11px,calc(10.5px*var(--k)))/1.7 "JB Mono",monospace;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
@media (max-width:420px){.hint p{white-space:normal}}

/* hover tip + spec card */
#tip{position:fixed;left:0;top:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .16s ease;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
#tip.on{opacity:1}
#tip b{background:var(--red);color:#fff;font:700 11px/1 "JB Mono",monospace;letter-spacing:.1em;padding:5px 8px}
#tip span{background:var(--panel);color:#E9EAEC;font:500 11px/1 "JB Mono",monospace;letter-spacing:.1em;padding:5px 8px;text-transform:uppercase}
#tip span em{font-style:normal;color:var(--red);margin-left:6px}
#spec{position:fixed;z-index:21;left:0;top:0;width:260px;background:var(--panel);color:#E9EAEC;padding:16px 18px 16px;opacity:0;pointer-events:none;
  transform:translateY(6px);transition:opacity .2s ease,transform .3s var(--ease);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
#spec.on{opacity:1;pointer-events:auto;transform:none}
#spec h2{font:700 12px/1 "JB Mono",monospace;letter-spacing:.12em;color:#fff;display:flex;align-items:center;gap:8px;margin-bottom:12px}
#spec h2::before{content:"";width:8px;height:8px;background:var(--red)}
#spec li{list-style:none;font:500 11px/1.5 "JB Mono",monospace;letter-spacing:.06em;text-transform:uppercase;padding:5px 0;border-top:1px solid rgba(255,255,255,.12)}
#spec button{position:absolute;right:8px;top:8px;width:28px;height:28px;background:none;border:0;color:#E9EAEC;font:500 16px/1 "JB Mono",monospace;cursor:pointer}

/* ---------- loader ---------- */
#ld{position:fixed;inset:0;z-index:50;pointer-events:none}
#ld .strip{position:absolute;left:0;right:0;background:#09090A}
#ld .word{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:400 clamp(34px,6vw,72px)/1 "Silk",monospace;color:var(--red);letter-spacing:.06em;white-space:nowrap;display:flex}
#ld .word span{opacity:0;position:relative}
#ld .word span.g::after{content:attr(data-c);position:absolute;left:-.32em;top:-.18em;color:rgba(224,49,63,.35)}
#ld .bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--red);transform-origin:0 50%;transform:scaleX(0)}

/* entrance guard */
.js-anim .rv{opacity:0}
.js-anim.done .rv{opacity:1}

/* ---------- portrait layout ---------- */
.mode-p header{height:56px}
.mode-p nav{left:auto;right:16px;transform:none;border-radius:8px;gap:16px}
.mode-p .card{right:auto;left:16px;top:var(--pcTop,72px);bottom:auto;width:calc(100vw - 32px);max-width:520px}
.mode-p .hint{top:var(--phTop,200px);bottom:auto;width:calc(100vw - 32px);max-width:520px}
.mode-s .card{right:auto;left:16px;top:56px;bottom:auto;width:var(--colw,300px)}
.mode-s .hint{left:16px;bottom:14px;width:var(--colw,300px)}
.mode-s .card h1{font-size:16px}
.mode-s .hint p{white-space:normal}
.mode-p #chevTR,.mode-s #chevTR{clip-path:inset(0 -2000px -2000px -2000px)}
.notags .tag,.notags .brk,.notags .tagline{display:none}

@media (prefers-reduced-motion:reduce){
  .js-anim .rv{opacity:1}
  #ld{display:none}
  #tip,#spec{transition:none}
}
</style>
</head>
<body>
<main id="stage" aria-label="MONS rain shell hero">
  <div class="tex"></div>

  <div id="frame">
    <svg class="chev" id="chevTR" viewBox="0 0 1440 900" aria-hidden="true"><polygon points="560,-400 723,-400 1515,195 1352,195"/></svg>
    <svg class="chev" id="chevL" viewBox="0 0 1440 900" aria-hidden="true"><polygon points="-54,462 101,462 281,642 281,660 -60,926 -60,792 134,636"/></svg>

    <div id="model">
      <img id="imgA" alt="Model in a hooded rain shell, smoked visor and face mask, with a black sling bag" decoding="async">

        <path d="M403 411H447L527 448"/>
        <path d="M430 465H462L498 486"/>
      </g>
      <line x1="282" y1="626" x2="462" y2="497" stroke-opacity=".55"/>
      <g stroke-width="1.2" stroke-opacity=".8">
        <g transform="translate(265 83)"><circle r="7"/><path d="M-13 0H13M0-13V13"/></g>
        <g transform="translate(980 433)"><circle r="7"/><path d="M-13 0H13M0-13V13"/></g>
        <g transform="translate(1188 578)"><circle r="7"/><path d="M-13 0H13M0-13V13"/></g>
      </g>
    </svg>

    <div id="tags" style="position:absolute;inset:0;pointer-events:none;transform:translateX(var(--tagx,0px))">
    <div class="tag rv" id="t1" style="left:288px;top:401px">TRK 01 / HOOD</div>
    <div class="tag rv" id="t2" style="left:262px;top:455px">TRK 02 / SHELL + SLING</div>
    <div class="brk rv" style="left:281px;top:393px;width:10px;height:10px;border-width:1px 0 0 1px"></div>
    <div class="brk rv" style="left:396px;top:419px;width:10px;height:10px;border-width:0 1px 1px 0"></div>
    <div class="brk rv" style="left:255px;top:447px;width:10px;height:10px;border-width:1px 0 0 1px"></div>
    <div class="brk rv" style="left:423px;top:473px;width:10px;height:10px;border-width:0 1px 1px 0"></div>
    </div>
  </div>


  <header>
    <a class="logo rv" href="./" aria-label="MONS home"><i></i><i></i><i></i></a>
    <nav class="rv" aria-label="Primary"><a href="#shop">Shop</a><a href="#tech">Tech</a><a href="#journal">Journal</a></nav>
  </header>

  <section class="card rv" aria-label="Intro">
    <p class="eyebrow">Monsoon Commuter</p>
    <h1>Built for the downpour.<br>Worn every day.</h1>
    <svg class="xh" viewBox="-13 -13 26 26" fill="none" stroke="#4D4A4E" stroke-width="1.2" aria-hidden="true"><circle r="7"/><path d="M-13 0H13M0-13V13"/></svg>
  </section>

  <aside class="hint rv" aria-label="How to interact">
    <p>Hover to unmask / click a piece to view</p>
    <p>Scroll ↓</p>
  </aside>
</main>

<div id="tip" aria-hidden="true"><b id="tipName">STORM HOOD</b><span>Click to view<em>[specs]</em></span></div>
<div id="spec" role="dialog" aria-modal="false" aria-labelledby="specT"><button type="button" aria-label="Close">×</button><h2 id="specT"></h2><ul id="specL"></ul></div>

<div id="ld" aria-hidden="true"><div class="word" id="ldw"></div><div class="bar" id="ldb"></div></div>

<script>
(()=>{
const W=1440,H=900;
const IMG=u=>'https://images.higgs.ai/?default=1&output=webp&url='+encodeURIComponent(u)+'&w=2048&q=85';
const SRC_A=IMG('https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261121_020044_2a50481c-2879-4750-9ba5-f6e6e1c4237e.png');
const SRC_B=IMG('https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261121_020045_d3d98f0d-73d5-4c45-b4eb-72294778af75.png');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const root=document.documentElement, stage=document.getElementById('stage'), frame=document.getElementById('frame');
const $=id=>document.getElementById(id);

/* wordmark: 6 horizontal bands (for the slice-glitch reveal) */
const wm=$('wm'), WORD='MONS', NB=6;
/* band 0 is the solid wordmark; bands 1..NB are clipped copies used only for the intro glitch, then removed */
for(let i=0;i<=NB;i++){const b=document.createElement('div');b.className='band';b.textContent=WORD;
  if(i){const j=i-1;b.style.clipPath=`inset(${(j/NB*100).toFixed(2)}% 0 ${(100-(j+1)/NB*100).toFixed(2)}% 0)`;b.classList.add('slice')}
  wm.appendChild(b)}
const dropSlices=()=>wm.querySelectorAll('.slice').forEach(b=>b.remove());
const g1=document.createElement('div');g1.className='glass g1 rv';wm.appendChild(g1);
const g2=document.createElement('div');g2.className='glass g2 rv';g2.innerHTML='<span class="hatch"></span>';wm.appendChild(g2);

/* ---------- layout ---------- */
let L={s:1,fx:0,fy:0,mode:'l'};
function layout(){
  const vw=innerWidth, vh=innerHeight, ar=vw/vh;
  let mode=ar<1.05?'p':(vh<560?'s':'l'), s, fx, fy, k, wmx=70, wmf=326, wmy=96;
  root.classList.remove('mode-p','mode-s','mode-l','notags'); root.classList.add('mode-'+mode);
  if(mode==='l'){
    /* frame spans the viewport width; wide screens crop the bottom, squarer ones leave flat bg on top */
    s=vw/W; fx=0; fy=ar>W/H?0:vh-H*s; k=Math.min(vw/W,vh/H);
  }else if(mode==='s'){
    s=vh/H; fx=vw*0.64-700*s; fy=0; k=s;
    const colw=Math.max(190,Math.min(330,fx+300*s-32)); root.style.setProperty('--colw',colw+'px');
  }else{
    k=Math.min(1,vw/900);
    const card=document.querySelector('.card'), hint=document.querySelector('.hint');
    root.style.setProperty('--pcTop','64px');
    const ch=card.offsetHeight; root.style.setProperty('--phTop',(64+ch+10)+'px');
    const stackBottom=64+ch+10+hint.offsetHeight+12;
    /* crop in on the model: as large as the space under the HUD allows, head always in view */
    s=Math.min(vw/420,(vh-stackBottom)/(H-120),vw/900*1.9);
    fx=vw/2-705*s; fy=vh-H*s;
    if(vw<640) root.classList.add('notags');
  }
  if(mode!=='l'){ /* fit the wordmark inside the visible window of the frame (beside the column in short landscape) */
    const colR=mode==='s'?16+parseFloat(getComputedStyle(root).getPropertyValue('--colw')):0;
    const winL=(colR-fx)/s, winR=(vw-fx)/s, pad=20/s, avail=winR-winL-2*pad;
    const sc=Math.min(1,avail/1280); wmf=326*sc;
    wmx=winL+pad+Math.max(0,(avail-1280*sc)/2)-0.0755*wmf; wmy=131-0.107*wmf;
    root.style.setProperty('--clx',(-fx/s)+'px'); root.style.setProperty('--crx',(winR-W)+'px');
    root.style.setProperty('--tagx',Math.max(0,(colR-fx)/s+16/s-255)+'px');
  }else{root.style.setProperty('--clx','0px');root.style.setProperty('--crx','0px');root.style.setProperty('--tagx','0px')}
  if(mode==='s' && vw<700) root.classList.add('notags');
  L={s,fx,fy,mode};
  const st=root.style;
  st.setProperty('--s',s); st.setProperty('--k',k);
  st.setProperty('--fx',fx+'px'); st.setProperty('--fy',fy+'px');
  st.setProperty('--wmx',wmx+'px'); st.setProperty('--wmy',wmy+'px'); st.setProperty('--wmf',wmf+'px');
  const tf=Math.max(11,11/s), th=Math.max(21,22/s);
  st.setProperty('--tf',tf+'px'); st.setProperty('--th',th+'px');
  resizeGL();
}

/* ---------- WebGL unmask ---------- */
const model=$('model'), cv=$('gl'), imgA=$('imgA');
imgA.src=SRC_A;
let gl=null, prog, texA, texB, texT, uTime, ready=false, tc, tctx;
const TW=360, TH=239;   /* trail buffer, model-canvas aspect (1440x956) */
function resizeGL(){
  if(!gl) return;
  const dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.min(2048,Math.round(1440*L.s*dpr)), h=Math.round(w*956/1440);
  if(cv.width!==w){cv.width=w;cv.height=h;gl.viewport(0,0,w,h);draw()}
}
function sh(type,src){const o=gl.createShader(type);gl.shaderSource(o,src);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
function tex(img){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  if(img)gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);return t}
const FS=`precision mediump float;
varying vec2 v;uniform sampler2D A,B,T;uniform float t;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
void main(){
  vec4 a=texture2D(A,v),b=texture2D(B,v);
  float nz=n(v*vec2(14.,9.3)+vec2(t*.35,-t*.2))*.55+n(v*vec2(34.,22.)-t*.5)*.45;
  float tr=texture2D(T,v).r+(nz-.5)*.16;
  float m=smoothstep(.40,.47,tr);
  vec2 ex=vec2(1.6/360.,0.),ey=vec2(0.,1.6/239.);
  float grad=length(vec2(texture2D(T,v+ex).r-texture2D(T,v-ex).r,texture2D(T,v+ey).r-texture2D(T,v-ey).r));
  float edge=smoothstep(.012,.07,grad);            /* rim only where the trail changes, never a flat fill */
  float glow=edge*(1.-smoothstep(0.,.2,abs(tr-.43)));
  float line=edge*smoothstep(.405,.43,tr)*(1.-smoothstep(.43,.455,tr));
  vec4 c=mix(a,b,m);
  vec3 red=vec3(.878,.192,.247);
  c.rgb=mix(c.rgb,red,glow*.78);
  c.rgb=mix(c.rgb,vec3(1.,.86,.87),line*.9);
  c.rgb+=red*glow*glow*.25;
  gl_FragColor=vec4(c.rgb*c.a,c.a);
}`;
function initGL(ia,ib){
  try{
    gl=cv.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:false});
    if(!gl) return false;
    prog=gl.createProgram();
    gl.attachShader(prog,sh(gl.VERTEX_SHADER,'attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0,1);}'));
    gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);gl.useProgram(prog);
    const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
    gl.activeTexture(gl.TEXTURE0);texA=tex(ia);gl.activeTexture(gl.TEXTURE1);texB=tex(ib);
    tc=document.createElement('canvas');tc.width=TW;tc.height=TH;tctx=tc.getContext('2d');tctx.fillStyle='#000';tctx.fillRect(0,0,TW,TH);
    gl.activeTexture(gl.TEXTURE2);texT=tex(tc);
    gl.uniform1i(gl.getUniformLocation(prog,'A'),0);gl.uniform1i(gl.getUniformLocation(prog,'B'),1);gl.uniform1i(gl.getUniformLocation(prog,'T'),2);
    uTime=gl.getUniformLocation(prog,'t');
    gl.clearColor(0,0,0,0);
    ready=true;resizeGL();draw();model.classList.add('gl');return true;
  }catch(e){console.warn(e);gl=null;return false}
}
function draw(){if(!ready)return;gl.uniform1f(uTime,performance.now()/1000);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}

/* trail: soft blobs along the pointer path, decaying back to the mask */
let px=null,py=null,energy=0,running=false,lastT=0;
const pts=[];
function addPoint(fxp,fyp){ /* frame coords -> trail coords */
  const x=fxp/1440*TW, y=(fyp+28)/956*TH;
  if(px!==null&&Math.hypot(x-px,y-py)>70)px=null;   /* a jump (pointer re-entering) starts a new trail */
  if(px!==null){
    const dx=x-px,dy=y-py,d=Math.hypot(dx,dy), sp=Math.min(1,d/18);
    const r=24+sp*10, steps=Math.max(1,Math.ceil(d/(r*.25)));
    for(let i=1;i<=steps;i++)pts.push([px+dx*i/steps,py+dy*i/steps,r]);
  }else pts.push([x,y,26]);
  px=x;py=y;energy=1;kick();
}
function stamp(){
  tctx.globalCompositeOperation='lighter';
  for(const [x,y,r] of pts){const g=tctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.6,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');
    tctx.fillStyle=g;tctx.beginPath();tctx.arc(x,y,r,0,7);tctx.fill()}
  pts.length=0;tctx.globalCompositeOperation='source-over';
}
function kick(){if(!running&&ready){running=true;lastT=performance.now();requestAnimationFrame(loop)}}
function loop(now){
  const dt=Math.min(50,now-lastT);lastT=now;
  /* exponential decay: ~0.7s back to masked */
  tctx.fillStyle=`rgba(0,0,0,${(1-Math.pow(0.05,dt/850)).toFixed(4)})`;tctx.fillRect(0,0,TW,TH);
  stamp();
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,texT);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,tc);
  draw();
  energy*=Math.pow(0.05,dt/900);
  if(energy>0.004){requestAnimationFrame(loop)}else{tctx.fillStyle='#000';tctx.fillRect(0,0,TW,TH);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,tc);draw();running=false;px=null}
}

/* ---------- kit pieces: hover tag + click spec ---------- */
const PIECES=[
  {id:'visor',name:'RAIN VISOR',test:(x,y)=>x>592&&x<818&&y>200&&y<300,specs:['Smoked anti-fog lens','Wraps under the hood','Beads and sheds rain']},
  {id:'mask',name:'FILTER MASK',test:(x,y)=>x>624&&x<792&&y>=300&&y<420,specs:['Washable mesh shell','Swap-in filter insert','Magnetic quick release']},
  {id:'hood',name:'STORM HOOD',test:(x,y)=>Math.hypot((x-705)/150,(y-235)/180)<1,specs:['Three-point adjust','Wired brim holds shape','Glove-friendly cord locks']},
  {id:'sling',name:'DRY SLING',test:(x,y)=>(x>585&&x<915&&y>590&&y<900&&(y-590)>(x-585)*-.2)||(x>505&&x<640&&y>470&&y<640),specs:['Welded roll-top body','Four litre volume','One-hand buckle release']},
  {id:'shell',name:'TAPED SHELL',test:(x,y)=>y>420&&x>270&&x<1125&&Math.hypot((x-697)/440,(y-930)/520)<1,specs:['Three-layer membrane','Fully taped seams','Pit zips for airflow']}
];
const tip=$('tip'),tipName=$('tipName'),spec=$('spec');let cur=null;
function hit(cx,cy){const x=(cx-L.fx)/L.s,y=(cy-L.fy)/L.s;for(const p of PIECES)if(p.test(x,y))return p;return null}
function moveTip(cx,cy){const w=tip.offsetWidth,h=tip.offsetHeight;let x=cx+18,y=cy+16;if(x+w>innerWidth-8)x=cx-w-14;if(y+h>innerHeight-8)y=cy-h-12;tip.style.transform=`translate(${x}px,${y}px)`}
function openSpec(p,cx,cy){
  $('specT').textContent=p.name;$('specL').innerHTML=p.specs.map(s=>'<li>'+s+'</li>').join('');
  spec.classList.add('on');const w=spec.offsetWidth,h=spec.offsetHeight;
  let x=Math.min(Math.max(8,cx+20),innerWidth-w-8),y=Math.min(Math.max(8,cy-h/2),innerHeight-h-8);
  if(innerWidth<640){x=(innerWidth-w)/2;y=Math.max(8,innerHeight-h-16)}
  spec.style.left=x+'px';spec.style.top=y+'px';tip.classList.remove('on');
}
function closeSpec(){spec.classList.remove('on')}
spec.querySelector('button').addEventListener('click',e=>{e.stopPropagation();closeSpec()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeSpec()});

let down=false;
stage.addEventListener('pointermove',e=>{
  const x=(e.clientX-L.fx)/L.s,y=(e.clientY-L.fy)/L.s;
  if(!reduce&&(e.pointerType==='mouse'||down))addPoint(x,y);
  if(e.pointerType==='mouse'){const p=hit(e.clientX,e.clientY);
    if(p!==cur){cur=p;if(p){tipName.textContent=p.name;tip.classList.add('on')}else tip.classList.remove('on')}
    stage.style.cursor=p?'pointer':'crosshair';if(p)moveTip(e.clientX,e.clientY)}
});
stage.addEventListener('pointerdown',e=>{down=true;if(e.pointerType!=='mouse'){px=null;addPoint((e.clientX-L.fx)/L.s,(e.clientY-L.fy)/L.s)}});
addEventListener('pointerup',()=>{down=false});
stage.addEventListener('pointerleave',()=>{cur=null;tip.classList.remove('on')});
stage.addEventListener('click',e=>{if(e.target.closest('a,nav,.logo'))return;const p=hit(e.clientX,e.clientY);if(p)openSpec(p,e.clientX,e.clientY);else closeSpec()});

/* ---------- magnetic repel parallax: every layer except the model drifts away from the cursor ---------- */
/* depth = max shift in px at the frame edge (frame units for frame layers, viewport px*k for HUD) */
const PLX=[
  ['.tex',8,'k'],['#chevTR',24,'f'],['#chevL',24,'f'],['#wm',14,'f'],['.g1',9,'f'],['.g2',9,'f'],
  ['#deco',18,'f'],['#tags',20,'f'],['.card',7,'k'],['.hint',7,'k']
].map(([sel,d,u])=>({els:[...document.querySelectorAll(sel)],d,u}));
let tx=0,ty=0,cx=0,cy=0,plxRun=false,plxT=0;
function plxTarget(x,y){tx=Math.max(-1,Math.min(1,(x/innerWidth-.5)*2));ty=Math.max(-1,Math.min(1,(y/innerHeight-.5)*2));
  if(!plxRun&&!reduce){plxRun=true;plxT=performance.now();requestAnimationFrame(plxLoop)}}
function plxLoop(now){
  const dt=Math.min(64,now-plxT);plxT=now;const a=1-Math.exp(-dt/220);   /* soft follow, ~0.6 s settle */
  cx+=(tx-cx)*a;cy+=(ty-cy)*a;
  const k=parseFloat(getComputedStyle(root).getPropertyValue('--k'))||1;
  for(const L of PLX){const m=L.u==='k'?k:1;const x=(-cx*L.d*m).toFixed(2),y=(-cy*L.d*.7*m).toFixed(2);
    for(const el of L.els)el.style.translate=`${x}px ${y}px`}
  if(Math.abs(tx-cx)>.0005||Math.abs(ty-cy)>.0005)requestAnimationFrame(plxLoop);else plxRun=false;
}
stage.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||down)plxTarget(e.clientX,e.clientY)});
stage.addEventListener('pointerleave',()=>plxTarget(innerWidth/2,innerHeight/2));
addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')plxTarget(innerWidth/2,innerHeight/2)});

/* ---------- load + loader + entrance ---------- */
addEventListener('resize',layout);
layout();
function loadImg(src){return new Promise(r=>{const i=new Image();i.crossOrigin='anonymous';i.decoding='async';i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
const fontsP=document.fonts?document.fonts.load('900 100px "Archivo X"').then(()=>document.fonts.load('400 40px "Silk"')).catch(()=>{}):Promise.resolve();
const imgsP=Promise.all([loadImg(SRC_A),loadImg(SRC_B)]);

const ldw=$('ldw'),ldb=$('ldb'),ld=$('ld');
const NS=10;const strips=[];
for(let i=0;i<NS;i++){const s=document.createElement('div');s.className='strip';s.style.top=(i/NS*100)+'%';s.style.height=(100/NS+.2)+'%';ld.insertBefore(s,ldw);strips.push(s)}
[...WORD].forEach((c,i)=>{const sp=document.createElement('span');sp.textContent=c;sp.dataset.c=c;if(i===0)sp.className='g';ldw.appendChild(sp)});

function finish(){root.classList.add('done');dropSlices();ld.remove()}
const failsafe=setTimeout(()=>{if(!root.classList.contains('done')){finish()}},5000);

async function run(){
  if(reduce){await fontsP;layout();finish();return}
  /* 0.00-0.40 pixel wordmark flickers in, progress line fills */
  const letters=[...ldw.children];
  letters.forEach((sp,i)=>sp.animate([{opacity:0},{opacity:1,offset:.3},{opacity:.2,offset:.5},{opacity:1}],{duration:200,delay:40+i*70,fill:'forwards',easing:'steps(4,end)'}));
  letters[0].animate([{transform:'translate(0,0)'},{transform:'translate(-6px,-4px)'},{transform:'translate(0,0)'}],{duration:120,delay:300,easing:'steps(2,end)'});
  const bar=ldb.animate([{transform:'scaleX(0)'},{transform:'scaleX(.8)'}],{duration:420,fill:'forwards',easing:'cubic-bezier(.3,.6,.3,1)'});
  const [[ia,ib]]=await Promise.all([imgsP,fontsP,new Promise(r=>setTimeout(r,420))]);
  layout();
  if(ia&&ib&&initGL(ia,ib)){}
  ldb.animate([{transform:'scaleX(.8)'},{transform:'scaleX(1)'}],{duration:90,fill:'forwards'});
  await new Promise(r=>setTimeout(r,90));
  clearTimeout(failsafe);

  /* ~0.45-0.75 slice-glitch wipe */
  ldw.animate([{opacity:1},{opacity:0}],{duration:60,fill:'forwards'});
  ldb.animate([{opacity:1},{opacity:0}],{duration:80,fill:'forwards'});
  strips.forEach((s,i)=>{const d=Math.random()*170;s.animate([{transform:'translateX(0)'},{transform:`translateX(${i%2?'':'-'}104%)`}],{duration:260,delay:d,fill:'forwards',easing:'cubic-bezier(.7,0,.3,1)'})});
  wm.querySelector('.band').animate([{opacity:0},{opacity:1}],{duration:1,delay:440,fill:'backwards'});
  wm.querySelectorAll('.slice').forEach((b,i)=>{const o=(i%2?1:-1)*(40+Math.random()*90);
    b.animate([{transform:`translateX(${o}px)`,opacity:0},{transform:`translateX(${-o*.25}px)`,opacity:1,offset:.6},{transform:'translateX(0)',opacity:1}],{duration:360,delay:60+Math.random()*20*i,fill:'backwards',easing:'steps(5,end)'})});
  setTimeout(dropSlices,520);
  model.animate([{opacity:0,filter:'brightness(1.9) contrast(.6)'},{opacity:1,filter:'brightness(1) contrast(1)'}],{duration:420,delay:120,fill:'backwards',easing:'cubic-bezier(.2,.7,.2,1)'});
  $('chevL').animate([{translate:'-420px 0'},{translate:'0 0'}],{duration:520,delay:180,fill:'backwards',easing:'cubic-bezier(.2,.8,.2,1)'});
  $('chevTR').animate([{translate:'420px 0'},{translate:'0 0'}],{duration:520,delay:240,fill:'backwards',easing:'cubic-bezier(.2,.8,.2,1)'});

  /* 0.80-1.6 HUD settles in, staggered, once */
  const order=['.logo','nav','#deco','.g1','.g2','#t1','#t2','.brk','.card','.hint'];
  let i=0;root.classList.add('done');
  order.forEach(sel=>document.querySelectorAll(sel).forEach(el=>{
    const y=el.matches('.card,.hint')?14:8;
    const kf=el.matches('nav')?[{opacity:0},{opacity:1}]:[{opacity:0,translate:`0 ${y}px`},{opacity:1,translate:'0 0'}];
    el.animate(kf,{duration:900,delay:360+i*55,fill:'backwards',easing:'cubic-bezier(.16,.84,.24,1)'});i++}));
  setTimeout(()=>ld.remove(),700);
}
run();
})();
</script>
