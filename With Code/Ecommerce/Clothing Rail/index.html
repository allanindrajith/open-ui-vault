:root{--bg:#0b0b0c;--ink:#f1efec;--mute:#8d8a86;--red:#b3121b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:"Inter","Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* 1500x1000 artboard scaled to fit */
#art{position:absolute;width:1500px;height:1000px;transform-origin:0 0;background:radial-gradient(70% 55% at 50% 40%,#18181a,var(--bg))}
.ui{font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
#about{position:absolute;left:46px;top:46px}
#contact{position:absolute;right:46px;top:46px}
#logo{position:absolute;left:50%;top:26px;transform:translateX(-50%);font:400 64px/1 "UnifrakturMaguntia",serif;letter-spacing:.01em}
/* everything that washes out when a garment is opened */
.dim{transition:opacity .7s cubic-bezier(.2,.8,.2,1),filter .7s}
body.open .dim{opacity:.12;filter:blur(2px)}
body.open .dimmer{opacity:0;pointer-events:none}

/* rail */
#rail{position:absolute;left:150px;right:150px;top:254px;height:12px;border-radius:6px;
  background:linear-gradient(#fafafa 0%,#b9bcc1 28%,#5d6066 55%,#a9adb3 78%,#e6e7e9 100%);box-shadow:0 10px 18px rgba(0,0,0,.45)}
#rail::before,#rail::after{content:"";position:absolute;top:-9px;width:16px;height:30px;border-radius:5px;background:linear-gradient(90deg,#8d9096,#f3f3f4 45%,#7a7d83)}
#rail::before{left:-14px}#rail::after{right:-14px}

/* garments: each one is a front-facing cut-out turned edge-on in real 3D */
#rack{position:absolute;left:0;top:0;width:1500px;height:1000px}
.g{position:absolute;top:236px;width:289px;height:300px;margin-left:-144.5px;perspective:900px;cursor:pointer;
  transition:left .75s cubic-bezier(.2,.8,.2,1)}
.g i{position:absolute;inset:0;background-repeat:no-repeat;transform-origin:50% 4%;transform:rotateY(-74deg);
  transition:transform .75s cubic-bezier(.2,.8,.2,1),filter .75s;filter:brightness(.82) drop-shadow(0 18px 18px rgba(0,0,0,.5))}
.g.face i{transform:rotateY(0deg);filter:brightness(1) drop-shadow(0 22px 26px rgba(0,0,0,.55))}
#cap{position:absolute;top:552px;transform:translateX(-50%);text-align:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);
  white-space:nowrap;transition:left .75s cubic-bezier(.2,.8,.2,1),opacity .35s;opacity:0;pointer-events:none}
#cap b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
#cap.on{opacity:1}
.pill{height:34px;padding:0 20px;border:1px solid rgba(241,239,236,.6);border-radius:40px;display:inline-grid;place-items:center;transition:background .25s,color .25s}
.pill:hover{background:var(--ink);color:var(--bg)}
#avail{position:absolute;left:50%;top:790px;transform:translateX(-50%)}

/* marquee band */
#band{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--red);overflow:hidden;display:flex;align-items:center}
#band div{display:flex;white-space:nowrap;animation:mq 22s linear infinite;font-size:13px;font-weight:600;letter-spacing:.14em}
#band span{padding-right:22px}
@keyframes mq{to{transform:translateX(-50%)}}

/* detail view */
#det{position:absolute;inset:0;pointer-events:none}
#big{position:absolute;left:50%;top:244px;width:473px;height:492px;margin-left:-236.5px;background-repeat:no-repeat;transform-origin:50% 4%;opacity:0;
  filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
#big2{position:absolute;left:50%;top:244px;width:473px;height:492px;margin-left:-236.5px;background-repeat:no-repeat;opacity:0;pointer-events:none}
#info{position:absolute;left:50%;top:770px;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .5s .25s}
#num{font-size:11px;letter-spacing:.16em;color:var(--mute)}
#name{font:italic 400 40px/1.15 "Instrument Serif",serif;margin:8px 0 6px}
#price{font-size:13px;letter-spacing:.08em;color:var(--mute);margin-bottom:18px}
.arr{position:absolute;top:452px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(241,239,236,.5);display:grid;place-items:center;opacity:0;transition:opacity .4s .25s,background .2s,color .2s}
.arr:hover{background:var(--ink);color:var(--bg)}
#prev{left:calc(50% - 300px)}#next{left:calc(50% + 254px)}
#close{position:absolute;right:46px;top:46px;opacity:0;transition:opacity .4s .25s}
body.open #det{pointer-events:auto}
body.open #info,body.open .arr,body.open #close{opacity:1}
body.open #det button{pointer-events:auto}
#det .hit{position:absolute;inset:0}
</style>
</head>
<body>

  <div class="ui dim" id="about">About</div>

  <div class="ui dim dimmer" id="contact">Contact</div>
  <div id="rail" class="dim"></div>
  <div id="rack" class="dim"></div>
  <div id="cap" class="dimmer"><b></b><span></span></div>
  <button class="pill ui dim dimmer" id="avail">See availability</button>
  <div id="band" class="dimmer"><div></div></div>
  <div id="det">
    <div class="hit"></div>
    <div id="big2"></div><div id="big"></div>
    <button class="arr" id="prev" aria-label="Previous"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button class="arr" id="next" aria-label="Next"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <div id="info"><div id="num"></div><div id="name"></div><div id="price"></div><button class="pill ui">See availability</button></div>

  </div>
</div>
<script>
const $=id=>document.getElementById(id);
/* one transparent 2048x1360 sheet: 5x2 garments on hangers, each in a 409.6 x 530 cell */
const SHEET='https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261107_130252_7b1b8485-d5c5-440c-8921-f5ae01054c6a.png&w=2048&q=90';

const P=[['Winged Skull Tee','€48'],['Heavy Blank Tee — Black','€38'],['Heavy Blank Tee — White','€38'],['Offcut Longsleeve','€55'],['Rose & Chain Tee','€52'],
         ['Varsity Jacket','€240'],['No Restocks Longsleeve','€58'],['Arch Logo Hoodie','€95'],['Barbed Heart Tee','€48'],['Black Zip Hoodie','€98']];
const N=P.length;

function paint(el,k){const x=(k%5)*CW-PAD,y=ROWY[Math.floor(k/5)],ew=el.offsetWidth,eh=el.offsetHeight;
  el.style.backgroundImage=`url("${SHEET}")`;el.style.backgroundSize=`${SW/BW*ew}px ${SH/CH*eh}px`;
  el.style.backgroundPosition=`${-x/BW*ew}px ${-y/CH*eh}px`;el.style.clipPath=CLIP[k]}

/* fit */
const art=$('art');function fit(){const k=Math.min(innerWidth/1500,innerHeight/1000);art.style.transform=`scale(${k})`;art.style.left=(innerWidth-1500*k)/2+'px';art.style.top=(innerHeight-1000*k)/2+'px'}
addEventListener('resize',fit);fit();

/* marquee */
$('band').firstElementChild.innerHTML=Array(16).fill('<span>OFFCUT</span><span>•</span><span>LIMITED RUN</span><span>•</span><span>NO RESTOCKS</span><span>•</span>').join('');

/* rail layout: edge-on slots, the faced garment opens a gap so its neighbours slide aside */
const rack=$('rack'),SLOT=108,OPEN=86,CX=750;
const G=P.map((p,k)=>{const d=document.createElement('div');d.className='g';d.innerHTML='<i></i>';rack.appendChild(d);paint(d.firstChild,k);return d});
let hov=-1,open=-1;
function layout(){G.forEach((g,k)=>{let x=CX+(k-(N-1)/2)*SLOT;if(hov>=0&&k!==hov)x+=Math.sign(k-hov)*OPEN;g.style.left=x+'px';g.classList.toggle('face',k===hov)});
  const c=$('cap');if(hov>=0){c.style.left=G[hov].style.left;c.firstChild.textContent=P[hov][0];c.lastChild.textContent=P[hov][1];c.classList.add('on')}else c.classList.remove('on')}
G.forEach((g,k)=>{g.addEventListener('pointerenter',()=>{if(open<0){hov=k;layout()}});g.addEventListener('click',()=>openG(k))});
rack.addEventListener('pointerleave',()=>{if(open<0){hov=-1;layout()}});
layout();

/* detail: the clicked garment lifts out of the rail to the centre, facing front, larger; everything else washes out */
const big=$('big'),big2=$('big2');
function openG(k){if(open>=0)return;open=k;hov=k;layout();
  const g=G[k],gx=parseFloat(g.style.left);big.getAnimations().forEach(x=>x.cancel());paint(big,k);fill(k);document.body.classList.add('open');
  big.animate([{transform:`translate(${gx-CX}px,-8px) scale(.61)`,opacity:1},{transform:'none',opacity:1}],{duration:750,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
  g.style.visibility='hidden'}
function fill(k){$('num').textContent=String(k+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');$('name').textContent=P[k][0];$('price').textContent=P[k][1]}
function step(d){if(open<0)return;const from=open;open=(open+d+N)%N;fill(open);G[from].style.visibility='';G[open].style.visibility='hidden';hov=open;layout();
  paint(big2,from);big2.animate([{transform:'none',opacity:1,filter:'blur(0)'},{transform:`translateX(${-d*120}px) scale(.94)`,opacity:0,filter:'blur(6px)'}],{duration:600,easing:'cubic-bezier(.2,.8,.2,1)'});
  big.getAnimations().forEach(x=>x.cancel());paint(big,open);big.animate([{transform:`translateX(${d*120}px) scale(.94)`,opacity:0,filter:'blur(6px)'},{transform:'none',opacity:1,filter:'blur(0)'}],{duration:600,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'})}
function closeG(){if(open<0)return;const k=open,gx=parseFloat(G[k].style.left);
  const a=big.animate([{transform:'none',opacity:1},{transform:`translate(${gx-CX}px,-8px) scale(.61)`,opacity:1}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
  document.body.classList.remove('open');setTimeout(()=>{G[k].style.visibility='';big.getAnimations().forEach(x=>x.cancel());big.style.opacity=0;open=-1;hov=-1;layout()},650)}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('close').onclick=closeG;document.querySelector('#det .hit').onclick=closeG;
addEventListener('keydown',e=>{if(open>=0){if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);if(e.key==='Escape')closeG()}
  else{if(e.key==='ArrowRight'){hov=Math.min(N-1,hov+1);layout()}if(e.key==='ArrowLeft'){hov=Math.max(0,hov<0?N-1:hov-1);layout()}if(e.key==='Enter'&&hov>=0)openG(hov)}});
window.__closet={openG,step,closeG,setHov:k=>{hov=k;layout()}};
