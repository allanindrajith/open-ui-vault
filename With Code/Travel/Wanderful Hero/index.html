<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wanderful</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Dirtyline';src:url('https://fonts.cdnfonts.com/s/15011/Dirtyline36DaysofType.woff') format('woff');font-weight:normal;font-style:normal;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;font-family:'Barlow',sans-serif;overflow-x:hidden}
.root{min-height:100vh;background:#000;color:#fff;overflow-x:hidden;font-family:'Inter',sans-serif;position:relative}
.vwrap{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#2a8aa5 0%,#5fa5b5 35%,#b57a2c 62%,#2a1a08 85%,#000 100%)}
.vwrap .scale{position:absolute;inset:0;transform:scale(1.08);transform-origin:center}
.vwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.liquid-glass{background:rgba(255,255,255,0.01);background-blend-mode:luminosity;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.1);position:relative;overflow:hidden}
.liquid-glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.15) 80%,rgba(255,255,255,0.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
header{position:fixed;top:0;left:0;right:0;z-index:50;padding:32px 40px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:17px;font-weight:600;letter-spacing:-0.025em}
.logo sup{font-size:.6em}
nav{border-radius:9999px;padding:8px;display:flex;align-items:center;gap:4px}
nav a,.cta{color:rgba(255,255,255,.9);text-decoration:none;font-size:11px;font-weight:500;letter-spacing:.12em;transition:color .2s}
nav a{padding:6px 16px;border-radius:9999px}
nav a:hover,.cta:hover{color:#fff}
.cta{border-radius:9999px;padding:10px 20px}
.headline{position:fixed;top:120px;left:0;right:0;z-index:20;text-align:center;font-weight:400;font-size:clamp(40px,5.4vw,72px);line-height:1.1;letter-spacing:-0.02em;padding:0 16px;transition:all 1s;opacity:0;transform:translateY(24px)}
.headline span{display:block}
.headline .dim{color:rgba(255,255,255,.55)}
.bottom{position:fixed;bottom:56px;left:0;right:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:24px;padding:0 20px;transition:all 1s .3s;opacity:0;transform:translateY(24px)}
.in .headline,.in .bottom{opacity:1;transform:none}
.bottom p{max-width:620px;font-size:15px;line-height:1.625;text-align:center}
.bottom p .dim{color:rgba(255,255,255,.55)}
.btn{background:#fff;color:#000;font:500 15px 'Inter',sans-serif;border:0;border-radius:9999px;padding:14px 32px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:scale(1.03);box-shadow:0 0 32px 4px rgba(255,255,255,.2)}
.btn:active{transform:scale(.97)}
.secure{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:500;letter-spacing:.14em;color:rgba(255,255,255,.7);text-align:center}
@media(max-width:820px){
 header{padding:18px 16px}
 nav{display:none}
 .cta{padding:9px 16px}
 .headline{top:84px}
 .bottom{bottom:32px;gap:20px}
 .bottom p{font-size:14px}
 .secure{font-size:10px}
}
</style>
</head>
<body>
<div class="root" id="root">
 <div class="vwrap"><div class="scale" id="vbg">
  <video id="v" autoplay muted loop playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260510_060007_60275ce7-030c-4668-a160-8f364ec537d3.mp4"></video>
 </div></div>
 <header>
  <div class="logo">Wanderful<sup>TM</sup></div>
  <nav class="liquid-glass">
   <a href="#">JOURNEY</a><a href="#">BENEFITS</a><a href="#">JOURNAL</a><a href="#">GUIDEBOOK</a>
  </nav>
  <a href="#" class="cta liquid-glass">GET ROAMING</a>
 </header>
 <h1 class="headline"><span>Venture without edges.</span><span class="dim">Uncover with keen instinct.</span></h1>
 <div class="bottom">
  <p>Our smart itineraries shape around you — your rhythm, your vibe, your hunger for adventure.<span class="dim"> Each getaway is tailored, seamless, and wholly yours.</span></p>
  <button class="btn">Plan my escape today</button>
  <div class="secure">
   <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
   <span>SECURE BY DESIGN. ZERO DATA LEAKS.</span>
  </div>
 </div>
</div>
<script>
requestAnimationFrame(function(){requestAnimationFrame(function(){document.getElementById('root').classList.add('in')})});
var v=document.getElementById('v');
v.addEventListener('loadedmetadata',function(){v.playbackRate=1.25});
var bg=document.getElementById('vbg'),tx=0,ty=0,cx=0,cy=0;
addEventListener('mousemove',function(e){var w=innerWidth/2,h=innerHeight/2;tx=((e.clientX-w)/w)*20;ty=((e.clientY-h)/h)*20});
(function loop(){cx+=(tx-cx)*0.06;cy+=(ty-cy)*0.06;bg.style.translate=cx+'px '+cy+'px';requestAnimationFrame(loop)})();
</script>
</body>
</html>
