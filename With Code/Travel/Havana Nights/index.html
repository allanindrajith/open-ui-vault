:root{--stage:#ebe1d7;--ink:#fff;--band:#0b0b0c}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#0b0b0c;overflow-x:clip;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{font-family:"Montserrat",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.track{height:260vh;height:260svh}
.hero{position:sticky;top:0;width:100%;height:100vh;height:100svh;overflow:hidden;background:var(--stage)}
.world{position:absolute;inset:0;display:none;will-change:transform}
.plate{position:absolute;display:block;pointer-events:none;user-select:none}
.plate.night{opacity:0;will-change:opacity}
#layers{position:absolute;inset:0;z-index:1;--night:0}
.piece{position:absolute;top:0;will-change:transform;pointer-events:none}
.piece canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.piece canvas.n{opacity:var(--night)}
.band{position:absolute;left:0;top:0;width:100%;z-index:2;will-change:transform;background-repeat:no-repeat;background-position:50% 0;background-size:cover;background-color:var(--band)}
.title{position:absolute;right:3vw;font-family:"Black Ops One",Impact,sans-serif;font-weight:400;line-height:1;color:#f4f2ee;white-space:nowrap;letter-spacing:.01em;
 text-shadow:0 0 18px rgba(255,255,255,.22),0 0 2px rgba(255,255,255,.5)}
.half{position:absolute;top:0;height:100%;z-index:3;overflow:hidden;background-color:var(--stage);will-change:transform}
.half.l{left:0}.half.r{right:0}
.half i{position:absolute;top:50%;display:block;background-repeat:no-repeat;background-size:100% 100%}
nav{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:max(14px,calc(var(--u)*34)) max(20px,calc(var(--u)*70)) 0;font-size:max(12px,calc(var(--u)*15));letter-spacing:.02em;
 text-shadow:0 1px 10px rgba(40,30,20,.28)}
nav .grp{display:flex;gap:max(18px,calc(var(--u)*78))}
nav a{color:inherit;text-decoration:none;padding:6px 0;line-height:1.2;min-width:24px;text-align:center}
nav .logo{position:absolute;left:50%;top:calc(var(--u)*22);transform:translateX(-50%);width:calc(var(--u)*44);height:calc(var(--u)*50)}
nav .logo svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 6px rgba(40,30,20,.25))}
.hero{--u:calc(100vw/1440)}
@media (max-width:820px){
 nav{padding:calc(14px + env(safe-area-inset-top)) 16px 0;font-size:12px;flex-wrap:wrap;row-gap:0}
 nav .grp{gap:16px}
 nav .logo{position:static;transform:none;order:-1;width:100%;height:34px;margin-bottom:10px;display:flex;justify-content:center}
 nav .logo svg{width:30px;height:34px}
 nav .grp.r{margin-left:auto}
}
@media (max-width:360px){nav{font-size:11px}nav .grp{gap:12px}}
@media (orientation:landscape) and (max-height:500px){nav{padding-top:10px;font-size:12px}nav .logo{top:6px;width:28px;height:32px}nav .grp{gap:18px}}
</style>

const CDN='https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/';
const PLATE_AR=2048/1360, FACADE_AR=2496/1664;
const PLATE_H=1.26;  // the street is 1.26x the frame height: the least that keeps its outer columns covered until the ledge arrives (max of ledge + 0.32 x rise over the scroll = 1.252)
// request only as many pixels as the screen needs (street plates are 2048 wide, facade 2496)
const need=(cssW)=>{const px=cssW*Math.min(devicePixelRatio||1,2);return [1280,1600,1920,2496].find(w=>w>=px)||2496};
const vw=innerWidth, vh=innerHeight, plateCss=Math.max(vw,vh*PLATE_H*PLATE_AR), facadeCss=Math.max(vw,vh*FACADE_AR);
const SRC={
  day:  H(CDN+'hf_20261125_123040_f513c6f7-07d8-410f-a6de-4545268d7e1f.png')+Math.min(2048,need(plateCss)),
  night:H(CDN+'hf_20261125_123132_feb5ca9b-fc48-4930-80a0-a8f2fb824330.png')+Math.min(2048,need(plateCss)),
  facade:H(CDN+'hf_20261125_063353_1267b8e6-3e85-4dde-b424-1647f0a4de2e.png')+need(facadeCss),
  band: H(CDN+'hf_20261125_063406_591aa9e3-ad36-4e74-9aa7-01de368920f9.png')+need(vw)
};

/* =====================================================================================
   Everything below is measured from the reel (30 fps), every frame tracked at 664 px wide
   with sub-pixel matching. Frame numbers are the reel's own (frame k = k x 33.37 ms).
   ===================================================================================== */
const FPS=30;
// --- intro (time-driven). T=0 = reel frame 77, the last still frame before the split
const HOLD=.4;   // the facade stands still this long first
// facade block shift per frame, px of a 664 px wide frame (both blocks, mirrored)
const FACADE=[0,0,1,2,3,6,10,15,22,30,40,51,64,79,95,112,129,148,166.5,185,203.5,222,240.5,259,277.5,296,314.5,333,351.5].map(v=>v/664);
// shared slide-out progress of the pieces (outermost piece; inner pieces read it a little earlier)
const STREET=[0,.005,.012,.019,.021,.03,.043,.061,.082,.109,.141,.176,.216,.261,.308,.358,.41,.464,.518,.573,.626,.678,.727,.773,.814,.852,.885,.915,.938,.958,.972,.983,.992,.996,.999,1];
const LEAD_PER_TRAVEL=0.25;   // seconds of head start per unit of travel less than the outermost piece (innermost: 2-3 frames)
const SEAM_GAP=8.5/664, WIN_MARGIN=8/664;   // half the resting gap between the facade blocks; sand margin between a block and the street window

/* The street is 8 wide pieces, like the reel (column-by-column mapping of a mid-opening frame back to the landed
   frame). The reel's pieces, in SCREEN fractions: A 0-.12 · B .12-.205 · C .205-.27 · D .27-.35 · E .35-.65 (still) ·
   F .65-.80 · G .80-.86 · H .86-1. Our street image is wider than the screen (it is 1.26x the height, for the scroll
   tilt), so the cuts are set in IMAGE fractions that land on those screen positions at a 1440x900 screen, nudged to
   go between our signs (no sign is cut). Each piece starts slid toward the centre by 0.93x the distance from the screen
   centre to the middle of its visible part: the reel's measured ratio (A .41 / .44, H .431 / .43, ...). So at the
   start the window between the facade blocks fills with the outer pieces first, exactly like the reel. */
const PIECES=[[0,.2045],[.2045,.325],[.325,.35],[.35,.372],[.372,.628],[.628,.76],[.76,.805],[.805,1]].map(span=>({span,travel:0}));   // BODEGA | LA HABANERA+SALSA | . | . | CINE..HOTEL (still) | RUMBA | . | PALADAR
const TRAVEL_RATIO=.93;
function setTravel(){
  for(const P of PIECES){
    const [a,b]=P.span, s0=Math.max(0,(G.px+a*G.pw)/G.W), s1=Math.min(1,(G.px+b*G.pw)/G.W);
    P.travel=(s0<=.5&&s1>=.5)?0:TRAVEL_RATIO*Math.abs((s0+s1)/2-.5);
  }
}
const leadOf=P=>Math.max(0,LEAD_PER_TRAVEL*(.41-P.travel));

// --- day -> night, pan and ledge (scroll-driven: scroll replaces the clock). Reel frames 113 -> 148.
const SCROLL_K0=113, SCROLL_K1=148;
const NIGHT_K0=113, NIGHT=[0,.02,.04,.05,.07,.09,.11,.14,.18,.21,.26,.3,.36,.41,.48,.54,.6,.67,.74,.79,.85,.91,.98,1];
// shared rise curve (outer piece, 139.75 px of 457 total); the street rises by it times the smooth tilt curve riseAt(d)
const PAN_K0=116, PAN=[0,.25,.5,1.25,2.5,4.25,6.5,9.5,13.25,17.5,22.5,28.25,34.25,40.75,47.75,55.25,62.75,70.5,78.5,86.5,94.25,101.5,108.5,114.75,120.75,125.75,130.25,133.75,136.5,138.5,139.5,139.75].map(v=>v/139.75);
// ledge top as a fraction of the height: enters from below late in the pan and eases to 79.9%
const LEDGE_K0=137, LEDGE=[1.02,.978,.95,.921,.895,.871,.851,.834,.818,.807,.801,.799];
const LEDGE_END=LEDGE[LEDGE.length-1];

const look=(tab,f)=>{if(f<=0)return tab[0];const i=Math.floor(f);if(i>=tab.length-1)return tab[tab.length-1];const k=f-i;return tab[i]+(tab[i+1]-tab[i])*k};
const INTRO_END=(STREET.length-1)/FPS;

const $=id=>document.getElementById(id);
const hero=$('hero'),world=$('world'),dayEl=$('day'),nightEl=$('night'),band=$('band'),title=$('title'),layersEl=$('layers');
const hl=$('hl'),hr=$('hr'),fl=$('fl'),fr=$('fr');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FIX=null, FIXS=null;

const load=src=>new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.decoding='async';i.onload=()=>res(i);i.onerror=rej;i.src=src});
let G={}, pieces=[], dayImg=null, nightImg=null, started=0, done=false, raf=0, fallback=false;

function layout(){
  const W=hero.clientWidth,Hh=hero.clientHeight;
  const ph=Math.max(W/PLATE_AR,Hh*PLATE_H), pw=ph*PLATE_AR;
  G={W,H:Hh,pw,ph,px:(W-pw)/2};
  setTravel();
  for(const el of [dayEl,nightEl]){el.style.width=pw+'px';el.style.height=ph+'px';el.style.left=G.px+'px';el.style.top='0px'}
  band.style.height=(1-LEDGE_END+.03)*Hh+'px';
  const fs=Math.min(Hh*.118,W*.105);title.style.fontSize=fs+'px';
  title.style.top=((1-LEDGE_END)*Hh*.56-fs*.5)+'px';
  // facade blocks: cover the frame, building centred, split at its seam, resting with a thin sand gap
  let fh=Hh, fw=fh*FACADE_AR; if(fw<W){fw=W;fh=fw/FACADE_AR}
  const gap=SEAM_GAP*W;
  hl.style.width=hr.style.width=(W/2-gap)+'px';
  fl.style.width=fr.style.width=fw+'px';fl.style.height=fr.style.height=fh+'px';fl.style.marginTop=fr.style.marginTop=(-fh/2)+'px';
  fl.style.left=(W/2-gap-fw/2)+'px'; fr.style.left=(-fw/2)+'px';
  if(dayImg) buildPieces();
}

/* ---------------------------------------------------------------------------------------------
   Street renderer (WebGL2). The 8 pieces are drawn from the day and night plates as textured strips.
   - intro: each strip slides sideways on its own (the reel's cut pieces)
   - scroll pan: instead of lifting rigid strips by different amounts (which steps the buildings at the
     cuts), every column of the picture rises along ONE smooth curve fitted to the reel's measured
     piece rises: rise(d) = 0.022 + 1.02 |d|^1.5 (d = distance from the centre / frame width, capped
     at 0.32 of the height). Verticals stay vertical, lines toward the vanishing point change angle:
     it reads as the camera tilting, never as a cut picture.
   - the strips are the picture from first frame to last: nothing is swapped in, so nothing can jump.
   --------------------------------------------------------------------------------------------- */
const RISE_A=.022, RISE_K=1.02, RISE_P=1.5, RISE_MAX=.32;
const riseAt=d=>Math.min(RISE_MAX,RISE_A+RISE_K*Math.pow(Math.abs(d),RISE_P));
let gl=null, glc=null, glP=null, glU={}, texD=null, texN=null, meshes=[];
const VS=`#version 300 es
in vec2 a;                 // a.x = position across the plate (0..1, <0 / >1 = mirrored apron), a.y = 0 top / 1 bottom
uniform vec2 uView;        // frame size, css px
uniform vec3 uPlate;       // plate left, width, height (css px)
uniform float uOff;        // this strip's sideways offset (intro)
uniform float uPan;        // shared rise curve, 0..1
uniform vec4 uRise;        // a, k, p, max
out vec2 vUV;
void main(){
  float xf=uPlate.x+a.x*uPlate.y;
  float d=(xf-uView.x*.5)/uView.x;
  float r=min(uRise.w,uRise.x+uRise.y*pow(abs(d),uRise.z));
  float y=a.y*uPlate.z-uPan*r*uView.y;
  vUV=a;
  gl_Position=vec4((xf+uOff)/uView.x*2.-1.,1.-y/uView.y*2.,0.,1.);
}`;
const FS=`#version 300 es
precision highp float;
in vec2 vUV; uniform sampler2D tD,tN; uniform float uNight; out vec4 o;
void main(){
  float u=vUV.x; u=u<0.?-u:(u>1.?2.-u:u);
  vec2 uv=vec2(u,vUV.y);
  // the night plate sits 2.5 px of 1600 to the right over the left and centre, 0 at the right (measured): sample it there
  vec2 uvN=vec2(u+.0016*clamp((.87-u)/.37,0.,1.),vUV.y);
  o=mix(texture(tD,uv),texture(tN,uvN),uNight);
}`;
function initGL(){
  try{
    glc=document.createElement('canvas');glc.id='street';glc.style.cssText='position:absolute;inset:0;width:100%;height:100%;display:block';
    gl=glc.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:true,preserveDrawingBuffer:false});
    if(!gl)return false;
    const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o};
    glP=gl.createProgram();gl.attachShader(glP,sh(gl.VERTEX_SHADER,VS));gl.attachShader(glP,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(glP);
    if(!gl.getProgramParameter(glP,gl.LINK_STATUS))throw gl.getProgramInfoLog(glP);
    gl.useProgram(glP);
    for(const n of ['uView','uPlate','uOff','uPan','uRise','tD','tN','uNight'])glU[n]=gl.getUniformLocation(glP,n);
    const tex=(img,unit)=>{const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
      gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t};
    texD=tex(dayImg,0);texN=tex(nightImg,1);gl.uniform1i(glU.tD,0);gl.uniform1i(glU.tN,1);
    gl.uniform4f(glU.uRise,RISE_A,RISE_K,RISE_P,RISE_MAX);
    // one strip mesh per piece: 48 columns x 2 rows (the rise only changes across x, so verticals stay straight)
    const APRON=.09;
    meshes=PIECES.map(P=>{
      let [a,b]=P.span; if(a===0)a=-APRON; if(b===1)b=1+APRON;
      const N=48,v=new Float32Array((N+1)*4);
      for(let i=0;i<=N;i++){const u=a+(b-a)*i/N;v.set([u,0,u,1],i*4)}
      const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,v,gl.STATIC_DRAW);
      const c=(P.span[0]+P.span[1])/2;
      return {buf,n:(N+1)*2,P,dir:c<.5?1:-1,c};
    }).sort((m1,m2)=>Math.abs(m1.c-.5)-Math.abs(m2.c-.5));   // inner first, outer pieces drawn on top
    const loc=gl.getAttribLocation(glP,'a');gl.enableVertexAttribArray(loc);glU.a=loc;
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    glc.addEventListener('webglcontextlost',e=>{e.preventDefault();gl=null;layersEl.textContent='';buildPieces2D();},{once:true});
    return true;
  }catch(e){gl=null;return false}
}
function sizeGL(){
  const dpr=Math.min(devicePixelRatio||1,2);
  glc.width=Math.round(G.W*dpr);glc.height=Math.round(G.H*dpr);gl.viewport(0,0,glc.width,glc.height);
}
function drawGL(T,pan,night){
  gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(glU.uView,G.W,G.H);gl.uniform3f(glU.uPlate,G.px,G.pw,G.ph);gl.uniform1f(glU.uPan,pan);gl.uniform1f(glU.uNight,night);
  for(const m of meshes){
    const prog=T<0?0:Math.min(1,look(STREET,(T+leadOf(m.P))*FPS));
    gl.uniform1f(glU.uOff,m.dir*(1-prog)*m.P.travel*G.W);
    gl.bindBuffer(gl.ARRAY_BUFFER,m.buf);gl.vertexAttribPointer(glU.a,2,gl.FLOAT,false,0,0);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,m.n);
  }
}
function buildPieces(){
  if(gl||(!pieces.length&&initGL())){layersEl.textContent='';layersEl.appendChild(glc);sizeGL();pieces=meshes;kick();return}
  buildPieces2D();
}

/* fallback without WebGL2: one element per piece with a day and a night canvas; each piece rises by the
   smooth curve taken at its own centre */
function buildPieces2D(){
  layersEl.textContent='';pieces=[];
  const dpr=Math.min(devicePixelRatio||1,2), w=Math.round(G.pw*dpr), h=Math.round(G.ph*dpr);
  PIECES.forEach((P,i)=>{
    const [a,b]=P.span, centre=(a+b)/2, left=centre<.5;
    const apron=(a===0||b===1)?Math.round(.09*w):0;   // the outermost pieces carry a mirrored edge so the frame side never opens
    const x0=Math.round(a*w), x1=Math.min(w,Math.round(b*w)+1), cw=x1-x0+apron, ox=(a===0)?apron:0;
    const el=document.createElement('div');el.className='piece';
    el.style.cssText=`left:${G.px+(x0-ox)/dpr}px;width:${cw/dpr}px;height:${G.ph}px;z-index:${Math.round(Math.abs(centre-.5)*1000)+1}`;
    for(const [img,cls] of [[dayImg,'d'],[nightImg,'n']]){
      const c=document.createElement('canvas');c.width=cw;c.height=h;c.className=cls;const g=c.getContext('2d');
      const sx=img.naturalWidth/w, sh=img.naturalHeight;
      g.drawImage(img,x0*sx,0,(x1-x0)*sx,sh,ox,0,x1-x0,h);
      if(apron){g.save();if(a===0){g.translate(apron,0);g.scale(-1,1);g.drawImage(img,x0*sx,0,apron*sx,sh,0,0,apron,h)}
        else{g.translate(cw,0);g.scale(-1,1);g.drawImage(img,(x1-apron)*sx,0,apron*sx,sh,0,0,apron,h)}g.restore()}
      el.appendChild(c);
    }
    layersEl.appendChild(el);
    pieces.push({el,dir:left?1:-1,P,rise:riseAt((G.px+centre*G.pw-G.W/2)/G.W)});
  });
  kick();
}

/* scroll -> reel frame, through a critically damped spring so the change glides */
const scrollProg=()=>{const m=document.documentElement.scrollHeight-innerHeight;return m>0?Math.min(1,Math.max(0,scrollY/m)):0};
let sCur=0,sVel=0,lastNow=0,running=false;
function kick(){if(!running){running=true;lastNow=0;raf=requestAnimationFrame(render)}}
addEventListener('scroll',kick,{passive:true});

function render(now){
  running=true;
  const dt=lastNow?Math.min(.05,(now-lastNow)/1000):0;lastNow=now;
  const T=FIX!==null?+FIX:(done||reduce)?99:(started?(now-started)/1000-HOLD:-1);
  const target=(T>=INTRO_END)?scrollProg():0;
  if(FIXS!==null){sCur=+FIXS;sVel=0}
  else if(reduce){sCur=target;sVel=0}
  else if(dt>0){const w=9,a=w*w*(target-sCur)-2*w*sVel;sVel+=a*dt;sCur+=sVel*dt;if(Math.abs(target-sCur)<1e-4&&Math.abs(sVel)<1e-4){sCur=target;sVel=0}}
  const k=SCROLL_K0+sCur*(SCROLL_K1-SCROLL_K0);   // reel frame for the scroll-driven part

  // facade blocks (reel: both blocks slide apart on the same curve)
  const fs=T<0?0:look(FACADE,T*FPS);
  hl.style.transform=`translate3d(${-fs*G.W}px,0,0)`;hr.style.transform=`translate3d(${fs*G.W}px,0,0)`;
  const gone=fs*G.W>=G.W/2+2; hl.style.visibility=hr.style.visibility=gone?'hidden':'visible';
  // the street shows only in the window between the blocks, a sand margin inside their inner edges
  const hw=(SEAM_GAP+fs-WIN_MARGIN)*G.W, inset=Math.max(0,G.W/2-Math.max(0,hw));
  layersEl.style.clipPath=gone?'none':`inset(0 ${inset}px 0 ${inset}px)`;

  // street: pieces slide out (intro) + the picture rises along the smooth camera-tilt curve (scroll)
  const rise=look(PAN,k-PAN_K0), night=look(NIGHT,k-NIGHT_K0);
  if(gl&&pieces===meshes) drawGL(T,rise,night);
  else{
    for(const p of pieces){
      const prog=T<0?0:Math.min(1,look(STREET,(T+leadOf(p.P))*FPS));
      p.el.style.transform=`translate3d(${p.dir*(1-prog)*p.P.travel*G.W}px,${-rise*p.rise*G.H}px,0)`;
    }
    layersEl.style.setProperty('--night',night);
  }
  band.style.transform=`translate3d(0,${look(LEDGE,k-LEDGE_K0)*G.H}px,0)`;

  if(FIX!==null){running=false;return}
  if(T>INTRO_END+.5)done=true;
  const settling=sVel!==0||sCur!==target;
  if(!done||settling)raf=requestAnimationFrame(render);else running=false;
}

/* if the images cannot be read into canvases, fall back to the two plates (night fade + uniform rise) */
function useFallback(){
  fallback=true;done=true;dayEl.src=SRC.day;nightEl.src=SRC.night;world.style.display='block';
  hl.style.visibility=hr.style.visibility='hidden';
  const f=()=>{const k=SCROLL_K0+scrollProg()*(SCROLL_K1-SCROLL_K0);nightEl.style.opacity=look(NIGHT,k-NIGHT_K0);
    world.style.transform=`translate3d(0,${-look(PAN,k-PAN_K0)*.2*G.H}px,0)`;band.style.transform=`translate3d(0,${look(LEDGE,k-LEDGE_K0)*G.H}px,0)`};
  addEventListener('scroll',()=>requestAnimationFrame(f),{passive:true});f();
}

async function boot(){
  fl.style.backgroundImage=fr.style.backgroundImage=`url("${SRC.facade}")`;
  band.style.backgroundImage=`url("${SRC.band}")`;
  layout();
  band.style.transform=`translate3d(0,${LEDGE[0]*G.H}px,0)`;
  const fail=setTimeout(()=>{if(!dayImg)useFallback()},9000);
  try{
    const [d,n]=await Promise.all([load(SRC.day),load(SRC.night),load(SRC.facade),load(SRC.band)]);
    await Promise.all([d.decode?.(),n.decode?.()].filter(Boolean)).catch(()=>{});
    if(fallback)return;
    dayImg=d;nightImg=n;clearTimeout(fail);
    buildPieces();
    if(reduce){done=true;kick();return}
    await document.fonts?.ready;
    requestAnimationFrame(t=>{started=t;kick()});
  }catch(e){if(!fallback)useFallback()}
}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{layout();kick()},120)});
if('scrollRestoration' in history)history.scrollRestoration='manual';scrollTo(0,0);
window.__hero={get T(){return started?(performance.now()-started)/1000-HOLD:null},layers:()=>pieces.length};
boot();
})();
</script>
</body>
</html>
