/* ------------------------------------------------------------------
   Design tokens (sampled from the reference)
------------------------------------------------------------------- */
:root{
  color-scheme: light;
  --bg:#FEFEFE;
  --ink:#0B0E0C;          /* headline */
  --strong:#111212;       /* active tab, chip title */
  --text:#222223;         /* field values, active tab, chip title */
  --label:#111313;        /* field labels */
  --muted:#6E7070;        /* inactive tabs */
  --lede:#727274;         /* lede paragraph */
  --mono:#7E7F81;         /* chip coordinate */
  --line:#E6E6E7;         /* card borders + dividers */
  --red:#00286E;          /* primary / button (fjord navy) */
  --red-icon:#0A2A72;     /* field icons + active underline */
  --chip:rgba(255,255,255,.985);

  --f-display:"GF Display","Inter Display","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-sans:"GF Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"GF Mono","DejaVu Sans Mono",Menlo,ui-monospace,monospace;

  /* Reference artboard: 1446 × 1088.
     --sx : horizontal scale (always tracks the viewport width → no side gutters)
     --u  : typographic / vertical scale. Equals --sx when the viewport has the
            reference aspect ratio (pixel-exact), shrinks on short-wide screens so
            the photo keeps real height, but never below 0.78px so text stays legible. */
  --sx: calc(100vw / 1446);
  --u: min(var(--sx), max(calc(100vh / 1088), .78px));
}
@supports (height:100dvh){ :root{ --u: min(var(--sx), max(calc(100dvh / 1088), .78px)); } }

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:var(--f-sans);color:var(--text);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;font-kerning:normal;
}
button,input{font:inherit;color:inherit}
svg{display:block;flex:none}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ------------------------------------------------------------------
   Page shell — exactly one viewport tall; the photo absorbs all spare
   height, so there is never blank space above or below the layout.
------------------------------------------------------------------- */
.page{
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;min-height:calc(var(--u) * 640);
  padding:0 calc(var(--sx) * 57) calc(var(--u) * 78) calc(var(--sx) * 60);
  overflow:hidden;
}

/* Hero */
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:calc(var(--u) * 40);flex:none}
.title{
  margin:calc(var(--u) * 83) 0 0 calc(var(--u) * 1);
  font-family:var(--f-display);font-weight:700;
  font-size:calc(var(--u) * 88);line-height:calc(var(--u) * 85);
  letter-spacing:-0.0165em;color:var(--ink);white-space:nowrap;
  font-feature-settings:"ss01" 0;
}
.title span{display:block}
.lede{
  margin:calc(var(--u) * 183) calc(var(--u) * 3) 0 0;
  max-width:max(calc(var(--u) * 420), 24.5em);
  font-size:max(calc(var(--u) * 17.4), 14px);line-height:calc(var(--u) * 30);
  letter-spacing:0em;
  color:var(--lede);text-align:right;font-weight:400;
}

/* Tabs */
.tabs{
  display:flex;gap:calc(var(--u) * 25);flex:none;
  margin:calc(var(--u) * 39) 0 0 calc(var(--u) * 1);padding:0;list-style:none;
  position:relative;z-index:1;
}
.tab{
  display:flex;align-items:center;gap:calc(var(--u) * 8.5);
  height:calc(var(--u) * 46);padding:0 calc(var(--u) * 1) 0 0;
  border:0;background:none;cursor:pointer;
  font-size:max(calc(var(--u) * 16), 14px);font-weight:500;letter-spacing:-0.01em;color:var(--muted);
  border-bottom:calc(var(--u) * 2) solid transparent;
}
.tab svg{margin-left:calc(var(--u) * -1);width:calc(var(--u) * 20);height:calc(var(--u) * 20);min-width:15px;min-height:15px}
.tab[aria-selected="true"]{color:var(--strong);font-weight:600;border-bottom-color:var(--red-icon)}
.tab:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:2px}

/* Search card */
.search{
  display:grid;flex:none;margin-top:-1px;
  grid-template-columns:minmax(0,483fr) minmax(0,355fr) minmax(0,319fr) minmax(0,169fr);
  border:1px solid var(--line);background:var(--bg);
}
.field{
  display:flex;flex-direction:column;justify-content:flex-start;min-width:0;
  padding:calc(var(--u) * 22) calc(var(--u) * 16) calc(var(--u) * 17) calc(var(--u) * 23.5);
  border-right:1px solid var(--line);
}
.field + .field{padding-left:calc(var(--u) * 22)}
.field-label{
  font-size:max(calc(var(--u) * 12), 10px);font-weight:600;letter-spacing:0.09em;
  line-height:1;text-transform:uppercase;color:var(--label);
}
.field-value{
  display:flex;align-items:center;
  margin-top:calc(var(--u) * 11);
  height:calc(var(--u) * 20);
  font-size:max(calc(var(--u) * 16), 14px);line-height:calc(var(--u) * 20);letter-spacing:-0.015em;
  color:var(--text);white-space:nowrap;
}
.field-value span{overflow:hidden;text-overflow:ellipsis}
