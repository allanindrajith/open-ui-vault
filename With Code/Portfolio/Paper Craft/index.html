:root{--ink:#1D1B2E;--ivory:#FAF6F0;--u:calc(100vw/1440)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#F7C6B2;color:var(--ink);font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
html.is-grabbing,html.is-grabbing *{cursor:grabbing!important}

/* ---------- stage (home slider) ---------- */
#stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none}
#bg{position:absolute;inset:0}
#card{position:absolute;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;display:none}
.obj{position:absolute;left:0;top:0;background-repeat:no-repeat;will-change:transform;pointer-events:none}
.shd{position:absolute;left:0;top:0;border-radius:50%;background:rgba(29,27,46,.22);filter:blur(14px);will-change:transform,opacity;pointer-events:none}
.ttl{position:absolute;left:0;top:0;pointer-events:none;will-change:transform,opacity}

/* ---------- fixed chrome ---------- */
.logo{position:fixed;left:calc(42*var(--u));top:calc(36*var(--u));z-index:75;display:flex;gap:calc(10*var(--u));align-items:flex-start;line-height:.86;font-weight:500;font-size:calc(25*var(--u));letter-spacing:-.01em}
.logo svg{width:calc(22*var(--u));height:calc(22*var(--u));margin-top:calc(3*var(--u))}
.burger{position:fixed;right:calc(42*var(--u));top:calc(36*var(--u));z-index:80;width:calc(58*var(--u));height:calc(58*var(--u));border-radius:50%;display:grid;place-items:center}
.burger i{position:absolute;left:28%;width:44%;height:2px;background:var(--ink);transition:transform .5s cubic-bezier(.77,0,.18,1),opacity .3s,background .3s}
.burger i:nth-child(1){transform:translateY(-7px)}.burger i:nth-child(3){transform:translateY(7px)}
.burger::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .5s cubic-bezier(.77,0,.18,1)}
html.menu-open .burger::before{transform:scale(1)}
html.menu-open .burger i{background:var(--ivory)}
html.menu-open .burger i:nth-child(1){transform:rotate(45deg) scaleX(.6)}
html.menu-open .burger i:nth-child(2){opacity:0}
html.menu-open .burger i:nth-child(3){transform:rotate(-45deg) scaleX(.6)}
.foot{position:fixed;left:calc(46*var(--u));bottom:calc(36*var(--u));z-index:55;display:flex;gap:calc(52*var(--u));font-size:calc(13*var(--u));font-weight:500}
.foot .lang{display:flex;gap:calc(12*var(--u))}
.foot .lang span:first-child{border-bottom:1.5px solid}
.foot .lang span:last-child{opacity:.55}

/* ---------- home ui ---------- */
#homeUi{position:fixed;left:0;right:0;top:calc(var(--vh,1vh)*66.4);z-index:40;display:flex;justify-content:center;align-items:center;gap:calc(40*var(--u));pointer-events:none}
#tabs{position:relative;display:flex;gap:calc(26*var(--u));pointer-events:auto}
#tabs button{font-size:calc(17*var(--u));font-weight:500;padding:calc(6*var(--u)) 0;opacity:.62;transition:opacity .4s}
#tabs button.is-current{opacity:1}
#tabs .p{position:absolute;left:0;bottom:calc(-4*var(--u));height:2px;width:100px;transform-origin:0 0;background:rgba(29,27,46,.22)}
#tabs .t{position:absolute;inset:0;background:var(--ink);transform-origin:0 0;transform:scaleX(0)}
#discover{pointer-events:auto;display:inline-flex;align-items:center;gap:calc(18*var(--u));height:calc(66*var(--u));padding:0 calc(38*var(--u));border-radius:99px;background:var(--ink);color:var(--ivory);font-size:calc(17*var(--u));font-weight:500;box-shadow:0 calc(18*var(--u)) calc(40*var(--u)) rgba(29,27,46,.18);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#discover:hover{transform:translateY(-3px)}
#discover svg,.btn svg{width:calc(26*var(--u));height:calc(12*var(--u));transition:transform .5s cubic-bezier(.2,.8,.2,1)}

  }else{ /* home */
    if(prev.name==='item'&&SC.y<C.H*.3){ /* card opens back to full screen */
      const it=ITEMS.find(x=>x.id===prev.id);gotoIdx(ITEMS.indexOf(it),false);col.cur=hex2(it.bg);col.p=1;S.rc=1;cardFrom=hex2(it.bg);cardEl.style.display='block';revealStage();
      gsap.to(page,{opacity:0,duration:.35,onComplete:()=>{page.style.visibility='hidden';pageIn.innerHTML='';}});
      await new Promise(res=>gsap.to(S,{rc:0,duration:RM?0:1.5,ease:'power4.inOut',onComplete:res}));
      cardEl.style.display='none';
    }else{
      if(page.style.visibility==='visible')await fadeOut();
      page.style.visibility='hidden';pageIn.innerHTML='';S.rc=0;cardEl.style.display='none';revealStage();
      S.alpha=0;gsap.to(S,{alpha:1,duration:RM?0:1.5,ease:'none'});
    }
    launchTimer();
  }
}
function fadeOut(){return new Promise(res=>{if(page.style.visibility!=='visible'&&!stageOn)return res();
  const tgt=page.style.visibility==='visible'?page:$('#stage');gsap.to(tgt,{opacity:0,duration:RM?0:.6,ease:'none',onComplete:()=>{tgt.style.opacity=1;if(tgt===page){page.style.visibility='hidden';pageIn.innerHTML='';}res();}});
  if(tgt!==page)gsap.to(homeUi,{opacity:0,duration:.4});});}
addEventListener('hashchange',()=>{const nx=parse(),prev={...route};Object.assign(route,nx);html.classList.toggle('on-home',nx.name==='home');if(nx.name==='home')html.classList.remove('scrolled');go(prev,nx);});

/* ---------- menu ---------- */
const menu=$('#menu'),burger=$('#burger'),mPrev=$('#mPrev'),mItems=$('#mItems');
ITEMS.forEach((it,i)=>{
  const pv=document.createElement('div');pv.className='pv';pv.style.background=it.card;mPrev.append(pv);it._pv=pv;
  const li=document.createElement('li');li.innerHTML=`<a href="#/item/${it.id}" class="m-anim"><span class="m-th" style="background:${it.card}"></span><span>${it.nav}</span></a>`;
  const a=li.firstChild;a.addEventListener('mouseenter',()=>setPrev(i));mItems.append(li);it._a=a;
});
function fillMenu(){
  ITEMS.forEach(it=>{
    it._pv.innerHTML='';const W=mPrev.clientWidth,H=mPrev.clientHeight;placeObjs(it._pv,it,W*1.1,H*.62,1,true);it._pv.firstChild&&([...it._pv.children].forEach(c=>{c.style.marginTop=H*.16+'px';c.style.marginLeft=-W*.05+'px';}));
    const th=it._a.querySelector('.m-th');th.innerHTML='';const tw=th.clientWidth;const o=it.objs.find(x=>!x.back)||it.objs[0];const sp=sprite(it.sheet,o.q,tw*.8);sp.style.left=tw*.1+'px';sp.style.top=(tw-tw*.8*sp._r)/2+'px';th.append(sp);
  });
}
function setPrev(i){ITEMS.forEach((it,k)=>{it._pv.classList.toggle('on',k===i);it._a.classList.toggle('on',k===i);});}
let menuTl=null;
function openMenu(){
  html.classList.add('menu-open');burger.setAttribute('aria-expanded','true');burger.setAttribute('aria-label','Close menu');
  setPrev(route.name==='item'?ITEMS.findIndex(x=>x.id===route.id):S.int);if(timerTw)timerTw.pause();
  const b=burger.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2,R=Math.hypot(Math.max(cx,C.W-cx),Math.max(cy,C.H-cy));
  menu.style.visibility='visible';if(menuTl)menuTl.kill();
  menuTl=gsap.timeline();
  menuTl.fromTo(menu,{clipPath:`circle(0px at ${cx}px ${cy}px)`},{clipPath:`circle(${R}px at ${cx}px ${cy}px)`,duration:RM?0:1,ease:'expo.inOut'})
   .fromTo('.m-anim',{opacity:0,y:30},{opacity:1,y:0,duration:.9,stagger:.05,ease:'expo.out'},RM?0:.45)
   .fromTo(mPrev,{opacity:0,y:40},{opacity:1,y:0,duration:1,ease:'expo.out'},RM?0:.5);
}
function closeMenu(instant){
  if(!html.classList.contains('menu-open'))return;
  html.classList.remove('menu-open');burger.setAttribute('aria-expanded','false');burger.setAttribute('aria-label','Open menu');
  const b=burger.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;if(menuTl)menuTl.kill();
  if(instant===true){gsap.to(menu,{opacity:0,duration:.5,onComplete:()=>{menu.style.visibility='hidden';menu.style.opacity=1;}});return;}
  gsap.to(menu,{clipPath:`circle(0px at ${cx}px ${cy}px)`,duration:RM?0:.8,ease:'expo.inOut',onComplete:()=>{menu.style.visibility='hidden';}});
  if(route.name==='home')launchTimer();
}
burger.addEventListener('click',()=>html.classList.contains('menu-open')?closeMenu():openMenu());
menu.addEventListener('click',e=>{const a=e.target.closest('a');if(a&&a.getAttribute('href')===location.hash||(a&&a.getAttribute('href')==='#/'&&!location.hash.replace('#/','')))closeMenu();});
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});

/* ---------- intro film (plays on load like the reference, with skip + countdown) ---------- */
const FILM=CDN+'hf_20261111_224117_b319aa12-0927-4642-99b2-12727753649b.mp4';
const intro=$('#intro'),iv=intro.querySelector('video'),iw=intro.querySelector('.w'),icd=intro.querySelector('.cd'),ipg=intro.querySelector('.prog');
intro.querySelector('.skip').innerHTML='Skip '+ARROW;
const WORDS=[[.4,3,'We fold'],[3.4,6.2,'the wild'],[6.6,9.4,'in paper']];
let introOn=false,introDone=null,lastW=-1;
function playIntro(){
  return new Promise(res=>{
    if(RM){res();return;}
    introDone=res;introOn=true;lastW=-1;iw.innerHTML='';intro.style.display='block';intro.style.opacity=1;
    if(timerTw)timerTw.pause();
    if(!iv.src)iv.src=FILM;iv.currentTime=0;
    const p=iv.play();if(p)p.catch(()=>closeIntro());
    const fail=setTimeout(()=>{if(introOn&&iv.currentTime<.05)closeIntro();},6000);iv._fail=fail;
    requestAnimationFrame(introTick);
  });
}
function introTick(){
  if(!introOn)return;const t=iv.currentTime,d=iv.duration||10;
  ipg.style.transform='scaleX('+Math.min(1,t/d).toFixed(4)+')';
  icd.textContent='00:'+String(Math.max(0,Math.ceil(d-t))).padStart(2,'0');
  const k=WORDS.findIndex(w=>t>=w[0]&&t<w[1]);
  if(k!==lastW){
    const old=iw.querySelectorAll('span');if(old.length)gsap.to(old,{opacity:0,y:-30,duration:.4,stagger:.03,ease:'power2.in',onComplete:()=>old.forEach(o=>o.remove())});
    if(k>-1){const box=document.createElement('div');box.innerHTML=WORDS[k][2].split('').map(c=>'<span>'+(c===' '?'&nbsp;':c)+'</span>').join('');const sp=[...box.children];setTimeout(()=>{iw.append(...sp);gsap.to(sp,{opacity:1,y:0,duration:.9,stagger:.04,ease:'expo.out'});},old.length?380:0);}
    lastW=k;
  }
  requestAnimationFrame(introTick);
}
function closeIntro(){
  if(!introOn)return;introOn=false;clearTimeout(iv._fail);
  gsap.to(intro,{opacity:0,duration:.8,ease:'none',onComplete:()=>{intro.style.display='none';iv.pause();}});
  const r=introDone;introDone=null;r&&r();
}
iv.addEventListener('ended',closeIntro);iv.addEventListener('error',closeIntro);
intro.querySelector('.skip').addEventListener('click',closeIntro);
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a||a.textContent.trim()!=='Replay film')return;e.preventDefault();
  if(route.name!=='home'){location.hash='#/';setTimeout(()=>playIntro().then(()=>{entrance();launchTimer();}),900);}else playIntro().then(()=>{entrance();launchTimer();});});
function entrance(){
  gsap.killTweensOf(S);const a=S.int;S.trans=true;S.goto=S.smooth=a-.45;S.alpha=0;
  gsap.to(S,{goto:a,duration:RM?0:2,ease:'power3.out',onComplete:()=>{S.trans=false;}});
  gsap.to(S,{alpha:1,duration:RM?0:1.1,ease:'none'});
}

/* ---------- boot ---------- */
function resize(){
  measure();setScrollMode();layoutStage();rszTabs();
  if(route.name==='item'){const it=ITEMS.find(x=>x.id===route.id);const y=SC.y;showPage(productHTML(it),it.bg,()=>fillProduct(it));pageIn.querySelectorAll('[data-in]').forEach(e=>e.style.opacity=1);SC.t=SC.y=Math.min(y,SC.max);}
  else if(route.name==='page'){const y=SC.y;showPage(editorialHTML(route.id),PAGES[route.id].bg);pageIn.querySelectorAll('[data-in]').forEach(e=>e.style.opacity=1);SC.t=SC.y=y;}
  fillMenu();
}
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(resize,120);});
(document.fonts?document.fonts.load('500 100px Figtree'):Promise.resolve()).then(()=>{
  measure();setScrollMode();layoutStage();rszTabs();moveTab(0,true);fillMenu();
  Object.assign(route,parse());html.classList.toggle('on-home',route.name==='home');
  if(route.name!=='home'){go({name:'none'},route);}
  else if(QS.has('nointro')){entrance();launchTimer();}
  else{S.alpha=0;playIntro().then(()=>{entrance();launchTimer();});}
  requestAnimationFrame(frame);
});
})();
</script>
