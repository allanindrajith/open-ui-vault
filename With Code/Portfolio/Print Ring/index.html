:root {
  --bg: #fcf7fc; --ink: #4a1448; --muted: #8a6689;
  --out: cubic-bezier(.22, 1, .36, 1);
  --leave: cubic-bezier(.4, 0, 1, 1);
}
:root[data-theme="dark"] { --bg: #4a1448; --ink: #fcf7fc; --muted: #a78aa6; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--ink);
  font: 700 13.4px/16px Roboto, Arial, sans-serif;
  text-transform: uppercase; user-select: none;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { margin: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-transform: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--muted); outline-offset: 3px; }

.ink { color: var(--ink); }
.muted { color: var(--muted); }
.ink.mixing, .muted.mixing { color: transparent; -webkit-background-clip: text; background-clip: text; }

#stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#stage:focus-visible { outline: none; }
#stage.dragging { cursor: grabbing; }

.ui { position: fixed; z-index: 3; }
.brand { left: 55px; top: 22px; margin: 0; font: 700 25px/30px Arvo, serif; white-space: nowrap; }
.controls { right: 56px; top: 18.5px; display: flex; gap: 36px; }
.controls button { height: 24px; white-space: nowrap; }
.caption { right: 54px; bottom: 33px; display: flex; gap: 22px; white-space: nowrap; pointer-events: none; }
.count { word-spacing: 4px; font-variant-numeric: tabular-nums; }
.mask { display: block; overflow: hidden; }
.mask > span { display: block; }
.title > span { max-width: 34vw; overflow: hidden; text-overflow: ellipsis; }

#numbers { position: fixed; inset: 0; z-index: 2; overflow: hidden; pointer-events: none; }
#numbers span { position: absolute; left: 0; top: 0; will-change: transform; font-variant-numeric: tabular-nums; }

#project { position: fixed; inset: 0; z-index: 2; pointer-events: none; letter-spacing: .03em; }
.details { display: contents; }
.block { position: absolute; left: 56%; margin: 0; }
.heading { top: 27%; }
.facts { top: 43%; display: grid; grid-template-columns: 148px auto; column-gap: 24px; row-gap: 2px; }
.note { top: 64%; max-width: 340px; text-transform: none; font-weight: 500; line-height: 18px; white-space: nowrap; }
.back { bottom: 28px; height: 24px; white-space: nowrap; }
.line > span { transform: translateY(105%); transition: transform .28s var(--leave); }
#project.shown .line > span { transform: none; transition: transform 1s var(--out); transition-delay: calc(var(--i) * .055s); }
#project.shown .back { pointer-events: auto; }

#thumbs { --w: 72px; --h: 54px; --gap: 12px; position: fixed; left: 0; top: 0; z-index: 2; display: flex; gap: var(--gap); pointer-events: none; will-change: transform; }
#thumbs button {
  flex: none; width: var(--w); height: var(--h); overflow: hidden; background-repeat: no-repeat;
  opacity: .55; clip-path: inset(0 0 100% 0);
  transition: clip-path .28s var(--leave), opacity .9s cubic-bezier(.22, .61, .36, 1);
}
#thumbs button.active { opacity: 1; }
#thumbs.shown { pointer-events: auto; }
#thumbs.shown button { clip-path: inset(0); transition: clip-path 1.1s var(--out) calc(.3s + var(--i) * .07s), opacity .9s cubic-bezier(.22, .61, .36, 1); }

<p class="nogl" id="nogl" hidden>These prints need WebGL2. Please open the page in a current browser.</p>

<script>
(() => {
'use strict';

/* ---------- Content ---------- */

const RESULT = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/';
const SHEETS = [
  'hf_20261122_104107_4bafcf96-fa68-439e-85bb-af0d6b852e6c.png',
  'hf_20261122_104106_ea17bea1-c68a-4d63-8805-44540b71f692.png',
  'hf_20261122_104106_ff428d1d-9435-40f4-a91a-a694b86d7051.png',

const PRINTS = [
  { title: 'Wool night', story: 3, sheet: 1, cell: 0, w: 197, h: 378, gap: 96, fx: .5, fy: .2, tone: '#33172f' },
  { title: 'Clear rain', story: 0, sheet: 0, cell: 0, w: 293, h: 438, gap: 62, fx: .5, fy: .5, tone: '#2b2029' },
  { title: 'Glass rain', story: 1, sheet: 0, cell: 1, w: 222, h: 333, gap: 16, fx: .5, fy: .5, tone: '#3c2a45' },
  { title: 'Lamp light', story: 0, sheet: 0, cell: 2, w: 216, h: 374, gap: 30, fx: .5, fy: .5, tone: '#4a3d50', border: true },
  { title: 'Lilac knot', story: 3, sheet: 0, cell: 3, w: 233, h: 370, gap: 74, fx: .5, fy: .5, tone: '#30212f' },
  { title: 'Walks home', story: 3, sheet: 1, cell: 1, w: 217, h: 404, gap: 48, fx: 1, fy: .5, tone: '#3f2a48' },
  { title: 'Wet stones', story: 5, sheet: 1, cell: 2, w: 384, h: 400, gap: 48, fx: .5, fy: .75, tone: '#38263b' },
  { title: 'Back seats', story: 1, sheet: 1, cell: 3, w: 336, h: 360, gap: 48, fx: .5, fy: .35, tone: '#35293a' },
  { title: 'Lilac hood', story: 0, sheet: 2, cell: 0, w: 376, h: 432, gap: 48, fx: .5, fy: .2, tone: '#5b465f' },
  { title: 'Stone step', story: 3, sheet: 2, cell: 1, w: 344, h: 384, gap: 48, fx: .5, fy: .75, tone: '#3a2f3d' },
  { title: 'Night tram', story: 2, sheet: 2, cell: 3, w: 392, h: 416, gap: 48, fx: .5, fy: .65, tone: '#443448', border: true },
  { title: 'Shared sky', story: 4, sheet: 3, cell: 0, w: 328, h: 372, gap: 48, fx: .5, fy: .3, tone: '#392638' },
  { title: 'River rail', story: 4, sheet: 3, cell: 1, w: 368, h: 420, gap: 48, fx: .5, fy: .3, tone: '#33283a' },
  { title: 'Warm doors', story: 1, sheet: 3, cell: 3, w: 373, h: 392, gap: 48, fx: .5, fy: .2, tone: '#3b2230' }
];

const STORIES = [
  { series: 'Street rain', mood: 'Nocturnal', note: ['Shot after midnight, in steady rain', 'with one street lamp to light the face,', 'and the wet road as a reflector.'] },
  { series: 'Window rain', mood: 'Tailored', note: ['Seen from the dry side of a window,', 'where every drop bends the city lights,', 'and the face is left half found.'] },
  { series: 'Quiet hours', mood: 'Profiles', note: ['An hour between the last two trams,', 'spent waiting for a person to turn away', 'just far enough from the lights.'] },
  { series: 'Night coats', mood: 'Wet street', note: ['Long wool, high collars, cold hands', 'photographed slowly on a long walk home', 'as the shop signs went out late.'] },
  { series: 'River night', mood: 'Cine stills', note: ['Made along the river after a storm,', 'on fast film pushed two stops for grain', 'then printed softly on warm rag.'] },
  { series: 'Empty roads', mood: 'Wet street', note: ['The city after everyone has gone in', 'with only the things they have left out', 'lying in the light of the lamps.'] }
];
const START = 2;

/* ---------- Motion values, from interactions.md ---------- */

const T = {
  soften: 5, wheel: 30, hand: 140, snapAfter: .16,
  throwTime: .3, dragFrom: 6, tiltPerPx: .28, tiltMin: -78, tiltMax: 84,
  step: { ease: [.45, 0, .12, 1], s: 1.5, extra: .2, max: 2.2 },
  open: { ease: [.25, 1, .5, 1], s: 2.4, words: 1.5, veil: 1.7 },
  roll: { ease: [.86, 0, .07, 1], s: 1.75, gap: .06 },
  back: { ease: [.65, .04, .4, 1], s: 2.8, wait: .15, rollWait: .4, rollS: 2, gap: .07, lock: .9 },
  drop: { ease: [.65, .04, .4, 1], s: 1.9, wave: .05 },
  soak: { ease: [.22, .24, .6, .84], s: 2, hover: .06, reach: .5, dry: .34, band: .26, wave: .03, lead: .56, wetIn: .14 },
  swing: { hz: 1, damp: .34, weight: .85, flareDamp: .7 },
  ripple: { hz: 2.4, damp: .3, weight: .1, s: .5, lean: .6 }
};
const FOV = 30 * Math.PI / 180;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const THEMES = {
  light: { bg: '#fcf7fc', ink: '#4a1448', muted: '#8a6689', dots: '#dccedc' },
  dark: { bg: '#4a1448', ink: '#fcf7fc', muted: '#a78aa6', dots: '#714670' }
};

/* ---------- Maths ---------- */

const TAU = Math.PI * 2;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (v, n) => ((v % n) + n) % n;
const wrapAngle = a => mod(a + Math.PI, TAU) - Math.PI;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const approach = (rate, dt) => 1 - Math.exp(-rate * dt);
const pad = n => String(n).padStart(2, '0');
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16) / 255);
const round4 = v => Math.round(v / 4) * 4;
const farness = a => smooth((Math.abs(a) - Math.PI / 2) / (Math.PI * .35)); // 0 in front, 1 round the back

function cubicBezier([x1, y1, x2, y2]) {
  const at = (p1, p2, t) => 3 * (1 - t) * (1 - t) * t * p1 + 3 * (1 - t) * t * t * p2 + t * t * t;
  return x => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0, hi = 1;
    for (let i = 0; i < 24; i++) {
      const mid = (lo + hi) / 2;
      if (at(x1, x2, mid) < x) lo = mid; else hi = mid;
    }
    return at(y1, y2, (lo + hi) / 2);
  };
}
const EASE = Object.fromEntries(['step', 'open', 'roll', 'back', 'drop', 'soak'].map(k => [k, cubicBezier(T[k].ease)]));
const seconds = s => REDUCED ? .01 : s;

class SoftSpring {
  constructor(x = 0) { this.set(x); }
  set(x) { this.x = this.goal = x; this.v = 0; }
  follow(to, omega, dt) {
    if (REDUCED) return this.set(to);
    this.goal += (to - this.goal) * approach(T.soften, dt);
    this.v += (omega * omega * (this.goal - this.x) - 2 * omega * this.v) * dt;
    this.x += this.v * dt;
  }
}

class Timed {
  constructor(value = 0) { this.from = this.to = value; this.start = 0; this.length = 1; this.ease = EASE.open; }
  at(now) { return lerp(this.from, this.to, this.ease((now - this.start) / this.length)); }
  go(now, to, length, ease, wait = 0) {
    this.from = this.at(now);
    Object.assign(this, { to, length: seconds(length), ease, start: now + (REDUCED ? 0 : wait) });
  }
}

/* ---------- Renderer ---------- */

const PAGE_GLSL = `
uniform vec2 uView;
uniform float uDpr;
uniform vec4 uDrop;   // centre x, y, radius, unevenness
uniform float uPhase;
uniform vec3 uBgFrom, uBgTo;
float newTheme() {
  vec2 p = vec2(gl_FragCoord.x / uDpr, uView.y - gl_FragCoord.y / uDpr) - uDrop.xy;
  float r = uDrop.z * (1.0 + uDrop.w * sin(3.0 * atan(p.y, p.x + 0.0001) + uPhase));
  return 1.0 - smoothstep(r - 1.0, r + 1.0, length(p));
}
vec3 pageColour() { return mix(uBgFrom, uBgTo, newTheme()); }`;

const PAGE_VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID & 1) * 4) - 1.0, float((gl_VertexID & 2) * 2) - 1.0);
  gl_Position = vec4(p, 0.999999, 1.0);
}`;
const PAGE_FS = `#version 300 es
precision highp float;
${PAGE_GLSL}
out vec4 colour;
void main() { colour = vec4(pageColour(), 1.0); }`;

const RAIL_VS = `#version 300 es
layout(location = 0) in vec3 aPos;
layout(location = 1) in vec2 aTone;   // kind, how pale
uniform mat4 uVP;
out vec2 vTone;
void main() { vTone = aTone; gl_Position = uVP * vec4(aPos, 1.0); }`;
const RAIL_FS = `#version 300 es
precision highp float;
${PAGE_GLSL}
uniform vec3 uInkFrom, uInkTo, uDotsFrom, uDotsTo;
in vec2 vTone;
out vec4 colour;
void main() {
  float k = newTheme();
  vec3 page = mix(uBgFrom, uBgTo, k);
  vec3 tone = vTone.x < 0.5 ? mix(uDotsFrom, uDotsTo, k) : (vTone.x < 1.5 ? mix(uInkFrom, uInkTo, k) : page);
  colour = vec4(mix(tone, page, vTone.y), 1.0);
}`;

const PRINT_VS = `#version 300 es
layout(location = 0) in vec2 aUv;
uniform mat4 uVP;
uniform float uBend, uRadius;
uniform vec3 uBox;     // place along the rail, width, height
uniform vec3 uCloth;   // sway, flare, hem lift
out vec2 vUv;
out vec3 vNormal;
void main() {
  float loose = pow(aUv.y, 1.7);
  float along = uBox.x + (aUv.x - 0.5) * uBox.y + uCloth.x * loose;
  float t = along * uBend;
  vec3 p = vec3(along, 0.0, uRadius);
  vec3 n = vec3(0.0, 0.0, 1.0);
  if (abs(uBend) > 0.000001) {
    float h = sin(t * 0.5);
    p = vec3(sin(t) / uBend, 0.0, uRadius - 2.0 * h * h / uBend);
    n = vec3(sin(t), 0.0, cos(t));
  }
  p += n * uCloth.y * loose;
  p.y = -uBox.z * aUv.y + uCloth.z * aUv.y * aUv.y;
  vUv = aUv;
  vNormal = n;
  gl_Position = uVP * vec4(p, 1.0);
}`;
const PRINT_FS = `#version 300 es
precision highp float;
${PAGE_GLSL}
uniform sampler2D uNow, uNext;
uniform vec4 uCropNow, uCropNext, uFrame;
uniform vec3 uBox, uPaper;
uniform float uShut;
uniform vec4 uSoak;    // wetness, origin x, y, front
uniform float uWave;
in vec2 vUv;
in vec3 vNormal;
out vec4 colour;

vec3 photo(sampler2D image, vec4 crop, vec2 uv, vec2 dx, vec2 dy, float spread) {
  vec2 at = crop.xy + uv * crop.zw;
  vec2 gx = dx * crop.zw, gy = dy * crop.zw;
  if (spread < 1.05) return textureGrad(image, at, gx, gy).rgb;
  vec3 sum = vec3(0.0);
  float wide = 1.0 + (spread - 1.0) * 0.42;
  for (int i = 0; i < 10; i++) {
    float f = (float(i) + 0.5) / 10.0, angle = float(i) * 2.39996;
    vec2 off = vec2(cos(angle), sin(angle)) * sqrt(f) * (spread - 1.0) * 0.62;
    sum += textureGrad(image, at + gx * off.x + gy * off.y, gx * wide, gy * wide).rgb;
  }
  return sum / 10.0;
}

void main() {
  vec2 inner = (vUv - uFrame.xy) / uFrame.zw;
  vec2 dx = dFdx(inner), dy = dFdy(inner);
  float pxHigh = 1.0 / max(length(dFdy(vUv)), 0.00001) / uDpr;
  if (vUv.y > 1.0 - uShut) discard;

  vec2 shift = vec2(0.0);
  float spread = 1.0, oldShare = 1.0;
  if (uSoak.x > 0.0) {
    float aspect = uBox.y / uBox.z;
    vec2 v = vec2(vUv.x * aspect, vUv.y) - uSoak.yz;
    float far = max(length(v), 0.0001);
    float d = far - uSoak.w - uWave * sin(3.0 * atan(v.y, v.x + 0.0001) + uPhase * 0.5);
    float w = 1.0 - smoothstep(0.0, d > 0.0 ? ${T.soak.reach.toFixed(2)} : ${T.soak.dry.toFixed(2)}, abs(d));
    float wet = w * w * uSoak.x;
    vec2 push = v / far * wet * 0.02;
    shift = vec2(push.x / aspect, push.y);
    spread = 1.0 + (exp2(wet * 3.7) - 1.0) * pxHigh / 600.0;
    oldShare = smoothstep(-${T.soak.band.toFixed(2)}, ${T.soak.band.toFixed(2)}, d);
  }
  vec2 uv = clamp(inner - shift, 0.0, 1.0);
  vec3 c = photo(uNow, uCropNow, uv, dx, dy, spread);
  if (uSoak.x > 0.0) c = mix(photo(uNext, uCropNext, uv, dx, dy, spread), c, oldShare);
  if (uFrame.z < 1.0) {
    vec2 e = abs(inner - 0.5) - 0.5;
    float paper = clamp(max(e.x / max(fwidth(inner.x), 0.00001), e.y / max(fwidth(inner.y), 0.00001)) + 0.5, 0.0, 1.0);
    c = mix(c, uPaper, paper);
  }
  c *= 0.9 + 0.12 * dot(normalize(vNormal), normalize(vec3(-0.45, 0.35, 0.82)));
  if (!gl_FrontFacing) {
    vec3 page = pageColour();
    c = mix(c, page, mix(0.22, 0.7, smoothstep(0.35, 0.9, page.g))); // dark prints need less wash on the plum page
    c += (1.0 - smoothstep(0.35, 0.9, page.g)) * 0.09;
  }
  colour = vec4(c, 1.0);
}`;

class Renderer {
  constructor(canvas) {
    const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, depth: true });
    if (!gl) throw new Error('WebGL2 unavailable');
    this.gl = gl;
    this.page = this.program(PAGE_VS, PAGE_FS);
    this.rail = this.program(RAIL_VS, RAIL_FS);
    this.print = this.program(PRINT_VS, PRINT_FS);
    this.aniso = gl.getExtension('EXT_texture_filter_anisotropic');

    const COLS = 12, ROWS = 14, verts = [], index = [];
    for (let y = 0; y <= ROWS; y++) for (let x = 0; x <= COLS; x++) verts.push(x / COLS, y / ROWS);
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const a = y * (COLS + 1) + x, b = a + COLS + 1;
      index.push(a, a + 1, b, b, a + 1, b + 1);
    }
    this.indexCount = index.length;
    this.sheetVao = gl.createVertexArray();
    gl.bindVertexArray(this.sheetVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(index), gl.STATIC_DRAW);

    this.railVao = gl.createVertexArray();
    this.railBuffer = gl.createBuffer();
    gl.bindVertexArray(this.railVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.railBuffer);
    gl.enableVertexAttribArray(0);
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 20, 0);
    gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 20, 12);
    gl.bindVertexArray(null);

    gl.enable(gl.DEPTH_TEST);
    gl.frontFace(gl.CW);
  }

  program(vs, fs) {
    const gl = this.gl, p = gl.createProgram();
    for (const [type, source] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(type);
      gl.shaderSource(s, source);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    }
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    for (let i = 0, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i < n; i++) {
      const { name } = gl.getActiveUniform(p, i);
      u[name] = gl.getUniformLocation(p, name);
    }
    return { p, u };
  }

  texture(source) {
    const gl = this.gl, t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    if (typeof source === 'string') {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([...hex(source).map(v => v * 255), 255]));
    } else {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
    }
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (this.aniso) gl.texParameterf(gl.TEXTURE_2D, this.aniso.TEXTURE_MAX_ANISOTROPY_EXT, 8);
    return t;
  }

  useProgram({ p, u }, f) {
    const gl = this.gl;
    gl.useProgram(p);
    gl.uniform2f(u.uView, f.w, f.h);
    gl.uniform1f(u.uDpr, f.dpr);
    gl.uniform4fv(u.uDrop, f.drop);
    gl.uniform1f(u.uPhase, f.phase);
    gl.uniform3fv(u.uBgFrom, f.from.bg);
    gl.uniform3fv(u.uBgTo, f.to.bg);
    if (u.uVP) gl.uniformMatrix4fv(u.uVP, false, f.vp);
    return u;
  }

  draw(f, prints, rail, railLength) {
    const gl = this.gl;
    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    gl.disable(gl.DEPTH_TEST);
    this.useProgram(this.page, f);
    gl.bindVertexArray(null);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.enable(gl.DEPTH_TEST);

    let u = this.useProgram(this.print, f);
    gl.bindVertexArray(this.sheetVao);
    gl.uniform1i(u.uNow, 0);
    gl.uniform1i(u.uNext, 1);
    gl.uniform1f(u.uBend, f.bend);
    gl.uniform1f(u.uRadius, f.radius);
    gl.uniform3fv(u.uPaper, f.paper);
    for (const p of prints) {
      gl.uniform3fv(u.uBox, p.box);
      gl.uniform3fv(u.uCloth, p.cloth);
      gl.uniform4fv(u.uFrame, p.frame);
      gl.uniform4fv(u.uCropNow, p.cropNow);
      gl.uniform4fv(u.uCropNext, p.cropNext);
      gl.uniform4fv(u.uSoak, p.soak);
      gl.uniform1f(u.uWave, p.wave);
      gl.uniform1f(u.uShut, p.shut);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, p.now.tex);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, p.next.tex);
      gl.drawElements(gl.TRIANGLES, this.indexCount, gl.UNSIGNED_SHORT, 0);
    }
    gl.activeTexture(gl.TEXTURE0);

    u = this.useProgram(this.rail, f);
    gl.uniform3fv(u.uInkFrom, f.from.ink);
    gl.uniform3fv(u.uInkTo, f.to.ink);
    gl.uniform3fv(u.uDotsFrom, f.from.dots);
    gl.uniform3fv(u.uDotsTo, f.to.dots);
    gl.bindVertexArray(this.railVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.railBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, rail.subarray(0, railLength), gl.DYNAMIC_DRAW);
    gl.drawArrays(gl.TRIANGLES, 0, railLength / 5);
  }
}

/* ---------- DOM and state ---------- */

const $ = id => document.getElementById(id);
const el = {
  stage: $('stage'), numbers: $('numbers'), project: $('project'), thumbs: $('thumbs'),
  theme: $('theme'), level: $('level'), load: $('load'), back: $('back'), picker: $('picker'),
  count: $('count'), title: $('title').firstElementChild,
  details: document.querySelector('.details'),
  fields: Object.fromEntries([...document.querySelectorAll('[data-project]')].map(n => [n.dataset.project, n]))
};
el.project.querySelectorAll('.line').forEach((line, i) => line.style.setProperty('--i', i));

let renderer;
try {
  renderer = new Renderer(el.stage);
} catch (error) {
  console.error(error);
  $('nogl').hidden = false;
  return;
}

let items = [], ownPhotos = false;
let now = 0;

const view = { w: 1, h: 1, dpr: 1, scale: 1, unit: 1, H0: 1, radius: 1, total: 1, near: 1, tier: 'wide', uiBoxes: [], dots: [] };
const turn = { target: START, goal: START, x: START, v: 0, pos: START, glides: [], mode: 'free', wheelAt: -1 };
const camera = { pitch: new SoftSpring(), lift: new SoftSpring(), dist: new SoftSpring(), zoom: new SoftSpring(1), height: new SoftSpring(1), tilt: 0 };
const shot = { pitch: 0, dist: 1, lift: 0, shift: 0, pan: 0, flat: 0, bend: 0, zoom: 1 };
const project = { open: false, since: 0, words: false, focus: START, rest: START, progress: new Timed(0), lockUntil: 0, veilA: 0, veil: 0, veilOnOpen: 0 };
const ripple = { x: 0, v: 0, history: new Float32Array(256), head: 0, rate: 120, prev: null, before: null };
const hand = { down: false, dragging: false, id: -1, x: 0, y: 0, pos: 0, tilt: 0 };
const theme = { from: 'light', to: 'light', start: -100, x: 0, y: 0, reach: 0, painted: [] };
let shownIndex = -1;

/* ---------- Photos ---------- */

function newItem(data) {
  return Object.assign({
    tex: renderer.texture(data.tone || '#3a2a3c'), iw: 2, ih: 3, fx: .5, fy: .5, border: false,
    centre: 0, bw: 1, bh: 1, sway: 0, swayV: 0, flare: 0, flareV: 0, hidden: 0,
    roll: new Timed(0), show: null, thumb: ''
  }, data);
}

const sheetUrl = (url, width) => `https://images.higgs.ai/?default=1&output=webp&url=${encodeURIComponent(url)}&w=${width}&q=85`;
const SHEET_WIDTH = Math.min(screen.width, screen.height) * Math.min(2, devicePixelRatio || 1) < 820 ? 1400 : 2336;

function fetchImage(url) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.crossOrigin = 'anonymous';
    image.onload = () => resolve(image);
    image.onerror = reject;
    image.src = url;
  });
}

function loadSheets() {
  return Promise.all(SHEETS.map(async (url, sheet) => {
    let image, used = sheetUrl(url, SHEET_WIDTH);
    try {
      image = await fetchImage(used);
    } catch {
      used = url;
      try { image = await fetchImage(used); } catch { return; }
    }
    if (ownPhotos) return;
    const trim = Math.ceil(image.width * .004); // never sample across the seam between two cells
    const w = image.width / 2 - trim * 2, h = image.height / 2 - trim * 2;
    const cut = document.createElement('canvas');
    cut.width = w; cut.height = h;
    const ctx = cut.getContext('2d');
    for (const item of items.filter(i => i.sheet === sheet)) {
      ctx.drawImage(image, item.cell % 2 * image.width / 2 + trim, (item.cell >> 1) * image.height / 2 + trim, w, h, 0, 0, w, h);
      renderer.gl.deleteTexture(item.tex);
      Object.assign(item, { tex: renderer.texture(cut), iw: w, ih: h, thumb: used });
    }
  }));
}

function styleThumb(button, item) {
  if (!item.thumb) return;
  const w = button.offsetWidth, h = button.offsetHeight;
  button.style.backgroundImage = `url("${item.thumb}")`;
  if (item.sheet === undefined) {
    Object.assign(button.style, { backgroundSize: 'cover', backgroundPosition: 'center' });
    return;
  }
  const cellH = w * 1.5, top = (item.cell >> 1) * cellH + clamp(item.fy * .7, 0, 1) * (cellH - h);
  Object.assign(button.style, { backgroundSize: `${w * 2}px ${cellH * 2}px`, backgroundPosition: `${-(item.cell % 2) * w}px ${-top}px` });
}

async function hangPhotos(list) {
  const files = [...list].filter(f => f.type.startsWith('image/')).slice(0, 24), ready = [];
  for (const file of files) {
    try {
      const bitmap = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(bitmap.width * k));
      c.height = Math.max(1, Math.round(bitmap.height * k));
      c.getContext('2d').drawImage(bitmap, 0, 0, c.width, c.height);
      bitmap.close();
      ready.push({ source: c, title: file.name.replace(/\.[^.]+$/, ''), thumb: URL.createObjectURL(file) });
    } catch {
      console.warn('Could not read', file.name);
    }
  }
  if (!ready.length) return;
  for (const item of items) {
    renderer.gl.deleteTexture(item.tex);
    if (item.thumb.startsWith('blob:')) URL.revokeObjectURL(item.thumb);
  }
  ownPhotos = true;
  items = ready.map(({ source, title, thumb }) => {
    const item = newItem({ title, thumb, iw: source.width, ih: source.height });
    renderer.gl.deleteTexture(item.tex);
    item.tex = renderer.texture(source);
    return item;
  });
  start(0);
}

/* ---------- Layout ---------- */

function layout() {
  view.w = innerWidth;
  view.h = innerHeight;
  view.dpr = Math.min(2, devicePixelRatio || 1);
  el.stage.width = Math.round(view.w * view.dpr);
  el.stage.height = Math.round(view.h * view.dpr);

  const { w, h } = view;
  view.tier = w / h <= 1.05 ? 'tall' : (h <= 520 || w <= 860 ? 'short' : 'wide');
  view.scale = view.tier === 'tall' ? Math.min(h * .46 / 504, w / 430) : Math.min(Math.min(h * .56, Math.max(560, w * .315)) / 504, w / 1180);
  view.H0 = 504 * view.scale;
  view.unit = Math.max(view.scale, .68);
  view.near = h / 2 / Math.tan(FOV / 2);

  let x = 0;
  const SIZE = [1, .74, .88, .66, .82];
  items.forEach((item, i) => {
    let gap;
    if (ownPhotos) {
      item.bh = round4(view.H0 * SIZE[i % SIZE.length]);
      item.bw = Math.round(Math.min(item.bh * clamp(item.iw / item.ih, .68, 1.5), w * .7) / 8) * 8;
      gap = 32;
    } else {
      item.bh = item.h * view.scale;
      item.bw = item.w * view.scale;
      gap = item.gap * view.scale;
    }
    item.centre = x + item.bw / 2;
    x += item.bw + gap;
  });
  view.total = Math.max(x, TAU * 420 * view.scale);
  view.radius = view.total / TAU;
  shot.bend = (1 - shot.flat) / view.radius;

  view.dots = [];
  items.forEach((item, i) => {
    const next = i + 1 < items.length ? items[i + 1].centre : items[0].centre + view.total;
    const n = Math.max(1, Math.round((next - item.centre) / (16 * view.unit)));
    for (let j = 0; j < n; j++) view.dots.push(item.centre + (next - item.centre) * j / n);
  });

  view.uiBoxes = [...document.querySelectorAll('.brand, .controls > button, .caption')].map(n => n.getBoundingClientRect());
  [...el.thumbs.children].forEach(b => styleThumb(b, items[+b.dataset.index]));
  ripple.prev = ripple.before = null;
}

function thumbSize() {
  const css = getComputedStyle(el.thumbs);
  return { w: parseFloat(css.getPropertyValue('--w')), h: parseFloat(css.getPropertyValue('--h')), gap: parseFloat(css.getPropertyValue('--gap')) };
}
let thumbBox, detailsTop = 0, thumbShift = 0;
function measureProject() {
  thumbBox = thumbSize();
  detailsTop = view.tier === 'tall' ? el.details.getBoundingClientRect().top : 0;
}

/* The box a print fills when it is open: centre x, top edge, zoom */
function projectView(width, height, zoom) {
  const { w, h, tier, unit } = view;
  if (tier === 'wide') {
    const z = zoom ?? Math.max(.1, Math.max(1, Math.min(h * .72 / height, w * .42 / width)));
    return { zoom: z, cx: w * .27, top: h / 2 - z * (height / 2 + 8 * unit) };
  }
  const below = thumbBox.h + 8;
  if (tier === 'short') {
    const room = h - 72 - below - 10, z = zoom ?? Math.min(room / height, w * .39 / width);
    return { zoom: z, cx: w * .235, top: 72 + Math.max(0, (room - height * z) / 2) };
  }
  const head = (w <= 560 ? 108 : 100), room = Math.max(40, detailsTop - 16 - below - head);
  const z = zoom ?? Math.min(room / height, w * .78 / width);
  return { zoom: z, cx: w / 2, top: head + Math.max(0, (room - height * z) / 2) };
}
const zoomFor = item => projectView(item.bw, item.bh).zoom;
function setProjectView(item) {
  camera.zoom.set(zoomFor(item));
  camera.height.set(item.bh);
}

function ringView(pitch) {
  const p = pitch * Math.PI / 180, { radius, near, H0, w, h } = view;
  const steep = 1 - Math.cos(p), half = Math.tan(FOV / 2);
  const tall = (2 * radius * Math.abs(Math.sin(p)) + H0 * Math.cos(p)) / (.92 * 2 * half);
  const broad = w < h ? 2 * radius * Math.abs(Math.sin(p)) / (.92 * 2 * half * w / h) : 0;
  return { lift: -H0 * (.546 - .322 * steep), shift: .0714 * H0 * (1 - steep), dist: Math.max(radius + near, tall, broad) };
}
function resetCamera(pitch) {
  const r = ringView(pitch);
  camera.pitch.set(pitch);
  camera.lift.set(r.lift);
  camera.dist.set(r.dist);
}

/* ---------- Ring position: one whole number is one print ---------- */

function along(q) {
  const n = items.length, k = Math.floor(q), i = mod(k, n), laps = Math.floor(k / n);
  const here = items[i].centre, next = i + 1 < n ? items[i + 1].centre : items[0].centre + view.total;
  return laps * view.total + here + (next - here) * (q - k);
}
const pxPerPrint = () => { const k = Math.floor(turn.pos); return along(k + 1) - along(k); };
const queued = () => turn.glides.reduce((sum, g) => sum + g.by, 0);
const destination = () => turn.target + queued();

function glide(by) {
  turn.mode = 'free';
  if (Math.abs(by) < .0001) return;
  const s = Math.min(T.step.max, T.step.s + T.step.extra * Math.max(0, Math.abs(by) - 1));
  turn.glides.push({ by, start: now, s: seconds(s) });
}

function land(thrown) {
  const rest = queued();
  let to = Math.round(turn.target + rest);
  if (thrown && Math.abs(turn.v) > .4) {
    const way = Math.sign(turn.v), carry = turn.x + turn.v * T.throwTime;
    to = Math.round((way > 0 ? Math.max(carry, turn.goal) : Math.min(carry, turn.goal)) + rest);
    if ((to - rest - turn.x) * way < .14 * Math.abs(turn.v)) to += way;
  }
  turn.target = to - rest;
  turn.mode = 'free';
}

/* ---------- Project ---------- */

function fillProject(i) {
  const item = items[i], f = el.fields, story = STORIES[item.story ?? 0];
  const own = item.sheet === undefined;
  f.number.textContent = `No ${pad(i + 1)} / ${pad(items.length)}`;
  f.title.textContent = item.title;
  f.series.textContent = own ? 'Your photos' : story.series;
  f.mood.textContent = own ? 'As loaded' : story.mood;
  f.year.textContent = own ? String(new Date().getFullYear()) : String(2026 - i % 3);
  f.work.textContent = own ? 'On this device only' : 'Portraits and lighting';
  const note = own ? ['Your photograph, hung on the ring.', 'It has not been uploaded anywhere', 'and is gone when the page closes.'] : story.note;
  [f.a.textContent, f.b.textContent, f.c.textContent] = note;
}

function openPrint(i) {
  const n = items.length;
  let by = mod(i - mod(Math.round(destination()), n), n);
  if (by > n / 2) by -= n;

  fillProject(i);
  document.body.classList.add('project-open');
  measureProject();
  if (project.progress.at(now) < .02) setProjectView(items[i]);
  Object.assign(project, { open: true, since: now, words: false, focus: i, veilOnOpen: project.veil });
  project.progress.go(now, 1, T.open.s, EASE.open);
  rollPrints(true);
  project.rest = Math.round(destination()) + by;
  glide(project.rest - destination());

  el.project.classList.remove('shown');
  el.thumbs.classList.remove('shown');
  el.project.inert = el.thumbs.inert = false;
  el.thumbs.replaceChildren();
  [...new Set([0, 1, 2, 3].map(k => mod(i + k, n)))].forEach((g, k) => {
    const b = document.createElement('button');
    b.dataset.index = g;
    b.setAttribute('aria-label', `Show ${items[g].title}`);
    b.style.setProperty('--i', k);
    b.classList.toggle('active', g === items[i].show.want);
    b.addEventListener('pointerenter', () => wishPhoto(g));
    b.addEventListener('pointerleave', () => dropWish(g));
    b.addEventListener('click', () => wishPhoto(g, true));
    el.thumbs.append(b);
    styleThumb(b, items[g]);
  });
}

function closeProject() {
  if (!project.open) return;
  wishPhoto(project.focus, true);
  if (project.progress.at(now) > .999) resetCamera(0);
  project.open = false;
  document.body.classList.remove('project-open');
  camera.tilt = 0;
  el.project.classList.remove('shown');
  el.thumbs.classList.remove('shown');
  if (el.project.contains(document.activeElement) || el.thumbs.contains(document.activeElement)) el.stage.focus({ preventScroll: true });
  el.project.inert = el.thumbs.inert = true;
  hand.down = hand.dragging = false;
  el.stage.classList.remove('dragging');
  land(false);
  project.progress.go(now, 0, T.back.s, EASE.back, T.back.wait);
  rollPrints(false);
}

function rollPrints(up) {
  const home = items[project.focus].centre;
  const distance = item => Math.abs(wrapAngle((item.centre - home) / view.radius));
  [...items].sort((a, b) => distance(a) - distance(b)).forEach((item, rank) => {
    const step = Math.min(rank, 8);
    if (up) item.roll.go(now, item === items[project.focus] ? 0 : 1, T.roll.s, EASE.roll, step * T.roll.gap);
    else item.roll.go(now, 0, T.back.rollS, EASE.back, T.back.rollWait + step * T.back.gap);
  });
}

function wishPhoto(index, sure = false) {
  if (!project.open) return;
  const s = items[project.focus].show;
  if (index !== s.want) { s.want = index; s.wishedAt = now; }
  if (sure) s.wishedAt = Math.min(s.wishedAt, now - T.soak.hover);
  for (const b of el.thumbs.children) b.classList.toggle('active', +b.dataset.index === s.want);
}

function dropWish(index) {
  if (!project.open) return;
  const s = items[project.focus].show;
  if (s.want !== index || now - s.wishedAt >= T.soak.hover) return;
  s.want = s.next >= 0 ? s.next : s.current;
  for (const b of el.thumbs.children) b.classList.toggle('active', +b.dataset.index === s.want);
}

/* An open print can be slid along the rail, never off the screen */
function keepInView(q) {
  const item = items[project.focus], v = projectView(item.bw, item.bh), half = item.bw * v.zoom / 2;
  const lo = Math.min(0, (24 + half - v.cx) / v.zoom), hi = Math.max(0, (view.w - 24 - half - v.cx) / v.zoom);
  const x0 = along(project.rest);
  const at = slide => {
    const d = -slide, step = d >= 0 ? along(project.rest + 1) - x0 : x0 - along(project.rest - 1);
    return project.rest + d / step;
  };
  const rest = queued();
  return clamp(q + rest, at(hi), at(lo)) - rest;
}

/* ---------- Simulation ---------- */

function update(dt) {
  now += dt;
  const n = items.length;

  if (turn.mode === 'wheel' && now - turn.wheelAt > T.snapAfter) land(false);
  const dragging = turn.mode === 'drag';
  turn.goal = dragging || REDUCED ? turn.target : turn.goal + (turn.target - turn.goal) * approach(T.soften, dt);
  const k = dragging ? T.hand : T.wheel;
  turn.v += (k * (turn.goal - turn.x) - 2 * Math.sqrt(k) * turn.v) * dt;
  turn.x += turn.v * dt;
  if (REDUCED) { turn.x = turn.goal; turn.v = 0; }
  let gliding = 0;
  turn.glides = turn.glides.filter(g => {
    const p = (now - g.start) / g.s;
    if (p < 1) { gliding += g.by * EASE.step(p); return true; }
    turn.target += g.by; turn.goal += g.by; turn.x += g.by;
    return false;
  });
  turn.pos = turn.x + gliding;

  const p = project.progress.at(now);
  if (!project.open && p < .02) project.focus = mod(Math.round(turn.pos), n);
  const focus = items[project.focus];
  if (p < .02) setProjectView(focus);
  else {
    camera.zoom.follow(zoomFor(focus), 3.5, dt);
    camera.height.follow(focus.bh, 3.5, dt);
  }

  camera.pitch.follow(camera.tilt, 5, dt);
  const ring = ringView(camera.pitch.x);
  camera.lift.follow(ring.lift, 3.2, dt);
  camera.dist.follow(ring.dist, 3, dt);

  const close = projectView(focus.bw, camera.height.x, camera.zoom.x);
  shot.zoom = close.zoom;
  shot.pitch = lerp(camera.pitch.x, 0, p) * Math.PI / 180;
  shot.dist = lerp(camera.dist.x, view.radius + view.near / close.zoom, p);
  shot.lift = lerp(camera.lift.x, (close.top - view.h / 2) / close.zoom, p);
  shot.pan = lerp(0, (view.w / 2 - close.cx) / close.zoom, p);
  shot.shift = lerp(ring.shift, 0, p);
  shot.flat = p * p;
  shot.bend = clamp(1 - shot.flat, 0, 1) / view.radius;

  const veilTo = project.open ? Math.max(smooth((now - project.since) / T.open.veil), project.veilOnOpen) : clamp(shot.flat * 14, 0, 1);
  const veilRate = approach(veilTo > project.veil ? 9 : 2.4, dt);
  project.veilA += (veilTo - project.veilA) * veilRate;
  project.veil += (project.veilA - project.veil) * veilRate;

  if (project.open && !project.words && now - project.since > seconds(T.open.words)) {
    project.words = true;
    el.project.classList.add('shown');
    el.thumbs.classList.add('shown');
  }

  items.forEach((item, i) => {
    const s = item.show;
    if (s.next >= 0 && now - s.start >= seconds(T.soak.s)) { s.current = s.next; s.next = -1; }
    if (s.next < 0 && s.want !== s.current && now - s.wishedAt >= T.soak.hover) {
      Object.assign(s, { next: s.want, start: now, slot: mod(s.want - i, n) });
    }
  });

  updatePaper(along(turn.pos), dt);

  const front = project.open && now - project.since > T.open.s ? project.focus : mod(Math.round(turn.pos), n);
  if (front !== shownIndex) showCaption(front);
}

function updatePaper(x, dt) {
  if (ripple.before !== null && !REDUCED) {
    const accel = clamp((x - 2 * ripple.prev + ripple.before) / (dt * dt), -30000, 30000);
    const spin = (x - ripple.prev) / dt / view.radius;
    for (const item of items) {
      const w = TAU * T.swing.hz * Math.sqrt(view.H0 / item.bh);
      item.swayV += (accel * T.swing.weight - w * w * item.sway - 2 * T.swing.damp * w * item.swayV) * dt;
      item.sway = clamp(item.sway + item.swayV * dt, -item.bh * .6, item.bh * .6);
      item.flareV += (spin * spin * view.radius - w * w * item.flare - 2 * T.swing.flareDamp * w * item.flareV) * dt;
      item.flare = clamp(item.flare + item.flareV * dt, 0, item.bh * .8);
    }
    const w = TAU * T.ripple.hz;
    ripple.v += (accel * T.ripple.weight - w * w * ripple.x - 2 * T.ripple.damp * w * ripple.v) * dt;
    ripple.x += ripple.v * dt;
  }
  ripple.before = ripple.prev;
  ripple.prev = x;
  ripple.head = (ripple.head + 1) % ripple.history.length;
  ripple.history[ripple.head] = ripple.x;
  ripple.rate = 1 / dt;
}

function showCaption(i) {
  const first = shownIndex < 0;
  shownIndex = i;
  el.count.textContent = `${pad(i + 1)} / ${pad(items.length)}`;
  el.title.textContent = items[i].title;
  if (!first && !REDUCED) {
    el.title.animate([{ transform: 'translateY(105%)' }, { transform: 'none' }], { duration: 900, easing: 'cubic-bezier(.16, 1, .3, 1)' });
  }
  [...el.numbers.children].forEach((node, k) => { node.className = k === i ? 'ink' : 'muted'; });
}

/* ---------- Projection ---------- */

const matrix = new Float32Array(16);
function buildMatrix() {
  const c = Math.cos(shot.pitch), s = Math.sin(shot.pitch), f = 1 / Math.tan(FOV / 2), fx = f * view.h / view.w;
  const ex = shot.pan, ey = shot.lift + s * shot.dist, ez = c * shot.dist;
  const n = 20, far = 16000, a = (far + n) / (n - far), b = 2 * far * n / (n - far);
  const ty = -(c * ey - s * ez), tz = -(s * ey + c * ez);
  const d = 2 * shot.shift / view.h; // lens shift
  matrix.set([fx, 0, 0, 0, 0, f * c + d * s, a * s, -s, 0, -f * s + d * c, a * c, -c, -fx * ex, f * ty + d * tz, a * tz + b, -tz]);
}

function railPoint(x, y, out = 0) {
  if (shot.bend < .000001) return [x, y, view.radius + out];
  const t = x * shot.bend, s = Math.sin(t), h = Math.sin(t / 2);
  return [s / shot.bend + s * out, y, view.radius - 2 * h * h / shot.bend + Math.cos(t) * out];
}

function toScreen([x, y, z]) {
  const m = matrix, w = m[3] * x + m[7] * y + m[11] * z + m[15];
  return {
    x: ((m[0] * x + m[4] * y + m[8] * z + m[12]) / w + 1) * view.w / 2,
    y: (1 - (m[1] * x + m[5] * y + m[9] * z + m[13]) / w) * view.h / 2,
    w
  };
}

function outline(x, width, height) {
  const top = [], bottom = [];
  for (let i = 0; i <= 4; i++) {
    const a = x + (i / 4 - .5) * width;
    top.push(toScreen(railPoint(a, 0)));
    bottom.push(toScreen(railPoint(a, -height)));
  }
  return top.concat(bottom.reverse());
}

/* Signed distance to a polygon: positive inside */
function depthInside(points, x, y) {
  let inside = false, best = Infinity;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    const a = points[i], b = points[j];
    if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) inside = !inside;
    const dx = b.x - a.x, dy = b.y - a.y, t = clamp(((x - a.x) * dx + (y - a.y) * dy) / (dx * dx + dy * dy || 1), 0, 1);
    best = Math.min(best, Math.hypot(x - a.x - dx * t, y - a.y - dy * t));
  }
  return inside ? best : -best;
}

function printAt(x, y) {
  const centre = along(turn.pos);
  let hit = -1, best = .15;
  items.forEach((item, i) => {
    const a = wrapAngle((item.centre - centre) / view.radius), facing = Math.cos(a);
    if (facing < best || item.roll.at(now) > .9) return;
    if (depthInside(outline(a * view.radius, item.bw, item.bh), x, y) >= 0) { hit = i; best = facing; }
  });
  return hit;
}

/* ---------- Rail ---------- */

let railData = new Float32Array(0), railLength = 0;
function railShape(points, kind, pale, out) {
  const p = points.map(([x, y]) => railPoint(x, y, out));
  for (let i = 1; i + 1 < p.length; i++) {
    for (const v of [p[0], p[i], p[i + 1]]) {
      railData[railLength++] = v[0]; railData[railLength++] = v[1]; railData[railLength++] = v[2];
      railData[railLength++] = kind; railData[railLength++] = pale;
    }
  }
}

function clipAcross(points, edge, keepRight) {
  const kept = [], inside = p => keepRight ? p[0] >= edge : p[0] <= edge;
  points.forEach((a, i) => {
    const b = points[(i + 1) % points.length];
    if (inside(a)) kept.push(a);
    if (inside(a) !== inside(b)) kept.push([edge, lerp(a[1], b[1], (edge - a[0]) / (b[0] - a[0]))]);
  });
  return kept;
}

const DOT = Array.from({ length: 10 }, (_, i) => [Math.cos(TAU * i / 10), Math.sin(TAU * i / 10)]);
function buildRail(centre) {
  const u = view.unit, size = 6.6 * u, half = 8 * u, middle = 12.5 * u;
  const need = (view.dots.length + 3) * 10 * 3 * 5 * 2;
  if (railData.length < need) railData = new Float32Array(need);
  railLength = 0;
  const last = ripple.history.length - 1;
  for (const dot of view.dots) {
    const x = mod(dot - centre + view.total / 2, view.total) - view.total / 2, a = x / view.radius;
    const ago = Math.min(last, Math.round(Math.abs(a) / Math.PI * T.ripple.s * ripple.rate));
    const lean = Math.tanh(ripple.history[mod(ripple.head - ago, last + 1)]) * .9 * T.ripple.lean * size;
    const points = DOT.map(([px, py]) => [x + px * size / 2 + lean * (py + 1) / 2, middle + py * size / 2]);
    railShape(points, 0, project.veil * farness(a), 0);
    if (Math.abs(x) < half + size + Math.abs(lean)) {
      const inWindow = clipAcross(clipAcross(points, -half, true), half, false);
      if (inWindow.length > 2) railShape(inWindow, 2, 0, 3.5);
    }
  }
  railShape([[-half, middle - half], [half, middle - half], [half, middle + half], [-half, middle + half]], 1, 0, 1.5);
  const hole = half - 3.5 * u;
  railShape([[-hole, middle - hole], [hole, middle - hole], [hole, middle + hole], [-hole, middle + hole]], 2, 0, 2.5);
}

/* ---------- Drawing ---------- */

const paletteRgb = Object.fromEntries(Object.entries(THEMES).map(([k, v]) => [k, { bg: hex(v.bg), ink: hex(v.ink), dots: hex(v.dots) }]));
const PAPER = hex('#f5f2f6');

function coverCrop(photo, aspect) {
  const own = photo.iw / photo.ih;
  const w = own > aspect ? aspect / own : 1, h = own > aspect ? 1 : own / aspect;
  return [(1 - w) * photo.fx, (1 - h) * photo.fy, w, h];
}

function soakFor(item, s) {
  const { w, h, gap } = thumbBox, z = shot.zoom, k = T.soak;
  const e = EASE.soak((now - s.start) / seconds(k.s)), aspect = item.bw / item.bh;
  const x = (thumbShift + s.slot * (w + gap) + w / 2) / z / item.bh, y = 1 + (16 + h / 2) / z / item.bh;
  const nearest = Math.hypot(Math.max(0, x - aspect), y - 1);
  const furthest = Math.max(Math.hypot(x, y), Math.hypot(aspect - x, y));
  const from = nearest - k.reach * k.lead - k.wave, to = furthest + k.dry + k.wave + .01;
  return { soak: [Math.max(.0001, smooth((now - s.start) / k.wetIn)), x, y, lerp(from, to, e)], wave: k.wave * (1 - .7 * e) };
}

function dropState() {
  const p = (now - theme.start) / seconds(T.drop.s);
  if (p >= 1) return { done: true, r: 0, wave: 0 };
  const e = EASE.drop(p);
  return { done: false, r: theme.reach * e, wave: T.drop.wave * (1 - e) };
}

let lastRender = 0;
function render() {
  buildMatrix();
  const centre = along(turn.pos), { radius } = view, prints = [], fronts = [];

  items.forEach((item, i) => {
    const a = wrapAngle((item.centre - centre) / radius), x = a * radius;
    const shut = Math.max(item.roll.at(now), project.veil * farness(a));
    item.angle = a;
    item.shut = shut;
    if (shut >= .993) return;

    const face = clamp((Math.cos(a * (1 - shot.flat)) - .08) / .3, 0, 1);
    if (face > 0) {
      const points = outline(x, item.bw, item.bh * (1 - clamp(shut, 0, 1)));
      if (points.every(p => p.w > 0)) fronts.push({ i, points, face, w: (points[0].w + points[4].w) / 2 });
    }

    const swayMax = item.bh * .2, flareMax = item.bh * .34;
    const sway = swayMax * Math.tanh(item.sway / swayMax), flare = flareMax * Math.tanh(item.flare / flareMax);
    let frame = [0, 0, 1, 1];
    if (item.border) {
      const side = .062, top = item.bw * side / item.bh;
      frame = [side, top, 1 - side * 2, 1 - top * 2.55];
    }
    const aspect = item.bw * frame[2] / (item.bh * frame[3]);
    const s = item.show, current = items[s.current], next = s.next >= 0 ? items[s.next] : current;
    const wet = s.next >= 0 ? soakFor(item, s) : { soak: [0, 0, 0, 0], wave: 0 };

    prints.push({
      box: [x, item.bw, item.bh], cloth: [sway, flare, (sway * sway + flare * flare) / (2 * item.bh) * .7],
      frame, shut, now: current, next, cropNow: coverCrop(current, aspect), cropNext: coverCrop(next, aspect),
      soak: wet.soak, wave: wet.wave
    });
  });

  drawNumbers(fronts, clamp(now - lastRender, 0, .1));
  lastRender = now;

  if (project.open || shot.flat > .02) {
    const item = items[project.focus];
    const corner = toScreen(railPoint(item.angle * radius - item.bw / 2, -item.bh));
    thumbShift = 0;
    if (view.tier !== 'wide') {
      // a narrow print is narrower than its row of thumbnails: keep the row on screen and out of the words
      const count = el.thumbs.children.length, row = count * thumbBox.w + (count - 1) * thumbBox.gap;
      const edge = view.tier === 'short' ? view.w * .47 - 10 : view.w - 12;
      thumbShift = Math.max(12, Math.min(corner.x, edge - row)) - corner.x;
    }
    el.thumbs.style.transform = `translate3d(${corner.x + thumbShift}px, ${corner.y + (view.tier === 'wide' ? 16 : 8)}px, 0)`;
  }

  buildRail(centre);
  const drop = dropState(), settled = paletteRgb[theme.to];
  renderer.draw({
    w: view.w, h: view.h, dpr: view.dpr, vp: matrix, bend: shot.bend, radius, paper: PAPER, phase: now * 1.4,
    from: drop.done ? settled : paletteRgb[theme.from], to: settled,
    drop: [theme.x, theme.y, drop.r, drop.wave]
  }, prints, railData, railLength);

  paintText(drop);
}

function drawNumbers(fronts, dt) {
  const u = view.unit;
  items.forEach((item, i) => {
    const node = el.numbers.children[i], a = item.angle;
    const p = toScreen(railPoint(a * view.radius - item.bw / 2 + 8 * u, 30 * u));
    const clear = p.w > 0 && p.x > 2 && p.y > 10 && p.x < view.w - 20 && p.y < view.h - 10 &&
      !view.uiBoxes.some(b => p.x + 18 > b.left - 4 && p.x < b.right + 4 && p.y + 7 > b.top - 3 && p.y - 8 < b.bottom + 3);
    let behind = 0;
    if (clear) {
      for (const f of fronts) {
        const nearer = clamp((p.w - f.w - 4) / 60, 0, 1);
        if (f.i === i || !nearer) continue;
        behind = Math.max(behind, smooth((depthInside(f.points, p.x + 7, p.y) + 6) / 16) * f.face * nearer);
      }
    }
    item.hidden += (behind - item.hidden) * approach(11, dt);
    const facing = smooth((Math.cos(a * (1 - shot.flat)) + .2) / .7);
    const opacity = clear ? lerp(.28, 1, facing) * (1 - clamp(item.shut, 0, 1)) * (1 - item.hidden) : 0;
    node.style.opacity = opacity.toFixed(3);
    node.style.visibility = opacity < .004 ? 'hidden' : '';
    if (clear) node.style.transform = `translate3d(${p.x.toFixed(2)}px, ${(p.y - 8).toFixed(2)}px, 0)`;
  });
}

/* ---------- Theme ---------- */

function flipTheme() {
  if (!dropState().done) return;
  const r = el.theme.getBoundingClientRect();
  theme.x = r.left + r.width / 2;
  theme.y = r.top + r.height / 2;
  theme.reach = Math.hypot(Math.max(theme.x, view.w - theme.x), Math.max(theme.y, view.h - theme.y)) * 1.12 + 8;
  theme.from = theme.to;
  theme.to = theme.from === 'light' ? 'dark' : 'light';
  theme.start = now;
  el.theme.textContent = theme.to === 'dark' ? 'Light' : 'Dark';
  theme.painted = [...document.querySelectorAll('.ink, .muted')];
}

/* Words change colour exactly where the edge of the drop crosses them */
function paintText(drop) {
  if (!theme.painted.length) return;
  if (drop.done) {
    document.documentElement.dataset.theme = theme.to;
    document.querySelector('meta[name="theme-color"]').content = THEMES[theme.to].bg;
    for (const node of theme.painted) {
      node.classList.remove('mixing');
      node.style.backgroundImage = '';
    }
    theme.painted = [];
    return;
  }
  const from = THEMES[theme.from], to = THEMES[theme.to];
  for (const node of theme.painted) {
    const b = node.getBoundingClientRect();
    if (!b.width) continue;
    const angle = Math.atan2(b.top + b.height / 2 - theme.y, b.left + b.width / 2 - theme.x);
    const r = drop.r * (1 + drop.wave * Math.sin(3 * angle + now * 1.4));
    const key = node.classList.contains('ink') ? 'ink' : 'muted';
    node.classList.add('mixing');
    node.style.backgroundImage = `radial-gradient(circle at ${theme.x - b.left}px ${theme.y - b.top}px, ${to[key]} ${r}px, ${from[key]} ${r + 1.5}px)`;
  }
}

/* ---------- Input ---------- */

el.stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 || hand.down) return;
  try { el.stage.setPointerCapture(e.pointerId); } catch { /* already released */ }
  Object.assign(hand, { down: true, dragging: false, id: e.pointerId, x: e.clientX, y: e.clientY, pos: turn.target, tilt: camera.tilt });
});
el.stage.addEventListener('pointermove', e => {
  if (!hand.down || e.pointerId !== hand.id) return;
  const dx = e.clientX - hand.x, dy = e.clientY - hand.y;
  if (!hand.dragging && Math.hypot(dx, dy) > T.dragFrom) {
    hand.dragging = true;
    turn.mode = 'drag';
    el.stage.classList.add('dragging');
  }
  if (!hand.dragging) return;
  if (project.open) {
    turn.target = keepInView(hand.pos - dx / shot.zoom / pxPerPrint());
  } else {
    turn.target = hand.pos - dx / pxPerPrint();
    camera.tilt = clamp(hand.tilt + dy * T.tiltPerPx, T.tiltMin, T.tiltMax);
  }
});
function release(e, lost) {
  if (!hand.down || e.pointerId !== hand.id) return;
  hand.down = false;
  el.stage.classList.remove('dragging');
  if (hand.dragging) {
    if (project.open) turn.mode = 'free'; else land(true);
  } else if (!lost) {
    if (project.open) closeProject();
    else {
      const hit = printAt(e.clientX, e.clientY);
      if (hit >= 0) openPrint(hit);
    }
  }
  hand.dragging = false;
}
el.stage.addEventListener('pointerup', e => release(e, false));
el.stage.addEventListener('pointercancel', e => release(e, true));

addEventListener('wheel', e => {
  if (e.ctrlKey) return; // leave pinch zoom to the browser
  e.preventDefault();
  let d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (e.deltaMode === 1) d *= 33;
  else if (e.deltaMode === 2) d *= view.h;
  if (project.open) { closeProject(); project.lockUntil = now + T.back.lock; return; }
  if (now < project.lockUntil) { project.lockUntil = now + .25; return; }
  turn.target += d / pxPerPrint();
  turn.mode = 'wheel';
  turn.wheelAt = now;
}, { passive: false });

addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeProject(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest?.('button')) return;
  switch (e.key) {
    case 'ArrowRight':
    case 'ArrowLeft': {
      if (project.open) { closeProject(); break; }
      const by = e.key === 'ArrowRight' ? 1 : -1;
      glide(Math.round(destination()) + by - destination());
      break;
    }
    case 'ArrowUp': camera.tilt = clamp(camera.tilt + 12, T.tiltMin, T.tiltMax); break;
    case 'ArrowDown': camera.tilt = clamp(camera.tilt - 12, T.tiltMin, T.tiltMax); break;
    case 'Enter':
    case ' ':
      if (!e.repeat) { if (project.open) closeProject(); else openPrint(mod(Math.round(destination()), items.length)); }
      break;
    default: return;
  }
  e.preventDefault();
});

el.theme.addEventListener('click', flipTheme);
el.level.addEventListener('click', () => { camera.tilt = 0; });
el.back.addEventListener('click', closeProject);
el.load.addEventListener('click', () => el.picker.click());
el.picker.addEventListener('change', async () => { await hangPhotos(el.picker.files); el.picker.value = ''; });
addEventListener('dragover', event => event.preventDefault());
addEventListener('drop', event => {
  event.preventDefault();
  hangPhotos(event.dataTransfer?.files ?? []);
});
el.stage.addEventListener('webglcontextlost', e => e.preventDefault());
el.stage.addEventListener('webglcontextrestored', () => location.reload());

/* ---------- Start ---------- */

function start(index) {
  Object.assign(turn, { target: index, goal: index, x: index, v: 0, pos: index, glides: [], mode: 'free' });
  Object.assign(project, { open: false, words: false, focus: index, progress: new Timed(0), veil: 0, veilA: 0, veilOnOpen: 0, lockUntil: 0 });
  document.body.classList.remove('project-open');
  el.project.classList.remove('shown');
  el.thumbs.classList.remove('shown');
  el.project.inert = el.thumbs.inert = true;
  el.thumbs.replaceChildren();
  hand.down = hand.dragging = false;

  items.forEach((item, i) => {
    item.show = { current: i, next: -1, want: i, start: 0, wishedAt: 0, slot: 0 };
  });
  el.numbers.replaceChildren(...items.map((_, i) => {
    const node = document.createElement('span');
    node.textContent = pad(i + 1);
    node.className = 'muted';
    return node;
  }));

  shot.flat = 0;
  layout();
  fillProject(index);
  measureProject();
  setProjectView(items[index]);
  camera.tilt = 0;
  resetCamera(0);
  shownIndex = -1;
  update(1 / 120);
  render();
}

function resize() {
  layout();
  measureProject();
  resetCamera(camera.pitch.x);
  setProjectView(items[project.focus]);
  if (project.open) turn.target = keepInView(turn.target);
  update(1 / 120);
  render();
}
addEventListener('resize', resize);

items = PRINTS.map(newItem);
start(START);
document.fonts.ready.then(resize);
const photosReady = loadSheets().then(() => {
  [...el.thumbs.children].forEach(b => styleThumb(b, items[+b.dataset.index]));
});

let last = performance.now();
requestAnimationFrame(function loop(t) {
  requestAnimationFrame(loop);
  const dt = clamp((t - last) / 1000, 1 / 240, 1 / 30);
  last = t;
  update(dt / 2);
  update(dt / 2);
  render();
});

/* Read-only state, used by the audit and recording scripts */
window.ombry = {
  ready: photosReady,
  get state() {
    return {
      time: now, pos: turn.pos, target: destination(), open: project.open, words: project.words, focus: project.focus,
      flat: shot.flat, veil: project.veil, pitch: shot.pitch * 180 / Math.PI, radius: view.radius, near: view.near, tier: view.tier,
      rolled: items.filter((item, i) => i !== project.focus && item.roll.at(now) > .999).length,
      flare: Math.max(...items.map(item => item.flare)), sway: Math.max(...items.map(item => Math.abs(item.sway))),
      shows: items.map(item => item.show.next >= 0 ? `${item.show.current}>${item.show.next}` : item.show.current),
      theme: theme.to,
      boxes: items.map((item, i) => ({ item, i })).filter(({ item }) => item.shut < .95 && Math.cos(item.angle * (1 - shot.flat)) > .15).map(({ item, i }) => {
        const pts = outline(item.angle * view.radius, item.bw, item.bh), xs = pts.map(p => p.x), ys = pts.map(p => p.y);
        return { i, left: Math.min(...xs), right: Math.max(...xs), top: Math.min(...ys), bottom: Math.max(...ys) };
      })
    };
  }
};
})();
</script>
</body>
