:root{
  --bg:#E27657;--word:#F6EDE1;--ui:#FFFFFF;--accent:#F0653F;
  --k:1px;               /* px per design px (1440x900 frame), set by JS */
  --n:1px;               /* nav unit */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ui);font-family:Manrope,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}

.stage{position:fixed;inset:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2;touch-action:manipulation}

.nav{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;height:calc(58*var(--n));padding:0 calc(36*var(--n))}
.logo{font-weight:800;font-size:max(22px,calc(30*var(--n)));padding:2px 0;letter-spacing:-.03em;line-height:1}
.links{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:calc(36*var(--n))}
.links a,.talk{font-weight:700;font-size:max(12px,calc(15*var(--n)));letter-spacing:-.005em;padding:6px 0;line-height:1.2}
.links a:hover,.talk:hover{opacity:.75}

.pill{position:absolute;z-index:5;right:calc(34*var(--n));top:calc(var(--rail) + 26*var(--n));height:max(26px,calc(30*var(--n)));padding:0 calc(14*var(--n));display:flex;align-items:center;border:1px solid rgba(255,255,255,.85);border-radius:999px;font-weight:800;font-size:max(11px,calc(10*var(--n)));letter-spacing:.22em;text-transform:uppercase;white-space:nowrap}
.eyebrow{position:absolute;z-index:5;left:calc(35*var(--n));bottom:calc(14*var(--n));font-weight:800;font-size:max(11px,calc(10*var(--n)));letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}

.word{position:absolute;z-index:1;left:0;right:0;bottom:0;height:var(--wordH);overflow:hidden;pointer-events:none}
.word span{position:absolute;left:var(--wordX);bottom:var(--wordB);font-family:"Archivo X",Manrope,sans-serif;font-weight:900;font-stretch:125%;font-size:var(--wordFS);line-height:1;letter-spacing:-.035em;color:var(--word);white-space:nowrap}

/* card that sits inside the open container (positioned from the 3D projection) */
.card{position:absolute;z-index:3;pointer-events:none;display:flex;flex-direction:column;justify-content:center;padding:0 calc(42*var(--c)) 0 calc(42*var(--c));--c:1px}
.card>*{opacity:0;transform:translateY(calc(10*var(--c)));transition:opacity .28s ease-out,transform .38s cubic-bezier(.22,1,.36,1)}
.card.on>*{opacity:1;transform:none}
.card.on>*:nth-child(2){transition-delay:.06s}
.card.on>*:nth-child(3){transition-delay:.12s}
.card.on>*:nth-child(4){transition-delay:.18s}
.card .eb{font-weight:800;font-size:max(11px,calc(12*var(--c)));letter-spacing:.24em;text-transform:uppercase}
.card h2{font-weight:800;font-size:max(18px,calc(40*var(--c)));letter-spacing:-.035em;line-height:1.05;margin-top:calc(12*var(--c))}
.card h2 em{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--accent);font-size:1.08em}
.card p{font-weight:500;font-size:max(11px,calc(16*var(--c)));line-height:1.5;margin-top:calc(12*var(--c));max-width:calc(440*var(--c));color:rgba(255,255,255,.88)}
.card .chips{display:flex;flex-wrap:wrap;gap:calc(8*var(--c));margin-top:calc(14*var(--c))}
.card .chips span{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:calc(5*var(--c)) calc(12*var(--c));font-weight:700;font-size:max(11px,calc(12.5*var(--c)))}
.card .mail{pointer-events:auto;align-self:flex-start;margin-top:calc(14*var(--c));background:var(--accent);color:#fff;border-radius:999px;padding:max(5px,calc(7*var(--c))) calc(16*var(--c));min-height:24px;display:inline-flex;align-items:center;font-weight:800;font-size:max(11px,calc(13*var(--c)))}

.card.tight h2{font-size:16px;margin-top:4px}.card.tight p,.card.tight .chips,.card.tight .mail{margin-top:6px}
.pill{transition:opacity .25s ease}.pill.away{opacity:0!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* entrance guard */
html.js .rv{opacity:0}
html.ready .rv{opacity:1}
@media (prefers-reduced-motion:reduce){html.js .rv{opacity:1}.card>*{transition:none}}

/* small screens: stacked nav */
@media (max-width:819px){
  .links{display:none}
}

/* ---------- corrugation normal map ---------- */
function corrugation(){
  const w=64,h=4,cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const x=cv.getContext('2d'), img=x.createImageData(w,h);
  for(let i=0;i<w;i++){
    const a=i/w*Math.PI*2, nx=Math.cos(a)*.62, nz=Math.sqrt(1-nx*nx);
    for(let j=0;j<h;j++){const k=(j*w+i)*4; img.data[k]=(nx*.5+.5)*255; img.data[k+1]=128; img.data[k+2]=nz*255; img.data[k+3]=255;}
  }
  x.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.NoColorSpace; return t;
}
const CORR = corrugation();
const RIDGE = 10; // design px per ridge
const matCache = new Map();
function paint(color, uLen, horizontal=false){
  const key=color+'|'+Math.round(uLen)+'|'+horizontal;
  if(matCache.has(key)) return matCache.get(key);
  const n=CORR.clone(); n.needsUpdate=true;
  if(horizontal){ n.rotation=Math.PI/2; n.center.set(.5,.5); }
  n.repeat.set(Math.max(1,Math.round(uLen/RIDGE)),1);
  const m=new THREE.MeshStandardMaterial({color, roughness:.6, metalness:0, normalMap:n, normalScale:new THREE.Vector2(.55,.55)});
  matCache.set(key,m); return m;
}
const plain = (color,r=.5)=>new THREE.MeshStandardMaterial({color,roughness:r,metalness:.1});

/* box with per-face materials: order +x,-x,+y,-y,+z,-z */
function slab(w,h,d,mats){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mats);
  m.castShadow=true; m.receiveShadow=true; return m;
}

/* ---------- label texture ---------- */
function labelTexture(lines, ink, L, H){
  const cw=1024, ch=Math.round(1024*H/L), cv=document.createElement('canvas');
  cv.width=cw; cv.height=ch; const x=cv.getContext('2d');
  let fs = ch*(lines.length>1?.27:.3);
  const font = s=>`900 ${s}px "Archivo X"`;
  x.font=font(fs);
  const maxW = cw*.82;
  const widest = Math.max(...lines.map(l=>x.measureText(l).width));
  if(widest>maxW){ fs*=maxW/widest; x.font=font(fs); }
  x.fillStyle=ink; x.textBaseline='alphabetic';
  const lh=fs*.9, total=lh*lines.length, top=(ch-total)/2+fs*.76;
  lines.forEach((l,i)=>x.fillText(l, cw*.075, top+i*lh));
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}

/* ---------- container ---------- */
function makeContainer(def){
  const {L,H,D}=SIZES[def.size]; const T=4;
  const g=new THREE.Group();
  const out=def.color, inn=C.inside;
  const oL=paint(out,L), oD=paint(out,D), oLh=paint(out,L,true);
  const iL=paint(inn,L), iD=paint(inn,D), iLh=paint(inn,L,true);
  const flat=plain(out,.55);
  // back wall (+z face is inside)
  const back=slab(L,H,T,[flat,flat,flat,flat,iL,oL]); back.position.z=-D/2+T/2; g.add(back);
  // roof (-y inside) and floor (+y inside)
  const roof=slab(L,T,D,[flat,flat,oLh,iLh,flat,flat]); roof.position.y=H/2-T/2; g.add(roof);
  const flr=slab(L,T,D,[flat,flat,iLh,oLh,flat,flat]); flr.position.y=-H/2+T/2; g.add(flr);
  // ends
  const endL=slab(T,H,D,[iD,oD,flat,flat,flat,flat]); endL.position.x=-L/2+T/2; g.add(endL);
  const endR=slab(T,H,D,[oD,iD,flat,flat,flat,flat]); endR.position.x=L/2-T/2; g.add(endR);
  // frame: corner posts + rails (slightly proud)
  const fr=plain(new THREE.Color(out).multiplyScalar(.9).getStyle(),.45), F=7;
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    const p=slab(F,H+1,F,fr); p.position.set(sx*(L/2-F/2+.5),0,sz*(D/2-F/2+.5)); g.add(p);
  }
  for(const sy of [-1,1]) for(const sz of [-1,1]){
    const r=slab(L+1,F,F,fr); r.position.set(0,sy*(H/2-F/2+.5),sz*(D/2-F/2+.5)); g.add(r);
  }
  for(const sx of [-1,1]) for(const sy of [-1,1]){
    const r=slab(F,F,D+1,fr); r.position.set(sx*(L/2-F/2+.5),sy*(H/2-F/2+.5),0); g.add(r);
  }
  // doors: two half-panels on the front, hinged at the outer corners
  const dW=L/2-F, dH=H-2*F;
  const doorMat=paint(out,dW);
  const mkDoor=side=>{
    const pivot=new THREE.Group(); pivot.position.set(side*(L/2-F),0,D/2-F/2);
    const panel=slab(dW,dH,T,doorMat); panel.position.set(-side*dW/2,0,0); pivot.add(panel);
    // lock bars on both faces
    const barM=plain('#d8d3cb',.4);
    for(const f of [.32,.72]){ for(const z of [-T/2-1.6]){
      const b=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,dH*.92,8),barM); b.position.set(-side*dW*f,0,z); b.castShadow=true; pivot.add(b);
    }}
    g.add(pivot); return pivot;
  };
  const doorL=mkDoor(-1), doorR=mkDoor(1);
  // label decal across the closed front
  const lt=labelTexture(def.label, def.ink, L, H);
  const label=new THREE.Mesh(new THREE.PlaneGeometry(L-2*F, H-2*F), new THREE.MeshStandardMaterial({map:lt, transparent:true, roughness:.6, metalness:0, polygonOffset:true, polygonOffsetFactor:-2}));
  label.position.z=D/2-F/2+T/2+2.2; g.add(label);

  g.traverse(o=>{ o.userData.box=def; });
  const homeP=new THREE.Vector3(def.pos[0],-def.pos[1],def.pos[2]);
  const homeQ=new THREE.Quaternion().setFromEuler(new THREE.Euler(def.rot[0],def.rot[1],def.rot[2],'XYZ'));
  g.position.copy(homeP); g.quaternion.copy(homeQ);
  Object.assign(def,{g,L,H,D,F,T,doorL,doorR,labelMesh:label,homeP,homeQ,open:0});
  scene.add(g); return def;
}

/* ---------- layout (design 1440x900 → screen) ---------- */
const V={vw:0,vh:0,k:1,tx:0,ty:0,railY:73,portrait:false,target:new THREE.Vector3(),targetS:{}};
const toWorld=(sx,sy)=>new THREE.Vector3((sx-V.tx)/V.k, -(sy-V.ty)/V.k, 0);

function layout(){
  const vw=innerWidth, vh=innerHeight; V.vw=vw; V.vh=vh;
  V.portrait = vw/vh < 1.05;
  const kL=Math.min(vw/1440, vh/900);
  const n = V.portrait ? Math.min(1, Math.max(.62, vw/560)) : Math.max(.62, kL);
  root.style.setProperty('--n', n+'px');

  // the giant word fills the width and sits on the bottom edge
  const w=document.getElementById('word');
  const fsProbe=200; w.style.fontSize=fsProbe+'px';
  const ww=w.getBoundingClientRect().width||1;
  const fs=fsProbe*(vw*1.005)/ww;
  root.style.setProperty('--wordFS', fs+'px');
  root.style.setProperty('--wordX', (-vw*.004)+'px');
  // put the baseline 35 design px above the bottom edge (mockup: cap top 711, baseline 865)
  const mc=document.createElement('canvas').getContext('2d');
  mc.font=`900 ${fs}px "Archivo X"`;
  const mt=mc.measureText("PROJECTS");
  const fA=mt.fontBoundingBoxAscent, fD=mt.fontBoundingBoxDescent, cap=mt.actualBoundingBoxAscent;
  const baseFromBoxBottom=(fs-(fA+fD))/2+fD;
  const baseGap = V.portrait ? 34*n : 35*kL;
  root.style.setProperty('--wordB', (baseGap-baseFromBoxBottom)+'px');
  root.style.setProperty('--wordH', (baseGap+cap+40)+'px');
  V.wordTop = vh-baseGap-cap;
  w.style.fontSize='';

  // design frame (1440x900) → screen
  if(!V.portrait){
    V.k=kL; V.tx=(vw-1440*V.k)/2; V.ty=vh-900*V.k;
  }else{
    // narrow screens: a tighter pile, bigger, resting on the word like the mockup
    V.k=vw/1130; V.tx=vw/2-768*V.k; V.ty=V.wordTop-716*V.k;
  }
  const k=V.k;
  root.style.setProperty('--k', k+'px');
  for(const b of CONTAINERS){
    const [x,y,z]=b.pos;
    b.homeP.set(x, -y, z);
    if(!b.dropped && state.held!==b && state.open!==b) b.g.position.copy(b.homeP);
  }

  // rail pinned just under the nav
  const railScreen = Math.max(73*k, 58*n + 15*n);
  root.style.setProperty('--rail', railScreen+'px');
  V.railY = -(railScreen-V.ty)/k;

  // camera looks at the centre of the viewport in design space
  const c=toWorld(vw/2, vh/2), h=vh/k;
  camera.aspect=vw/vh; camera.fov=20;
  const D=(h/2)/Math.tan(THREE.MathUtils.degToRad(10));
  camera.position.set(c.x, c.y+Math.sin(PITCH)*D, Math.cos(PITCH)*D);
  camera.lookAt(c); camera.near=D*.3; camera.far=D*3; camera.updateProjectionMatrix();

  sun.position.set(c.x-500, c.y+1500, 1100); sun.target.position.copy(c);
  const sc=sun.shadow.camera, ext=Math.max(vw,vh)/k*.75;
  sc.left=-ext; sc.right=ext; sc.top=ext; sc.bottom=-ext; sc.near=10; sc.far=5000; sc.updateProjectionMatrix();
  fill.position.set(c.x+900,c.y+200,900); fill.target.position.copy(c);

  floor.position.set(c.x, -742, 0);
  wall.position.x=c.x; wall.position.y=c.y;

  rail.position.set(c.x, V.railY, -10);
  const m=new THREE.Matrix4(); let i=0;
  for(let x=c.x-4500; x<c.x+4500 && i<140; x+=72, i++){ m.makeTranslation(Math.round(x/72)*72, V.railY+4, -3.5); bolts.setMatrixAt(i,m); }
  bolts.count=i; bolts.instanceMatrix.needsUpdate=true;

  // where a picked container hangs, and how big it gets
  const pileTop = toWorld(0, V.ty+372*k).y; // top of the pile (TOOL KIT)
  if(!V.portrait){
    // keep the open container tall enough for its card on short screens
    const bodyH=Math.max(218*k, Math.min(170, vh*.42))/k;
    V.fitH=bodyH; V.fitW=bodyH*2.5;
    V.target.set(c.x, V.railY-48*Math.min(1,bodyH/218)-bodyH/2, 70);
  }else{
    const gapTop=V.railY-40, gapBot=pileTop+30;
    V.target.set(c.x, (gapTop+gapBot)/2+10, 70);
    V.fitW=vw*(vw<360?.93:.86)/k; V.fitH=Math.min(V.fitW*.62, (gapTop-gapBot)*.8);
  }
  for(const b of CONTAINERS){ b.s=Math.min(V.fitW/b.L, V.fitH/b.H); }

  renderer.setSize(vw,vh,false);
  const pr=renderer.getPixelRatio();
  shadowCut.value=(vh-V.wordTop)*pr; shadowFade.value=14*pr;
  if(state.open){ placeOpen(state.open); placeCard(state.open); pillAway(state.open); }
  updateCrane();
}

/* ---------- tiny tween engine ---------- */
const tweens=[];
const E={
  outQuad:t=>1-(1-t)*(1-t), inQuad:t=>t*t, outCubic:t=>1-Math.pow(1-t,3),
  inOutQuad:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2
};
function tween(dur, fn, ease=E.outQuad){
  return new Promise(res=>{
    if(REDUCED || dur<=0){ fn(1); res(); return; }
    tweens.push({t0:performance.now(), dur:dur*1000, fn, ease, res});
  });
}
const wait=s=>REDUCED?Promise.resolve():new Promise(r=>setTimeout(r,s*1000));

/* ---------- crane state ---------- */
const state={ trolleyX:720, cableLen:118, held:null, open:null, busy:false, pending:undefined, swing:0 };
const tmp=new THREE.Vector3();
function attachPoint(b){ return b.g.localToWorld(tmp.set(0,b.H/2,0)).clone(); }
function updateCrane(){
  trolley.position.set(state.trolleyX, V.railY-6, 6);
  const topY=V.railY-TROLLEY_DROP;
  let spY;
  if(state.held){ const a=attachPoint(state.held); spY=a.y; state.trolleyX=a.x; trolley.position.x=a.x; }
  else spY=topY-state.cableLen-SPREADER_H;
  spreader.position.set(state.trolleyX, spY, 6);
  const len=Math.max(1, topY-(spY+SPREADER_H));
  cable.scale.y=len; cable.position.set(state.trolleyX, topY-len/2, 6);
  cable.visible = len>2;
}

/* ---------- open / close ---------- */
function targetQuat(){ return new THREE.Quaternion(); }
function placeOpen(b){ b.g.position.copy(V.target); b.g.quaternion.copy(targetQuat()); b.g.scale.setScalar(b.s); }
function setDoors(b,a){
  const th=THREE.MathUtils.degToRad(V.portrait?98:122)*a;
  b.doorL.rotation.y=th; b.doorR.rotation.y=-th; b.open=a;
  b.labelMesh.material.opacity=Math.max(0,1-a*8);
  b.labelMesh.visible=b.labelMesh.material.opacity>0.01;
}
function cardHTML(c){
  let h=`<div class="eb">${c.eb}</div><h2>${c.h}</h2>`;
  if(c.p) h+=`<p>${c.p}</p>`;
  if(c.chips) h+=`<div class="chips">${c.chips.map(x=>`<span>${x}</span>`).join('')}</div>`;
  if(c.mail) h+=`<a class="mail" href="mailto:${c.mail}">${c.mail}</a>`;
  return h;
}
const proj=new THREE.Vector3();
function placeCard(b){
  // interior back wall of the hanging container, projected to the screen
  const g=new THREE.Group(); g.position.copy(V.target); g.quaternion.copy(targetQuat()); g.scale.setScalar(b.s); g.updateMatrixWorld();
  const pts=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([sx,sy])=>{
    proj.set(sx*(b.L/2-b.F), sy*(b.H/2-b.F), -b.D/2+b.T).applyMatrix4(g.matrixWorld).project(camera);
    return [(proj.x*.5+.5)*V.vw, (-proj.y*.5+.5)*V.vh];
  });
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  Object.assign(cardEl.style,{left:x0+'px',top:y0+'px',width:(x1-x0)+'px',height:(y1-y0)+'px'});
  const cs=Math.min((y1-y0)/200, (x1-x0)/480);
  cardEl.style.setProperty('--c', cs+'px');
  cardEl.classList.toggle('tight', (y1-y0)<112);
}

async function pickUp(b){
  b.g.updateMatrixWorld();
  const a=attachPoint(b);
  // travel along the rail, cable stays short
  const x0=state.trolleyX, d=Math.abs(a.x-x0);
  if(d>1) await tween(.22+d/2600, t=>{ state.trolleyX=x0+(a.x-x0)*t; }, E.inOutCubic);
  // lower the cable onto the container
  const topY=V.railY-TROLLEY_DROP, L0=state.cableLen, L1=Math.max(10, topY-a.y-SPREADER_H);
  await tween(.36, t=>{ state.cableLen=L0+(L1-L0)*t; }, E.outQuad);
  await wait(.08);
  // hoist: measured 0.55 s ease-out-quad
  state.held=b;
  castShadows(b,false);
  settleDependents(b);
  const p0=b.homeP.clone(), q0=b.homeQ.clone(), q1=targetQuat();
  await tween(.55, t=>{
    b.g.position.lerpVectors(p0, V.target, t);
    b.g.quaternion.slerpQuaternions(q0, q1, t);
    b.g.scale.setScalar(1+(b.s-1)*t);
  }, E.outQuad);
  // small swing that settles while the doors open
  swingOut(b);
  await wait(.05);
  placeCard(b);
  pillAway(b);
  cardEl.innerHTML=cardHTML(b.card);
  setTimeout(()=>cardEl.classList.add('on'), REDUCED?0:150);
  await tween(.42, t=>setDoors(b,t), E.outCubic);
}
/* containers resting on others settle down when their support is lifted,
   and ride back up when it returns */
const SUPPORTS = {
  about:[['kit',{dy:90}]],
  work:[['about',{dy:194}],['kit',{dy:194}],['hello',{dy:126,drz:.3,drx:-.05}]],
};
function poseOf(d,o){
  const p=d.homeP.clone(); p.y-=o.dy;
  const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(d.rot[0]+(o.drx||0), d.rot[1], d.rot[2]+(o.drz||0),'XYZ'));
  return {p,q};
}
function settleDependents(b){
  for(const [id,o] of SUPPORTS[b.id]||[]){
    const d=CONTAINERS.find(c=>c.id===id); if(!d || d===state.held) continue;
    const {p,q}=poseOf(d,o), p0=d.g.position.clone(), q0=d.g.quaternion.clone();
    d.dropped=true;
    setTimeout(()=>{
      tween(.38, t=>{ d.g.position.lerpVectors(p0,p,t); d.g.quaternion.slerpQuaternions(q0,q,t); }, E.inQuad)
        .then(()=>tween(.18, t=>{ d.g.position.y=p.y+Math.sin(t*Math.PI)*(1-t)*4; }, t=>t));
    }, REDUCED?0:120);
  }
}
function restoreDependents(b){
  for(const [id] of SUPPORTS[b.id]||[]){
    const d=CONTAINERS.find(c=>c.id===id); if(!d || !d.dropped) continue;
    d.dropped=false;
    const p0=d.g.position.clone(), q0=d.g.quaternion.clone();
    tween(.3, t=>{ d.g.position.lerpVectors(p0,d.homeP,t); d.g.quaternion.slerpQuaternions(q0,d.homeQ,t); }, E.outQuad);
  }
}
const pillEl=document.querySelector('.pill');
/* on short screens the open container can reach the pill: hide the pill while it hangs there */
function pillAway(b){
  const was=b.open; setDoors(b,1); b.g.updateMatrixWorld(true);
  let L=1e9,R=-1e9,T=1e9,B=-1e9; const v=new THREE.Vector3();
  b.g.traverse(o=>{ if(!o.isMesh) return; o.geometry.computeBoundingBox(); const bb=o.geometry.boundingBox;
    for(const x of [bb.min.x,bb.max.x]) for(const y of [bb.min.y,bb.max.y]) for(const z of [bb.min.z,bb.max.z]){
      v.set(x,y,z); o.localToWorld(v).project(camera); const sx=(v.x*.5+.5)*V.vw, sy=(-v.y*.5+.5)*V.vh;
      L=Math.min(L,sx); R=Math.max(R,sx); T=Math.min(T,sy); B=Math.max(B,sy); } });
  setDoors(b,was);
  const p=pillEl.getBoundingClientRect();
  pillEl.classList.toggle('away', L<p.right && R>p.left && T<p.bottom && B>p.top);
}
function castShadows(b,on){ b.g.traverse(o=>{ if(o.isMesh) o.castShadow=on; }); }
function swingOut(b){
  if(REDUCED) return;
  tween(.7, t=>{ state.swing=.03*Math.sin(t*Math.PI*3)*(1-t); }, t=>t).then(()=>state.swing=0);
}
async function closeAndLower(b){
  cardEl.classList.remove('on');
  pillEl.classList.remove('away');
  await tween(.17, t=>setDoors(b,1-t), E.inQuad);
  await wait(.06);
  const p0=b.g.position.clone(), q0=b.g.quaternion.clone(), s0=b.g.scale.x;
  setTimeout(()=>restoreDependents(b), REDUCED?0:240);
  await tween(.42, t=>{
    b.g.position.lerpVectors(p0, b.homeP, t);
    b.g.quaternion.slerpQuaternions(q0, b.homeQ, t);
    b.g.scale.setScalar(s0+(1-s0)*t);
  }, E.inOutQuad);
  // little landing bounce
  await tween(.2, t=>{ b.g.position.y=b.homeP.y+Math.sin(t*Math.PI)*(1-t)*5; }, t=>t);
  b.g.position.copy(b.homeP);
  castShadows(b,true);
  state.held=null;
  const topY=V.railY-TROLLEY_DROP, L0=topY-attachPoint(b).y-SPREADER_H;
  state.cableLen=L0;
  await tween(.3, t=>{ state.cableLen=L0+(118-L0)*t; }, E.outQuad);
}
async function handle(b){
  if(state.open===b){ await closeAndLower(b); state.open=null; return; }
  if(state.open){ const o=state.open; state.open=null; await closeAndLower(o); }
  await pickUp(b); state.open=b;
}
async function request(b){
  if(state.busy){ state.pending=b; return; }
  state.busy=true;
  try{ await handle(b); } finally { state.busy=false; }
  if(state.pending!==undefined){ const p=state.pending; state.pending=undefined; if(p) request(p); }
}

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
function hit(e){
  const r=canvas.getBoundingClientRect();
  ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr,camera);
  const h=ray.intersectObjects(CONTAINERS.map(b=>b.g),true)[0];
  return h?h.object.userData.box:null;
}
canvas.addEventListener('pointermove',e=>{ canvas.style.cursor=hit(e)?'pointer':'default'; });
canvas.addEventListener('click',e=>{ const b=hit(e); if(b) request(b); });

/* keyboard access */
const menu=document.getElementById('menu');
/* ---------- boot ---------- */
await document.fonts.load('900 40px "Archivo X"');
await Promise.all([document.fonts.load('800 20px Manrope'), document.fonts.load('italic 20px "Instrument Serif"')]).catch(()=>{});
CONTAINERS.forEach(makeContainer);
CONTAINERS.forEach(b=>{
  const bt=document.createElement('button'); bt.textContent='Open '+b.label.join(' ').toLowerCase();
  bt.addEventListener('click',()=>request(b)); menu.appendChild(bt);
});
layout();
addEventListener('resize', layout);

const swingQ=new THREE.Quaternion(), zAxis=new THREE.Vector3(0,0,1);
function frame(now){
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i]; const p=Math.min(1,(now-tw.t0)/tw.dur);
    tw.fn(tw.ease(p));
    if(p>=1){ tweens.splice(i,1); tw.res(); }
  }
  if(state.open && state.held===state.open && !tweens.length && state.swing===0){
    state.open.g.quaternion.identity();
  }
  if(state.held && state.swing){ swingQ.setFromAxisAngle(zAxis,state.swing); state.held.g.quaternion.copy(targetQuat()).multiply(swingQ); }
  updateCrane();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- entrance: one timeline, once ---------- */
const rv=[...document.querySelectorAll('.rv')];
if(!REDUCED && rv[0].animate){
  rv.forEach((el,i)=>{
    const big=el.id==='word';
    el.animate([{opacity:0,transform:big?'translateY(18%)':'translateY(12px)'},{opacity:1,transform:'none'}],
      {duration:big?1100:850, delay:120+i*70, easing:'cubic-bezier(.22,1,.36,1)', fill:'backwards'});
  });
}
root.classList.add('ready');
setTimeout(()=>root.classList.add('ready'),2500);
window.__depot={CONTAINERS,request,state,V,camera,renderer,scene};
</script>
</body>
