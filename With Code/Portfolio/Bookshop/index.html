<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio: Independent Press</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ --bg:#000; --ink:#fff; --serif:"Libre Caslon Display",Georgia,serif; --sans:"Inter",system-ui,sans-serif }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* nav: a centred container from 23.3vw to 76.6vw, centre line at 6.8vh */
.nav{position:fixed;left:23.3vw;right:23.4vw;top:4.6vh;height:4.4vh;display:flex;align-items:center;z-index:5;font-size:max(11px,.78vw);font-weight:500;opacity:0}
.logo{display:flex;align-items:center;gap:.7vw}
.logo i{width:2.1vw;height:2.4vw;min-width:22px;min-height:25px;border-radius:2px;background:#b8a58a;position:relative}
.logo i::after{content:"";position:absolute;left:32%;top:18%;width:24%;height:64%;background:#16120d;border-radius:1px}
.logo b{display:grid;font:400 max(17px,1.55vw)/.95 var(--serif)}
.logo small{font:400 max(8px,.6vw)/1 var(--sans);letter-spacing:.04em;opacity:.7;margin-top:.25vw}
.links{display:flex;gap:2.3vw;margin:0 auto 0 11.4vw}
.links a{display:flex;align-items:center;gap:.35vw;opacity:.88;transition:opacity .25s}
.links a:hover,.right a:hover{opacity:1}
.links svg{width:.62vw;min-width:7px;height:.62vw;stroke:currentColor;fill:none;stroke-width:2}
.right{display:flex;align-items:center;gap:2.4vw}
.right a{opacity:.88}
.pill{background:#fff;color:#000;border-radius:.4vw;padding:.55vw 1vw;font-weight:500;opacity:1!important;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.pill:hover{transform:translateY(-1px)}

/* giant wordmark behind the books: cap top 15.4vh, about 72vw wide */
.word{--fs:min(46vh,32vw);position:fixed;left:0;right:0;top:calc(46.5vh - var(--fs) * .8);text-align:center;font:400 var(--fs)/1 var(--serif);letter-spacing:-.02em;z-index:1;pointer-events:none;opacity:0}
.foot{position:fixed;left:0;right:0;top:51.1vh;display:flex;justify-content:center;gap:2.1vw;font-size:max(10px,.74vw);font-weight:500;z-index:1;opacity:0}
.foot a{opacity:.9;transition:opacity .25s}.foot a:hover{opacity:1}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:2;display:block}

@media (max-width:760px){
  .nav{left:5vw;right:5vw;top:2.5vh}.links{display:none}.right a:not(.pill){display:none}.right{margin-left:auto}.pill{padding:8px 12px;border-radius:6px}
  .word{--fs:36vw;top:14vh}.foot{top:36vh;flex-wrap:wrap;gap:8px 14px;padding:0 8vw}
}
</style>
</head>
<body>
<nav class="nav">
  <a class="logo" href="#"><i></i><b>Folio<small>independent press</small></b></a>
  <div class="links">
    <a href="#">Books <svg viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3"/></svg></a><a href="#">Authors</a><a href="#">Journal</a><a href="#">More <svg viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3"/></svg></a>
  </div>
  <div class="right"><a href="#">Sign in</a><a class="pill" href="#">Start reading</a></div>
</nav>
<h1 class="word">Folio</h1>
<div class="foot"><a href="#">New Releases</a><a href="#">Bestsellers</a><a href="#">Fiction</a><a href="#">Nonfiction</a><a href="#">Poetry</a><a href="#">Classics</a><a href="#">Independent Voices</a><a href="#">Gift Cards</a></div>
<canvas id="c"></canvas>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const IMG = {"sheetA": "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261030_003447_7862e2d0-751c-4d7c-9c8a-e682415d908f.png&w=2336&q=90", "sheetB": "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261030_003448_95f1eed5-2ae5-4736-a53c-f3b3f87acd3b.png&w=2336&q=90"};
// cover cells on the two Higgsfield sheets: [x, y, w, h, spine colour]
const CELLS = {"A": [[6, 0, 386, 575, "#2c4f63"], [401, 0, 376, 575, "#195433"], [787, 0, 377, 575, "#c62420"], [1175, 0, 379, 575, "#f4f3ef"], [1564, 0, 377, 575, "#2d86cf"], [1949, 0, 383, 575, "#f7d547"], [6, 583, 386, 573, "#494e68"], [401, 583, 376, 573, "#f2ecde"], [787, 583, 377, 573, "#7893a3"], [1175, 583, 379, 573, "#0c0b0b"], [1564, 583, 377, 573, "#ddd0c1"], [1949, 583, 383, 573, "#013eb0"], [6, 1164, 386, 578, "#f2f1ed"], [401, 1164, 376, 578, "#0a291c"], [787, 1164, 377, 578, "#c61111"], [1175, 1164, 379, 578, "#7f7263"], [1564, 1164, 377, 578, "#ae4716"], [1949, 1164, 383, 578, "#021f42"]], "B": [[3, 2, 383, 574, "#d1cd8c"], [394, 2, 381, 574, "#000621"], [784, 2, 381, 574, "#b8acd3"], [1172, 2, 381, 574, "#e6bd7e"], [1562, 2, 381, 574, "#076368"], [1952, 2, 382, 574, "#ad8357"], [3, 586, 383, 572, "#cfa94d"], [394, 586, 381, 572, "#497f9d"], [784, 586, 381, 572, "#02878a"], [1172, 586, 381, 572, "#170402"], [1562, 586, 381, 572, "#09150b"], [1952, 586, 382, 572, "#f57664"], [3, 1167, 383, 574, "#f3f3f3"], [394, 1167, 381, 574, "#2a2929"], [784, 1167, 381, 574, "#3fb1b9"], [1172, 1167, 381, 574, "#6b1405"], [1562, 1167, 381, 574, "#ceba9f"], [1952, 1167, 382, 574, "#1c565e"]]};
const SHEET_W = 2336, SHEET_H = 1744;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .55;
const key = new THREE.DirectionalLight(0xfff3e4, 2.4); key.position.set(-4, 6, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0xbfd2ff, 1.1); rim.position.set(6, 3, -4); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, .12));

const camera = new THREE.PerspectiveCamera(30, 1, .1, 100);

// ---- book textures ----
const loader = new THREE.TextureLoader(); loader.setCrossOrigin('anonymous');
const sheets = {};
function sheet(k) {
  if (!sheets[k]) { const t = loader.load(IMG[k]); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); sheets[k] = t; }
  return sheets[k];
}
function coverTex(k, [x, y, w, h]) {
  const t = sheet(k).clone(); t.needsUpdate = true;
  const i = 3; // trim off the black gutter
  t.repeat.set((w - 2 * i) / SHEET_W, (h - 2 * i) / SHEET_H);
  t.offset.set((x + i) / SHEET_W, 1 - (y + h - i) / SHEET_H);
  return t;
}
// cream page block: fine horizontal lines with slight warmth variation
function pagesTex(vertical) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#efe7d6'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 256; i += 2) { g.fillStyle = `rgba(120,100,70,${.05 + Math.random() * .12})`; vertical ? g.fillRect(i, 0, 1, 256) : g.fillRect(0, i, 256, 1); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const pagesH = pagesTex(false), pagesV = pagesTex(true);

const W = 1, H = 1.5, D = .2;
const geo = new THREE.BoxGeometry(W, H, D);
// face order: +x fore-edge, -x spine, +y top, -y bottom, +z cover, -z back
const pageSide = new THREE.MeshStandardMaterial({ map: pagesH, roughness: .9 });
const pageTop = new THREE.MeshStandardMaterial({ map: pagesV, roughness: .9 });

// a varied order so neighbours never share a palette
const ORDER = [0, 22, 5, 30, 9, 13, 26, 2, 19, 11, 33, 7, 15, 24, 4, 28, 17, 21, 1, 31, 14, 8, 25, 35, 3, 18, 10, 29, 16, 23, 6, 34];
const books = [];
ORDER.forEach((n, i) => {
  const k = n < 18 ? 'sheetA' : 'sheetB', cell = CELLS[k === 'sheetA' ? 'A' : 'B'][n % 18];
  const spine = new THREE.Color(cell[4]).multiplyScalar(.62);
  const mats = [
    pageSide,
    new THREE.MeshPhysicalMaterial({ color: spine, roughness: .55, clearcoat: .3 }),
    pageTop, pageTop,
    new THREE.MeshPhysicalMaterial({ map: coverTex(k, cell), roughness: .42, clearcoat: .55, clearcoatRoughness: .35 }),
    new THREE.MeshPhysicalMaterial({ color: spine, roughness: .6 })
  ];
  const m = new THREE.Mesh(geo, mats);
  const g = new THREE.Group(); g.add(m); scene.add(g);
  books.push({ g, m, i, y: -3, v: 0, tz: 0, vz: 0, delay: .25 + (ORDER.length - i) * .035 });
});

// the row: book i sits further back and further left; the front book is at the bottom right
const ROW = { x0: 1.55, y: -1.12, z0: .9, dx: -.5, dz: -.2, turn: .32 };
function place() {
  books.forEach(b => { b.g.position.set(ROW.x0 + b.i * ROW.dx, ROW.y, ROW.z0 + b.i * ROW.dz); b.g.rotation.y = ROW.turn; });
}
place();

function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // keep the row framed the same way on any aspect: widen the lens on narrow screens
  camera.fov = w / h < 1 ? 40 : 19.5;
  camera.position.set(3.6, 2.15, 7.4);
  camera.lookAt(-1.4, .05, -.6);
  camera.updateProjectionMatrix();
}
resize(); addEventListener('resize', resize);

// ---- pointer wave ----
let px = -1e4, py = -1e4, active = false, last = performance.now();
addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; active = true; last = performance.now(); });
document.addEventListener('pointerleave', () => active = false);
addEventListener('blur', () => active = false);
const coarse = matchMedia('(pointer:coarse)').matches;
const v3 = new THREE.Vector3();
function influence(b, x, y) {
  v3.set(0, .1, 0).applyMatrix4(b.m.matrixWorld).project(camera);
  const sx = (v3.x + 1) / 2 * innerWidth, sy = (1 - v3.y) / 2 * innerHeight;
  const s = Math.max(innerWidth, innerHeight) * .085, d2 = ((sx - x) ** 2 + ((sy - y) * .55) ** 2) / (s * s);
  return Math.exp(-d2);
}

const t0 = performance.now(); let prev = t0;
const LIFT = .78, K = 70, C = 12.5;
function frame(now) {
  const dt = Math.min(.05, (now - prev) / 1000); prev = now;
  const t = (now - t0) / 1000;
  // on touch screens (or after a long idle) a slow virtual cursor sweeps along the row
  let x = px, y = py, on = active;
  if (coarse || (!active && now - last > 4000)) {
    const u = (Math.sin(t * .45) + 1) / 2;
    v3.set(0, 0, 0); const a = books[books.length - 3].g.position, z = books[1].g.position;
    v3.lerpVectors(a, z, u).project(camera);
    x = (v3.x + 1) / 2 * innerWidth; y = (1 - v3.y) / 2 * innerHeight; on = true;
  }
  for (const b of books) {
    const intro = t > b.delay;
    const target = intro ? (on ? LIFT * influence(b, x, y) : 0) : -3;
    // critically-damped-ish spring, sub-stepped for smoothness at any frame rate
    for (let s = 0; s < 4; s++) {
      const h = dt / 4;
      b.v += ((target - b.y) * K - b.v * C) * h; b.y += b.v * h;
      const tz = target > 0 ? target * .35 : 0;
      b.vz += ((tz - b.tz) * K - b.vz * C) * h; b.tz += b.vz * h;
    }
    b.m.position.y = b.y; b.m.position.z = b.tz;
    b.m.rotation.x = -b.v * .012;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// text in: wordmark rises out of a soft blur, nav and links follow
document.fonts.ready.then(() => {
  const ease = 'cubic-bezier(.2,.8,.2,1)';
  document.querySelector('.word').animate([{ opacity: 0, transform: 'translateY(4vh)', filter: 'blur(14px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 1400, easing: ease, fill: 'forwards', delay: 150 });
  document.querySelector('.nav').animate([{ opacity: 0, transform: 'translateY(-1.2vh)' }, { opacity: 1, transform: 'none' }], { duration: 900, easing: ease, fill: 'forwards', delay: 700 });
  document.querySelector('.foot').animate([{ opacity: 0, transform: 'translateY(1.2vh)' }, { opacity: 1, transform: 'none' }], { duration: 900, easing: ease, fill: 'forwards', delay: 850 });
});
</script>
</body>
</html>
