:root{--u:calc(100vw / 1500)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}

/* corner UI: 10u / 500 / uppercase, 80u in, 40u from top and bottom */
.ui a,.ui button{position:fixed;z-index:5;color:#fff;font:500 max(9px, calc(10*var(--u)))/1.4 "Inter Tight",sans-serif;text-transform:uppercase;text-decoration:none;background:none;border:0;cursor:pointer;letter-spacing:0;opacity:0;transition:opacity .6s ease .2s}
.ready .ui a,.ready .ui button{opacity:1}
.tl{left:calc(80*var(--u));top:calc(40*var(--u))}
.tr{right:calc(80*var(--u));top:calc(40*var(--u))}
.bl{left:calc(80*var(--u));bottom:calc(40*var(--u))}
.br{right:calc(80*var(--u));bottom:calc(40*var(--u))}
.bl span{opacity:.5}

/* loader: three dashes */
.loader{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:6px;z-index:4;transition:opacity .4s}
.loader i{display:block;width:44px;height:2px;background:#fff;animation:dash 1s ease-in-out infinite}
.loader i:nth-of-type(2){width:44px;animation-delay:.12s}
.loader i:nth-of-type(3){width:38px;animation-delay:.24s}
@keyframes dash{0%,100%{opacity:.25}50%{opacity:1}}
.ready .loader{opacity:0;pointer-events:none}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top/bottom veil over the vertical stack (phone only) */
.veil{display:none;position:fixed;inset:0;z-index:3;pointer-events:none;
  background:
    linear-gradient(to bottom,#000 0%,rgba(0,0,0,.77) 5%,rgba(0,0,0,.42) 10%,rgba(0,0,0,.14) 15%,rgba(0,0,0,.02) 20%,transparent 26%),
    linear-gradient(to top,#000 0%,rgba(0,0,0,.77) 5%,rgba(0,0,0,.42) 10%,rgba(0,0,0,.14) 15%,rgba(0,0,0,.02) 20%,transparent 26%)}

/* phone (<=649px, the reference's breakpoint): a looping vertical stack in WebGL, unit = vw/390 */
@media (max-width:649px){
  :root{--u:calc(100vw / 390)}
  .tl,.tr{top:calc(25*var(--u))}
  .bl,.br{bottom:calc(25*var(--u))}
  .tl,.bl{left:calc(40*var(--u))}
  .tr,.br{right:calc(40*var(--u))}
  .veil{display:block}
}

/* ── WebGL ribbon: a port of the reference's own shader chunks ── */
const CHUNKS = /* glsl */`
const float SHEET_PI = 3.141592653589793;
const float SHEET_BANK = -0.16;
const float SHEET_DIAG = 0.03;
const float SHEET_REAR_Y = 0.1;
const float SHEET_REAR_Z = 0.2;
const float SHEET_VTWIST = 1.8;
const float SHEET_TAIL = 1.0;
const float SHEET_SHIFT = -0.2;
uniform float u_sheetW, u_sheetD, u_sheetT, u_sheetC, u_sheetP, u_sheetV;
uniform float u_leanA, u_leanW;
uniform float u_hover, u_dent;
uniform float u_axis;   // 0 = ribbon runs along x (desktop), 1 = along y (phone stack)
uniform float u_diag;   // SHEET_DIAG on desktop, 0 on the phone stack

float sheetQ(float wx){ return wx / max(u_sheetW, 0.0001) * u_sheetT + SHEET_SHIFT; }
float sheetShape(float q){ return mix(1.0 - q*q, sin(SHEET_PI*q), u_sheetC) * exp(-SHEET_TAIL*q*q); }
float sheetShapeSlope(float q){
  float g = exp(-SHEET_TAIL*q*q);
  float bowl = -2.0*q*(1.0 + SHEET_TAIL*(1.0 - q*q));
  float ess = SHEET_PI*cos(SHEET_PI*q) - 2.0*SHEET_TAIL*q*sin(SHEET_PI*q);
  return mix(bowl, ess, u_sheetC) * g;
}
float sheetZ(float wx){ return -u_sheetD * sheetShape(sheetQ(wx)); }
float sheetRoll(float wx){
  if (u_sheetW < 0.001) return 0.0;
  return SHEET_BANK * sheetShapeSlope(sheetQ(wx)) / SHEET_PI * u_sheetC * u_sheetP;
}
vec4 sheetWind(vec4 w){
  float a = sheetRoll(w.x);
  if (u_sheetV > 0.001 && u_sheetW > 0.001 && u_sheetP > 0.001){
    float qe = w.x / u_sheetW;
    a += SHEET_VTWIST * u_sheetV * smoothstep(0.3, 0.9, abs(qe)) * sign(qe) * u_sheetP;
  }
  if (abs(a) < 0.0001) return w;
  float s = sin(a), c = cos(a);
  return vec4(w.x, w.y*c - w.z*s, w.y*s + w.z*c, w.w);
}
vec4 sheet(vec4 w){
  w = sheetWind(w);
  w.z += sheetZ(w.x) * u_sheetP;
  if (u_sheetW > 0.001){
    float qw = w.x / u_sheetW;
    w.y += u_diag * w.x * u_sheetP;
    if (u_sheetV > 0.001){
      float m = 1.0 - smoothstep(-1.0, 0.3, qw);
      w.y += SHEET_REAR_Y * u_sheetW * u_sheetV * m * u_sheetP;
      w.z += SHEET_REAR_Z * u_sheetW * u_sheetV * m * u_sheetP;
    }
  }
  return w;
}
float leanRamp(float s){ s = clamp(s, -1.0, 1.0); return s * (1.5 - 0.5*s*s); }
float leanSlope(float s){ s = min(abs(s), 1.0); return 1.5 * (1.0 - s*s); }
vec4 lean(vec4 w, float k){
  if (u_leanW > 0.001 && k > 0.001) w.z += u_leanA * leanRamp(w.x / u_leanW) * k;
  return w;
}
float sheetDome(vec2 uv){ vec2 q = uv*2.0 - 1.0; return (1.0 - q.x*q.x) * (1.0 - q.y*q.y); }
float sheetShade(float wx, vec2 uv, float resY){
  if (u_sheetD < 0.001) return 0.0;
  float d = clamp((u_sheetD - sheetZ(wx)) / (2.0*u_sheetD), 0.0, 1.0) * u_sheetP;
  if (u_hover > 0.0001) d += (u_hover * u_dent * resY * sheetDome(uv)) / (2.0*u_sheetD);
  return clamp(d, 0.0, 1.0);
}
float sheetOffset(float wx, vec2 uv, float resY){
  float z = sheetZ(wx) * u_sheetP;
  if (u_leanW > 0.001) z += u_leanA * leanRamp(wx / u_leanW) * u_sheetP;
  if (u_hover > 0.0001) z -= u_hover * u_dent * resY * sheetDome(uv);
  return z;
}
vec3 sheetNormal(float wx, vec2 uv, vec2 res){
  float dzdx = -u_sheetD * sheetShapeSlope(sheetQ(wx)) * u_sheetT / u_sheetW * u_sheetP;
  float dzdy = 0.0;
  if (u_leanW > 0.001) dzdx += (u_leanA / u_leanW) * leanSlope(wx / u_leanW) * u_sheetP;
  if (u_hover > 0.0001){

const CARD_VS = `
uniform vec2 u_res;

const CARD_FS = `
uniform sampler2D u_texture;  // the media: preview image, then the preview video
uniform sampler2D u_overlay;  // caption + pill, transparent

const FLOOR_VS = `

varying vec2 vUv;

const FLOOR_FS = `
uniform vec3 u_c0, u_c1;
uniform float u_alpha, u_grid;
uniform vec2 u_gridF;

/* ── Layout (the reference's DOM row: h = 43.5svh, gap 10u, radius 20u) ── */

/* media: the preview image first, swapped for the preview video once it has a frame */

}
// cover crop of the media into the card's shape, as UV offset + scale

/* ── Virtual scroll (the reference's input mapping) ── */

/* ── Hover: the card dents in ── */

    u.u_sheetW.value = SW; u.u_sheetD.value = D; u.u_sheetV.value = small ? 0 : r; u.u_leanA.value = A; u.u_leanW.value = small ? 0 : W;
    c.hoverT = c === hovered ? 1 : 0;
    c.hover += (c.hoverT - c.hover) * (1 - Math.exp(-(c.hoverT ? 8 : 6) * dt));
    u.u_hover.value = reduce ? 0 : c.hover;
    if (loaded && c.tex) u.u_alpha.value = Math.min(1, u.u_alpha.value + dt / 0.6);
  }
  canvas.style.cursor = hovered ? 'pointer' : '';

  // floor under the strip
  const fu = floorMat.uniforms;
  const a = -cardH * k / 2 - H * FLOOR.drop, o = H * FLOOR.run, l = camera.position.z;
  const near = Math.min(l * (1 - Math.abs(a) / H) + H * FLOOR.lip, l * 0.8), depth = near + o, wide = W * 2 * FLOOR.wide;
  floor.scale.set(wide, 1, depth); floor.position.set(0, a, (near - o) / 2);
  const cell = H * FLOOR.cell;
  fu.u_gridF.value.set(wide / cell, o / cell); fu.u_run.value = o;
  fu.u_leanA.value = A; fu.u_leanW.value = W;
  if (loaded) fu.u_alpha.value = Math.min(FLOOR.alpha, fu.u_alpha.value + dt / 0.8);

  // mirrored camera for the grid-line reflection
  const m = a - H * FLOOR.reflGap;
  reflCam.fov = camera.fov; reflCam.aspect = camera.aspect; reflCam.near = camera.near; reflCam.far = camera.far; reflCam.updateProjectionMatrix();
  reflCam.position.set(camera.position.x, 2 * m - camera.position.y, camera.position.z); reflCam.updateMatrixWorld();
  fu.u_reflVP.value.copy(reflCam.matrixWorld).invert().premultiply(reflCam.projectionMatrix);
  fu.u_reflLX.value = -W * FLOOR.reflLight;

  if (!small) {
    floor.visible = false;
    renderer.setRenderTarget(reflRT); renderer.render(scene, reflCam);
    renderer.setRenderTarget(null); floor.visible = true;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ── Boot ── */
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.decoding = 'async'; i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
layout();
addEventListener('resize', () => { clearTimeout(layout.t); layout.t = setTimeout(layout, 100); });
requestAnimationFrame(frame);
const fail = setTimeout(() => document.body.classList.add('ready'), 8000); // failsafe
Promise.all([document.fonts.load('400 18px "Inter Tight"'), ...CARDS.map(c => loadImg(c.src))]).then(([, ...im]) => {
  imgs.push(...im);
  cards.forEach((c, i) => initMedia(c, im[i]));
  cards.forEach(paint);
  loaded = true; clearTimeout(fail);
  document.body.classList.add('ready');
}).catch(() => document.body.classList.add('ready'));
// resume visible videos when the tab comes back (browsers pause hidden ones)
document.addEventListener('visibilitychange', () => { if (document.hidden) cards.forEach(c => c.video && c.video.pause()); });
window.__hero = { cards, get current() { return current; }, set target(v) { target = v; current = v; } };
</script>
