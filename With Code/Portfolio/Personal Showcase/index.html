<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcus — Bennet</title>
<link rel="stylesheet" href="https://db.onlinewebfonts.com/c/95cecf452d3208890088a5b4c19c7ecf?family=Helvetica+Neue+ME" media="print" onload="this.media='all'">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#efeee9;--ease:cubic-bezier(0.76,0,0.24,1)}
html,body{height:100%;background:#9a9a9a}
body{font-family:'Helvetica Neue ME',Helvetica,Arial,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
ul{list-style:none}
.hero{position:relative;height:100vh;height:100dvh;width:100%;overflow:hidden;background:#9a9a9a}
.img{position:absolute;inset:0;height:100%;width:100%;object-fit:cover}
.bg{animation:fadeIn 1.2s ease-out both}
.front{z-index:20;pointer-events:none;animation:riseIn 1.4s cubic-bezier(0.22,1,0.36,1) 300ms both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes riseIn{from{opacity:0;transform:translateY(4vh) scale(1.03)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.up{animation:fadeUp .9s cubic-bezier(0.22,1,0.36,1) both}
header{position:absolute;inset:0 0 auto 0;z-index:30;display:flex;align-items:flex-start;justify-content:space-between;padding:24px 24px 0}
.brand{font-size:18px;letter-spacing:.025em;line-height:28px}
.right{display:none;align-items:flex-start;gap:64px;font-size:14px;line-height:24px}
.right ul{display:flex;flex-direction:column;gap:2px}
.right a{transition:opacity .3s}
.right a:hover{opacity:.6}
.marq{position:absolute;inset-inline:0;top:16vh;z-index:10;overflow:hidden;animation:fadeUp .9s cubic-bezier(0.22,1,0.36,1) 500ms both}
.track{display:flex;width:max-content;white-space:nowrap;font-size:16vh;line-height:1;color:var(--cream);animation:marquee 30s linear infinite}
.track span{padding-right:6vw}
.rule{position:absolute;left:24px;right:24px;bottom:5.5rem;z-index:10;height:2px;background:var(--cream);transform-origin:left;animation:line 1.1s var(--ease) 1200ms both}
footer{position:absolute;inset:auto 0 0 0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 20px;font-size:12px;line-height:1.625;z-index:30}
.fr{text-align:right}
.burger{position:absolute;right:24px;top:24px;z-index:50;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:0;cursor:pointer;margin:-8px -8px 0 0;animation:fadeUp .9s cubic-bezier(0.22,1,0.36,1) 900ms both}
.bars{position:relative;width:24px;height:16px;display:block}
.bars i{position:absolute;left:0;width:24px;height:1.5px;background:var(--cream);transition:transform .5s var(--ease),opacity .3s}
.bars i:nth-child(1){top:0}.bars i:nth-child(2){top:7px}.bars i:nth-child(3){top:14px}
.open .bars i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.open .bars i:nth-child(2){opacity:0}
.open .bars i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.back{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .5s}
.open ~ .back,.back.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:80%;max-width:24rem;z-index:41;background:#141414;padding:40px 32px;transform:translateX(100%);transition:transform .6s var(--ease);display:flex;flex-direction:column;gap:40px;overflow:auto}
.panel.on{transform:none}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:.2em;color:rgba(239,238,233,.5);margin-bottom:16px}
.rev{opacity:0;transform:translateY(24px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.on .rev{opacity:1;transform:none}
.panel nav a{display:block;font-size:36px;line-height:1.25}
.panel .soc{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px}
.closeb{position:absolute;right:24px;top:24px;transform:rotate(90deg);opacity:0;transition:transform .5s var(--ease),opacity .4s;background:none;border:0;color:var(--cream);cursor:pointer;line-height:0}
.on .closeb{transform:none;opacity:1;transition-delay:300ms}
@media(min-width:640px){
 header{padding:32px 40px 0}
 .right{display:flex}
 .burger,.panel,.back{display:none}
 .marq{top:14vh}.track{font-size:26vh}
 .rule{left:40px;right:40px;bottom:7rem}
 footer{padding:0 40px 32px;font-size:14px;z-index:10}
}
@media(min-width:1024px){.right{gap:96px}}
@media(prefers-reduced-motion:reduce){
 .bg,.front,.up,.marq,.rule,.burger{animation-duration:.01ms!important;animation-delay:0s!important}
 .track{animation-duration:.01ms!important}
}
</style>
</head>
<body>
<section class="hero" id="hero">
 <img class="img bg" alt="" src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260729_022513_486985a2-ac8c-4278-91a8-071dcd9fcaff.png&w=1280&q=85">
 <div class="marq"><div class="track"><span>Marcus &mdash; Bennet&nbsp;</span><span>Marcus &mdash; Bennet&nbsp;</span></div></div>
 <div class="rule"></div>
 <footer>
  <div class="up" style="animation-delay:1400ms">Visuals Composer<br>Digital Crafter<br>Obsessed by The Office</div>
  <div class="fr up" style="animation-delay:1550ms">A homage to<br>Marcus Holloway</div>
 </footer>
 <img class="img front" alt="Portrait" src="https://stone-expand-60400629.figma.site/_assets/v11/8da570354e86aa0d44ac3e4aa335a72c8e750d68.png">
 <header>
  <a class="brand up" href="#" style="animation-delay:800ms">Marcus</a>
  <div class="right">
   <span class="up" style="animation-delay:900ms">2025</span>
   <ul>
    <li class="up" style="animation-delay:1000ms"><a href="#">Story</a></li>
    <li class="up" style="animation-delay:1080ms"><a href="#">Jobs</a></li>
    <li class="up" style="animation-delay:1160ms"><a href="#">Message</a></li>
   </ul>
   <ul>
    <li class="up" style="animation-delay:1150ms"><a href="#">Instagram</a></li>
    <li class="up" style="animation-delay:1230ms"><a href="#">TikTok</a></li>
    <li class="up" style="animation-delay:1310ms"><a href="#">YouTube</a></li>
   </ul>
  </div>
 </header>
 <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span class="bars"><i></i><i></i><i></i></span></button>
 <div class="back" id="back"></div>
 <aside class="panel" id="panel" aria-hidden="true">
  <button class="closeb" id="close" aria-label="Close"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <div>
   <p class="lab rev" style="transition-delay:250ms">Site Index</p>
   <nav>
    <a class="rev" style="transition-delay:300ms" href="#">Story</a>
    <a class="rev" style="transition-delay:380ms" href="#">Jobs</a>
    <a class="rev" style="transition-delay:460ms" href="#">Message</a>
   </nav>
  </div>
  <div>
   <p class="lab rev" style="transition-delay:500ms">Find Me</p>
   <div class="soc">
    <a class="rev" style="transition-delay:550ms" href="#">Instagram</a>
    <a class="rev" style="transition-delay:610ms" href="#">TikTok</a>
    <a class="rev" style="transition-delay:670ms" href="#">YouTube</a>
   </div>
  </div>
 </aside>
</section>
<script>
(function(){
 var b=document.getElementById('burger'),p=document.getElementById('panel'),k=document.getElementById('back'),c=document.getElementById('close');
 function set(o){
  b.classList.toggle('open',o);p.classList.toggle('on',o);k.classList.toggle('on',o);
  b.setAttribute('aria-expanded',o);p.setAttribute('aria-hidden',!o);
  document.body.style.overflow=o?'hidden':'';
 }
 b.addEventListener('click',function(){set(!p.classList.contains('on'))});
 k.addEventListener('click',function(){set(false)});
 c.addEventListener('click',function(){set(false)});
 window.addEventListener('resize',function(){if(innerWidth>=640)set(false)});
})();
</script>
</body>
</html>
