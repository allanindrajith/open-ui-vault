<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mina — 3D Creator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background-color: #0C0C0C; font-family: 'Kanit', sans-serif; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }

    /* Gradient text utility */
    .hero-heading {
      background: linear-gradient(180deg, #646973 0%, #BBCCD7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* FadeIn animation */
    .fade-in {
      opacity: 0;
      transform: translateY(var(--fade-y, 30px)) translateX(var(--fade-x, 0px));
      transition: opacity 0.7s cubic-bezier(0.25, 0.1, 0.25, 1), transform 0.7s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0) translateX(0);
    }

    /* ===== HERO SECTION ===== */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: clip;
    }
    .hero-inner {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 0 10px;
      position: relative;
      z-index: 0;
    }

    /* Navbar */
    .navbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 24px 0;
    }
    .navbar a {
      color: #D7E2EA;
      font-size: 0.875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }
    .navbar a:hover { opacity: 0.7; }

    /* Hero heading */
    .hero-title-wrap { margin-top: 24px; overflow: hidden; }
    .hero-title {
      font-weight: 900;
      text-transform: uppercase;
      line-height: 0.85;
      letter-spacing: -0.02em;
      white-space: nowrap;
      width: 100%;
      font-size: 14vw;
    }

    /* Hero bottom */
    .hero-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 28px;
      padding-left: 24px;
      padding-right: 24px;
    }
    .hero-tagline {
      color: #D7E2EA;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      line-height: 1.4;
      max-width: 160px;
      font-size: clamp(0.75rem, 1.4vw, 1.5rem);
    }

    /* Contact Button */
    .contact-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      padding: 12px 32px;
      color: white;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.75rem;
      white-space: nowrap;
      background: linear-gradient(123deg, #18011F 7%, #B600A8 37%, #7621B0 72%, #BE4C00 100%);
      box-shadow: 0px 4px 4px rgba(181, 1, 167, 0.25), 4px 4px 12px #7721B1 inset;
      outline: 2px solid #E3E3E3;
      outline-offset: -3px;
      transition: opacity 0.2s;
    }
    .contact-btn:hover { opacity: 0.9; }
    .contact-btn:active { opacity: 0.75; }

    /* Hero portrait with magnet */
    .hero-portrait-wrap {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 400px;
      top: 50%;
      transform: translate(-50%, -50%);
      touch-action: pan-y;
    }
    .hero-portrait-inner {
      transition: transform 0.6s ease-in-out;
      will-change: transform;
    }
    .hero-portrait-inner { position: relative; }
    .hero-portrait-inner img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    #faceGl { position: absolute; left: -35%; top: -35%; width: 170%; height: 170%; pointer-events: none; }
    #faceProps { position: absolute; inset: 0; pointer-events: none; }
    #faceFly, #faceHand { position: absolute; opacity: 0; transition: opacity .2s; transform: translate(-50%, -50%); }
    #faceFly { width: 6%; fill: #111; }
    #faceFly .wing { fill: rgba(220, 235, 255, .7); transform-origin: 16px 15px; animation: flap .05s linear infinite alternate; }
    #faceFly .wing.r { animation-direction: alternate-reverse; }
    @keyframes flap { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
    #faceHand { width: 11%; fill: #fff; stroke: #0c0c0c; stroke-width: 1.4; stroke-linejoin: round; }
    #faceHand .grab { display: none; }
    #faceHand.shut .open { display: none; }
    #faceHand.shut .grab { display: block; }

    /* ===== MARQUEE SECTION ===== */
    .marquee-section {
      width: 100%;
      overflow: hidden;
      padding-top: 96px;
      padding-bottom: 40px;
      background-color: #0C0C0C;
    }
    .marquee-rows { display: flex; flex-direction: column; gap: 12px; }
    .marquee-row {
      display: flex;
      gap: 12px;
      will-change: transform;
      overflow: visible;
    }
    .marquee-tile {
      flex-shrink: 0;
      width: 420px;
      height: 270px;
      border-radius: 16px;
      overflow: hidden;
    }
    .marquee-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ===== ABOUT SECTION ===== */
    .about-section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      position: relative;
    }
    .about-decor {
      position: absolute;
      z-index: 0;
    }
    .about-decor img { width: 100%; height: auto; }
    .about-decor.top-left { top: 4%; left: 1%; width: 120px; }
    .about-decor.bottom-left { bottom: 8%; left: 3%; width: 100px; }
    .about-decor.top-right { top: 4%; right: 1%; width: 120px; }
    .about-decor.bottom-right { bottom: 8%; right: 3%; width: 130px; }

    .about-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 64px;
      max-width: 896px;
      width: 100%;
      position: relative;
      z-index: 10;
    }
    .about-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      width: 100%;
    }
    .about-heading {
      font-weight: 900;
      text-transform: uppercase;
      line-height: 0.85;
      letter-spacing: -0.02em;
      text-align: center;
      width: 100%;
      font-size: clamp(3rem, 12vw, 160px);
    }
    .about-text {
      color: #D7E2EA;
      font-weight: 500;
      text-align: center;
      line-height: 1.7;
      max-width: 560px;
      font-size: clamp(1rem, 2vw, 1.35rem);
    }
    .about-text .char {
      position: relative;
      display: inline-block;
    }
    .about-text .char-placeholder {
      visibility: hidden;
      font-weight: 500;
    }
    .about-text .char-visible {
      position: absolute;
      inset: 0;
      font-weight: 500;
      color: #D7E2EA;
      opacity: 0.2;
      transition: opacity 0.1s;
    }

    /* ===== SERVICES SECTION ===== */
    .services-section {
      display: flex;
      flex-direction: column;
      padding: 80px 20px;
      border-radius: 40px 40px 0 0;
      background-color: #FFFFFF;
    }
    .services-heading {
      font-weight: 900;
      text-transform: uppercase;
      line-height: 0.85;
      letter-spacing: -0.02em;
      text-align: center;
      width: 100%;
      margin-bottom: 64px;
      font-size: clamp(3rem, 12vw, 160px);
      color: #0C0C0C;
    }
    .services-list {
      display: flex;
      flex-direction: column;
      width: 100%;
      align-items: center;
    }
    .service-item-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1024px;
    }
    .service-divider {
      width: 100%;
      border-top: 1px solid rgba(12, 12, 12, 0.15);
    }
    .service-item {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      padding: 32px 0;
      width: 100%;
    }
    .service-number {
      font-weight: 900;
      text-transform: uppercase;
      line-height: 0.85;
      flex-shrink: 0;
      font-size: clamp(3rem, 10vw, 140px);
      color: #0C0C0C;
    }
    .service-info { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
    .service-name {
      font-weight: 500;
      text-transform: uppercase;
      font-size: clamp(1rem, 2.2vw, 2.1rem);
      color: #0C0C0C;
    }
    .service-desc {
      font-weight: 300;
      line-height: 1.7;
      max-width: 672px;
      font-size: clamp(0.85rem, 1.6vw, 1.25rem);
      color: #0C0C0C;
      opacity: 0.6;
    }

    /* ===== PROJECTS SECTION ===== */
    .projects-section {
      position: relative;
      padding: 0 20px;
      border-radius: 40px 40px 0 0;
      margin-top: -40px;
      z-index: 10;
      background-color: #0C0C0C;
    }
    .projects-heading-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 0;
    }
    .projects-heading {
      font-weight: 900;
      text-transform: uppercase;
      line-height: 0.85;
      letter-spacing: -0.02em;
      text-align: center;
      width: 100%;
      font-size: clamp(3rem, 12vw, 160px);
    }
    .project-card-container {
      height: 85vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      position: sticky;
      top: 96px;
    }
    .project-card {
      position: absolute;
      width: 100%;
      max-width: 1760px;
      border-radius: 40px;
      border: 2px solid #D7E2EA;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      background-color: #0C0C0C;
      transform-origin: top center;
      will-change: transform;
    }
    .project-card-header {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .project-card-meta {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .project-card-number {
      color: #D7E2EA;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 0.85;
      font-size: clamp(3rem, 10vw, 140px);
    }
    .project-card-info { display: flex; flex-direction: column; gap: 8px; }
    .project-card-category {
      color: #D7E2EA;
      font-weight: 500;
      text-transform: uppercase;
      font-size: clamp(1rem, 2.2vw, 2.1rem);
    }
    .project-card-name {
      color: #D7E2EA;
      font-weight: 300;
      letter-spacing: 0.05em;
      font-size: clamp(0.9rem, 2vw, 2rem);
    }
    .live-project-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      border: 2px solid #D7E2EA;
      padding: 12px 32px;
      color: #D7E2EA;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.875rem;
      white-space: nowrap;
      transition: background-color 0.2s;
      align-self: flex-start;
    }
    .live-project-btn:hover { background-color: rgba(215, 226, 234, 0.1); }

    .project-card-images {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }
    .project-card-col1 {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }
    .project-card-col1 img {
      width: 100%;
      object-fit: cover;
      border-radius: 30px;
    }
    .project-card-col1 img:first-child { height: clamp(130px, 16vw, 230px); }
    .project-card-col1 img:last-child { height: clamp(160px, 22vw, 340px); }
    .project-card-col2 {
      width: 100%;
    }
    .project-card-col2 img {
      width: 100%;
      object-fit: cover;
      border-radius: 30px;
      height: 300px;
    }

    /* ===== RESPONSIVE ===== */
    @media (min-width: 640px) {
      .navbar { padding: 24px 24px 0; }
      .navbar a { font-size: 1rem; }
      .hero-title-wrap { margin-top: 16px; }
      .hero-title { font-size: 15vw; }
      .hero-bottom { padding-bottom: 32px; }
      .hero-tagline { max-width: 220px; }
      .hero-portrait-wrap {
        width: 500px;
      }
      .contact-btn { padding: 14px 40px; font-size: 0.875rem; }
      .marquee-section { padding-top: 128px; }
      .about-section { padding: 80px 32px; }
      .about-decor.top-left { width: 160px; left: 2%; }
      .about-decor.bottom-left { width: 140px; left: 6%; }
      .about-decor.top-right { width: 160px; right: 2%; }
      .about-decor.bottom-right { width: 170px; right: 6%; }
      .about-content { gap: 80px; }
      .about-inner { gap: 56px; }
      .services-section { padding: 96px 32px; border-radius: 50px 50px 0 0; }
      .services-heading { margin-bottom: 80px; }
      .service-item { gap: 32px; padding: 40px 0; }
      .service-info { gap: 16px; }
      .projects-section { padding: 0 32px; border-radius: 50px 50px 0 0; margin-top: -48px; }
      .projects-heading-wrap { padding: 96px 0; }
      .project-card { border-radius: 50px; padding: 24px; gap: 32px; }
      .project-card-header { flex-direction: row; align-items: center; justify-content: space-between; }
      .project-card-meta { gap: 32px; }
      .project-card-info { gap: 16px; }
      .live-project-btn { padding: 14px 40px; }
    }

    @media (min-width: 768px) {
      .navbar { padding: 32px 40px 0; }
      .navbar a { font-size: 1.4rem; }
      .hero-inner { padding: 0 40px; }
      .hero-title-wrap { margin-top: -20px; }
      .hero-title { font-size: 16vw; }
      .hero-bottom { padding-bottom: 40px; padding-left: 40px; padding-right: 40px; }
      .hero-tagline { max-width: 260px; }
      .hero-portrait-wrap { width: 600px; }
      .contact-btn { padding: 16px 48px; font-size: 1rem; }
      .marquee-section { padding-top: 160px; }
      .about-section { padding: 80px 40px; }
      .about-decor.top-left { width: 210px; left: 4%; }
      .about-decor.bottom-left { width: 180px; left: 10%; }
      .about-decor.top-right { width: 210px; right: 4%; }
      .about-decor.bottom-right { width: 220px; right: 10%; }
      .about-content { gap: 96px; }
      .about-inner { gap: 64px; }
      .services-section { padding: 128px 40px; border-radius: 60px 60px 0 0; }
      .services-heading { margin-bottom: 112px; }
      .service-item { gap: 40px; padding: 48px 0; }
      .service-info { gap: 20px; }
      .projects-section { padding: 0 40px; border-radius: 60px 60px 0 0; margin-top: -56px; }
      .projects-heading-wrap { padding: 128px 0; }
      .project-card { border-radius: 60px; padding: 32px; gap: 40px; }
      .project-card-container { top: 128px; }
      .project-card-meta { gap: 40px; }
      .project-card-info { gap: 24px; }
      .project-card-images { flex-direction: row; gap: 20px; }
      .project-card-col1 { width: 40%; gap: 20px; }
      .project-card-col2 { width: 60%; }
      .project-card-col2 img { height: 100%; border-radius: 60px; }
      .project-card-col1 img { border-radius: 60px; }
    }

    @media (min-width: 1024px) {
      .hero-title { font-size: 17.5vw; }
      .hero-portrait-wrap { width: clamp(640px, 78vh, 46vw); }
    }
  </style>
</head>
<body>
  <main style="background-color: #0C0C0C; overflow-x: clip;">

    <!-- ===== HERO SECTION ===== -->
    <section class="hero">
      <div class="hero-inner">
        <div class="fade-in" style="--fade-y: -20px;" data-delay="0">
          <nav class="navbar">
            <a href="#about">About</a>
            <a href="#price">Price</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
          </nav>
        </div>

        <div class="hero-title-wrap fade-in" style="--fade-y: 40px;" data-delay="150">
          <h1 class="hero-title hero-heading">Hi, i'm mina</h1>
        </div>

        <div style="flex: 1;"></div>

        <div class="hero-bottom">
          <div class="fade-in" style="--fade-y: 20px;" data-delay="350">
            <p class="hero-tagline">a 3d creator driven by crafting striking and unforgettable projects</p>
          </div>
          <div class="fade-in" style="--fade-y: 20px;" data-delay="500">
            <a href="#contact" class="contact-btn">Contact Me</a>
          </div>
        </div>
      </div>

      <div class="hero-portrait-wrap" id="magnetWrap">
        <div class="hero-portrait-inner fade-in" id="magnetInner" style="--fade-y: 30px;" data-delay="600">
          <img id="faceFallback" src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261031_040619_2f6f349e-a4a7-40db-8e9b-03b6acd8b99a.png&w=1024&q=92" alt="Portrait" />
          <canvas id="faceGl" aria-hidden="true"></canvas>
          <div id="faceProps" aria-hidden="true">
            <svg id="faceFly" viewBox="0 0 32 32"><path class="wing" d="M15 15C12 9.500 4.500 8.500 2 13c2.500 4.500 10 4.500 13 2z"/><path class="wing r" d="M17 15c3-5.500 10.500-6.500 13-2-2.500 4.500-10 4.500-13 2z"/><ellipse cx="16" cy="19.500" rx="4" ry="6.500"/><circle cx="16" cy="11.500" r="3.300"/></svg>
            <svg id="faceHand" viewBox="0 0 32 32"><path class="open" d="M10.500 16.500V8.200a1.800 1.800 0 0 1 3.600 0V14v-8a1.800 1.800 0 0 1 3.600 0V14 7a1.800 1.800 0 0 1 3.600 0v8-5a1.800 1.800 0 0 1 3.600 0v10.500c0 5-3.400 8.500-8.400 8.500-3.600 0-5.700-1.600-7.600-4.600l-3.500-5.600c-.6-1 .1-2.200 1.200-2.400 1-.2 1.900.2 2.600 1z"/><path class="grab" d="M10.500 17v-3.300a1.800 1.800 0 0 1 3.600 0V14v-1.800a1.800 1.800 0 0 1 3.600 0V14v-1.300a1.800 1.800 0 0 1 3.600 0V14v-.3a1.800 1.800 0 0 1 3.600 0v6.800c0 5-3.400 8.500-8.400 8.500-3.600 0-5.700-1.600-7.600-4.600l-2.300-3.700c-.6-1 .1-2.200 1.200-2.400 1-.2 1.900.2 2.700 1z"/></svg>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== MARQUEE SECTION ===== -->
    <section class="marquee-section" id="marqueeSection">
      <div class="marquee-rows">
        <div style="overflow: hidden; width: 100%;">
          <div class="marquee-row" id="marqueeRow1" style="transform: translateX(-200px);"></div>
        </div>
        <div style="overflow: hidden; width: 100%;">
          <div class="marquee-row" id="marqueeRow2" style="transform: translateX(200px);"></div>
        </div>
      </div>
    </section>

    <!-- ===== ABOUT SECTION ===== -->
    <section class="about-section" id="about">
      <div class="about-decor top-left fade-in" style="--fade-x: -80px; --fade-y: 0px;" data-delay="100">
        <img src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/moon_icon.11395d36.png" alt="Moon icon" />
      </div>
      <div class="about-decor bottom-left fade-in" style="--fade-x: -80px; --fade-y: 0px;" data-delay="250">
        <img src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/p59_1.4659672e.png" alt="3D object" />
      </div>
      <div class="about-decor top-right fade-in" style="--fade-x: 80px; --fade-y: 0px;" data-delay="150">
        <img src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/lego_icon-1.703bb594.png" alt="Lego icon" />
      </div>
      <div class="about-decor bottom-right fade-in" style="--fade-x: 80px; --fade-y: 0px;" data-delay="300">
        <img src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/Group_134-1.2e04f3ce.png" alt="3D group" />
      </div>

      <div class="about-content">
        <div class="about-inner">
          <div class="fade-in" style="--fade-y: 40px;" data-delay="0">
            <h2 class="about-heading hero-heading">About me</h2>
          </div>
          <p class="about-text" id="animatedText"></p>
        </div>
        <div class="fade-in" style="--fade-y: 20px;" data-delay="300">
          <a href="#contact" class="contact-btn">Contact Me</a>
        </div>
      </div>
    </section>

    <!-- ===== SERVICES SECTION ===== -->
    <section class="services-section" id="services">
      <div class="fade-in" style="--fade-y: 40px;" data-delay="0">
        <h2 class="services-heading">Services</h2>
      </div>
      <div class="services-list" id="servicesList"></div>
    </section>

    <!-- ===== PROJECTS SECTION ===== -->
    <section class="projects-section" id="projects">
      <div class="projects-heading-wrap">
        <div class="fade-in" style="--fade-y: 40px;" data-delay="0">
          <h2 class="projects-heading hero-heading">Project</h2>
        </div>
      </div>
      <div id="projectCards"></div>
    </section>

  </main>

  <script>
    // ===== DATA =====

        const ty = (pressed || handHeld ? (brush ? brush.py * .16 : 0) : awake ? (pv - .46) * .008 : 0) + wantLean[1] + Math.sin(now * .0013) * .0022;
        lvX += ((tx - leanX) * 70 - lvX * 8) * dt; lvY += ((ty - leanY) * 70 - lvY * 8) * dt;
        leanX += lvX * dt; leanY += lvY * dt;

        // skin
        simLeft += dt;
        let steps = 0;
        while (simLeft >= H && steps < 9) { step(H); simLeft -= H; steps++; }
        if (steps === 9) simLeft = 0;
        for (let j = 0; j < M; j++) for (let i = 0; i < M; i++) {
          const k = j * M + i, edge = i === 0 || j === 0 || i === N || j === N;
          sx[k] = edge ? ux[k] : (ux[k] * 4 + ux[k - 1] + ux[k + 1] + ux[k - M] + ux[k + M]) / 8;
          sy[k] = edge ? uy[k] : (uy[k] * 4 + uy[k - 1] + uy[k + 1] + uy[k - M] + uy[k + M]) / 8;
        }
        untangle();
        for (let k = 0, o = 0; k < count; k++) {
          dyn[o++] = sx[k]; dyn[o++] = sy[k];
          const r = k % M, c = k / M | 0;
          let sh = 1;
          if (r > 0 && r < N && c > 0 && c < N) sh = Math.max(.86, Math.min(1.16, 1 - ((sx[k + 1] - sx[k - 1]) + (sy[k + M] - sy[k - M])) * 1.8));
          dyn[o++] = sh;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, dynBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, dyn);

        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex[faceA] || tex.rest);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tex[faceB] || tex.rest);
        gl.uniform1f(U.fade, Math.min(1, (now - fadeT) / fadeMs));
        gl.uniform2f(U.lean, leanX, leanY);
        gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
      }

      (async () => {
        const base = await load('rest');
        if (!base) return;
        upload('rest', base); hitMap(base);
        document.getElementById('faceFallback').style.visibility = 'hidden';
        ready = true; tStart = performance.now(); requestAnimationFrame(frame);
        const take = async n => { const img = await load(n); if (img) upload(n, img); };
        await take('closed'); await take('half');
        const names = Object.keys(IDS).filter(n => !['rest', 'closed', 'half'].includes(n));
        let i = 0;
        await Promise.all(Array.from({length: 6}, async () => { while (i < names.length) await take(names[i++]); }));
      })();
    })();
  </script>
