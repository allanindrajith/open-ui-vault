:root{--bg:#ffffff;--ink:#111111;--label:#6b6b63;--tile-bg:#e8e2d4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{-webkit-font-smoothing:antialiased}
.hero{position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;background:var(--bg);touch-action:none}
.word{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
.fade{position:absolute;left:0;right:0;bottom:0;height:var(--fade-h,46%);z-index:2;pointer-events:none;
  background:linear-gradient(to bottom,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 38%,rgba(255,255,255,.88) 66%,#fff 100%)}
.word text{font-family:"Inter Display","Inter",system-ui,sans-serif;font-weight:600;fill:var(--ink);letter-spacing:-.02em;font-variation-settings:"opsz" 32}
.label{position:absolute;z-index:3;font-family:"Geist Mono",ui-monospace,monospace;font-weight:400;color:var(--label);white-space:nowrap;line-height:1;letter-spacing:0}
.orbit{position:absolute;inset:0;z-index:1}
.tile{position:absolute;top:0;left:0;width:var(--t);height:var(--t);offset-path:var(--p);offset-rotate:auto;offset-distance:0%;
  background-color:var(--tile-bg);background-image:var(--sheet);background-size:300% 300%;background-repeat:no-repeat;will-change:offset-distance,opacity;opacity:0}
.reveal{opacity:0;transform:translateY(14px)}
.ready .reveal{opacity:1;transform:none;transition:opacity 1s cubic-bezier(.22,1,.36,1),transform 1s cubic-bezier(.22,1,.36,1)}
.ready .word.reveal{transition-delay:.7s}
.ready .label.reveal{transition-delay:.82s}
@media (prefers-reduced-motion:reduce){.reveal,.ready .reveal{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<main class="hero" id="hero" aria-label="Ceramics, studio pottery">
  <svg class="word reveal" id="word" aria-hidden="true"><text id="wordText" x="0" y="0">Ceramics</text></svg>
  <p class="label reveal" id="label">Studio pottery</p>
  <div class="orbit" id="orbit" aria-hidden="true"></div>
  <div class="fade" id="fade" aria-hidden="true"></div>
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Ceramics — Studio pottery</h1>
</main>
<script>
(function(){
  // Tile art: one 3x3 sheet, direct Higgsfield result through the images.higgs.ai resizer
  var SHEET = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261118_062935_549a25c0-75f8-4239-bebd-64d1f851ec20.png";
  var SHEET_URL = "https://images.higgs.ai/?default=1&output=webp&url=" + encodeURIComponent(SHEET) + "&w=1200&q=85";
  var ORDER = [0,4,2,6,1,8,3,7,5]; // cell order along the path so neighbours differ
  var N = 34;                      // 3 loops, same tile-to-tile spacing as the 4-loop version
  var SPEED = 0.001;               // reference: 1% of path per second (0.001 % per ms)
  var DT_CAP = 40;                 // reference caps the per-frame step at ~40 ms
  var PUSH_PER_PX = 0.0043;        // reference: ~2.15% of path per 500 px of scroll
  var PUSH_TAU = 110;              // push eases out over ~400 ms

  var hero = document.getElementById('hero');
  var orbit = document.getElementById('orbit');
  var wordSvg = document.getElementById('word');
  var wordText = document.getElementById('wordText');
  var label = document.getElementById('label');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  hero.style.setProperty('--sheet', 'url("' + SHEET_URL + '")');

  var tiles = [];
  for (var i = 0; i < N; i++) {
    var el = document.createElement('div');
    el.className = 'tile';
    var c = ORDER[i % 9];
    el.style.backgroundPosition = (c % 3) * 50 + '% ' + Math.floor(c / 3) * 50 + '%';
    orbit.appendChild(el);
    tiles.push(el);
  }

  function spiralPath(cx, cy, rx, ry, endFrac, turns) {
    // Clockwise from the outer right edge inward to the centre, like the reference path.
    // Built from cubic Bezier segments with exact tangents (Hermite), so offset-rotate:auto
    // turns the tiles smoothly instead of stepping at polyline corners.
    var A = turns * Math.PI * 2, df = -(1 - endFrac);
    function pt(t) {
      var a = t * A, f = 1 + df * t;
      return [cx + Math.cos(a) * rx * f, cy + Math.sin(a) * ry * f,
              rx * (-Math.sin(a) * A * f + Math.cos(a) * df),
              ry * ( Math.cos(a) * A * f + Math.sin(a) * df)];
    }
    var segs = Math.ceil(turns * 16), h = 1 / segs, p = pt(0), d = 'M' + p[0].toFixed(2) + ' ' + p[1].toFixed(2);
    for (var k = 1; k <= segs; k++) {
      var q = pt(k * h);
      d += 'C' + (p[0] + p[2] * h / 3).toFixed(2) + ' ' + (p[1] + p[3] * h / 3).toFixed(2) + ' ' +
                 (q[0] - q[2] * h / 3).toFixed(2) + ' ' + (q[1] - q[3] * h / 3).toFixed(2) + ' ' +
                 q[0].toFixed(2) + ' ' + q[1].toFixed(2);
      p = q;
    }
    return 'path("' + d + '")';
  }

  function layout() {
    var vw = hero.clientWidth, vh = hero.clientHeight;
    var phone = vw < 820 && vh > vw;
    var s = Math.min(vw / 1440, vh / 900);
    var pad, cx, cy, rx, ry, tile, labelSize, labelGap, labelLeft;
    if (phone) {
      pad = Math.max(8, vw * 0.02);
      cx = vw * 0.5; cy = vh * 0.42; rx = ry = vw * 0.62; tile = Math.round(Math.min(vw * 0.115, 60));
      labelSize = 12; labelGap = 12; labelLeft = Math.max(16, vw * 0.045);
    } else {
      s = Math.max(s, 0.42);
      pad = 12 * Math.max(vw / 1440, 0.6);
      // round spiral centred on the screen, 3 loops; the outer loop just bleeds off the top
      cx = vw * 0.5; cy = vh * 0.44; rx = ry = 470 * s; tile = Math.round(70 * s);
      labelSize = Math.max(12, 21 * s); labelGap = Math.max(8, 11 * s); labelLeft = Math.max(16, 40 * vw / 1440);
    }
    hero.style.setProperty('--t', tile + 'px');
    hero.style.setProperty('--p', spiralPath(cx, cy, rx, ry, 0.05, 3));

    // Big word: fit to the full width, baseline just below the bottom edge (letters cropped like the mockup)
    wordSvg.setAttribute('viewBox', '0 0 ' + vw + ' ' + vh);
    wordText.setAttribute('font-size', 100);
    var w100 = wordText.getComputedTextLength() || 440;
    var fs = 100 * (vw - pad - (phone ? pad : 25 * Math.max(vw / 1440, 0.6))) / w100;
    fs = Math.min(fs, vh * 0.5); // short landscape screens: keep the word from swallowing the spiral
    wordText.setAttribute('font-size', fs.toFixed(2));
    var bb = wordText.getBBox();
    wordText.setAttribute('x', (pad - (bb.x - 0)).toFixed(2));
    var baseline = vh + fs * 0.04;
    wordText.setAttribute('y', baseline.toFixed(2));
    var capTop = baseline - fs * 0.727;

    label.style.fontSize = labelSize + 'px';
    label.style.left = labelLeft + 'px';
    label.style.top = (capTop - labelGap - labelSize * 0.8).toFixed(1) + 'px';
  }

  // Loading intro: tiles emerge one by one from the spiral's centre (the path's end) and travel
  // outward along the curve to their slots while fading in; inner slots first, so the spiral
  // forms from the middle out. The drift keeps running underneath the whole time.
  // The tiles feed out of the centre one after another as one continuous ribbon at their normal
  // spacing: the "unrolled" length u grows from 0 to 100% of the path (easeOutCubic over
  // INTRO_MS, cubic ease-in-out), and a tile whose slot is dist% from the centre sits u - (100 - dist) % out from it.
  // All tiles reach their slots together, nothing overlaps, and the drift keeps running underneath.
  // Short, subtle intro: each tile appears in place, gliding a little inward along the path
  // (INTRO_GLIDE %, less than the gap to its neighbour, so nothing crosses), fading in and
  // growing from 85%. Outer tiles start first, so the spiral forms from the edge inward,
  // the same direction the tiles flow.
  var INTRO_STAGGER = 1100, INTRO_TILE = 850, INTRO_GLIDE = 2.4, INTRO_MS = INTRO_STAGGER + INTRO_TILE;
  var introT = reduce ? 1e9 : 0, introDone = reduce;
  function easeOutSine(x) { return Math.sin(x * Math.PI / 2); }

  var base = 0, push = 0, last = performance.now();
  function paint() {
    for (var i = 0; i < N; i++) {
      var raw = base + i * 100 / N, d = ((raw % 100) + 100) % 100, op = Math.max(0, Math.min(1, d / 10, (100 - d) / 10));
      var sc = 1;
      if (!introDone) {
        var delay = d / 100 * INTRO_STAGGER;                   // outer edge (d near 0) first, centre last
        var e = easeOutSine(Math.max(0, Math.min(1, (introT - delay) / INTRO_TILE)));
        d = Math.max(0, d - INTRO_GLIDE * (1 - e));             // starts slightly outward, glides in to its slot (the flow direction)
        op *= e; sc = 0.85 + 0.15 * e;
      }
      var el = tiles[i];
      el.style.scale = sc === 1 ? '' : sc.toFixed(3);
      el.style.offsetDistance = d + '%';
      el.style.opacity = op;
      el.style.zIndex = 1 + Math.floor(d / 10);
    }
    if (!introDone && introT >= INTRO_MS) introDone = true;
  }
  function frame(now) {
    var dt = Math.min(now - last, DT_CAP); last = now;
    if (!introDone) introT += dt;
    base += SPEED * dt;
    if (push !== 0) {
      var step = push * (1 - Math.exp(-dt / PUSH_TAU));
      base += step; push -= step;
      if (Math.abs(push) < 1e-4) push = 0;
    }
    paint();
    requestAnimationFrame(frame);
  }
  // Infinite scroll: the section itself takes wheel and touch input, so there is no page end.
  // Down / swipe up pushes the tiles forward, up / swipe down pushes them back; drift never stops.
  function nudge(px) { if (!reduce) push += px * PUSH_PER_PX; }
  window.addEventListener('wheel', function (e) {
    e.preventDefault();
    var k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? window.innerHeight : 1;
    nudge(Math.max(-400, Math.min(400, e.deltaY * k)));
  }, { passive: false });
  var touchY = null;
  hero.addEventListener('touchstart', function (e) { touchY = e.touches[0].clientY; }, { passive: true });
  hero.addEventListener('touchmove', function (e) {
    if (touchY === null) return;
    var y = e.touches[0].clientY; nudge((touchY - y) * 1.6); touchY = y;
  }, { passive: true });
  hero.addEventListener('touchend', function () { touchY = null; }, { passive: true });
  window.addEventListener('keydown', function (e) {
    var m = { ArrowDown: 120, ArrowUp: -120, PageDown: 600, PageUp: -600, ' ': 600 }[e.key];
    if (m) { e.preventDefault(); nudge(e.shiftKey && e.key === ' ' ? -m : m); }
  });

  var rz; window.addEventListener('resize', function () { cancelAnimationFrame(rz); rz = requestAnimationFrame(layout); });

  function start() {
    layout(); paint();
    document.documentElement.classList.add('ready');
    if (!reduce) requestAnimationFrame(function (t) { last = t; requestAnimationFrame(frame); });
  }
  var started = false;
  function go() { if (!started) { started = true; start(); } }
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('600 100px "Inter Display"'), document.fonts.load('400 16px "Geist Mono"')]).then(go, go);
    setTimeout(go, 1500); // failsafe
  } else go();
})();
</script>
