:root{
  /* one 1440×810 (16:9) frame that covers the viewport */
  --u:max(calc(100vw / 1440), calc(100vh / 810));
  --sans:"Urbanist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --display:"Archivo","Arial Black",Impact,sans-serif;
  --mist:#CDD2E6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#02040D;color:#fff;overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}
a,button{color:inherit;font:inherit;text-decoration:none;border:0;background:none}

.stage{position:fixed;inset:0;overflow:hidden}
@media (hover:hover) and (pointer:fine){.stage,.stage *{cursor:none}}
.frame{position:absolute;left:calc(50% - 720 * var(--u));top:calc(50% - 405 * var(--u));width:calc(1440 * var(--u));height:calc(810 * var(--u))}
.frame>*{position:absolute}

/* scene: still plate, the head-turn clip over the head, the glass helmet */
.plate{inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.head{left:calc(510 * var(--u));top:calc(255 * var(--u));width:calc(435 * var(--u));height:calc(450 * var(--u));object-fit:fill;opacity:0;transition:opacity .6s;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 46%,#000 72%,transparent 99%);mask-image:radial-gradient(ellipse 50% 50% at 50% 46%,#000 72%,transparent 99%)}
.head.is-on{opacity:1}

  background:radial-gradient(circle at 42% 32%,#FF5A55 0%,#E21D25 48%,#B30F18 100%);

<body>
<main class="stage">
  <div class="frame">

    <img class="dome" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/e8c78660-4497-41b9-82ae-a4738a5edd11.jpg" alt="" aria-hidden="true">

    <a class="logo" href="#" aria-label="Lumora home"><i></i>Lumora</a>
    <button class="menu" type="button" aria-label="Open menu"><span></span><span></span><span></span></button>

    <div class="copy">
      <p class="eyebrow">CADET</p>

    </div>

    <button class="push" type="button" aria-pressed="false" aria-label="Close the helmet">PUSH<br>ME</button>
  </div>
  <div class="cur" aria-hidden="true"></div><div class="dot" aria-hidden="true"></div>

<script>
(function(){
  var root=document.documentElement,stage=document.querySelector('.stage'),frame=document.querySelector('.frame');
  var v=document.querySelector('.head'),dome=document.querySelector('.dome'),push=document.querySelector('.push');
  var cur=document.querySelector('.cur'),dot=document.querySelector('.dot');
  var REC=/[?&]rec=1/.test(location.search);
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DUR=5.04,MID=DUR/2;

  /* the head clip: cursor x across the frame picks the moment of the turn */
  var shown=MID,target=MID,lastMove=-1e9;
  function frameX(px){var r=frame.getBoundingClientRect();return Math.max(0,Math.min(1,(px-r.left)/r.width))}
  function timeFor(nx){var k=Math.max(0,Math.min(1,(nx-.14)/.72));return k*DUR}
  v.addEventListener('loadedmetadata',function(){DUR=v.duration-.04;MID=DUR/2;shown=target=MID;v.currentTime=MID});
  v.addEventListener('seeked',function on(){v.classList.add('is-on');v.removeEventListener('seeked',on)});
  /* load the whole clip into memory so every seek is instant (streamed seeks wait on the network) */
  var SRC=v.getAttribute('data-src');
  if(REC||!window.fetch||!window.URL)v.src=SRC;
  else fetch(SRC).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){v.src=URL.createObjectURL(b)}).catch(function(){v.src=SRC});

  /* helmet on/off */
  var helmet=false;
  function setHelmet(on,instant){
    helmet=on;push.classList.toggle('is-on',on);push.setAttribute('aria-pressed',on);push.setAttribute('aria-label',on?'Open the helmet':'Close the helmet');
    var kf=[{opacity:0,transform:'translateY(calc(-70 * var(--u))) scale(.94)'},{opacity:1,transform:'translateY(calc(6 * var(--u))) scale(1.01)',offset:.75},{opacity:1,transform:'none'}];
    var a=dome.animate(on?kf:kf.slice().reverse(),{duration:instant?0:720,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
    return a;
  }
  function press(){push.animate([{transform:'scale(1)'},{transform:'scale(.88)',offset:.4},{transform:'scale(1)'}],{duration:320,easing:'ease-out'})}

  if(!REC){
    push.addEventListener('click',function(){press();setHelmet(!helmet)});
    var cx=-100,cy=-100,rx=-100,ry=-100;
    stage.addEventListener('pointermove',function(e){
      if(e.pointerType==='mouse'){root.classList.add('is-pointer');cx=e.clientX;cy=e.clientY}
      target=timeFor(frameX(e.clientX));lastMove=performance.now();
    });
    stage.addEventListener('pointerleave',function(){root.classList.remove('is-pointer')});
    (function tick(now){
      /* idle: drift the gaze slowly from side to side */
      if(now-lastMove>3500)target=MID+Math.sin((now-lastMove)/1600)*DUR*.32;
      shown+=(target-shown)*.14;
      if(!reduce&&!v.seeking&&v.readyState>=1&&Math.abs(v.currentTime-shown)>.03)v.currentTime=shown;
      rx+=(cx-rx)*.55;ry+=(cy-ry)*.55;
      cur.style.transform='translate('+rx+'px,'+ry+'px)';dot.style.transform='translate('+cx+'px,'+cy+'px)';
      requestAnimationFrame(tick);
    })(performance.now());
  }

  /* entrance */
  var E='cubic-bezier(.2,.8,.2,1)',q=function(s){return document.querySelectorAll(s)};
  function go(els,kf,o){[].forEach.call(els,function(el,i){el.animate(kf,{duration:o.d,delay:o.at+i*(o.st||0),easing:o.e||E,fill:'backwards'})})}
  if(!reduce&&Element.prototype.animate){
    go(q('.logo,.menu'),[{opacity:0,transform:'translateY(-12px)'},{opacity:1,transform:'none'}],{d:700,at:100,st:80});
    go(q('.eyebrow'),[{opacity:0,letterSpacing:'.9em'},{opacity:1,letterSpacing:'.46em'}],{d:900,at:250});
    go(q('.title'),[{opacity:0,transform:'translateY(26px) scale(.96)',filter:'blur(14px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{d:1100,at:380});
    go(q('.sub'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{d:700,at:800});
    go(q('.cap'),[{opacity:0},{opacity:1}],{d:700,at:1000,st:100});
    go(q('.push'),[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1.08)',offset:.7},{opacity:1,transform:'none'}],{d:650,at:1100,e:'ease-out'});
  }

  /* recording: a scripted cursor on the page clock, so frame-by-frame capture shows the interaction */
  if(REC){
    root.classList.add('is-pointer');
    var W=[[0,1180,470],[0.9,1060,430],[1.9,320,380],[3.0,1150,350],[3.7,820,610],[4.15,713,757],[4.6,713,757],[5.2,960,600],[5.8,430,470]];
    function cr(p0,p1,p2,p3,t){var t2=t*t,t3=t2*t;return .5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3)}
    function at(t){
      if(t<=W[0][0])return [W[0][1],W[0][2]];
      for(var i=0;i<W.length-1;i++)if(t<=W[i+1][0]){
        var a=W[Math.max(0,i-1)],b=W[i],c=W[i+1],d=W[Math.min(W.length-1,i+2)],k=(t-b[0])/(c[0]-b[0]);
        k=k*k*(3-2*k);
        return [cr(a[1],b[1],c[1],d[1],k),cr(a[2],b[2],c[2],d[2],k)];
      }
      var L=W[W.length-1];return [L[1],L[2]];
    }
    var T=5.8,steps=174,kd=[],kr=[];
    for(var s=0;s<=steps;s++){var t=s/steps*T,p=at(t),pr=at(Math.max(0,t-.006));
      kd.push({transform:'translate('+p[0]+'px,'+p[1]+'px)',opacity:t<.75?0:1,offset:s/steps});
      kr.push({transform:'translate('+pr[0]+'px,'+pr[1]+'px)'+(Math.abs(t-4.3)<.12?' scale(.78)':''),opacity:t<.75?0:1,offset:s/steps})}
    dot.animate(kd,{duration:T*1000,fill:'both'});cur.animate(kr,{duration:T*1000,fill:'both'});
    /* the press and the helmet, on the same clock */
    push.animate([{transform:'scale(1)'},{transform:'scale(.88)',offset:.4},{transform:'scale(1)'}],{duration:320,delay:4200,easing:'ease-out',fill:'backwards'});
    dome.animate([{opacity:0,transform:'translateY(calc(-70 * var(--u))) scale(.94)'},{opacity:1,transform:'translateY(calc(6 * var(--u))) scale(1.01)',offset:.75},{opacity:1,transform:'none'}],{duration:720,delay:4300,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});
    push.animate([{boxShadow:getComputedStyle(push).boxShadow},{boxShadow:'0 0 0 calc(4 * var(--u)) #3A2F3B,0 0 0 calc(5.5 * var(--u)) rgba(255,255,255,.35),0 0 calc(26 * var(--u)) rgba(255,70,70,.75)'}],{duration:300,delay:4300,fill:'both'});

    window.__recTime=function(el,t){if(el!==v)return null;var x=at(Math.max(0,t-.12))[0];return t<.75?MID:Math.min(DUR,timeFor(x/1440))};
    v.classList.add('is-on');
  }
})();
</script>
