<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EAF2">
<title>MindAI — Where Your Mind Meets the Impossible</title>

<!-- Questrial, hosted. display=block matches the old local @font-face: the
     type is the composition, so it waits rather than flashing a fallback
     it will not match the metrics of. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&display=block">

<style>
:root{
  --ink:#000000;
  --bg:#F6EAF2;
  --hairline:rgba(0,0,0,.55);
  --glass:rgba(255,255,255,.15);
  --bust-top:80.5rem;

  /* Framing of the clip inside the figure box — see .bust-v. */
  --bust-zoom:1;
  --bust-nudge-x:0%;
  --bust-nudge-y:0%;
}

/* ============================================================
   THE UNIT
   1rem === one reference pixel of the 1594x987 design.
   u = min(viewport-width / 1594, viewport-height / 987)

   Because the unit takes the SMALLER of the two ratios, the layout is
   either an exact uniform scale of the reference (when the width
   governs) or the reference pulled APART (when the height governs).
   It can never be compressed, so pinned elements cannot collide.
   The upper bound only stops type from ballooning on very large
   displays; it creates no margins, because everything is pinned to
   the viewport edges rather than to a fixed-width canvas.
   ============================================================ */
html{
  font-size:min(calc(100vw / 1594), calc(100vh / 987), 1.75px);
  -webkit-text-size-adjust:100%;
}
@supports (height:100dvh){
  html{font-size:min(calc(100vw / 1594), calc(100dvh / 987), 1.75px)}
}

*{margin:0;padding:0;box-sizing:border-box}

/* Form controls do not inherit type by default — without this the pill
   labels and the brightness button silently fall back to the UA font,
   which has no variable weight axis. */
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;cursor:pointer}

body{
  min-height:100vh;min-height:100dvh;
  background:var(--bg);
  color:var(--ink);
  font-family:'Questrial',system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}

/* The stage is the viewport itself — never a fixed-width canvas.
   A canvas narrower than the screen is what leaves dead side margins. */
.stage{position:fixed;inset:0;isolation:isolate}

/* The bottom control row animates as one group. Normally the wrapper is
   inert (display:contents) so it has no effect on layout at all. While the
   entrance runs it becomes a real box spanning the stage exactly — a
   transformed element becomes the containing block for its absolutely
   positioned children, so any other size would relocate the controls
   mid-animation. Carrying the tween here also keeps the hairline borders
   and backdrop-filters off their own compositing layers, which is what
   kept their final raster pixel-identical to the static page. */
.instruments{display:contents}
html[data-anim] .instruments{display:block;position:absolute;inset:0;pointer-events:none}
html[data-anim] .instruments > *{pointer-events:auto}

/* ============================================================
   THE ANCHOR FRAME
   Seven anchors. Every element declares the edge it belongs to plus
   its measured offset from that edge (--x / --y), so a right-hand
   element is structurally incapable of being driven from the left.
   Middle-row items hang off the vertical centre (--dy is the measured
   distance from y=493.5), which keeps the composition together as the
   frame grows taller.
   ============================================================ */
.pin{position:absolute}
.pin-tl{top:var(--y);left:var(--x)}
.pin-tc{top:var(--y);left:50%;transform:translateX(calc(-50% + var(--dx,0rem)))}
.pin-tr{top:var(--y);right:var(--x)}
.pin-ml{top:calc(50% + var(--dy));left:var(--x)}
.pin-mr{top:calc(50% + var(--dy));right:var(--x)}
.pin-bl{bottom:var(--y);left:var(--x)}
.pin-br{bottom:var(--y);right:var(--x)}

/* ---------- figure ----------
   The box is unchanged from the still-image build: the bottom of the
   figure sits on the bottom of the frame, and the visible portion is
   identical on every screen — it only ever scales, never reveals more.

   What changed is the fill. The source is now a 16:9 clip, so the box
   became a viewport onto it rather than the media's own frame: .bust is
   the prototype's crop, .bust-v is the footage, cover-fitted and then
   pushed with --bust-zoom / --bust-nudge until the opening frame lands
   on the same composition the .webp did. Those three numbers are the
   only things to retune if the clip is ever regenerated. */
.bust{
  position:absolute;
  top:var(--bust-top);
  left:50%;
  height:calc(100vh - var(--bust-top));
  width:auto;
  aspect-ratio:1049 / 1032;
  transform:translateX(calc(-50% + -51.50rem));
  z-index:0;
  pointer-events:none;
  user-select:none;
  overflow:hidden;

  /* The .webp was a cut-out; the clip is a filled rectangle, so the box has
     to do the cutting out itself. Two steps, and they only work together.

     One: the box carries the page colour and the clip multiplies onto it
     (see .bust-v). Two: the box fades its own top and sides out. The clip's
     backdrop is lit brightest at the top centre and falls off to the
     corners, and no single filter flattens a gradient — so the filter
     handles the middle, where the numbers nearly meet, and the fade
     handles the corners, where they do not. Both land on var(--bg), so the
     edge has nothing to be an edge against.

     The bottom is left solid: the figure bleeds off the bottom of the
     frame there, exactly as the still did. */
  background:var(--bg);
  -webkit-mask-image:
    linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%),
    linear-gradient(to bottom, transparent 0, #000 9%, #000 100%);
  mask-image:
    linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%),
    linear-gradient(to bottom, transparent 0, #000 9%, #000 100%);
  -webkit-mask-composite:source-in;
  mask-composite:intersect;
}
@supports (height:100dvh){
  .bust{height:calc(100dvh - var(--bust-top))}
}

.bust-v{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 50%;
  transform:scale(var(--bust-zoom)) translate(var(--bust-nudge-x), var(--bust-nudge-y));
  transform-origin:50% 100%;
  display:block;

  /* The clip's backdrop sits around #e8d8dc across the cropped window —
     close to the page, but not close enough to go unseen. The lift pushes
     it to clipping white so the multiply below resolves it to exactly
     var(--bg); the saturate puts back the colour the lift washed out of
     the figure, which is bright enough to keep its highlights. */
  filter:brightness(1.18) saturate(1.22);
  mix-blend-mode:multiply;
}

/* ---------- masthead ---------- */
.nav{
  --x:41.7rem; --y:29.0rem;
  font-size:21.1rem;
  line-height:27.0rem;
  letter-spacing:-0.33rem;
  -webkit-text-stroke:0.323rem var(--bg);paint-order:fill stroke;
  z-index:3;
}
.nav ul{list-style:none;white-space:nowrap}
.nav .col-b{position:absolute;top:0;left:165.0rem}
.nav a{color:inherit;text-decoration:none;display:block}
.nav .lead{
  -webkit-text-stroke:0.146rem var(--ink);paint-order:stroke fill;
  letter-spacing:-0.33rem;
}

/* The burger only exists once the desktop nav can no longer be shown in
   full. It borrows the brightness dial's treatment so it reads as its
   sibling rather than a bolted-on mobile control. */
.burger{
  display:none;
  border-radius:50%;
  border:1.1rem solid var(--hairline);
  background:var(--glass);
  -webkit-backdrop-filter:blur(6rem);backdrop-filter:blur(6rem);
  place-items:center;
  z-index:5;
}
.burger svg{width:60%;height:60%;display:block;fill:var(--ink)}

.logo{--y:24.0rem; --dx:-0.5rem; width:60rem;height:38rem;z-index:3}
.moon{--x:115.0rem; --y:35.0rem; width:21rem;height:22rem;z-index:3}
.mode{
  --x:44.5rem; --y:26.9rem;
  width:37.8rem;height:37.8rem;z-index:3;
}

/* ---------- type ---------- */
.headline{
  --x:47.0rem; --dy:-38.5rem;
  font-size:42.3rem;
  line-height:55.0rem;
  letter-spacing:1.5rem;
  font-weight:400;
  white-space:nowrap;
  -webkit-text-stroke:0.791rem var(--bg);paint-order:fill stroke;
  z-index:2;
}
.headline .l1,.headline .l2,.headline .ln{display:block}
.headline .l2{word-spacing:0.0rem}
.headline .w1{letter-spacing:3.25rem}
.headline .w2{letter-spacing:3.167rem;margin-left:-7.0rem}
.headline .w3{letter-spacing:1.167rem;margin-left:-7.0rem}
.headline .w4{letter-spacing:1.5rem}
.headline .w5{letter-spacing:2.5rem;margin-left:-5.0rem}
.headline b{
  font-weight:400;
  -webkit-text-stroke:1.436rem var(--ink);paint-order:stroke fill;
  margin-left:-4.0rem;
  letter-spacing:2.858888888888889rem;
}

.blurb{
  --x:32.0rem; --dy:162.5rem;
  width:400.5rem;
  font-size:22.66rem;
  line-height:30.0rem;
  letter-spacing:0.06rem;
  -webkit-text-stroke:0.189rem var(--bg);paint-order:fill stroke;
  z-index:2;
}
.blurb b{
  font-weight:400;
  -webkit-text-stroke:0.147rem var(--ink);paint-order:stroke fill;
  letter-spacing:0.5rem;
}

/* ---------- controls ---------- */
.brightness{
  --x:41.0rem; --y:6.0rem;
  width:41.6rem;height:41.6rem;
  border-radius:50%;
  border:1.1rem solid var(--hairline);
  background:var(--glass);
  -webkit-backdrop-filter:blur(6rem);backdrop-filter:blur(6rem);
  display:grid;place-items:center;
  z-index:3;
}
.brightness svg{width:26rem;height:26rem;display:block}

.tags{
  --x:43.0rem; --y:9.0rem;
  display:flex;gap:3.0rem;
  z-index:3;
}
.tag{
  height:32.0rem;
  border:1.2rem solid var(--ink);
  border-radius:16.0rem;
  background:var(--glass);
  -webkit-backdrop-filter:blur(6rem);backdrop-filter:blur(6rem);
  display:flex;align-items:center;justify-content:center;
  font-size:16.6rem;
  letter-spacing:-0.2rem;
  line-height:1;
  -webkit-text-stroke:0.241rem var(--ink);paint-order:stroke fill;
  white-space:nowrap;
}
.tag:nth-child(1){width:68.5rem}
.tag:nth-child(2){width:81.0rem}
.tag:nth-child(3){width:60.5rem}

@media (prefers-reduced-motion:no-preference){
  .nav a,.tag,.brightness{transition:opacity .25s ease}
  .nav a:hover,.tag:hover,.brightness:hover{opacity:.62}
}
:focus-visible{outline:2px solid #000;outline-offset:3px}

/* ============================================================
   ENTRANCE — initial states
   Scoped to [data-anim="pending"], which script sets before first paint.
   No script, no attribute, nothing hidden. These rules are what make the
   headline a MASKED reveal rather than a slide: without the overflow the
   lines travel 105% of their height in full view of the page.
   ============================================================ */
html[data-anim] *{transition:none !important}

html[data-anim="pending"] .bust{
  opacity:0;scale:1.028;transform-origin:50% 100%;will-change:opacity,scale;
}
html[data-anim="pending"] .logo{opacity:0;scale:.9;will-change:opacity,scale}
html[data-anim="pending"] .nav a,
html[data-anim="pending"] .burger,
html[data-anim="pending"] .moon,
html[data-anim="pending"] .mode{opacity:0;translate:0 -8rem;will-change:opacity,translate}
html[data-anim="pending"] .headline .l1,
html[data-anim="pending"] .headline .l2{overflow:hidden}
html[data-anim="pending"] .headline .ln{translate:0 105%;will-change:translate}
html[data-anim="pending"] .blurb{opacity:0;translate:0 12rem;will-change:opacity,translate}
html[data-anim="pending"] .instruments{opacity:0;translate:0 12rem;will-change:opacity,translate}

@media (prefers-reduced-motion:reduce){
  html[data-anim] *{opacity:1 !important;translate:none !important;scale:none !important}
}

/* ============================================================
   Two independent switches, not one.

   The old system had a single "tablet" breakpoint doing two unrelated
   jobs, so a 1794px window collapsed its nav because of its ASPECT even
   though its type was 23px and perfectly usable. Those jobs are now
   separated, and each keys off the thing that actually governs it:

     A. DENSITY  — the nav collapses when the unit gets too small for
        touch. That is a function of viewport SIZE (u < 0.78), nothing else.
     B. PROPORTION — a squarer frame makes the figure wider, because its
        height drives its width. That is a function of frame SHAPE, and the
        answer is to ease the type back, not to move the figure.
     C. STACK — below 13:10 no type size clears the figure, so the
        composition genuinely has to change.

   The composition itself is now the plain desktop one at every size down
   to 13:10. No width cap, no bottom-aligned frame — both of those were
   fixes for problems the cap itself created, and both are gone.
   ============================================================ */

/* A — DENSITY --------------------------------------------------------
   The burger is a TOUCH accommodation, so it must key off the input
   device, not off geometry. Viewport size cannot tell you what is
   pointing at the screen: a maximised window on a 1200px monitor reports
   1070, 856 or 713 CSS px depending only on the OS display scaling, so
   any height threshold here fires on ordinary desktops. `pointer:coarse`
   asks the question directly. The unenforced width floor below it is the
   one case where geometry alone is enough: at that size the two nav
   columns cannot fit whatever is pointing at them. */
@media (pointer:coarse) and (max-width:1600px),
       (max-width:999px){
  .burger{display:grid;--x:41rem;--y:24rem;width:56rem;height:56rem;border-width:1.4rem}
  .moon{--x:132rem;--y:32rem;width:28rem;height:29rem}
  .mode{--x:43rem;--y:23rem;width:50rem;height:50rem}

  .nav{
    --x:41rem;--y:96rem;
    display:flex;gap:62rem;
    padding:30rem 38rem 32rem;
    border:1.4rem solid var(--ink);
    border-radius:30rem;
    background:var(--glass);
    -webkit-backdrop-filter:blur(18rem);backdrop-filter:blur(18rem);
    font-size:30rem;line-height:40rem;letter-spacing:0;
    opacity:0;visibility:hidden;translate:0 -12rem;pointer-events:none;
    z-index:4;
  }
  .nav .col-b{position:static;left:auto}
  .nav .lead{letter-spacing:0}
  html[data-menu="open"] .nav{opacity:1;visibility:visible;translate:0 0;pointer-events:auto}

  .brightness{--x:41rem;--y:8rem;width:60rem;height:60rem;border-width:1.4rem}
  .brightness svg{width:37rem;height:37rem}
  .tags{--x:43rem;--y:9rem;gap:6rem}
  .tag{height:52rem;border-radius:26rem;font-size:27rem;border-width:1.6rem}
  .tag:nth-child(1){width:110rem}
  .tag:nth-child(2){width:130rem}
  .tag:nth-child(3){width:96rem}
}

/* B — PROPORTION ----------------------------------------------------- */
@media (min-aspect-ratio:13/10) and (max-aspect-ratio:31/20){
  .headline{font-size:38.4rem;line-height:49.5rem}
  .blurb{width:350rem}
}

/* ============================================================
   TABLET — PORTRAIT / PHONE
   Past 11:10 the frame is too tall for a side-by-side reading of type and
   figure, so the same parts stack: masthead, headline, blurb, figure
   bleeding off the bottom. Collapsing the nav frees the band the two
   columns used to occupy, which goes back to the figure.
   ============================================================ */
@media (max-aspect-ratio:13/10), (max-width:899px){
  html{font-size:min(calc(100vw / 720), calc(100vh / 1040), 1.75px)}
  /* The stack now also serves wide but squarish frames (a 1664x1192 window
     is closer to square than to the 1.615 the composition is drawn for). On
     those the text would otherwise run the full width, so the column is
     capped and centred; on a phone the gutter still wins and nothing moves. */
  :root{
    --bust-top:auto;
    --col-x:max(32rem, calc(50% - 336rem));
    --col-w:min(672rem, calc(100% - 64rem));
  }

  .burger{display:grid;--x:32rem;--y:32rem;width:48rem;height:48rem}
  .logo{--y:35rem;--dx:0rem;width:70rem;height:44rem}
  .moon{display:none}
  .mode{--x:32rem;--y:33rem;width:48rem;height:48rem}

  .nav{
    --x:32rem;--y:94rem;
    display:flex;gap:48rem;
    padding:24rem 30rem 26rem;
    border:1.4rem solid var(--ink);
    border-radius:26rem;
    background:var(--glass);
    -webkit-backdrop-filter:blur(18rem);backdrop-filter:blur(18rem);
    font-size:26rem;line-height:36rem;letter-spacing:0;
    opacity:0;visibility:hidden;translate:0 -10rem;pointer-events:none;
    z-index:4;
  }
  .nav .col-b{position:static;left:auto}
  .nav .lead{letter-spacing:0}
  html[data-menu="open"] .nav{opacity:1;visibility:visible;translate:0 0;pointer-events:auto}

  .headline{
    left:var(--col-x);right:auto;
    top:212rem;
    font-size:54rem;line-height:64rem;letter-spacing:0;
  }
  .headline .l2{word-spacing:0}
  .headline .w1,.headline .w2,.headline .w3,
  .headline .w4,.headline .w5{letter-spacing:0;margin-left:0}
  .headline .l1,.headline .l2,.blurb{-webkit-text-stroke-width:0}
  .headline b{margin-left:0;letter-spacing:0;-webkit-text-stroke:2.6rem var(--ink);paint-order:stroke fill}

  .blurb{
    left:var(--col-x);right:auto;width:var(--col-w);
    top:366rem;
    font-size:27rem;line-height:38rem;letter-spacing:0;
  }

  .bust{
    top:auto;bottom:0;
    height:max(430rem, calc(100vh - 496rem));
    transform:translateX(-50%);
  }

  .brightness{--x:32rem;--y:32rem;width:52rem;height:52rem;border-width:1.4rem}
  .brightness svg{width:32rem;height:32rem}
  .tags{--x:32rem;--y:36rem;gap:6rem}
  .tag{height:44rem;border-radius:22rem;font-size:21rem;border-width:1.6rem}
  .tag:nth-child(1){width:88rem}
  .tag:nth-child(2){width:104rem}
  .tag:nth-child(3){width:76rem}
}

@media (max-aspect-ratio:13/10) and (min-height:1px), (max-width:899px){
  @supports (height:100dvh){
    html{font-size:min(calc(100vw / 720), calc(100dvh / 1040), 1.75px)}
    .bust{height:max(430rem, calc(100dvh - 496rem))}
  }
}

/* ============================================================
   MOBILE
   The stack above is drawn on a 720x1040 frame — a tablet-portrait
   reference. Held down to phone widths its unit falls to 0.50, which puts
   body copy at 13.5px and tap targets at 22px. Neither is a layout
   failure, which is why it survives so long; both are quality failures,
   measured at 540px (targets) and 450px (copy).

   So mobile is not the stack compressed further: it is the same stack
   redrawn on a 360px frame, where the unit sits near 1 instead of 0.5.
   Same order, same components, same language — the reference frame is
   what changes. The unit is width-only here because on a phone
   readability tracks width, not height, and the figure absorbs whatever
   height is left over. 520px is where the two frames cross: the headline
   lands at 36px on either side of the line.
   ============================================================ */
@media (max-width:520px){
  html{font-size:min(calc(100vw / 360), 1.2px)}

  /* Phone frames range from 0.39 to 0.56 aspect, so a fixed top for the
     copy leaves a void on tall handsets and crowds short ones. The figure
     is sized first, then the copy centres itself in the band between the
     masthead and the figure — one expression instead of a breakpoint per
     handset. */
  :root{
    --fig-h:min(max(300rem, calc(100vh - 350rem)), 112vw);
    --text-top:calc((90rem + 100vh - var(--fig-h)) / 2 - 91rem);
  }

  .burger{--x:24rem;--y:22rem;width:44px;height:44px;border-width:1px}
  .burger svg{width:20px;height:20px}
  .logo{--y:25rem;--dx:0rem;width:48px;height:30px}
  .moon{display:block;--x:84rem;--y:32rem;width:18px;height:19px}
  .mode{--x:24rem;--y:22rem;width:36px;height:36px}

  .nav{
    --x:24rem;--y:82rem;
    gap:28px;padding:16px 20px 18px;
    border-radius:20px;border-width:1px;
    font-size:16px;line-height:24px;
  }

  .headline{
    top:var(--text-top);left:24rem;right:24rem;
    font-size:28px;line-height:34px;
  }
  .headline b{-webkit-text-stroke:1.5px var(--ink)}
  .blurb{
    top:calc(var(--text-top) + 104rem);left:24rem;right:24rem;width:auto;
    font-size:16px;line-height:24px;
  }

  /* Bottom-pinned as everywhere else, so the crop stays the prototype's.
     The width bound keeps the shoulders from being cut too deeply on a
     narrow frame; the height floor keeps the figure clear of the copy. */
  .bust{height:var(--fig-h)}

  .brightness{--x:24rem;--y:24rem;width:44px;height:44px;border-width:1px}
  .brightness svg{width:22px;height:22px}
  .tags{--x:24rem;--y:24rem;gap:6px}
  .tag{height:36px;padding:0 14px;border-radius:18px;font-size:14px;border-width:1px}
  .tag:nth-child(1),.tag:nth-child(2),.tag:nth-child(3){width:auto}
}

@media (max-width:520px){
  @supports (height:100dvh){
    :root{
      --fig-h:min(max(300rem, calc(100dvh - 350rem)), 112vw);
      --text-top:calc((90rem + 100dvh - var(--fig-h)) / 2 - 91rem);
    }
  }
}
</style>
<script>
(function(){var d=document.documentElement;
 if(!('animate' in Element.prototype))return;
 try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
 d.setAttribute('data-anim','pending');
 window.__entryGuard=setTimeout(function(){d.removeAttribute('data-anim');},4000);
})();
</script>

</head>
<body>
<main class="stage">
  <div class="bust" role="img"
       aria-label="Translucent iridescent figure with light tracing through it, turning to its left">
    <video class="bust-v" muted playsinline loop preload="auto" disablepictureinpicture
           tabindex="-1" aria-hidden="true"
           src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/24f3c998-86fb-4f1d-9906-07c7fa740f8a.mp4"></video>
  </div>

  <button class="burger pin pin-tl" type="button" aria-label="Menu"
          aria-expanded="false" aria-controls="primary-nav">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="3" y="8.4" width="18" height="1.7" rx=".85"/>
      <rect x="3" y="13.9" width="18" height="1.7" rx=".85"/>
    </svg>
  </button>

<script>
(function(){
  var root=document.documentElement;
  if(root.getAttribute('data-anim')!=='pending'){return;}

  var one=function(s){return document.querySelector(s);};
  var all=function(s){return [].slice.call(document.querySelectorAll(s));};

  /* Three curves. The typographic one is deliberately not a deep expo:
     over 58px of masked travel, an expo tail parks the line within a pixel
     of home after ~55% of its duration and then drifts sub-pixel for the
     remaining 400ms, which reads as a stall rather than a settle. This
     curve is still fast off the mark (half the distance in 175ms) but
     finishes in 110ms instead of 426. The interface curve was retuned the
     same way: a cubic-out tail left the blurb creeping through its last
     5% of opacity and last pixel of travel for ~300ms after it looked
     finished. */
  var HERO='cubic-bezier(.16,1,.3,1)',
      TYPE='cubic-bezier(.3,.7,.55,1)',
      UI  ='cubic-bezier(.3,.7,.55,1)';

  var tweens=[];
  function play(el,frames,dur,delay,ease){
    /* Skip anything the current breakpoint does not render — the burger on
       desktop, the moon in portrait. Animating a display:none element keeps
       a tween in the timeline that the compositor never paints, which left
       the final frame resolving a beat late. */
    if(!el||getComputedStyle(el).display==='none'){return;}
    tweens.push(el.animate(frames,{duration:dur,delay:delay,easing:ease,fill:'both'}));
  }

  function run(){
    /* 01 — the subject settles into frame, anchored to the bottom bleed */
    play(one('.bust'),[{opacity:0,scale:1.028},{opacity:1,scale:1}],1250,50,HERO);

    /* 02 — the frame assembles quietly around it */
    play(one('.logo'),[{opacity:0,scale:.9},{opacity:1,scale:1}],550,300,UI);
    all('.nav a').forEach(function(a,i){
      play(a,[{opacity:0,translate:'0 -8rem'},{opacity:1,translate:'0 0'}],500,380+i*40,UI);
    });
    [one('.burger'),one('.moon'),one('.mode')].forEach(function(el,i){
      play(el,[{opacity:0,translate:'0 -8rem'},{opacity:1,translate:'0 0'}],500,440+i*60,UI);
    });

    /* 03 — the message: each line rises out of its own mask */
    all('.headline .ln').forEach(function(el,i){
      play(el,[{translate:'0 105%'},{translate:'0 0'}],660,580+i*110,TYPE);
    });

    /* 04 — the answer, from the opposite side of the composition */
    play(one('.blurb'),[{opacity:0,translate:'0 12rem'},{opacity:1,translate:'0 0'}],620,920,TYPE);

    /* 05 — the instrument row closes the frame along the bottom edge.
       The three tags are one segmented control, so the row settles as a
       single object and only the labels resolve in sequence. (Animating
       each tag separately promoted them to their own layers, and their
       half-pixel flex positions came back re-rasterised.) */
    play(one('.instruments'),[{opacity:0,translate:'0 12rem'},{opacity:1,translate:'0 0'}],620,1060,UI);

    Promise.all(tweens.map(function(t){return t.finished;})).then(stop,stop);
  }

  /* Entrance over: restore authored CSS and drop every effect in the same
     frame (transitions stay suppressed across it), then release the page. */
  function stop(){
    clearTimeout(window.__entryGuard);
    root.setAttribute('data-anim','done');
    tweens.forEach(function(t){t.cancel();});
    tweens.length=0;
    requestAnimationFrame(function(){root.removeAttribute('data-anim');});
  }

  /* --- menu ------------------------------------------------------------
     One button, one attribute. CSS owns every breakpoint decision; this only
     tracks open/closed, so there is no viewport measuring in script. */
  var burger=one('.burger'), nav=one('.nav');
  if(burger&&nav){
    var setMenu=function(open){
      if(open){root.setAttribute('data-menu','open');}
      else{root.removeAttribute('data-menu');}
      burger.setAttribute('aria-expanded',open?'true':'false');
    };
    burger.addEventListener('click',function(e){
      e.stopPropagation();
      setMenu(root.getAttribute('data-menu')!=='open');
    });
    document.addEventListener('click',function(e){
      if(root.getAttribute('data-menu')==='open'&&!nav.contains(e.target)){setMenu(false);}
    });
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape'&&root.getAttribute('data-menu')==='open'){setMenu(false);burger.focus();}
    });
    nav.addEventListener('click',function(e){
      if(e.target.closest('a')){setMenu(false);}
    });
  }

  /* Wait for the webfont and figure so nothing re-renders mid-reveal, but
     never let that block the start for long. The figure is a clip now, so
     "loaded" means its first frame is decodable — readyState 2. There is no
     poster standing in behind it any more, so the wait is what keeps the
     entrance from fading in an empty box; the timeout below is the floor,
     and past it the figure resolves a beat late rather than not at all. */
  var ready=[];
  if(document.fonts&&document.fonts.ready){ready.push(document.fonts.ready);}
  var vid=one('.bust-v');
  if(vid){
    ready.push(new Promise(function(res){
      if(vid.readyState>=2){res();return;}
      vid.addEventListener('loadeddata',res,{once:true});
      vid.addEventListener('error',res,{once:true});
    }));
  }
  var fired=false,go=function(){if(fired){return;}fired=true;requestAnimationFrame(run);};
  Promise.all(ready).then(go,go);
  setTimeout(go,400);
})();

/* ============================================================
   THE FIGURE'S TURN
   The clip is not playback, it is a dial the pointer holds. It never
   plays on its own: the only thing that moves it is horizontal mouse
   travel. Move left and the figure turns forward, move right and it
   turns back, at exactly the rate the hand moves — stop moving and it
   stops on the frame it was left on.

   The mapping is distance, not direction: each mousemove contributes
   (delta / viewport width) * SENSITIVITY of the clip's whole duration,
   so one full sweep of the screen covers 80% of the turn regardless of
   how fast it was made. The position is clamped to the clip's ends
   rather than wrapped, so the two extremes are hard stops.

   Seeking is the only way to run a clip in both directions, and a seek
   that is issued while one is already in flight is discarded by the
   browser. So the pointer only ever updates a target, and the seek loop
   feeds that target to the decoder one request at a time: `seeked` is
   what queues the next one. Without that gate a fast sweep floods the
   decoder and the figure lands minutes of pointer travel behind.

   Deliberately its own scope: the entrance script above returns early
   when the browser has no Web Animations or the reader asked for reduced
   motion, and the figure still has to answer the pointer in both cases.
   ============================================================ */
(function(){
  var box=document.querySelector('.bust'),
      v=box&&box.querySelector('.bust-v');
  if(!box||!v){return;}

  /* Fraction of the clip covered by one full-width sweep of the pointer. */
  var SENSITIVITY=0.8;

  /* The clip runs at 24fps, so anything under a frame apart renders the
     same picture: seeking there costs a decode and shows nothing for it. */
  var EPSILON=0.04;

  var prevX=null,
      targetTime=0,
      seeking=false,
      requested=-1;

  function duration(){
    var d=v.duration;
    return (d&&isFinite(d)&&d>0)?d:0;
  }

  function pump(){
    if(seeking||Math.abs(targetTime-v.currentTime)<EPSILON){return;}
    seeking=true;
    requested=targetTime;
    try{v.currentTime=targetTime;}catch(e){seeking=false;}
  }

  /* The queue: whatever the pointer asked for while the last seek was in
     flight is served here, and nothing is served anywhere else. The test is
     against what was asked for, not against where the decoder landed — a
     seek resolves to the nearest decodable frame, so comparing positions
     would re-issue a seek that has already been honoured, forever. */
  v.addEventListener('seeked',function(){
    seeking=false;
    if(targetTime!==requested){pump();}
  });

  function onMove(e){
    var d=duration();
    if(prevX===null||!d){prevX=e.clientX;return;}
    var delta=prevX-e.clientX;
    prevX=e.clientX;
    if(!delta){return;}
    var t=targetTime+(delta/window.innerWidth)*SENSITIVITY*d;
    targetTime=t<0?0:(t>d?d:t);
    pump();
  }

  /* A pointer re-entering the page has no meaningful delta against where it
     left, so the next move starts a fresh measurement instead of jumping
     the figure by the width of the gap. */
  function reanchor(){prevX=null;}

  /* A pointer that can hover drives the turn; one that cannot (touch) has
     no travel to read, so the figure simply turns on its own. */
  var hoverable=true;
  try{hoverable=matchMedia('(hover: hover) and (pointer: fine)').matches;}catch(e){}

  var calm=false;
  try{calm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}

  if(calm){
    /* Held on the opening frame — the same picture the still build showed. */
    v.pause();
    return;
  }

  if(!hoverable){
    v.addEventListener('canplay',function(){
      var p=v.play();
      if(p&&p.catch){p.catch(function(){});}
    },{once:true});
    return;
  }

  /* The clip is a dial from here on, so the decoder must never be running
     underneath it — frame 0 is where the turn starts.

     A video element paints nothing until it holds a decoded frame, and this
     one never plays, so without a nudge the figure would be an empty box
     until the first mouse move and then appear from nowhere. Seeking a
     hair off zero forces that first decode, which is what the poster used
     to stand in for. */
  v.pause();
  function anchor(){
    targetTime=v.currentTime;
    if(!v.currentTime){v.currentTime=0.001;}
  }
  v.addEventListener('loadeddata',anchor,{once:true});
  if(v.readyState>=2){anchor();}

  window.addEventListener('mousemove',onMove,{passive:true});
  document.addEventListener('mouseleave',reanchor);
  window.addEventListener('blur',reanchor);
  document.addEventListener('visibilitychange',reanchor);
})();
</script>
