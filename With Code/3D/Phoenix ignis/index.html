<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Myth Atlas ‚Äî Featured creatures</title>
<meta name="description" content="Turn a phoenix and a kraken in your hands. An interactive 3D field guide to creatures that never existed.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --bg: #ebe1cd;
    --panel: #f8f2e6;
    --line: #d6c9ae;
    --ink: #241c14;
    --muted: #7a6b58;
    --accent: #b4532a;
    --accent-ink: #ffffff;
    --accent-tint: #f3dfcd;
    --chip: #e4d8c2;
    --shadow: 70, 48, 24;
    --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
    --sans: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --ease: cubic-bezier(.22, .8, .24, 1);
  }
  .hero[data-light="dusk"] {
    --bg: #17120d;
    --panel: #211a13;
    --line: #3d3225;
    --ink: #f1e7d6;
    --muted: #a89880;
    --accent: #e08a4f;
    --accent-ink: #17120d;
    --accent-tint: #3b2415;
    --chip: #2d251b;
    --shadow: 0, 0, 0;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    font-family: var(--sans);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  svg { display: block; }
  .ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- hero shell ---------- */
  .hero {
    position: relative;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    background: var(--bg);
    color: var(--ink);
    display: grid;
    grid-template-columns: 196px minmax(0, 1fr) clamp(300px, 27vw, 356px);
    overflow: hidden;
    transition: background-color .6s var(--ease), color .6s var(--ease);
  }
  #gl {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: 5;
    pointer-events: none;
  }

  /* ---------- sidebar ---------- */
  .side {
    display: flex; flex-direction: column;
    padding: 22px 12px 18px 24px;
    border-right: 1px solid var(--line);
    min-height: 0;
    transition: opacity .5s var(--ease), transform .5s var(--ease), border-color .6s;
  }
  .brand { font-family: var(--serif); font-size: 27px; font-weight: 400; letter-spacing: -.02em; white-space: nowrap; font-variation-settings: "opsz" 48; }
  .brand small { display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .nav { list-style: none; padding: 0; margin: 20px 0 12px; display: grid; gap: 2px; min-height: 0; overflow: hidden; }
  .nav button {
    width: 100%; display: flex; align-items: center; gap: 16px;
    padding: 7px 10px; border-radius: 3px; text-align: left;
    font-size: 14px; line-height: 1.15;
    box-shadow: inset 2px 0 0 transparent;
    transition: background-color .25s, box-shadow .25s;
  }
  .nav button:hover { background: var(--chip); }
  .nav button[aria-current="page"] { background: var(--accent-tint); box-shadow: inset 2px 0 0 var(--accent); }
  .nav small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .feature {
    margin-top: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 3px;
    padding: 14px 14px 16px;
    transition: background-color .6s;
  }
  .eyebrow { font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .feature img { display: block; width: 92px; height: 76px; object-fit: contain; margin: 4px auto 2px; }
  .feature h3 { font-family: var(--serif); font-weight: 400; font-size: 18px; line-height: 1.15; letter-spacing: -.01em; }
  .feature p { font-size: 12px; line-height: 1.4; color: var(--muted); margin-top: 6px; }
  .feature a { display: inline-flex; gap: 6px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--ink); text-underline-offset: 3px; }
  .feature a .ico { width: 14px; height: 14px; }

  /* ---------- centre column ---------- */
  .main {
    display: grid; grid-template-rows: auto minmax(0, 1fr);
    padding: 48px 18px 14px 26px;
    min-width: 0; min-height: 0;
  }
  .tabs { display: flex; gap: 10px; transition: opacity .5s var(--ease), transform .5s var(--ease); }
  .tab {
    width: 130px; padding: 8px 8px 11px;
    display: grid; justify-items: center;
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    transition: background-color .35s, border-color .35s, transform .35s var(--ease);
  }
  .tab::before { content: attr(data-no); position: absolute; left: 8px; top: 6px; font-family: var(--mono); font-size: 9.5px; color: var(--muted); letter-spacing: .1em; }
  .tab::after { content: ""; position: absolute; left: -1px; right: -1px; bottom: -1px; height: 2px; background: var(--accent); transform: scaleX(0); transition: transform .35s var(--ease); }
  .tab:hover { transform: translateY(-2px); border-color: var(--muted); }
  .tab img { width: 58px; height: 52px; object-fit: contain; }
  .tab b { font-family: var(--serif); font-weight: 400; font-size: 15.5px; margin-top: 2px; letter-spacing: -.01em; }
  .tab i { font-family: var(--serif); font-size: 12px; color: var(--muted); }
  .tab[aria-selected="true"] { border-color: var(--ink); }
  .tab[aria-selected="true"]::after { transform: scaleX(1); }

  .stage {
    position: relative; min-height: 0;
    touch-action: none;
    cursor: grab;
    user-select: none; -webkit-user-select: none;
    border-radius: 3px;
  }
  .plate { position: absolute; inset: 10px 0 24px; pointer-events: none; z-index: 1; }
  .plate i { position: absolute; width: 14px; height: 14px; border: 0 solid var(--line); }
  .plate i:nth-child(1) { left: 0; top: 0; border-width: 1px 0 0 1px; }
  .plate i:nth-child(2) { right: 0; top: 0; border-width: 1px 1px 0 0; }
  .plate i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 1px 1px; }
  .plate i:nth-child(4) { right: 0; bottom: 0; border-width: 0 1px 1px 0; }
  .scale { position: absolute; left: 0; bottom: 30px; z-index: 6; pointer-events: none; font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .08em; }
  .scale::before { content: ""; display: block; width: 72px; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }
  .stage.dragging { cursor: grabbing; }
  .ground {
    position: absolute; left: 50%; bottom: 15%;
    width: min(62%, 460px); height: 44px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(var(--shadow), .22), rgba(var(--shadow), 0));
    pointer-events: none;
    transition: opacity .5s, transform .7s var(--ease);
  }
  .stage.switching .ground { opacity: 0; transform: translateX(-50%) scaleX(.4); }

  .rail {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    display: grid; gap: 9px; z-index: 6;
  }
  .rail button {
    width: 38px; height: 38px; border-radius: 3px;
    display: grid; place-items: center;
    background: var(--panel); border: 1px solid var(--line);
    transition: background-color .25s, color .25s, border-color .25s, transform .2s var(--ease);
  }
  .rail button .ico { width: 17px; height: 17px; }
  .rail button:hover { border-color: var(--accent); }
  .rail button:active { transform: scale(.92); }
  .rail button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .turn {
    position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%);
    z-index: 6;
    display: flex; align-items: center; gap: 2px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 3px; padding: 3px 4px;
    font-family: var(--mono); font-size: 12px;
  }
  .turn button { height: 28px; min-width: 32px; padding: 0 8px; border-radius: 2px; display: grid; place-items: center; transition: background-color .2s; }
  .turn button:hover { background: var(--chip); }
  .turn .ico { width: 16px; height: 16px; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 0;
    text-align: center; z-index: 6; pointer-events: none;
    font-family: var(--serif); font-style: italic; font-weight: 300; font-size: clamp(17px, 1.65vw, 22px); letter-spacing: -.01em;
  }
  .hint {
    position: absolute; right: 4px; top: 8px; z-index: 6; pointer-events: none;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
    transition: opacity .6s;
  }
  .hint .ico { width: 15px; height: 15px; }
  .hero.touched .hint { opacity: 0; }

  .loader {
    position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); pointer-events: none;
    opacity: 0; transition: opacity .35s;
  }
  .loader.show { opacity: 1; }
  .loader::before {
    content: ""; width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  .fallback {
    position: absolute; inset: 6% 10% 16%; display: none;
    background: center / contain no-repeat;
  }
  .stage.failed .fallback { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- right column ---------- */
  .info {
    display: grid; grid-template-rows: auto minmax(0, 1fr);
    gap: 16px; padding: 13px 26px 14px 0;
    min-height: 0; min-width: 0;
    transition: opacity .5s var(--ease), transform .5s var(--ease);
  }
  .top { display: flex; align-items: center; gap: 10px; }
  .search {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px;
    height: 32px; padding: 0 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    color: var(--muted);
  }
  .search .ico { width: 15px; height: 15px; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 11.5px; color: var(--ink); }
  .search input::placeholder { color: var(--muted); }
  .search:focus-within { border-color: var(--accent); }
  .iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; flex: none; }
  .iconbtn:hover { background: var(--chip); }
  .avatar { background: var(--ink); color: var(--bg); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }
  .avatar .ico { width: 15px; height: 15px; stroke-width: 1.8; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    box-shadow: inset 0 0 0 4px var(--panel), inset 0 0 0 5px var(--line);
    padding: 26px 24px 20px;
    overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin;
    transition: background-color .6s, border-color .6s;
  }
  .detail { display: flex; flex-direction: column; min-height: 100%; }
  .detail > * { animation: rise .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
  .detail.leaving > * { animation: sink .2s ease-in both; animation-delay: 0s; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  @keyframes sink { to { opacity: 0; transform: translateY(-6px); } }

  .detail h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(42px, 4.4vw, 58px); line-height: .96; letter-spacing: -.035em; margin-top: 8px; font-variation-settings: "opsz" 144; }
  .detail h1 em { font-style: italic; font-weight: 300; display: block; font-size: .36em; letter-spacing: 0; color: var(--muted); margin-top: 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .tags span { font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; padding: 5px 9px; border-radius: 2px; border: 1px solid var(--line); }
  .lede { font-size: 13.5px; line-height: 1.55; margin-top: 16px; text-wrap: pretty; }
  .detail h2 { font-family: var(--mono); font-weight: 500; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .traits { margin-top: 10px; display: grid; gap: 9px; }
  .traits div { display: flex; align-items: baseline; gap: 10px; font-size: 13px; }
  .traits div .ico { align-self: center; width: 18px; height: 18px; color: var(--muted); }
  .traits dt { color: var(--muted); flex: 1; display: flex; align-items: baseline; white-space: nowrap; }
  .traits dt::after { content: ""; flex: 1; border-bottom: 1px dotted var(--line); margin: 0 8px; transform: translateY(-3px); }
  .traits dd { text-align: right; font-weight: 500; }
  .era { margin-top: 14px; }
  .era .bar { position: relative; display: grid; grid-template-columns: 1300fr 1000fr 400fr; height: 6px; border-radius: 2px; overflow: visible; }
  .era .bar b { background: var(--chip); border-right: 1px solid var(--panel); }
  .era .bar b:first-child { border-radius: 2px 0 0 2px; } .era .bar b:last-child { border-radius: 0 2px 2px 0; border-right: 0; }
  .era .bar u { position: absolute; top: -3px; height: 12px; min-width: 3px; background: var(--accent); border-radius: 1px; text-decoration: none; }
  .era .bar u.l::after { right: auto; left: 0; }
  .era .bar u::after { content: attr(data-l); position: absolute; right: 0; top: 15px; font-family: var(--mono); font-size: 9.5px; color: var(--accent); white-space: nowrap; letter-spacing: .04em; }
  .era .lab { display: grid; grid-template-columns: 1300fr 1000fr 400fr; margin-top: 20px; font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .habitat { display: flex; align-items: center; gap: 16px; margin-top: 12px; font-size: 13px; }
  .closeup {
    margin-top: auto; width: 100%; text-align: left;
    display: grid; grid-template-columns: 76px 1fr 18px; gap: 14px; align-items: center;
    padding: 10px; border: 1px solid var(--line); border-radius: 3px;
    transition: border-color .25s, background-color .25s;
  }
  .closeup-wrap { margin-top: auto; padding-top: 16px; }
  .closeup:hover, .closeup[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-tint); }
  .closeup .lens { width: 76px; height: 76px; border-radius: 2px; background-color: var(--chip); background-repeat: no-repeat; background-size: 520%; }
  .closeup b { font-family: var(--serif); font-weight: 400; font-size: 18px; display: block; letter-spacing: -.01em; }
  .closeup small { display: block; font-size: 11.5px; line-height: 1.4; color: var(--muted); margin-top: 3px; }
  .closeup .ico { width: 18px; height: 18px; transition: transform .3s var(--ease); }
  .closeup[aria-pressed="true"] .ico { transform: rotate(180deg); }

  /* ---------- focus (expanded) view ---------- */
  .hero.focus .side { opacity: 0; transform: translateX(-24px); pointer-events: none; }
  .hero.focus .info { opacity: 0; transform: translateX(24px); pointer-events: none; }
  .hero.focus .tabs { opacity: 0; transform: translateY(-16px); pointer-events: none; }

  /* ---------- tablet ---------- */
  @media (max-width: 1100px) {
    .hero { grid-template-columns: minmax(0, 1fr) clamp(280px, 36vw, 340px); }
    .side { display: none; }
    .main { padding-left: 20px; }
  }

  /* ---------- phone ---------- */
  @media (max-width: 760px) {
    .hero { display: flex; flex-direction: column; }
    .info { display: contents; }
    .top { order: 1; padding: 10px 14px 0; }
    .top::before { content: "Myth Atlas"; font-family: var(--serif); font-size: 21px; margin-right: auto; white-space: nowrap; }
    .search { flex: 0 0 32px; width: 32px; padding: 0; justify-content: center; border-radius: 50%; }
    .search input { display: none; }
    .main { order: 2; flex: 1; padding: 10px 14px 6px; }
    .tabs { gap: 8px; }
    .tab { width: auto; flex: 1; grid-template-columns: 44px 1fr; grid-template-rows: auto auto; column-gap: 8px; justify-items: start; align-items: center; padding: 6px 10px; }
    .tab img { width: 44px; height: 40px; grid-row: 1 / 3; }
    .tab b { align-self: end; margin: 0; font-size: 15px; }
    .tab i { align-self: start; font-size: 12px; }
    .rail { gap: 7px; }
    .rail button { width: 34px; height: 34px; }
    .turn { bottom: 30px; }
    .caption { font-size: 15px; }
    .hint { display: none; }
    .ground { bottom: 17%; height: 30px; }
    .card {
      order: 3; position: relative; z-index: 7;
      flex: 0 0 auto; max-height: 40dvh;
      border-radius: 10px 10px 0 0; border-width: 1px 0 0; box-shadow: none;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      transition: transform .5s var(--ease), background-color .6s;
    }
    .detail h1 { font-size: 34px; margin-top: 4px; }
    .tags { margin-top: 10px; }
    .lede { margin-top: 10px; font-size: 13px; }
    .detail h2 { margin-top: 12px; padding-top: 10px; }
    .hero.focus .card { transform: translateY(105%); }
    .hero.focus .top { opacity: 0; pointer-events: none; }
    .hero.focus .card { position: absolute; left: 0; right: 0; bottom: 0; }
  }
  @media (max-height: 620px) and (min-width: 761px) {
    .main { padding-top: 16px; }
    .side { padding-top: 14px; }
    .nav { margin-top: 12px; }
    .feature img, .feature p { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; transition-duration: .01s !important; }
  }
</style>
</head>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ data */
const DINOS = [
  {
    id: 'phoenix', no: 'MA-001', era: [-800, -430], eraLabel: 'Herodotus, 430 BC', scale: '1 m',
    name: 'Phoenix', latin: 'Phoenix ignis', family: 'Fire birds',
    image: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261031_020340_4815bb8d-68c3-48c4-ad05-6307d085e896.png&w=900&q=85',
    model: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261031_015714_12c0e407-828a-4b1f-957c-2efe1fe83be1.glb',
    yaw: 3.9, pitch: 0.1,

    traits: [
      ['t-wing', 'Wingspan', '4 m'],
      ['t-time', 'Lifespan', '500 years, then again'],
      ['t-diet', 'Diet', 'Frankincense and myrrh'],
      ['t-range', 'Reported', 'Heliopolis, Egypt'],
    ],
    habitat: 'Temple roofs, desert dawns and the pages of Herodotus.',
    caption: 'Burns once a lifetime. Never twice the same.',
    closeup: 'Each tail plume ends in a pale gold tip, the only part said to survive the fire.',
    lens: '55% 25%',
    feature: ['A fire you can outlive.', 'Crimson, gold and patient. The bird that refuses to end.'],
  },
  {
    id: 'kraken', no: 'MA-002', era: [1180, 1752], eraLabel: 'Pontoppidan, 1752', scale: '10 m',
    name: 'Kraken', latin: 'Architeuthis mythos', family: 'Sea monsters',
    image: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261031_020342_3e375b40-2c06-4189-995a-acbc21f06142.png&w=900&q=85',
    model: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261031_013537_0dc2c71f-4f11-4a86-ab93-91a59535d5b7.glb',
    yaw: 0.75, pitch: 0.12,
    tags: ['Abyssal', 'Ship-taker', 'Norse'],
    lede: 'Norwegian sailors described an island that was not there the day before, then the whirlpool it left when it sank. Bishop Pontoppidan wrote it up in 1752 as the largest creature in the world. The giant squid, hauled up a century later, turned out to be the smaller, truer version of the same story.',
    traits: [
      ['t-ruler', 'Length', 'A mile across, by oath'],
      ['t-depth', 'Depth', 'Norwegian Sea floor'],
      ['t-diet', 'Diet', 'Fish, whales and ships'],
      ['t-range', 'Reported', 'Off Bergen, Norway'],
    ],
    habitat: 'Cold deep water between Norway and Iceland.',
    caption: 'The island breathed, and the crew stopped rowing.',
    closeup: 'Suckers the width of a barrel lid, each ringed with a horn like a saw.',
    lens: '30% 45%',
    feature: ['An island with an appetite.', 'Eight arms, two tentacles and a thousand years of sailors‚Äô tales.'],
  },
];

/* ------------------------------------------------------------------- dom */
const $ = (id) => document.getElementById(id);
const hero = $('hero'), stage = $('stage'), canvas = $('gl'), loader = $('loader');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const use = (id) => `<svg class="ico"><use href="#${id}"/></svg>`;
let active = 0;

$('tabs').innerHTML = DINOS.map((b, i) => `
  <button class="tab" role="tab" id="tab-${b.id}" aria-selected="${i === active}" aria-controls="detail" tabindex="${i === active ? 0 : -1}" data-i="${i}" data-no="${String(i + 1).padStart(2, '0')}">
    <img src="${b.image}" alt="" loading="eager">
    <b>${b.name}</b><i>${b.latin}</i>
  </button>`).join('');
const tabEls = [...document.querySelectorAll('.tab')];

const SPAN = [-800, 1900];                                  // years, left to right
function eraHTML([from, to], label) {
  const pct = (y) => (y - SPAN[0]) / (SPAN[1] - SPAN[0]) * 100;
  return `<div class="era"><div class="bar"><b></b><b></b><b></b>
    <u class="${pct(from) < 50 ? 'l' : ''}" style="left:${pct(from).toFixed(2)}%;width:${Math.max(0.6, pct(to) - pct(from)).toFixed(2)}%" data-l="${label}"></u></div>
    <div class="lab"><span>Antiquity</span><span>Medieval</span><span>Modern</span></div></div>`;
}

function detailHTML(b) {
  const rows = [
    `<div class="eyebrow">${b.family} ¬∑ Specimen ${b.no}</div>`,
    `<h1>${b.name}<em>${b.latin}</em></h1>`,
    `<div class="tags">${b.tags.map((t) => `<span>${t}</span>`).join('')}</div>`,
    `<p class="lede">${b.lede}</p>`,
    eraHTML(b.era, b.eraLabel),
    `<h2>Field notes</h2>`,
    `<dl class="traits">${b.traits.map(([ic, k, v]) => `<div>${use(ic)}<dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`,
    `<h2>Haunts</h2>`,
    `<div class="habitat">${use('t-reed')}<span>${b.habitat}</span></div>`,
    `<div class="closeup-wrap"><button class="closeup" id="closeup" aria-pressed="false">
       <span class="lens" style="background-image:url('${b.image}');background-position:${b.lens}"></span>
       <span><b>Close-up Detail</b><small>${b.closeup}</small></span>${use('i-chev')}
     </button></div>`,
  ];
  return rows.map((r, i) => r.replace(/^<(\w+)/, `<$1 style="--i:${i}"`)).join('');
}

function paintInfo(i, instant) {
  const b = DINOS[i], d = $('detail');
  const fill = () => {
    d.classList.remove('leaving');
    d.innerHTML = detailHTML(b);
    d.parentElement.scrollTop = 0;
    $('caption').textContent = b.caption;
    $('scale').textContent = b.scale;
    $('featImg').src = b.image;
    $('featTitle').textContent = b.feature[0];
    $('featText').textContent = b.feature[1];
    $('fallback').style.backgroundImage = `url('${b.image}')`;
  };
  if (instant) return fill();
  d.classList.add('leaving');
  setTimeout(fill, reduced ? 0 : 200);
}

/* ----------------------------------------------------------------- scene */
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.95;

const FOV = 26;
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);
const key = new THREE.DirectionalLight(0xfff4e2, 1.6); key.position.set(2.5, 4, 5);
const rim = new THREE.DirectionalLight(0xbfd8ff, 0.5); rim.position.set(-4, 2, -3);
scene.add(key, rim);

const LIGHTS = {
  day:  { env: 0.95, key: 1.6, rim: 0.5, keyColor: 0xfff4e2, exposure: 1.05 },
  dusk: { env: 0.28, key: 2.6, rim: 1.9, keyColor: 0xffc98a, exposure: 1.0 },
};
let lightNow = { ...LIGHTS.day }, lightGoal = LIGHTS.day;
const keyGoal = new THREE.Color(LIGHTS.day.keyColor);

/* each creature: pivot (slide, scale, sway) > spin (free rotation from the hand) > model */
const rigs = DINOS.map((b) => {
  const pivot = new THREE.Group(), spin = new THREE.Group();
  pivot.add(spin); pivot.visible = false; scene.add(pivot);
  const home = new THREE.Quaternion().setFromEuler(new THREE.Euler(b.pitch, b.yaw, 0, 'YXZ'));
  spin.quaternion.copy(home);
  return { pivot, spin, home, loaded: false, failed: false, promise: null, k: 0, x: 0, twist: 0 };
});

const gltf = new GLTFLoader();
const draco = new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
gltf.setDRACOLoader(draco).setMeshoptDecoder(MeshoptDecoder);

function loadModel(i) {
  const rig = rigs[i];
  if (rig.promise) return rig.promise;
  rig.promise = gltf.loadAsync(DINOS[i].model).then((g) => {
    const model = g.scene;
    const box = new THREE.Box3().setFromObject(model);
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    model.position.sub(sphere.center);
    const holder = new THREE.Group();
    holder.add(model);
    holder.scale.setScalar(1 / sphere.radius);          // every model has radius 1
    const aniso = renderer.capabilities.getMaxAnisotropy();
    model.traverse((o) => {
      if (!o.isMesh) return;
      o.frustumCulled = false;
      for (const m of [].concat(o.material)) {
        if (m.map) m.map.anisotropy = aniso;
        m.envMapIntensity = 1;
      }
    });
    rig.spin.add(holder);
    rig.loaded = true;
  }).catch((err) => { console.error('Model failed to load:', DINOS[i].id, err); rig.failed = true; });
  return rig.promise;
}

/* ---------------------------------------------------------------- layout */
// The canvas spans the whole hero so the model is never cropped by a panel;
// the camera's principal point is shifted onto the stage centre instead.
const view = { cx: 0, cy: 0, px: 200, W: 1, H: 1, first: true };
const goal = { cx: 0, cy: 0, px: 200, sw: 600 };
let zoom = 1, zoomGoal = 1;
const ZMIN = 0.55, ZMAX = 3.4;

function measure() {
  const h = hero.getBoundingClientRect();
  const s = hero.classList.contains('focus') ? h : stage.getBoundingClientRect();
  view.W = h.width; view.H = h.height;
  goal.cx = s.left - h.left + s.width / 2;
  goal.cy = s.top - h.top + s.height * (hero.classList.contains('focus') ? 0.5 : 0.44);
  goal.px = Math.min(s.width * 0.5, s.height * 0.6) * 1.16;
  goal.sw = s.width;
  renderer.setSize(view.W, view.H, false);
  camera.aspect = view.W / view.H;
  if (view.first) { Object.assign(view, { cx: goal.cx, cy: goal.cy, px: goal.px, first: false }); }
}
new ResizeObserver(measure).observe(hero);
new ResizeObserver(measure).observe(stage);
addEventListener('orientationchange', measure);

/* ----------------------------------------------------------- interaction */
const X = new THREE.Vector3(1, 0, 0), Y = new THREE.Vector3(0, 1, 0);
const q = new THREE.Quaternion();
const turnBy = (rig, ax, ay) => {
  rig.spin.quaternion.premultiply(q.setFromAxisAngle(Y, ax));
  rig.spin.quaternion.premultiply(q.setFromAxisAngle(X, ay));
};
const vel = { x: 0, y: 0 };
let yawQueue = 0, homing = false, lastTouch = -1e9;
const pointers = new Map();
let pinch = 0;
const touched = () => { lastTouch = performance.now(); homing = false; hero.classList.add('touched'); };

stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button')) return;
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
  vel.x = vel.y = 0; yawQueue = 0;
  stage.classList.add('dragging'); touched();
});
stage.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch) setZoom(zoomGoal * d / pinch);
    pinch = d;
    return;
  }
  const k = Math.PI / Math.max(260, view.px * 1.6);   // about half a turn per model-width
  vel.x = dx * k; vel.y = dy * k;
  turnBy(rigs[active], vel.x, vel.y);
  touched();
});
const release = (e) => {
  pointers.delete(e.pointerId); pinch = 0;
  if (!pointers.size) stage.classList.remove('dragging');
};
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  setZoom(zoomGoal * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)));
  touched();
}, { passive: false });
stage.addEventListener('dblclick', (e) => { if (!e.target.closest('button')) reset(); });
stage.addEventListener('keydown', (e) => {
  const step = 0.18;
  const map = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (map[e.key]) { e.preventDefault(); turnBy(rigs[active], ...map[e.key]); touched(); }
  if (e.key === '+' || e.key === '=') setZoom(zoomGoal * 1.2);
  if (e.key === '-') setZoom(zoomGoal / 1.2);
  if (e.key === '0') reset();
});

function setZoom(z) {
  zoomGoal = Math.min(ZMAX, Math.max(ZMIN, z));
  $('zoomIn').classList.toggle('on', zoomGoal >= 1);
  $('zoomOut').classList.toggle('on', zoomGoal < 1);
  const c = $('closeup'); if (c) c.setAttribute('aria-pressed', zoomGoal > 2.2);
}
function reset() { homing = true; vel.x = vel.y = 0; yawQueue = 0; setZoom(1); }

$('zoomIn').onclick = () => { setZoom(zoomGoal * 1.35); touched(); };
$('zoomOut').onclick = () => { setZoom(zoomGoal / 1.35); touched(); };
$('turnL').onclick = () => { yawQueue -= Math.PI / 2; touched(); };
$('turnR').onclick = () => { yawQueue += Math.PI / 2; touched(); };
$('turnFull').onclick = () => { yawQueue += Math.PI * 2; touched(); };
$('expand').onclick = () => setFocus(!hero.classList.contains('focus'));
$('light').onclick = () => {
  const dusk = hero.dataset.light !== 'dusk';
  hero.dataset.light = dusk ? 'dusk' : 'day';
  document.body.style.background = dusk ? '#14170f' : '';
  lightGoal = LIGHTS[hero.dataset.light];
  keyGoal.set(lightGoal.keyColor);
  $('light').classList.toggle('on', dusk);
  $('light').setAttribute('aria-pressed', dusk);
  $('light').setAttribute('aria-label', dusk ? 'Switch to daylight' : 'Switch to dusk lighting');
};
function setFocus(on) {
  hero.classList.toggle('focus', on);
  $('expand').classList.toggle('on', on);
  $('expand').setAttribute('aria-pressed', on);
  $('expand').setAttribute('aria-label', on ? 'Close expanded viewer' : 'Expand viewer');
  measure();
}
addEventListener('keydown', (e) => { if (e.key === 'Escape') setFocus(false); });
$('detail').addEventListener('click', (e) => {
  const c = e.target.closest('#closeup');
  if (!c) return;
  setZoom(zoomGoal > 2.2 ? 1 : 2.6); touched();
});

/* ------------------------------------------------------------ tab switch */
const DUR = reduced ? 1 : 780;
let anim = null;          // { from, to, dir, t0 }

async function select(i) {
  if (i === active) return;
  const from = active, dir = Math.sign(i - from);
  active = i;
  tabEls.forEach((t, n) => { t.setAttribute('aria-selected', n === i); t.tabIndex = n === i ? 0 : -1; });
  paintInfo(i);
  stage.classList.remove('failed');
  stage.classList.add('switching');
  vel.x = vel.y = 0; yawQueue = 0; setZoom(1);
  anim = { from, to: -1, dir, t0: performance.now() };      // old model leaves at once
  const rig = rigs[i];
  if (!rig.loaded && !rig.failed) { loader.classList.add('show'); await loadModel(i); }
  if (active !== i) return;                                 // user moved on meanwhile
  loader.classList.remove('show');
  if (rig.failed) { stage.classList.add('failed'); stage.classList.remove('switching'); return; }
  rig.spin.quaternion.copy(rig.home);
  const now = performance.now();
  anim = { from: anim ? anim.from : -1, to: i, dir, t0: anim ? anim.t0 : now, t1: now };
  stage.classList.remove('switching');
}
tabEls.forEach((t) => {
  t.addEventListener('click', () => select(+t.dataset.i));
  t.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const n = (+t.dataset.i + (e.key === 'ArrowRight' ? 1 : -1) + DINOS.length) % DINOS.length;
    tabEls[n].focus(); select(n);
  });
});

/* ------------------------------------------------------------------ loop */
const inCubic = (t) => t * t * t;
const outCubic = (t) => 1 - Math.pow(1 - t, 3);
const outBack = (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);
const clamp01 = (t) => Math.min(1, Math.max(0, t));
let last = performance.now();

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const f = (rate) => 1 - Math.exp(-dt * rate);

  // camera follows the stage
  view.cx += (goal.cx - view.cx) * f(7);
  view.cy += (goal.cy - view.cy) * f(7);
  view.px += (goal.px - view.px) * f(7);
  zoom += (zoomGoal - zoom) * f(6);
  camera.position.z = view.H / (2 * Math.tan(THREE.MathUtils.degToRad(FOV / 2)) * view.px * zoom);
  camera.setViewOffset(view.W, view.H, view.W / 2 - view.cx, view.H / 2 - view.cy, view.W, view.H);

  // lights
  for (const k of ['env', 'key', 'rim', 'exposure']) lightNow[k] += (lightGoal[k] - lightNow[k]) * f(4);
  scene.environmentIntensity = lightNow.env; key.intensity = lightNow.key; rim.intensity = lightNow.rim;
  renderer.toneMappingExposure = lightNow.exposure; key.color.lerp(keyGoal, f(4));

  // transition
  const slide = (goal.sw * 0.95) / view.px;        // world units ‚âà one stage width
  rigs.forEach((r) => { r.k = 0; r.x = 0; r.twist = 0; });
  rigs[active].k = anim ? 0 : 1;
  if (anim) {
    if (anim.from >= 0) {
      const t = clamp01((now - anim.t0) / (DUR * 0.6)), e = inCubic(t);
      Object.assign(rigs[anim.from], { k: 1 - e, x: -anim.dir * e * slide, twist: -anim.dir * e * 1.4 });
      if (t >= 1) anim.from = -1;
    }
    if (anim.to >= 0) {
      const t = clamp01((now - anim.t1) / DUR), e = outCubic(t);
      Object.assign(rigs[anim.to], { k: Math.max(0.0001, outBack(t)) * (0.25 + 0.75 * e), x: anim.dir * (1 - e) * slide, twist: anim.dir * (1 - e) * 1.6 });
      if (t >= 1 && anim.from < 0) anim = null;
    }
  }

  // hand, inertia, queued turns, homing
  const rig = rigs[active];
  if (!pointers.size) {
    if (Math.abs(vel.x) + Math.abs(vel.y) > 1e-4) {
      turnBy(rig, vel.x, vel.y);
      const d = Math.exp(-dt * 4.5); vel.x *= d; vel.y *= d;
    }
    if (Math.abs(yawQueue) > 1e-3) {
      const step = yawQueue * f(4.2);
      turnBy(rig, step, 0); yawQueue -= step;
    }
    if (homing) {
      rig.spin.quaternion.slerp(rig.home, f(6));
      if (rig.spin.quaternion.angleTo(rig.home) < 0.002) homing = false;
    }
  }

  // idle life: a slow sway and hover, eased back in after the hand lets go
  const idle = reduced ? 0 : clamp01((now - lastTouch - 1800) / 1500);
  const s = now / 1000;
  rigs.forEach((r, i) => {
    r.pivot.visible = r.loaded && r.k > 0.0005;
    if (!r.pivot.visible) return;
    r.pivot.scale.setScalar(r.k);
    r.pivot.position.set(r.x, (reduced ? 0 : Math.sin(s * 1.3 + i) * 0.028), 0);
    r.pivot.rotation.set(Math.sin(s * 0.9) * 0.03 * idle, r.twist + Math.sin(s * 0.55) * 0.16 * idle, 0);
  });

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------ boot */
paintInfo(active, true);
measure();
loader.classList.add('show');
requestAnimationFrame(frame);
loadModel(active).then(() => {
  loader.classList.remove('show');
  if (rigs[active].failed) { stage.classList.add('failed'); }
  else anim = { from: -1, to: active, dir: 1, t0: performance.now(), t1: performance.now() };
  DINOS.forEach((_, i) => loadModel(i));                     // warm the other model
});
</script>
</body>
</html>
