<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOONHUB - 3D Shape Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; height: 100vh; font-family: 'Inter', sans-serif; }

    .outer {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      transition: background-color 650ms cubic-bezier(0.4,0,0.2,1);
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 200px 200px;
      opacity: 0.4;
    }

    .ghost-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      user-select: none;
      z-index: 2;
      top: 18%;
    }
    .ghost-text span {
      font-family: 'Anton', sans-serif;
      font-size: clamp(90px, 28vw, 380px);
      font-weight: 900;
      color: white;
      opacity: 1;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand {
      position: absolute;
      top: 24px;
      left: 16px;
      z-index: 60;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: white;
      opacity: 0.9;
    }

    .carousel {
      position: absolute;
      inset: 0;
      z-index: 3;
    }

    .carousel-item {
      position: absolute;
      aspect-ratio: 0.6 / 1;
      transition: transform 650ms cubic-bezier(0.4,0,0.2,1),
                  filter 650ms cubic-bezier(0.4,0,0.2,1),
                  opacity 650ms cubic-bezier(0.4,0,0.2,1),
                  left 650ms cubic-bezier(0.4,0,0.2,1),
                  bottom 650ms cubic-bezier(0.4,0,0.2,1),
                  height 650ms cubic-bezier(0.4,0,0.2,1);
      will-change: transform, filter, opacity;
    }
    .carousel-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .bottom-left {
      position: absolute;
      bottom: 24px;
      left: 16px;
      z-index: 60;
      max-width: 320px;
    }
    .bottom-left .title {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
      font-size: 16px;
      color: white;
      opacity: 0.95;
    }
    .bottom-left .desc {
      font-size: 12px;
      color: white;
      opacity: 0.85;
      line-height: 1.6;
      margin-bottom: 16px;
      display: none;
    }
    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: transparent;
      border: 2px solid white;
      color: white;
      cursor: pointer;
      transition: transform 150ms, background-color 150ms;
      flex-shrink: 0;
    }
    .nav-btn:hover {
      transform: scale(1.08);
      background-color: rgba(255,255,255,0.12);
    }
    .nav-btn svg {
      width: 26px;
      height: 26px;
    }

    .bottom-right {
      position: absolute;
      bottom: 24px;
      right: 16px;
      z-index: 60;
    }
    .bottom-right a {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Anton', sans-serif;
      font-size: clamp(20px, 4vw, 56px);
      font-weight: 400;
      color: white;
      opacity: 0.95;
      letter-spacing: -0.02em;
      line-height: 1;
      text-transform: uppercase;
      text-decoration: none;
      transition: opacity 200ms;
    }
    .bottom-right a:hover { opacity: 1; }
    .bottom-right a svg {
      width: 20px;
      height: 20px;
    }

    @media (min-width: 640px) {
      .brand { left: 32px; }
      .bottom-left {
        bottom: 80px;
        left: 96px;
      }
      .bottom-left .title {
        font-size: 22px;
        margin-bottom: 12px;
      }
      .bottom-left .desc {
        display: block;
        font-size: 14px;
        margin-bottom: 20px;
      }
      .nav-buttons { gap: 12px; }
      .nav-btn { width: 64px; height: 64px; }
      .bottom-right {
        bottom: 80px;
        right: 40px;
      }
      .bottom-right a svg { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>
  <div class="outer" id="outer">
    <div class="grain"></div>
    <div class="ghost-text"><span>3D SHAPE</span></div>
    <div class="brand">TOONHUB</div>

    <div class="carousel" id="carousel"></div>

    <div class="bottom-left">
      <p class="title">TOONHUB FIGURINES</p>
      <p class="desc">The artwork is stunning, shipped fully prepared. The finish is a vision, the 3D craft is flawless. Many thanks! Wishing you the win. Order now.</p>
      <div class="nav-buttons">
        <button class="nav-btn" id="prevBtn" aria-label="Previous">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <button class="nav-btn" id="nextBtn" aria-label="Next">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </div>

    <div class="bottom-right">
      <a href="#">
        DISCOVER IT
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </div>
  </div>

  <script>
    const IMAGES = [
      { src: 'https://fifth-gentle-45902158.figma.site/_components/v2/4de492f6d9cf8244ad5293233e5c6f52407d42fc/1.02464a56.png', bg: '#F4845F' },
      { src: 'https://fifth-gentle-45902158.figma.site/_components/v2/4de492f6d9cf8244ad5293233e5c6f52407d42fc/2.b977faab.png', bg: '#6BBF7A' },
      { src: 'https://fifth-gentle-45902158.figma.site/_components/v2/4de492f6d9cf8244ad5293233e5c6f52407d42fc/3.4df853b4.png', bg: '#E882B4' },
      { src: 'https://fifth-gentle-45902158.figma.site/_components/v2/4de492f6d9cf8244ad5293233e5c6f52407d42fc/4.4457fbce.png', bg: '#6EB5FF' },
    ];

    // Preload
    IMAGES.forEach(img => { const el = new Image(); el.src = img.src; });

    let activeIndex = 0;
    let isAnimating = false;

    const outer = document.getElementById('outer');
    const carousel = document.getElementById('carousel');

    // Create carousel items
    const items = IMAGES.map((img, i) => {
      const div = document.createElement('div');
      div.className = 'carousel-item';
      const imgEl = document.createElement('img');
      imgEl.src = img.src;
      imgEl.alt = `Character ${i + 1}`;
      imgEl.draggable = false;
      div.appendChild(imgEl);
      carousel.appendChild(div);
      return div;
    });

    function isMobile() { return window.innerWidth < 640; }

    function getRoleStyles(role) {
      const mobile = isMobile();
      switch (role) {
        case 'center': return {
          transform: `translateX(-50%) scale(${mobile ? 1.25 : 1.68})`,
          filter: 'blur(0px)', opacity: 1, zIndex: 20,
          left: '50%', height: mobile ? '60%' : '92%',
          bottom: mobile ? '22%' : '0px'
        };
        case 'left': return {
          transform: 'translateX(-50%) scale(1)',
          filter: 'blur(2px)', opacity: 0.85, zIndex: 10,
          left: mobile ? '20%' : '30%', height: mobile ? '16%' : '28%',
          bottom: mobile ? '32%' : '12%'
        };
        case 'right': return {
          transform: 'translateX(-50%) scale(1)',
          filter: 'blur(2px)', opacity: 0.85, zIndex: 10,
          left: mobile ? '80%' : '70%', height: mobile ? '16%' : '28%',
          bottom: mobile ? '32%' : '12%'
        };
        case 'back': return {
          transform: 'translateX(-50%) scale(1)',
          filter: 'blur(4px)', opacity: 1, zIndex: 5,
          left: '50%', height: mobile ? '13%' : '22%',
          bottom: mobile ? '32%' : '12%'
        };
      }
    }

    function getRole(i) {
      if (i === activeIndex) return 'center';
      if (i === (activeIndex + 3) % 4) return 'left';
      if (i === (activeIndex + 1) % 4) return 'right';
      return 'back';
    }

    function render() {
      outer.style.backgroundColor = IMAGES[activeIndex].bg;
      items.forEach((div, i) => {
        const role = getRole(i);
        const s = getRoleStyles(role);
        Object.assign(div.style, {
          transform: s.transform, filter: s.filter,
          opacity: s.opacity, zIndex: s.zIndex,
          left: s.left, height: s.height, bottom: s.bottom
        });
      });
    }

    function navigate(dir) {
      if (isAnimating) return;
      isAnimating = true;
      if (dir === 'next') activeIndex = (activeIndex + 1) % 4;
      else activeIndex = (activeIndex + 3) % 4;
      render();
      setTimeout(() => { isAnimating = false; }, 650);
    }

    document.getElementById('prevBtn').addEventListener('click', () => navigate('prev'));
    document.getElementById('nextBtn').addEventListener('click', () => navigate('next'));
    window.addEventListener('resize', render);

    render();
  </script>
</body>
</html>
