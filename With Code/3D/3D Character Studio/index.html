<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mainframe</title>
<link rel="stylesheet" href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium">
<link rel="stylesheet" href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg">
<style>
:root{--font-heading:'HelveticaNowDisplay-Medium','Helvetica Neue',Arial,sans-serif;--font-body:'HelveticaNowDisplayW01-Rg','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{font-family:var(--font-body);background:radial-gradient(ellipse at 75% 40%,#e8173c 0%,#c4002a 45%,#8c0020 100%);color:#fff;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:70% center}
nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
.logo{display:flex;gap:12px;align-items:center}
.logo .t{font-family:var(--font-heading);font-size:21px;letter-spacing:-0.025em}
.logo .s{font-size:25px;user-select:none;letter-spacing:-0.02em}
.links,.cta{display:none;font-size:23px}
.links a,.cta{transition:opacity .2s}
.links a:hover,.cta:hover{opacity:.6}
.cta{text-decoration:underline;text-underline-offset:2px}
.burger{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:4px}
.burger i{display:block;width:24px;height:2px;background:#fff;transition:all .3s}
.burger.open i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.open i:nth-child(2){opacity:0}
.burger.open i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
#ov{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;justify-content:center;gap:32px;padding:0 32px;opacity:0;pointer-events:none;transition:opacity .3s}
#ov.open{opacity:1;pointer-events:auto}
#ov a{font-size:32px;font-weight:500}
#ov a.u{text-decoration:underline}
.hero{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 20px 48px;overflow:hidden}
.box{max-width:36rem;position:relative;z-index:10}
.intro{pointer-events:none;user-select:none;margin-bottom:20px;font-size:clamp(18px,4vw,26px);line-height:1.3;font-weight:400;filter:blur(4px)}
#tw{margin-bottom:20px;font-size:clamp(18px,4vw,26px);line-height:1.35;font-weight:400;min-height:54px}
.cur{display:inline-block;width:2px;height:1.1em;background:#fff;vertical-align:middle;margin-left:2px;animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.pills{display:flex;flex-wrap:wrap;row-gap:4px;opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease}
.pills.show{opacity:1;transform:none}
.pill{display:inline-flex;align-items:center;justify-content:center;font:inherit;cursor:pointer;background:#fff;color:#000;border:1px solid rgba(0,0,0,.1);border-radius:9999px;font-size:13px;padding:.3em 16px;margin:0 .2em .4em;white-space:nowrap;transition:background-color .2s,color .2s,border-color .2s}
.pill:hover{background:#000;color:#fff}
.pill.o{background:transparent;color:#fff;border-color:#fff;gap:8px}
.pill.o:hover{background:#fff;color:#000}
.pill.o u{text-underline-offset:1px}
@media(min-width:640px){
nav{padding:20px 32px}
.logo .t{font-size:26px}.logo .s{font-size:30px}
.hero{padding-left:32px;padding-right:32px}
.intro,#tw{margin-bottom:24px}
.pill{font-size:15px;padding:.3em 20px}
.pill.o{gap:12px}
}
@media(min-width:768px){
.links,.cta{display:block}.burger,#ov{display:none}
.hero{justify-content:center;padding-bottom:0;padding-left:40px;padding-right:40px}
}
</style>
</head>
<body>
<video id="bg" muted playsinline preload="auto" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260826_041744_63efcd78-bf7d-4039-99e2-2461e8a61903.mp4"></video>
<nav>
  <div class="logo"><span class="t">Mainframe®</span><span class="s">✳︎</span></div>
  <div class="links"><a href="#">Labs</a>, <a href="#">Studio</a>, <a href="#">Openings</a>, <a href="#">Shop</a></div>
  <a href="#" class="cta">Get in touch</a>
  <button class="burger" id="bb" aria-label="Menu"><i></i><i></i><i></i></button>
</nav>
<div id="ov"><a href="#">Labs</a><a href="#">Studio</a><a href="#">Openings</a><a href="#">Shop</a><a href="#" class="u">Get in touch</a></div>
<section class="hero">
  <div class="box">
    <p class="intro">Hey there, meet A.R.I.A,<br>Mainframe's Adaptive Response Interface Agent</p>
    <p id="tw"><span id="txt"></span><span class="cur" id="cur"></span></p>
    <div class="pills" id="pills">
      <button class="pill">Pitch us an idea</button>
      <button class="pill">Come work here</button>
      <button class="pill">Send a brief hello</button>
      <button class="pill">See how we operate</button>
      <button class="pill o" id="copy"><span>Reach us: <u>hello@mainframe.co</u></span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
    </div>
  </div>
</section>
<script>
(function(){
  var bb=document.getElementById('bb'),ov=document.getElementById('ov');
  bb.onclick=function(){bb.classList.toggle('open');ov.classList.toggle('open')};
  var full="Glad you stopped in. Good taste tends to find us. Now, what are we building?";
  var txt=document.getElementById('txt'),cur=document.getElementById('cur'),i=0;
  setTimeout(function(){var iv=setInterval(function(){i++;txt.textContent=full.slice(0,i);if(i>=full.length){clearInterval(iv);cur.style.display='none'}},38)},600);
  setTimeout(function(){document.getElementById('pills').classList.add('show')},400);
  var c=document.getElementById('copy');
  c.onclick=function(){try{navigator.clipboard.writeText('hello@mainframe.co')}catch(e){}};
  var v=document.getElementById('bg'),prevX=null,target=0,seeking=false,S=0.8;
  function seek(){if(!v.duration||seeking)return;if(Math.abs(v.currentTime-target)<0.01)return;seeking=true;v.currentTime=target}
  v.addEventListener('seeked',function(){seeking=false;seek()});
  window.addEventListener('mousemove',function(e){
    if(prevX===null){prevX=e.clientX;return}
    var d=e.clientX-prevX;prevX=e.clientX;
    if(!v.duration)return;
    target=Math.max(0,Math.min(v.duration,target+(d/window.innerWidth)*S*v.duration));
    seek();
  });
})();
</script>
</body>
</html>
