<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background-color: #f0f0ee;
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Navbar */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 1rem;
      padding-left: 1rem;
      padding-right: 1rem;
      gap: 0.5rem;
    }

    .logo-circle {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      width: 2.5rem;
      height: 2.5rem;
      background-color: #EDEDED;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1rem;
      border-radius: 0.75rem;
      padding: 0.625rem 1rem;
      background-color: #EDEDED;
    }

    .nav-links a {
      font-size: 12px;
      font-weight: 500;
      color: #374151;
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #111827;
    }

    /* Hero */
    .hero {
      flex: 1;
      display: flex;
      align-items: flex-end;
      padding-bottom: 2.5rem;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }

    .hero-inner {
      max-width: 20rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 11.5px;
      font-weight: 500;
      color: #3b82f6;
      text-decoration: none;
      margin-bottom: 0.75rem;
      transition: color 0.2s;
    }

    .badge:hover {
      color: #2563eb;
    }

    .badge .arrow {
      display: inline-block;
      transition: transform 0.2s;
    }

    .badge:hover .arrow {
      transform: translateX(2px);
    }

    .headline {
      font-size: 1.5rem;
      line-height: 1.15;
      font-weight: 500;
      color: #111827;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
    }

    .subtext {
      font-size: 13px;
      color: #9ca3af;
      font-weight: 400;
      margin-bottom: 0.75rem;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 13px;
      font-weight: 500;
      color: #3b82f6;
      border: 1px solid #60a5fa;
      border-radius: 9999px;
      padding: 0.625rem 1.25rem;
      text-decoration: none;
      transition: all 0.2s;
    }

    .cta:hover {
      background-color: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }

    .cta .arrow {
      display: inline-block;
      transition: transform 0.2s;
    }

    .cta:hover .arrow {
      transform: translateX(2px);
    }

    /* Responsive */
    @media (min-width: 640px) {
      .navbar {
        padding-top: 1.5rem;
        padding-left: 2rem;
        padding-right: 2rem;
        gap: 0.75rem;
      }

      .logo-circle {
        width: 2.75rem;
        height: 2.75rem;
      }

      .nav-links {
        gap: 2.5rem;
        padding: 0.75rem 2rem;
      }

      .nav-links a {
        font-size: 14px;
      }

      .hero {
        padding-bottom: 4rem;
        padding-left: 3rem;
        padding-right: 3rem;
      }

      .headline {
        font-size: 1.75rem;
      }
    }

    @media (min-width: 768px) {
      .hero {
        padding-left: 5rem;
        padding-right: 5rem;
      }
    }

    @media (min-width: 1024px) {
      .hero {
        padding-bottom: 5rem;
        padding-left: 7rem;
        padding-right: 7rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- Background video -->
    <video
      class="bg-video"
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260508_215831_c6a8989c-d716-4d8d-8745-e972a2eec711.mp4"
      autoplay
      muted
      loop
      playsinline
    ></video>

    <!-- Content -->
    <div class="content">
      <!-- Navbar -->
      <nav class="navbar">
        <div class="logo-circle">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 256 256">
            <path
              d="M 160 88 L 194 34 L 216 0 L 256 0 L 256 40 L 221.5 93.5 L 200 128 L 256 128 L 256 256 L 96 256 L 96 168 L 64.246 220 L 40 256 L 0 256 L 0 216 L 34 162 L 56 128 L 0 128 L 0 0 L 160 0 Z"
              fill="rgb(84, 84, 84)"
            />
          </svg>
        </div>
        <div class="nav-links">
          <a href="#">Story</a>
          <a href="#">Products</a>
          <a href="#">Help</a>
          <a href="#">Support</a>
        </div>
      </nav>

      <!-- Hero -->
      <div class="hero">
        <div class="hero-inner">
          <a href="#" class="badge">
            Seen on Shark Tank in India
            <span class="arrow">&rarr;</span>
          </a>

          <h1 class="headline">Simple, smart prosthetics made for people who keep fighting.</h1>

          <p class="subtext">Reclaim your movement now.</p>

          <a href="#" class="cta">
            Try a free fitting
            <span class="arrow">&rarr;</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
