:root{--s:1;--fx:0px;--fy:0px;--ink:#f4efe6;--muted:#8f8f8f;--bg:#050505}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Newsreader",Georgia,serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}

#wood{position:fixed;inset:0;background:#050505 center/cover no-repeat;z-index:0}
#stage{position:fixed;inset:0;z-index:1;touch-action:none}
#stage canvas{display:block;outline:none}
.open #stage{cursor:grab}
.open #stage.grabbing{cursor:grabbing}

/* ---------- logo ---------- */
.logo{position:fixed;left:50%;top:calc(var(--fy) + 5px*var(--s));transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none;width:calc(240px*var(--s))}
.logo .t{display:block;font-family:"Patrick Hand",cursive;font-size:calc(21.4px*var(--s));line-height:1;letter-spacing:.125em;padding-left:.125em;color:#fff}
.logo .st{display:block;font-family:"Caveat",cursive;font-weight:500;font-size:calc(23px*var(--s));line-height:1;margin-top:calc(3px*var(--s));color:#fff}
.logo svg{display:block;width:calc(158px*var(--s));height:calc(6px*var(--s));margin:calc(3px*var(--s)) auto 0}

/* ---------- arrows ---------- */
.navArrow{position:fixed;z-index:6;top:calc(var(--fy) + 420px*var(--s));width:calc(80px*var(--s));height:calc(40px*var(--s));display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s}
.navArrow svg{width:calc(68px*var(--s));height:calc(30px*var(--s));overflow:visible;transition:transform .25s cubic-bezier(.3,.7,.2,1)}
.navArrow.prev{left:calc(var(--fx) + 54px*var(--s))}
.navArrow.next{left:calc(var(--fx) + 1306px*var(--s))}
.navArrow.next svg{transform:scaleX(-1)}
.navArrow.prev:hover svg{transform:translateX(calc(-10px*var(--s))) rotate(-6deg)}
.navArrow.next:hover svg{transform:scaleX(-1) translateX(calc(-10px*var(--s))) rotate(-6deg)}
.open .navArrow{opacity:1;pointer-events:auto}
.open .navArrow[disabled]{opacity:.2;pointer-events:none}

/* ---------- page dots ---------- */
.dots{position:fixed;z-index:6;left:50%;top:var(--dotsY,814px);transform:translate(-50%,-50%);display:flex;align-items:center;gap:calc(12px*var(--s));opacity:0;pointer-events:none;transition:opacity .5s .2s}
.open .dots{opacity:1;pointer-events:auto}
.dot{position:relative;width:calc(14.5px*var(--s));height:calc(14.5px*var(--s));border-radius:50%;background:#333 center/cover no-repeat;transition:width .35s,height .35s,box-shadow .35s;overflow:hidden}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.35),rgba(255,255,255,0) 45%),radial-gradient(circle at 60% 65%,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
.dot.on{width:calc(20.5px*var(--s));height:calc(20.5px*var(--s));box-shadow:0 0 calc(10px*var(--s)) rgba(255,190,110,.45)}
.dot:not(.on){opacity:.7}
.dot:hover{opacity:1}

/* ---------- footer ---------- */
.foot{position:fixed;z-index:6;bottom:calc(var(--fy) - 9px*var(--s));font-size:calc(15.2px*var(--s));line-height:1;color:var(--muted);letter-spacing:.005em;height:calc(26px*var(--s));display:flex;align-items:flex-start;white-space:nowrap}
.foot.l{left:calc(var(--fx) + 26px*var(--s))}
.foot.r{right:calc(var(--fx) + 26px*var(--s));gap:calc(19px*var(--s))}
.foot a,.foot button{text-decoration:none;color:#bdbdbd;transition:color .3s}
.foot a:hover,.foot button:hover{color:#fff;text-decoration:underline}
.foot .dim{color:#5c5c5c}

/* ---------- intro (driven by the scroll progress in JS) ---------- */
.pretext{position:fixed;z-index:4;left:0;right:0;top:var(--introY,62%);display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 16px;will-change:opacity,transform}
.pretext.gone{visibility:hidden;pointer-events:none}
.enterButton{position:relative;display:flex;align-items:center;gap:10px;height:50px;padding:0 34px;font-size:15px;color:#fff;opacity:.35;pointer-events:none;transition:opacity .5s}
.ready .enterButton{opacity:1;pointer-events:auto}
.enterButton svg.ring{position:absolute;inset:-4px -8px;width:calc(100% + 16px);height:calc(100% + 8px);overflow:visible}
.enterButton svg.ring path{transition:stroke-dashoffset .9s cubic-bezier(.6,0,.2,1)}
.enterButton:hover svg.ring path{stroke-dashoffset:-60}
.enterButton .ico{width:20px;height:16px}
.enterButton:hover .ico{animation:flick .5s steps(2) infinite}
@keyframes flick{50%{transform:translateY(-1px) rotate(-6deg)}}
.dedic{margin-top:26px;line-height:1.35;letter-spacing:.02em}
.dedic .for{display:block;font-style:italic;font-size:13px;color:#8c8c8c}
.dedic .who{display:block;font-size:22px;color:#fff;margin:2px 0 8px}
.dedic p{font-size:17px;opacity:.85}
.dedic .love{display:block;font-size:14px;margin-top:10px;color:#fff}
.dedic .sub{display:block;font-style:italic;font-size:13px;color:#8c8c8c;margin-top:2px}
.loading{margin-top:16px;font-style:italic;font-size:13px;color:#8c8c8c}

.captions{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:819px){
  .logo{top:10px;width:220px}
  .logo .t{font-size:19px}.logo .st{font-size:20px}.logo svg{width:140px;height:6px}
  .navArrow{display:none}
  .dots{gap:12px}
  .dot{width:13px;height:13px}.dot.on{width:18px;height:18px}

function setFace(leaf, side, sky, fg, txt, mode, shiftY = 0) {
  const u = leaf.mat.uniforms, p = side === 'f' ? 'f' : 'b';
  u[p + 'Sky'].value = sky; if (fg) u[p + 'Fg'].value = fg; if (txt) u[p + 'Txt'].value = txt;
  u[p + 'Flags'].value.set(fg ? 1 : 0, txt && !mobile ? 1 : 0, mode, 1);
  u[p + 'Shift'].value.set(0, shiftY);
  leaf[p + 'HasTxt'] = !!txt;
}
function applyTextMode() { leaves.forEach(l => ['f', 'b'].forEach(p => { if (l[p + 'HasTxt']) l.mat.uniforms[p + 'Flags'].value.y = mobile ? 0 : 1; })); }

/* Kling 3.0 sky loops (direct result links); each replaces its still sky once it is actually playing */
const KLING = [
  'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261108_051956_5f368146-b522-461d-9f5d-422f45255bd0.mp4', 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261108_051955_27d39710-be95-4992-8914-ce803e5729f5.mp4', 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261108_051956_e7b2c41f-53c7-4adf-a9b7-ea294590d358.mp4', 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261108_051955_15cd3fbc-7100-420e-8479-ca8b0afb346e.mp4',
];
const skyVideos = [];
function startSkyVideo(i) {
  const v = document.createElement('video');
  Object.assign(v, { crossOrigin: 'anonymous', muted: true, loop: true, playsInline: true, preload: 'auto', src: KLING[i] });
  v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
  v.addEventListener(REC ? 'loadeddata' : 'playing', () => {
    if (v.dataset.on) return; v.dataset.on = 1;
    const tex = new THREE.VideoTexture(v); tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false; v.tex = tex;
    const left = turnables[i], right = i < N - 1 ? turnables[i + 1] : board;
    left.mat.uniforms.bSky.value = tex; left.mat.uniforms.bVid.value = 1;
    right.mat.uniforms.fSky.value = tex; right.mat.uniforms.fVid.value = 1;
  });
  if (REC) v.load(); else v.play().catch(() => {});   // still sky stays if autoplay is refused
  skyVideos.push(v);
}
document.addEventListener('visibilitychange', () => skyVideos.forEach(v => document.hidden ? v.pause() : v.play().catch(() => {})));
const SHIFT = [0.035, 0, 0, 0];      // spread 1: measured shift that aligns its art with the chosen mockup
Promise.all([
  load(RAW.cover, 1600),
  ...SPREADS.map((_, i) => load(RAW['sky' + (i + 1)], 2048)),
  ...SPREADS.map((_, i) => load(RAW['fg' + (i + 1)], 2048)),
  fontsReady,
]).then(res => {
    const cv = res[0], skies = res.slice(1, 1 + N), fgs = res.slice(1 + N, 1 + 2 * N);
    const txts = SPREADS.map(textTexture);
    setFace(cover, 'f', cv, null, null, 0);
    for (let i = 0; i < N; i++) {
      setFace(turnables[i], 'b', skies[i], fgs[i], txts[i], 2, SHIFT[i]);                          // left half of spread i
      const rightLeaf = i < N - 1 ? turnables[i + 1] : board;
      setFace(rightLeaf, 'f', skies[i], fgs[i], txts[i], 1, SHIFT[i]);                              // right half of spread i
    }
    applyTextMode();
    loaded = true;
    if (!reduce && !/still/.test(location.hash)) SPREADS.forEach((_, i) => startSkyVideo(i));
    testHooks();
    if (state === 'loading') startShowcase();
  })
  .catch(err => { console.error(err); document.getElementById('loading').textContent = 'Could not load the pictures. Please refresh.'; });

/* ================= opening: scroll zooms the closed book in, then it opens ================= */
let state = 'loading';          // loading → showcase → intro → open
let prog = 0, target = 0, lastInput = 0, autoRun = false;
let cur = 0;
const mouse = { x: 0, y: 0, ex: 0, ey: 0 };

function pose(o, time) {
  const a = ease(clamp01(o / 0.42));                 // lift off the table, turn upright
  const b = ease(clamp01((o - 0.32) / 0.68));        // fly to the reading position and zoom in
  const ox = rect.x + rect.w / 2 - vw / 2, oy = vh / 2 - (rect.y + rect.h / 2);
  const intro = mobile
    ? { x: 0, y: vh / 2 - vh * 0.30, s: rect.w * 1.0, rx: -0.95, ry: 0, rz: 0.26 }
    : { x: 0, y: sy(318), s: rect.w * 0.74, rx: -0.95, ry: 0, rz: 0.26 };
  const mid = mobile
    ? { x: 0, y: vh / 2 - vh * 0.24, s: rect.w * 0.72, rx: 0, ry: 0, rz: 0 }
    : { x: 0, y: sy(250), s: rect.w * 0.46, rx: 0, ry: 0, rz: 0 };
  const open = { x: ox, y: oy, s: rect.w, rx: 0, ry: 0, rz: 0 };
  const float = reduce ? 0 : Math.sin(time * 1.3) * 5 * S * (1 - a);
  const m = {};
  for (const k of ['x', 'y', 's', 'rx', 'ry', 'rz']) m[k] = lerp(lerp(intro[k], mid[k], a), open[k], b);
  m.y += float;
  // mouse: gentle tilt in every state
  m.rx += -mouse.ey * (0.05 + 0.03 * b); m.ry += mouse.ex * (0.08 + 0.02 * b);
  return m;
}

function resize() {
  layout(); applyTextMode();
  renderer.setSize(vw, vh, false);
  renderer.domElement.style.width = vw + 'px'; renderer.domElement.style.height = vh + 'px';
  camera.aspect = vw / vh;
  camera.position.set(0, 0, (vh / 2) / Math.tan(THREE.MathUtils.degToRad(FOV / 2)));
  camera.near = camera.position.z / 10; camera.far = camera.position.z * 10;
  camera.updateProjectionMatrix();
  updateUI();
}
addEventListener('resize', resize);

function nudge(delta) {
  if (state !== 'intro' || !loaded) return;
  target = clamp01(target + delta); lastInput = now();
}
addEventListener('wheel', e => { if (state === 'intro') { e.preventDefault(); nudge(e.deltaY / (e.deltaMode ? 30 : 1400)); } }, { passive: false });
let touchY = null;
stage.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
stage.addEventListener('touchmove', e => { if (touchY == null) return; const y = e.touches[0].clientY; nudge((touchY - y) / 600); touchY = y; }, { passive: true });
stage.addEventListener('touchend', () => { touchY = null; });
function openBook() { if (state === 'intro' && loaded) { autoRun = true; } }
document.getElementById('enter').addEventListener('click', openBook);
stage.addEventListener('click', () => { if (state === 'intro' && prog < 0.02 && loaded) openBook(); });

/* ================= page turning (half the spread: the right page turns over the spine) ================= */
const tweens = new Set();
function tweenLeaf(leaf, to, dur) {
  if (leaf.tween) tweens.delete(leaf.tween);
  const tw = { leaf, from: leaf.t, to, t0: now(), D: reduce ? 1 : dur * Math.abs(to - leaf.t) + 120 };
  leaf.tween = tw; tweens.add(tw);
}
function runTweens(t) {
  for (const tw of tweens) {
    const k = Math.min(1, Math.max(0, (t - tw.t0) / tw.D));
    tw.leaf.t = tw.from + (tw.to - tw.from) * ease(k); deform(tw.leaf);
    if (k >= 1) { tweens.delete(tw); tw.leaf.tween = null; }
  }
}
const prevBtn = document.querySelector('.navArrow.prev'), nextBtn = document.querySelector('.navArrow.next');
const dots = [...document.querySelectorAll('.dot')];
function updateUI() {
  prevBtn.disabled = cur <= 0; nextBtn.disabled = cur >= SPREADS.length - 1;
  dots.forEach((d, i) => { d.classList.toggle('on', i === cur); d.setAttribute('aria-current', i === cur ? 'page' : 'false'); });
  document.getElementById('capH').textContent = SPREADS[cur].h;
  document.getElementById('capP').textContent = SPREADS[cur].lines.join(' ');
  document.getElementById('srText').textContent = state === 'open' ? `${SPREADS[cur].h}. ${SPREADS[cur].lines.join(' ')}` : '';
}
function go(i) {
  if (state !== 'open' || i === cur || i < 0 || i >= SPREADS.length) return;
  if (i > cur) for (let k = cur + 1; k <= i; k++) tweenLeaf(turnables[k], 1, 1050);
  else for (let k = cur; k > i; k--) tweenLeaf(turnables[k], 0, 1050);
  cur = i; updateUI();
}
prevBtn.addEventListener('click', () => go(cur - 1));
nextBtn.addEventListener('click', () => go(cur + 1));
dots.forEach(d => d.addEventListener('click', () => go(+d.dataset.i)));
addEventListener('keydown', e => {
  if (state === 'intro' && ['ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key) && document.activeElement === document.body) { e.preventDefault(); openBook(); }
  if (e.key === 'ArrowRight') go(cur + 1);
  if (e.key === 'ArrowLeft') go(cur - 1);
});

let drag = null;
stage.addEventListener('pointerdown', e => {
  if (state !== 'open') return;
  if (e.clientY < rect.y || e.clientY > rect.y + rect.h || e.clientX < rect.x - 30 || e.clientX > rect.x + rect.w + 30) return;
  const right = e.clientX > rect.x + rect.w / 2;
  let leaf = null;
  if (right && cur < SPREADS.length - 1) leaf = turnables[cur + 1];
  if (!right && cur > 0) leaf = turnables[cur];
  if (!leaf) return;
  if (leaf.tween) { tweens.delete(leaf.tween); leaf.tween = null; }
  drag = { x: e.clientX, leaf, right, t0: leaf.t };
  stage.classList.add('grabbing'); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, span = rect.w * 0.9;
  drag.leaf.t = clamp01(drag.t0 + (drag.right ? -dx : -dx) / span);
  deform(drag.leaf);
});
const endDrag = () => {
  if (!drag) return;
  stage.classList.remove('grabbing');
  const { leaf, right } = drag; drag = null;
  if (right) { if (leaf.t > 0.3) { tweenLeaf(leaf, 1, 900); cur++; } else tweenLeaf(leaf, 0, 600); }
  else { if (leaf.t < 0.7) { tweenLeaf(leaf, 0, 900); cur--; } else tweenLeaf(leaf, 1, 600); }
  updateUI();
};
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);

addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  mouse.x = Math.max(-1, Math.min(1, (e.clientX / vw) * 2 - 1));
  mouse.y = Math.max(-1, Math.min(1, (e.clientY / vh) * 2 - 1));
});

document.getElementById('copyUrl').addEventListener('click', async e => {
  try { await navigator.clipboard.writeText(location.href); e.target.textContent = 'Copied!'; setTimeout(() => e.target.textContent = 'Copy URL', 1400); } catch {}
});
document.getElementById('mailIt').href = `mailto:?subject=${encodeURIComponent('Little Lantern')}&body=${encodeURIComponent(location.href)}`;

/* ================= loop ================= */
const pretext = document.getElementById('pretext');
let lastT = null;
function frame() {
  const tNow = now(), dt = lastT == null ? 1 / 60 : Math.min(0.1, Math.max(0, (tNow - lastT) / 1000)); lastT = tNow;
  const time = tNow / 1000, f60 = dt * 60;                 // frame-rate independent smoothing
  runTweens(tNow);
  if (!reduce) { const k = 1 - Math.pow(0.94, f60); mouse.ex += (mouse.x - mouse.ex) * k; mouse.ey += (mouse.y - mouse.ey) * k; }

  let p;
  if (state === 'loading') {
    p = SHOW_A();
    leaves.forEach(l => l.mat.uniforms.uBright.value = 0);
  } else if (state === 'showcase') {
    p = showcase(showFreeze ?? (tNow - showStart) / 1000, time);
  }
  if (state === 'intro') {
    // past halfway (or after a click) the book finishes opening by itself
    if (!autoRun && target > 0.5 && tNow - lastInput > 160) autoRun = true;
    if (autoRun) target = Math.min(1, target + (reduce ? 1 : 0.011 * f60));
    prog += (target - prog) * (reduce ? 1 : 1 - Math.pow(0.915, f60));
    cover.t = ease(clamp01((prog - 0.45) / 0.5)); deform(cover);
    const fade = clamp01(1 - prog * 3.2);
    pretext.style.opacity = fade; pretext.style.transform = `translateY(${prog * 160}px)`;
    if (prog > 0.995) {
      prog = 1; cover.t = 1; deform(cover); state = 'open';
      pretext.classList.add('gone'); document.body.classList.add('open'); updateUI();
    }
  }
  if (!p) p = pose(prog, time);
  book.visible = leaves[0].mat.uniforms.uBright.value > 0.01;   // fully hidden while still dark
  book.position.set(p.x, p.y, 0); book.scale.setScalar(p.s); book.rotation.set(p.rx, p.ry, p.rz);

  const c = cover.t;
  pivot.position.x = -PW / 2 * (1 - c);              // closed: cover centred · open: spread centred
  stackL.visible = c > 0.96;
  shadow.position.set(lerp(PW / 2, 0, c), -0.03, -DR - 0.008);
  shadow.scale.set(lerp(PW * 1.45, 1.28, c), A * 1.5, 1);
  shadow.material.opacity = (0.85 - 0.35 * c) * leaves[0].mat.uniforms.uBright.value;

  const par = reduce ? 0 : 1;
  leaves.forEach(l => l.mat.uniforms.uPar.value.set(-mouse.ex * par, mouse.ey * par));
  if (REC) skyVideos.forEach(v => v.tex && (v.tex.needsUpdate = true));
  renderer.render(scene, camera);
  if (!REC) requestAnimationFrame(frame);
}
/* ================= load showcase: open book flips back, closes, swings round and settles on the table ================= */
const woodEl = document.getElementById('wood');
const enterEl = document.getElementById('enter'), loadingEl = document.getElementById('loading'), dedicEl = pretext.querySelector('.dedic');
const SHOW_FROM = 2;                 // the book is first seen open on spread 3
const SHOW_END = 3.6;
let showStart = 0, showFreeze = null;
const SHOW_A = () => mobile
  ? { x: 0, y: vh / 2 - vh * 0.30, s: rect.w * 0.80, rx: 0.12, ry: -0.2, rz: 0.02 }
  : { x: 0, y: sy(318), s: rect.w * 0.50, rx: 0.12, ry: -0.2, rz: 0.02 };
const SHOW_B = () => mobile
  ? { x: 0, y: vh / 2 - vh * 0.30, s: rect.w * 0.95, rx: -0.35, ry: -0.75, rz: 0.12 }
  : { x: 0, y: sy(310), s: rect.w * 0.64, rx: -0.35, ry: -0.75, rz: 0.12 };
const mixPose = (a, b, k) => { const o = {}; for (const key in a) o[key] = lerp(a[key], b[key], k); return o; };
function dedicShift() { return (vh * 0.5 - 70) - (pretext.offsetTop + 76); }   // centred while loading
function setIntroUI(k) {           // k: 0 = loading look, 1 = intro look
  const tr = `translateY(${dedicShift() * (1 - ease(clamp01(k)))}px)`;
  dedicEl.style.transform = tr; loadingEl.style.transform = tr;
}
setIntroUI(0); enterEl.style.opacity = 0; enterEl.style.pointerEvents = 'none';
let state0 = reduce ? 'skip' : 'loading';
if (!reduce) { woodEl.style.opacity = 0; edgeMats.forEach(m => m.color.setScalar(0)); }

function showcase(st, time) {
  // pages flip back one by one, then the cover closes
  for (let i = SHOW_FROM; i >= 0; i--) {
    const t0 = 0.35 + (SHOW_FROM - i) * 0.4, t1 = t0 + (i === 0 ? 0.8 : 0.6);
    turnables[i].t = 1 - ease(clamp01((st - t0) / (t1 - t0))); deform(turnables[i]);
  }
  const bright = smoothstep(0.45, 1.1, st);          // book fades in once the dedication has moved down
  leaves.forEach(l => l.mat.uniforms.uBright.value = bright);
  edgeMats[0].color.setHex(0x131a31).multiplyScalar(bright); edgeMats[1].color.setHex(0xd8cbb3).multiplyScalar(bright);
  woodEl.style.opacity = smoothstep(1.9, 3.1, st);
  setIntroUI(st / 0.6);
  loadingEl.style.opacity = 1 - clamp01(st / 0.4);
  const ui = smoothstep(3.0, SHOW_END, st);
  enterEl.style.opacity = ui;

  const A0 = SHOW_A(); A0.ry += 0.12 * Math.sin(st * 1.4); A0.y += Math.sin(st * 2) * 4 * S;
  const k1 = ease(clamp01((st - 1.15) / 1.0)), k2 = ease(clamp01((st - 1.95) / 1.15));
  let p = mixPose(A0, SHOW_B(), k1);
  p = mixPose(p, pose(0, time), k2);
  if (st >= SHOW_END && showFreeze == null) finishShowcase();
  return p;
}
function startShowcase() {
  if (state0 === 'skip') { finishShowcase(); return; }
  for (let i = 0; i <= SHOW_FROM; i++) { turnables[i].t = 1; deform(turnables[i]); }
  showStart = now(); state = 'showcase';
}
function finishShowcase() {
  turnables.forEach(l => { l.t = 0; deform(l); });
  leaves.forEach(l => l.mat.uniforms.uBright.value = 1);
  edgeMats[0].color.setHex(0x131a31); edgeMats[1].color.setHex(0xd8cbb3);
  woodEl.style.opacity = 1; setIntroUI(1);
  enterEl.style.opacity = ''; enterEl.style.pointerEvents = '';
  loadingEl.style.opacity = 1;
  loadingEl.textContent = mobile ? 'Swipe up or tap to open' : 'Scroll or click to open';
  document.body.classList.add('ready');
  state = 'intro';
}
addEventListener('resize', () => { if (state === 'loading' || state === 'showcase') setIntroUI(0); });

resize();
if (!REC) requestAnimationFrame(frame);

/* test hooks for screenshots: #open, #p=2, #prog=0.6, #turn=0.5, #show=1.4 */
function testHooks() {
  const h = location.hash;
  const sh = h.match(/show=([\d.]+)/);
  if (sh) { startShowcase(); showFreeze = +sh[1]; return; }
  const pr = h.match(/prog=([\d.]+)/);
  if (pr) { finishShowcase(); prog = target = +pr[1]; cover.t = ease(clamp01((prog - 0.45) / 0.5)); deform(cover); state = 'hold'; pretext.style.opacity = clamp01(1 - prog * 3.2); }
  if (/open|p=|turn/.test(h)) {
    finishShowcase();
    prog = target = 1; cover.t = 1; deform(cover); state = 'open';
    pretext.classList.add('gone'); document.body.classList.add('open');
    const pk = h.match(/p=(\d)/); if (pk) { cur = +pk[1]; for (let i = 1; i <= cur; i++) { turnables[i].t = 1; deform(turnables[i]); } }
    const tn = h.match(/turn=([\d.]+)/); if (tn) { turnables[cur + 1].t = +tn[1]; deform(turnables[cur + 1]); }
    updateUI();
  }
}

/* ================= entrance: one WAAPI timeline, run once, guarded + failsafe ================= */
function reveal() { root.classList.remove('js-anim'); root.classList.add('anim-done'); }
if (reduce || !document.body.animate) reveal();
else {
  const easeC = 'cubic-bezier(.2,.7,.2,1)';
  const els = [
    [document.querySelector('.logo'), [{ opacity: 0, transform: 'translate(-50%,-14px)' }, { opacity: 1, transform: 'translate(-50%,0)' }], 0],
    ...[...document.querySelectorAll('.foot')].map(el => [el, [{ opacity: 0 }, { opacity: 1 }], 600]),
  ];
  const anims = els.map(([el, kf, delay]) => el.animate(kf, { duration: 900, delay, easing: easeC, fill: 'backwards' }));
  reveal();
  Promise.all(anims.map(a => a.finished)).catch(() => {}).finally(reveal);
  setTimeout(reveal, 2500);
}
window.__rec = {
  ready: () => loaded && skyVideos.every(v => v.tex),
  async step(tMs) {
    vNow = tMs;
    await Promise.all(skyVideos.map(v => new Promise(r => { const t = (tMs / 1000) % v.duration; if (Math.abs(v.currentTime - t) < 1e-3) return r(); v.addEventListener('seeked', r, { once: true }); v.currentTime = t; })));
    frame();
  },
};
window.__book = { leaves, go, openBook, get state() { return state; }, get rect() { return rect; }, get prog() { return prog; } };
</script>
</body>
