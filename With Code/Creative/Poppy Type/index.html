*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1C1C1B;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;cursor:text;font-family:'DM Mono',ui-monospace,monospace;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#app button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html[data-touch] #app{touch-action:none;top:var(--tg-top,0px)!important;bottom:auto!important;height:var(--tg-h,100%)!important}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#inp{position:fixed;left:0;top:0;width:1px;height:1px;margin:0;padding:0;border:0;opacity:0;font-size:16px;color:transparent;background:transparent;caret-color:transparent;pointer-events:none}
.brand{position:absolute;top:calc(22px + env(safe-area-inset-top));left:calc(26px + env(safe-area-inset-left));z-index:5;font-size:15px;letter-spacing:.04em;line-height:1;pointer-events:none}
.modes{position:absolute;top:calc(16px + env(safe-area-inset-top));right:calc(18px + env(safe-area-inset-right));z-index:6;display:flex;gap:4px;padding:4px;border:1px solid #3A3A38;border-radius:999px}
.modes button{border:0;border-radius:999px;padding:8px 17px;font-size:13px;letter-spacing:.04em;cursor:pointer;background:transparent}
.bar{position:absolute;left:calc(26px + env(safe-area-inset-left));right:calc(20px + env(safe-area-inset-right));bottom:calc(46px + env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px;letter-spacing:.06em}
.hints{display:flex;gap:31px;flex-wrap:wrap;opacity:.85}
.coarse{display:none}
@media (pointer:coarse){.fine{display:none}.coarse{display:inline}}
.ctrls{display:flex;gap:8px;align-items:center}
.pal{display:flex;gap:6px;align-items:center;padding:4px 6px;border:1px solid #4A4A47;border-radius:999px}
.sw{--sw:24px;width:var(--sw);height:var(--sw);padding:0;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.sw:hover{transform:scale(1.15)!important}
.sw span{width:calc(var(--sw)*.46);height:calc(var(--sw)*.46);border-radius:999px}
.btn{background:transparent;border:1px solid #4A4A47;padding:9px 15px;border-radius:999px;cursor:pointer;font-size:13px;letter-spacing:.04em;transition:border-color .15s,color .15s}
.btn:hover{border-color:currentColor}
#poster{position:absolute;inset:0;display:none;grid-template-columns:minmax(280px,340px) minmax(0,1fr);background:#111110;cursor:default;color:#EDEDED;font-size:12px;letter-spacing:.03em;z-index:4}
#poster.on{display:grid}
.panel{border-right:1px solid #262624;overflow-y:auto;overflow-x:hidden;padding:24px 22px 32px;display:flex;flex-direction:column;gap:26px;background:#161615}
.ph{font-family:'Playfair Display',serif;font-weight:600;font-size:26px;color:#fff}
.mut{color:#8C8C88}
.lab{color:#8C8C88;text-transform:uppercase;font-size:11px;letter-spacing:.08em}
.sec{display:flex;flex-direction:column;gap:10px}
#ptext{background:#0E0E0D;border:1px solid #2E2E2C;border-radius:10px;color:#fff;font-family:'Playfair Display',serif;font-weight:600;font-size:22px;padding:10px 12px;outline:none;user-select:text}
#ptext:focus{border-color:#fff}
.pill{align-self:flex-start;background:transparent;border:1px solid #2E2E2C;padding:8px 12px;border-radius:999px;cursor:pointer}
.pill:hover{border-color:#fff}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pre{text-align:left;border:1px solid #2E2E2C;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.pre b{font-weight:400;font-size:13px}.pre i{font-style:normal;color:#8C8C88;font-size:11px}
.pre.sel,.pc.sel{border-color:#fff;background:#1E1E1C}
.pc{display:flex;flex-direction:column;gap:8px;background:transparent;border:1px solid #2E2E2C;padding:6px 6px 8px;border-radius:12px;cursor:pointer;text-align:left}
.pc:hover{border-color:#8C8C88}
.pc .pv{display:flex;align-items:center;justify-content:center;height:44px;border-radius:8px}
.pc .pv span{border-radius:50%}
.pc .pv em{font-family:'Playfair Display',serif;font-style:normal;font-weight:600;font-size:18px;margin-left:8px}
.ex{display:flex;flex-direction:column;gap:10px;border-top:1px solid #262624;padding-top:20px}
.ex1{background:#fff;border:0;color:#000;font-weight:500;padding:12px 14px;border-radius:999px;cursor:pointer}
.ex2{background:transparent;border:1px solid #3A3A38;padding:11px 14px;border-radius:999px;cursor:pointer}
.ex2:hover{border-color:#fff}
.ex1:disabled,.ex2:disabled{opacity:.5;cursor:default}
.stage{display:flex;align-items:center;justify-content:center;padding:64px 32px 32px;min-width:0}
#pcv{width:min(100%,calc(100vh - 104px));height:auto;aspect-ratio:1/1;display:block;border:1px solid #262624}
@media (max-width:600px){
  .brand{top:calc(24px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));font-size:13px}
  .modes{right:calc(12px + env(safe-area-inset-right))}
  .modes button{padding:7px 13px;font-size:12px}
  .bar{left:calc(16px + env(safe-area-inset-left));right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));gap:12px;font-size:11px}
  .hints{gap:12px}
  .ctrls{flex:1 1 100%;justify-content:space-between;gap:8px}
  .pal{gap:4px}
  .sw{--sw:clamp(13px,calc((100vw - 183px) / 10),22px)}
  .btn{padding:7px 11px}
}
@media (max-height:460px) and (orientation:landscape){
  .bar{bottom:calc(10px + env(safe-area-inset-bottom))}
  .hints{display:none}
}
@media (max-width:720px){
  #poster.on{display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  #poster::before{content:"";order:-2;position:sticky;top:0;flex:none;height:calc(60px + env(safe-area-inset-top));margin-bottom:calc(-60px - env(safe-area-inset-top));background:linear-gradient(#111110 62%,rgba(17,17,16,0));z-index:4;pointer-events:none}
  .stage{order:-1;flex:none;padding:calc(64px + env(safe-area-inset-top)) 16px 12px}
  #pcv{width:100%;max-width:520px}
  .panel{flex:none;border-right:0;border-top:1px solid #262624;overflow:visible;padding:20px 16px calc(32px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){.sw,.btn{transition:none}}

  <div class="bar" id="bar">
    <div class="hints"><span class="fine">type to grow</span><span class="coarse">tap to type</span><span>space cuts</span><span class="fine">backspace withers</span><span class="coarse">⌫ withers</span><span class="fine">enter clears</span><span class="coarse">return clears</span></div>
    <div class="ctrls">

      <button class="btn" id="png">PNG</button>
      <button class="btn" id="svg">SVG</button>
    </div>
  </div>
  <div id="poster">
    <div class="panel">
      <div class="sec" style="gap:4px"><div class="ph">Poster</div><div class="mut" id="pinfo"></div></div>
      <div class="sec"><div class="lab">Words</div><input id="ptext" spellcheck="false"><button class="pill" id="regrow">Regrow garden</button></div>
      <div class="sec"><div class="lab">Motion</div><div class="g2" id="presets"></div></div>
      <div class="sec"><div class="lab">Palette</div><div class="g2" id="ppal"></div></div>
      <div class="ex"><div class="lab">Export · 1080 × 1080 loop</div><button class="ex1" id="vid"></button><button class="ex2" id="frames">PNG frames (.zip)</button><div class="mut" id="status" style="min-height:16px"></div></div>
    </div>
    <div class="stage"><canvas id="pcv" width="1080" height="1080"></canvas></div>
  </div>
</div>
<script>

    ['Soft', '#181F2C', '#EB6F70', '#8AA6A3', '#FFD6D2', '#FFFFFF', '#0B0E15'],
    ['Field', '#22301F', '#E8643C', '#B9C79A', '#FFD8C2', '#F6F1E6', '#0F160E'],
    ['Dusk', '#2A1E2E', '#F07A5A', '#B49AB8', '#FFD9CC', '#FFF4EE', '#140D16'],
    ['Clay', '#3A2A22', '#F28C5B', '#C9B79C', '#FFE0CC', '#FFF6EC', '#1C130E'],
    ['Linen', '#F1EBE0', '#D9472B', '#5E6B4E', '#FFD3C2', '#1E1B18', '#1E1B18'],
    ['Butter', '#F6E7B8', '#D8432C', '#4F6B3A', '#FFCDB8', '#241D14', '#241D14'],
    ['Blush', '#F4D6D0', '#C83A30', '#6E7F5C', '#FFE1DA', '#2A1A18', '#2A1A18'],

  // ---------- butterfly ----------
  spawnFly(cx, cy) {

  flyOff(f) { f.st = 'leave'; f.pid = null; f.ex = f.x < this.W / 2 ? -80 : this.W + 80; f.ey = f.y - this.H * 0.3; }

  fname() { return 'letterbloom-' + (this.state.text || 'loop').trim().replace(/[^a-z0-9]+/gi, '-').toLowerCase().slice(0, 24) + '-' + this.state.preset; }
  async exportVideo() {

  async exportFrames() {

  zip(files) {

      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(14, 33, true);

  }

  // ---------- interface ----------
  buildUI() {

      b.innerHTML = `<b>${p.label}</b><i>${p.sub}</i>`;
