:root {
  --bg: #f6f3ec; --text: #1b1f30; --text-soft: rgba(27,31,48,.72); --muted: rgba(27,31,48,.42);
  --tint-a: .34; --tint-b: .08;
  --glass-edge: rgba(255,255,255,.8); --glass-rim: rgba(255,255,255,.95); --glass-rim-low: rgba(255,255,255,.35);
  --glass-glow: rgba(255,255,255,.35); --glass-sheen: rgba(255,255,255,.35);
  --glass-shadow: 0 12px 40px rgba(28,40,96,.14), 0 2px 8px rgba(28,40,96,.08);
  --chip: rgba(255,255,255,.4); --chip-hover: rgba(255,255,255,.7); --chip-edge: rgba(27,31,48,.1);
  --accent: #2a5fe6; --thumb: rgba(255,255,255,.85); --focus: rgba(42,95,230,.28);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #06070c; --text: #e8ebf7; --text-soft: rgba(232,235,247,.72); --muted: rgba(232,235,247,.4);
  --tint-a: .1; --tint-b: .03;
  --glass-edge: rgba(255,255,255,calc(.14 * var(--edge,1)));
  --glass-rim: rgba(255,255,255,calc(.32 * var(--edge,1)));
  --glass-rim-low: rgba(255,255,255,calc(.08 * var(--edge,1)));
  --glass-glow: rgba(140,170,255,.07); --glass-sheen: rgba(255,255,255,.1);
  --glass-shadow: 0 16px 48px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  --chip: rgba(255,255,255,.05); --chip-hover: rgba(255,255,255,.12); --chip-edge: rgba(255,255,255,.1);
  --accent: #7aa2ff; --thumb: rgba(255,255,255,.14); --focus: rgba(122,162,255,.3);
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body { font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
canvas.field { display: block; width: 100vw; height: 100vh; font-family: "Geist Mono", ui-monospace, Menlo, monospace; touch-action: none; }
button { font: inherit; color: inherit; }
svg { display: block; }

.glass {
  position: fixed; isolation: isolate;
  background: linear-gradient(135deg, rgba(255,255,255,calc(var(--tint-a) * var(--tint,1))), rgba(255,255,255,calc(var(--tint-b) * var(--tint,1))));
  border: 1px solid var(--glass-edge);
  box-shadow: inset 1px 1px 0 var(--glass-rim), inset -1px -1px 0 var(--glass-rim-low), inset 0 0 24px var(--glass-glow), var(--glass-shadow);
  -webkit-backdrop-filter: blur(var(--blur,6px)) saturate(180%);
  backdrop-filter: blur(var(--blur,6px)) saturate(180%);
  transition: background .4s, border-color .4s, box-shadow .4s;
}
.liquid .glass {
  -webkit-backdrop-filter: url(#liquid-glass) blur(var(--blur,6px)) saturate(180%);
  backdrop-filter: url(#liquid-glass) blur(var(--blur,6px)) saturate(180%);
}
.glass::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: linear-gradient(180deg, var(--glass-sheen), transparent 48%); pointer-events: none; }

.top-bar { position: fixed; z-index: 30; top: 18px; left: 50%; translate: -50% 0; display: flex; align-items: center; gap: 8px; }
.top-bar .glass { position: relative; }
.choices { display: flex; gap: 2px; max-width: max(240px, calc(100vw - 300px)); padding: 4px; overflow-x: auto; scrollbar-width: none; border-radius: 999px; --blur: 5px; }
.choices::-webkit-scrollbar { display: none; }
.choices button { position: relative; z-index: 1; flex: none; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px 0 11px; border: 0; border-radius: 999px; background: none; white-space: nowrap; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; transition: color .3s; }
.choices button:hover { color: var(--text-soft); }
.choices button[aria-checked="true"] { color: var(--text); }
.choices button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.choices .thumb { position: absolute; top: 0; left: 0; height: 32px; border-radius: 999px; background: var(--thumb); box-shadow: inset 0 1px 0 var(--glass-rim), 0 2px 8px #0000001f; transition: translate .35s cubic-bezier(.3,1.3,.5,1), width .35s cubic-bezier(.3,1.3,.5,1); }
.choices .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--swatch) 50%, white), var(--swatch) 70%); }

.stage { position: fixed; top: 50%; left: 50%; translate: -50% -50%; }
.masthead { position: absolute; bottom: 100%; left: 50%; translate: -50% 0; display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: 28px; pointer-events: none; }
.avatar {
  position: relative; width: 66px; height: 66px; border-radius: 50%; overflow: hidden;
  background: linear-gradient(180deg, #ffffff1a, #ffffff05);
  -webkit-backdrop-filter: blur(6px) saturate(160%); backdrop-filter: blur(6px) saturate(160%);
}
.liquid .avatar { -webkit-backdrop-filter: url(#liquid-glass) blur(6px) saturate(160%); backdrop-filter: url(#liquid-glass) blur(6px) saturate(160%); }
.avatar::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: .62;
  background:
    repeating-linear-gradient(176deg, rgba(255,255,255,.06) 0 2px, rgba(0,0,0,.08) 2px 5px),
    radial-gradient(circle at 38% 30%, #9a9ea8, #4a4d55 62%, #24262c);
}
.greeting {
  margin: 0; white-space: nowrap;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Geist, system-ui, sans-serif;
  font-size: clamp(24px, 5vw, 32px); font-weight: 500; line-height: 1.15; letter-spacing: -.02em; color: #e8e8e8;
  text-shadow: 0 0 6px var(--bg), 0 0 24px var(--bg);
}
.composer {
  --glass-rim: rgba(255,255,255,calc(.14 * var(--edge,1))); --glass-sheen: rgba(255,255,255,.04);
  --ui-text: #ececec; --ui-muted: #8d8d8d;
  position: relative; width: min(720px, calc(100vw - 32px)); box-sizing: border-box;
  display: flex; flex-direction: column; gap: 18px; margin: 0; padding: 18px 12px 12px 18px; border-radius: 24px; --blur: 7px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Geist, system-ui, sans-serif;
}
.composer:focus-within {
  border-color: rgba(122,162,255,calc(.3 * var(--edge,1)));
  box-shadow: inset 1px 1px 0 var(--glass-rim), inset -1px -1px 0 var(--glass-rim-low), inset 0 0 24px var(--glass-glow), 0 0 0 3px rgba(122,162,255,calc(.12 * var(--edge,1))), var(--glass-shadow);
}
.composer-field { display: flex; align-items: flex-start; gap: 10px; }
.composer-search { flex: none; margin-top: 4px; color: var(--ui-muted); }
.composer textarea { flex: 1; display: block; min-height: 27px; max-height: 200px; margin: 0; padding: 0; border: 0; outline: none; resize: none; overflow-y: hidden; background: none; font-family: inherit; font-size: 17px; font-weight: 400; line-height: 1.55; color: var(--ui-text); caret-color: var(--ui-text); }
.composer textarea::placeholder { color: var(--ui-muted); }
.composer-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tools { display: flex; align-items: center; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 11px; border: 1px solid rgba(255,255,255,.1); border-radius: 999px; background: none; font-family: inherit; font-size: 14px; font-weight: 400; color: #c4c4c4; cursor: pointer; transition: background .2s, color .2s; }
.pill:hover { background: #ffffff0d; color: var(--ui-text); }
.icon-btn { width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; background: none; color: var(--ui-muted); cursor: pointer; transition: background .2s, color .2s; }
.icon-btn:hover { background: #ffffff0f; color: var(--ui-text); }
.pill:focus-visible, .icon-btn:focus-visible, .send:focus-visible { outline: 2px solid rgba(255,255,255,.35); outline-offset: 2px; }
.send { width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; background: #3a3a3a; color: #e6e6e6; cursor: pointer; transition: background .2s, color .2s, transform .15s; }
.send:hover:not(:disabled) { background: #f2f2f2; color: #1c1c1c; }
.send:disabled { background: #333; color: #7c7c7c; cursor: default; }

.hint { position: fixed; left: 14px; bottom: 12px; z-index: 5; margin: 0; font: 600 11px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .02em; color: var(--muted); pointer-events: none; user-select: none; }

.tweaks { top: 16px; right: 16px; z-index: 10; width: 288px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; border-radius: 20px; font-size: 12px; --blur: 18px; --tint-a: .62; --tint-b: .48; }
[data-theme="dark"] .tweaks { --tint-a: .1; --tint-b: .06; }
[data-theme="dark"] .tweaks, [data-theme="dark"] .tweaks-open { background-color: #0a0c148c; }
.liquid .tweaks { -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%); }
.tweaks[hidden], .tweaks-open[hidden] { display: none; }
.tweaks-head { display: flex; align-items: center; gap: 6px; padding: 12px 10px 10px 16px; border-bottom: 1px solid var(--chip-edge); }
.tweaks-head h2 { flex: 1; margin: 0; font-size: 13px; font-weight: 500; }
.tweaks-action, .tweaks-close { height: 26px; border: 1px solid var(--chip-edge); border-radius: 999px; background: var(--chip); color: var(--text-soft); cursor: pointer; font-size: 12px; }
.tweaks-action { padding: 0 10px; }
.tweaks-action.confirm { color: #ff9a9a; background: #ff5a5a24; border-color: #ff787873; }
.tweaks-action.confirm:hover { color: #ffb4b4; background: #ff5a5a38; }
.tweaks-close { width: 26px; padding: 0; display: grid; place-items: center; }
.tweaks-action:hover, .tweaks-close:hover { background: var(--chip-hover); color: var(--text); }
.tweaks-body { overflow-y: auto; padding: 4px 16px 14px; overscroll-behavior: contain; }
.tweaks-group h3 { margin: 14px 0 6px; font: 600 10px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tweaks-row { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 8px; padding: 4px 0; color: var(--text-soft); }
.tweaks-row.off { opacity: .4; }
.tweaks-label { cursor: default; user-select: none; -webkit-user-select: none; }
.tweaks-tip { position: fixed; z-index: 40; max-width: 240px; padding: 9px 11px; border: 1px solid var(--glass-edge); border-radius: 12px; background: #0e101aeb; box-shadow: var(--glass-shadow); font-size: 12px; line-height: 1.45; color: var(--text); pointer-events: none; }
.tweaks-tip[hidden] { display: none; }

    this.resize();
    if (document.fonts) document.fonts.load(`600 16px ${getComputedStyle(canvas).fontFamily}`).then(() => { if (!this.disposed && this.reduced.matches) this.drawStill(); });
    this.schedule();
  }
  setAnimal(a, tuning) {
    this.animal = pick(a); this.tuning = { ...this.animal.defaults, ...tuning };
    this.flock = new Flock(this.animal, this.tuning, this.count); this.renderer.setAnimal(this.animal, this.tuning); this.resize();
  }
  set(key, value) {
    this.tuning[key] = value;
    if (key === "detail") this.resize(); else if (key === "hueShift" || key === "grid") this.renderer.restyle();
    if (this.reduced.matches) this.drawStill();
  }
  resize() {
    const r = this.canvas.getBoundingClientRect(); if (r.width < 1 || r.height < 1) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.renderer.resize(r.width, r.height, dpr); this.flock.resize(r.width, r.height);
    if (this.reduced.matches) this.drawStill();
  }
  schedule() {
    cancelAnimationFrame(this.raf);
    if (this.disposed || !this.visible || this.reduced.matches) return;
    this.last = performance.now(); this.raf = requestAnimationFrame(this.frame);
  }
  drawStill() { if (this.flock.time < 4) for (let i = 0; i < 240; i++) this.flock.step(STEP); this.renderer.render(this.flock, STEP); }
}

/* ---------- tweaks panel ---------- */
const GLASS = { blur: 3.5, refraction: 40, ripple: 0.007, tint: 0, edge: 0.55, radius: 24, width: 720 };
const OPEN_KEY = "wild-tab:tweaks-open";
function readStore(key) { try { return JSON.parse(localStorage.getItem(key) ?? "{}"); } catch { return {}; } }
function changed(cur, def) { const out = {}; for (const k of Object.keys(def)) if (cur[k] !== def[k]) out[k] = cur[k]; return out; }
function applyGlass(g) {
  const box = document.querySelector(".composer");
  box.style.setProperty("--blur", `${g.blur}px`); box.style.borderRadius = `${g.radius}px`; box.style.width = `min(${g.width}px, calc(100vw - 32px))`;
  document.documentElement.style.setProperty("--tint", String(g.tint)); document.documentElement.style.setProperty("--edge", String(g.edge));
  const map = document.querySelector("#liquid-glass feDisplacementMap"); if (map) map.setAttribute("scale", String(g.refraction));
  const noise = document.querySelector("#liquid-glass feTurbulence"); if (noise) noise.setAttribute("baseFrequency", `${g.ripple} ${g.ripple * 1.5}`);
}
const decimals = (step) => (step >= 1 ? 0 : Math.min(3, Math.ceil(-Math.log10(step))));
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }

function buildTweaks(field, defaults, groupsFor, { storageKey = "tweaks", onChange } = {}) {
  const tuning = field.tuning, saved = readStore(storageKey), glass = { ...GLASS, ...saved.glass };
  for (const [k, v] of Object.entries(saved.tuning ?? {})) if (k in defaults) field.set(k, v);
  applyGlass(glass);
  const save = () => { try { localStorage.setItem(storageKey, JSON.stringify({ tuning: changed(tuning, defaults), glass: changed(glass, GLASS) })); } catch {} if (onChange) onChange(); };
  const kinds = {
    knob: (key, label, min, max, step, hint) => ({ kind: "range", label, min, max, step, hint, def: defaults[key], get: () => tuning[key], set: (v) => field.set(key, v) }),
    toggle: (key, label, hint) => ({ kind: "toggle", label, hint, def: defaults[key], get: () => tuning[key], set: (v) => field.set(key, v) }),
  };
  const glassKnob = (key, label, min, max, step, hint) => ({ kind: "range", label, min, max, step, hint, def: GLASS[key], get: () => glass[key], set: (v) => { glass[key] = v; applyGlass(glass); } });
  const groups = [...groupsFor(kinds), ["Chat glass", [
    glassKnob("blur", "Blur (px)", 0, 30, 0.5, "How frosted the chat box is: how much it blurs what's behind it."),
    glassKnob("refraction", "Refraction", 0, 150, 1, "How strongly the glass bends what's behind it, like liquid glass (Chrome and Edge only)."),
    glassKnob("ripple", "Ripple", 0.001, 0.04, 0.001, "Size of the refraction ripples: higher is finer and busier, lower is broad and smooth."),
    glassKnob("tint", "Tint", 0, 3, 0.05, "How milky the glass is. 0 is perfectly clear."),
    glassKnob("edge", "Edge", 0, 2, 0.05, "How strong the glass borders and their bright rims are, on the chat box, the animal bar at the top and this panel. 0 hides them."),
    glassKnob("radius", "Corner radius", 0, 48, 1, "How rounded the chat box's corners are."),
    glassKnob("width", "Width", 320, 960, 10, "How wide the chat box is."),
  ]]];
  const panel = el("aside", "tweaks glass"); panel.setAttribute("aria-label", "Tweaks");
  const head = el("header", "tweaks-head"), title = el("h2", "", "Tweaks"), copy = el("button", "tweaks-action", "Copy"), reset = el("button", "tweaks-action", "Reset"), close = el("button", "tweaks-close");
  close.setAttribute("aria-label", "Close tweaks");
  close.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  head.append(title, copy, reset, close);
  const body = el("div", "tweaks-body"); panel.append(head, body);
  const opener = el("button", "tweaks-open glass");
  opener.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Tweaks</span>';
  const refreshers = [], refreshAll = () => refreshers.forEach((f) => f());
  const tip = el("div", "tweaks-tip"); tip.setAttribute("role", "tooltip"); tip.hidden = true;
  const showTip = (row, hint) => {
    if (!hint) return;
    tip.innerHTML = ""; tip.append(el("span", "", hint), el("small", "", "Double-click the name to reset it.")); tip.hidden = false;
    const r = row.getBoundingClientRect(), pr = panel.getBoundingClientRect();
    tip.style.right = `${window.innerWidth - pr.left + 10}px`;
    tip.style.top = `${Math.max(8, Math.min(window.innerHeight - tip.offsetHeight - 8, r.top + r.height / 2 - tip.offsetHeight / 2))}px`;
  };
  const hideTip = () => (tip.hidden = true);
  for (const [name, items] of groups) {
    const sec = el("section", "tweaks-group"); sec.append(el("h3", "", name));
    for (const it of items) {
      const row = el("label", `tweaks-row ${it.kind}`), lab = el("span", "tweaks-label", it.label);
      row.addEventListener("pointerenter", () => showTip(row, it.hint)); row.addEventListener("pointerleave", hideTip);
      row.addEventListener("focusin", () => showTip(row, it.hint)); row.addEventListener("focusout", hideTip);
      if (it.kind === "toggle") {
        const box = el("input"); box.type = "checkbox";
        box.addEventListener("change", () => { it.set(box.checked); refreshAll(); save(); });
        refreshers.push(() => (box.checked = it.get()));
        lab.addEventListener("dblclick", (e) => { e.preventDefault(); it.set(it.def); refreshAll(); save(); });
        row.append(lab, box);
      } else {
        const out = el("output", "tweaks-value"), range = el("input");
        range.type = "range"; range.min = String(it.min); range.max = String(it.max); range.step = String(it.step);
        const sync = () => {
          const v = it.get(); range.value = String(v); out.textContent = v.toFixed(decimals(it.step));
          range.style.setProperty("--fill", `${((v - it.min) / (it.max - it.min)) * 100}%`);
          const off = it.disabled ? it.disabled() : false; range.disabled = off; row.classList.toggle("off", off);
        };
        range.addEventListener("input", () => { it.set(Number(range.value)); sync(); save(); });
        lab.addEventListener("dblclick", (e) => { e.preventDefault(); it.set(it.def); sync(); save(); });
        refreshers.push(sync); row.append(lab, out, range);
      }
      sec.append(row);
    }
    body.append(sec);
  }
  refreshAll();
  copy.addEventListener("click", async () => {
    const text = JSON.stringify({ tuning: changed(tuning, defaults), glass: changed(glass, GLASS) }, null, 2);
    try { await navigator.clipboard.writeText(text); copy.textContent = "Copied"; } catch { console.log(text); copy.textContent = "In console"; }
    setTimeout(() => (copy.textContent = "Copy"), 1400);
  });
  let confirmTimer = 0;
  const disarm = () => { clearTimeout(confirmTimer); confirmTimer = 0; reset.textContent = "Reset"; reset.classList.remove("confirm"); };
  reset.addEventListener("click", () => {
    if (!confirmTimer) { reset.textContent = "Reset all?"; reset.classList.add("confirm"); confirmTimer = window.setTimeout(disarm, 3000); return; }
    disarm();
    for (const k of Object.keys(defaults)) field.set(k, defaults[k]);
    Object.assign(glass, GLASS); applyGlass(glass); refreshAll();
    try { localStorage.removeItem(storageKey); } catch {}
    if (onChange) onChange();
  });
  const setOpen = (open) => { panel.hidden = !open; opener.hidden = open; try { localStorage.setItem(OPEN_KEY, open ? "1" : "0"); } catch {} };
  close.addEventListener("click", () => { hideTip(); setOpen(false); });
  opener.addEventListener("click", () => setOpen(true));
  document.body.append(panel, opener, tip);
  let startOpen = false; try { startOpen = localStorage.getItem(OPEN_KEY) === "1"; } catch {}
  setOpen(startOpen);
  return { destroy() { panel.remove(); opener.remove(); tip.remove(); } };
}

/* ---------- greeting, composer, species bar ---------- */
function greetingFor(name, d = new Date()) {
  const h = d.getHours();
  return h >= 5 && h < 12 ? `Good morning, ${name}` : h >= 12 && h < 17 ? `Good afternoon, ${name}` : h >= 17 && h < 22 ? `Good evening, ${name}` : `Still up, ${name}?`;
}
function startGreeting(name) { const n = document.querySelector(".greeting"); if (!n) return; const set = () => (n.textContent = greetingFor(name)); set(); setInterval(set, 60000); }
function startComposer() {
  const form = document.querySelector(".composer"), box = form.querySelector("textarea"), send = form.querySelector(".send");
  function fit() { box.style.height = "auto"; box.style.height = `${box.scrollHeight}px`; box.style.overflowY = box.scrollHeight > box.clientHeight + 1 ? "auto" : "hidden"; send.disabled = box.value.trim() === ""; }
  box.addEventListener("input", fit);
  if (matchMedia("(hover: hover) and (pointer: fine)").matches) box.focus({ preventScroll: true });
  box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
  form.addEventListener("submit", (e) => { e.preventDefault(); const text = box.value.trim(); if (!text) return; form.dispatchEvent(new CustomEvent("chat:submit", { detail: { text } })); box.value = ""; fit(); });
}
function startChoices(bar, options, initial, onPick) {
  const thumb = document.createElement("span"); thumb.className = "thumb"; thumb.setAttribute("aria-hidden", "true"); bar.append(thumb);
  const buttons = options.map((o) => {
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("role", "radio"); b.dataset.value = o.value;
    b.innerHTML = `<span class="dot" style="--swatch: ${o.swatch}" aria-hidden="true"></span><span>${o.label}</span>`;
    b.addEventListener("click", () => select(o.value, true)); bar.append(b); return b;
  });
  function place() { const on = buttons.find((b) => b.getAttribute("aria-checked") === "true"); if (on) { thumb.style.translate = `${on.offsetLeft}px ${on.offsetTop}px`; thumb.style.width = `${on.offsetWidth}px`; thumb.style.height = `${on.offsetHeight}px`; } }
  function select(value, fire) {
    for (const b of buttons) { const on = b.dataset.value === value; b.setAttribute("aria-checked", String(on)); b.tabIndex = on ? 0 : -1; if (on) b.scrollIntoView({ block: "nearest", inline: "nearest" }); }
    place(); if (fire) onPick(value);
  }
  bar.addEventListener("keydown", (e) => {
    const i = buttons.indexOf(document.activeElement); if (i < 0 || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
    e.preventDefault(); const next = buttons[(i + (e.key === "ArrowRight" ? 1 : -1) + buttons.length) % buttons.length]; next.focus(); select(next.dataset.value, true);
  });
  select(initial, false);
  if (document.fonts) document.fonts.ready.then(place);
  window.addEventListener("resize", place);
}

const PREFIX = "wild-tab:", params = new URLSearchParams(location.search), countParam = Number(params.get("count")) || undefined;
const known = (v) => v !== null && v in ANIMALS;
let stored = null; try { stored = localStorage.getItem(PREFIX + "animal"); } catch {}
let current = known(params.get("animal")) ? params.get("animal") : known(stored) ? stored : "moths";
const field = new WildField(document.querySelector("canvas.field"), { animal: current, count: countParam, theme: "dark" });
const storeKey = (a) => `${PREFIX}tweaks:${a}`;
function groupsFor(a) {
  const animal = ANIMALS[a], hidden = new Set(animal.hide ?? []);
  return (kinds) => {
    const make = (o) => {
      if ("toggle" in o) return kinds.toggle(o.key, o.label, o.hint);
      const k = kinds.knob(o.key, o.label, o.min, o.max, o.step, o.hint);
      return o.disabledWhen ? { ...k, disabled: () => !!field.tuning[o.disabledWhen] } : k;
    };
    const list = (arr) => arr.filter((o) => !hidden.has(o.key)).map(make);
    return [["Movement", list(SHARED.movement)], ...animal.controls.map(([n, arr]) => [n, arr.map(make)]), ["Look", list(SHARED.look)]];
  };
}
let tweaks = buildTweaks(field, ANIMALS[current].defaults, groupsFor(current), { storageKey: storeKey(current) });
window.addEventListener("storage", (e) => { if (e.key === storeKey(current)) location.reload(); });
startChoices(document.querySelector(".choices"), ORDER.map((k) => ({ value: k, label: ANIMALS[k].label, swatch: `rgb(${ANIMALS[k].swatch.join(",")})` })), current, (k) => {
  current = k; field.setAnimal(current); tweaks.destroy();
  tweaks = buildTweaks(field, ANIMALS[current].defaults, groupsFor(current), { storageKey: storeKey(current) });
  try { localStorage.setItem(PREFIX + "animal", current); } catch {}
});
startComposer();
startGreeting("Rosalie");
</script>
