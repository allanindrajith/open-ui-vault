<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digitwist AI Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff;font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;cursor:pointer}
nav{position:fixed;top:0;left:0;right:0;z-index:50;background:transparent;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{width:24px;height:24px;color:#fff;display:block}
.links{display:none;gap:32px;font-size:14px;font-weight:500;color:rgba(255,255,255,.8)}
.links a{display:flex;align-items:center;gap:4px;transition:color .2s}
.links a:hover{color:#fff}
@media(min-width:768px){.links{display:flex}}
.right{display:flex;align-items:center;gap:24px}
.demo{display:none;font-size:14px;font-weight:500;color:rgba(255,255,255,.8)}
.demo:hover{color:#fff}
@media(min-width:640px){.demo{display:block}}
.start{background:#fff;color:#000;border-radius:9999px;padding:10px 20px;font-size:14px;font-weight:600}
.hero{position:relative;width:100%;min-height:100vh;background:#000;color:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:96px 24px 48px}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.g{position:absolute;border-radius:50%;filter:blur(120px);mix-blend-mode:screen;pointer-events:none}
.g1{top:-20%;left:20%;width:600px;height:600px;background:rgba(23,37,84,.2)}
.g1{background:rgba(30,58,138,.2)}
.g2{bottom:-10%;right:20%;width:500px;height:500px;background:rgba(49,46,129,.2)}
.content{position:relative;z-index:10;margin-top:80px;max-width:64rem;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:48px}
.pre{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;line-height:1.1}
.h1{font-weight:600;font-size:60px;line-height:.9;letter-spacing:-.05em;background:linear-gradient(to bottom,#fff,#fff,#b4c0ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding-bottom:.08em}
.sub{font-size:18px;line-height:1.65;max-width:36rem;opacity:.7}
.btns{display:flex;flex-direction:column;align-items:center;gap:24px}
.primary{display:inline-flex;align-items:center;gap:16px;background:#fff;border-radius:9999px;padding:8px 8px 8px 24px;color:#0a0400;font-weight:500;font-size:18px;transition:transform .3s,box-shadow .3s}
.primary:hover{box-shadow:0 0 20px rgba(255,255,255,.3);transform:scale(1.05)}
.arr{width:40px;height:40px;border-radius:50%;background:#3054ff;display:grid;place-items:center;transition:background .2s}
.primary:hover .arr{background:#2040e0}
.sec{display:inline-flex;align-items:center;gap:8px;color:rgba(255,255,255,.7);padding:8px 16px;border-radius:8px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:color .2s,background .2s;font-size:16px}
.sec:hover{color:#fff;background:rgba(255,255,255,.05)}
.sec svg{transition:transform .2s}
.sec:hover svg{transform:translateX(4px)}
@media(min-width:640px){.pre{font-size:48px}.h1{font-size:96px}.sub{font-size:20px}.btns{flex-direction:row}}
@media(min-width:1024px){.h1{font-size:136px}}
/* animations */
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes sc{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0}to{opacity:.7}}
.pre{animation:up .6s ease-out both}
.h1{animation:sc .6s ease-out .2s both}
.sub{animation:fd .6s ease-out .4s both}
.btns{animation:up .5s ease-out .6s both}
</style>
</head>
<body>
<nav>
  <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><g id="rays"></g><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg>
  <div class="links">
    <a href="#">Products <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></a>
    <a href="#">Customer Stories</a><a href="#">Resources</a><a href="#">Pricing</a>
  </div>
  <div class="right"><a class="demo" href="#">Book A Demo</a><a class="start" href="#">Get Started</a></div>
</nav>

<section class="hero">
  <video id="v" muted loop playsinline autoplay poster="https://images.unsplash.com/photo-1647356191320-d7a1f80ca777?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxhYnN0cmFjdCUyMGRhcmslMjB0ZWNobm9sb2d5JTIwbmV1cmFsJTIwbmV0d29ya3xlbnwxfHx8fDE3Njg5NzIyNTV8MA&ixlib=rb-4.1.0&q=80&w=1080"></video>
  <div class="overlay"></div>
  <div class="g g1"></div><div class="g g2"></div>
  <div class="content">
    <p class="pre">Design at the speed of thought</p>
    <h1 class="h1">Build Faster</h1>
    <p class="sub">Create fully functional, SEO-optimized websites in seconds with our advanced AI engine.</p>
    <div class="btns">
      <a class="primary" href="#">Start Building Free <span class="arr"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span></a>
      <a class="sec" href="#">See Examples <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>
<script>
(function(){
  var g=document.getElementById('rays'),s='';
  for(var i=0;i<12;i++){var a=i*Math.PI/6,r1=5.5,r2=(i%2?9:11);
    s+='<line x1="'+(12+Math.cos(a)*r1).toFixed(2)+'" y1="'+(12+Math.sin(a)*r1).toFixed(2)+'" x2="'+(12+Math.cos(a)*r2).toFixed(2)+'" y2="'+(12+Math.sin(a)*r2).toFixed(2)+'"/>';}
  g.innerHTML=s;
  var v=document.getElementById('v'),src='https://stream.mux.com/T6oQJQ02cQ6N01TR6iHwZkKFkbepS34dkkIc9iukgy400g.m3u8';
  var play=function(){v.play().catch(function(e){console.log('Auto-play prevented:',e)})};
  if(window.Hls&&Hls.isSupported()){var h=new Hls();h.loadSource(src);h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,play);}
  else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=src;v.addEventListener('loadedmetadata',play);}
})();
</script>
</body>
</html>
