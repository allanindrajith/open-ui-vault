<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECHOID — Your voice ID to the E network</title>
<link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
--bg:#000;--text:#fff;--text-dim:rgba(255,255,255,.62);--text-dimmer:rgba(255,255,255,.42);
--line:rgba(255,255,255,.14);--line-strong:rgba(255,255,255,.26);
--fill-ghost:rgba(255,255,255,.05);--fill-solid:rgba(255,255,255,.10);
--gutter:clamp(20px,5vw,100px);--ease-premium:cubic-bezier(.16,1,.3,1);
--font-display:"Sora","Helvetica Neue",Helvetica,Arial,sans-serif;
--font-mono:"JetBrains Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-family:var(--font-display)}
body.menu-open{overflow:hidden}
a{color:inherit;text-decoration:none}
.hero{position:relative;width:100%;height:100vh;height:100svh;min-height:640px;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;isolation:isolate}
@media (max-height:640px){.hero{min-height:100svh}}
.hero__media{position:absolute;inset:0;z-index:-1;background:#000}
.hero__media video{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.hero__scrim{position:absolute;inset:0;z-index:-1;pointer-events:none;
background:linear-gradient(to right,transparent 0%,transparent 45%,rgba(0,0,0,.45) 72%,rgba(0,0,0,.72) 100%),
linear-gradient(to bottom,rgba(0,0,0,.55) 0%,transparent 22%,transparent 78%,rgba(0,0,0,.65) 100%)}
.nav{position:relative;z-index:60;display:flex;justify-content:space-between;align-items:center;gap:32px;
padding:clamp(20px,2.4vw,34px) var(--gutter);padding-left:max(var(--gutter),env(safe-area-inset-left));padding-right:max(var(--gutter),env(safe-area-inset-right))}
.logo{font-weight:200;font-size:clamp(20px,1.75vw,30px);letter-spacing:.16em;line-height:1}
.nav__right{display:flex;align-items:center;gap:clamp(24px,3.2vw,62px)}
.nav__links{display:flex;gap:clamp(20px,2.8vw,56px);list-style:none}
.nav__links a,.cta{font-family:var(--font-mono);font-weight:400;font-size:clamp(11px,.78vw,14px);letter-spacing:.18em;text-transform:uppercase}
.nav__links a{transition:color .25s ease}
.nav__links a:hover{color:var(--text-dim)}
.cta{padding:clamp(12px,1vw,17px) clamp(20px,1.8vw,32px);border:1px solid var(--line-strong);transition:background .25s ease,border-color .25s ease}
.cta:hover{background:var(--fill-ghost);border-color:rgba(255,255,255,.5)}
.toggle{display:none;position:relative;width:44px;height:44px;background:none;border:0;cursor:pointer;color:#fff}
.toggle span{position:absolute;left:50%;width:22px;height:1px;background:#fff;transform:translateX(-50%);transition:transform .45s var(--ease-premium),opacity .25s ease,top .45s var(--ease-premium)}
.toggle span:nth-child(1){top:16px}.toggle span:nth-child(2){top:22px}.toggle span:nth-child(3){top:28px}
.toggle[aria-expanded=true] span:nth-child(1){top:22px;transform:translateX(-50%) rotate(45deg)}
.toggle[aria-expanded=true] span:nth-child(2){opacity:0;transform:translateX(-50%) scaleX(0)}
.toggle[aria-expanded=true] span:nth-child(3){top:22px;transform:translateX(-50%) rotate(-45deg)}
.mmenu{position:fixed;inset:0;z-index:50;background:rgba(4,4,6,.94);-webkit-backdrop-filter:blur(28px) saturate(140%);backdrop-filter:blur(28px) saturate(140%);
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
clip-path:circle(3% at calc(100% - 42px) 42px);opacity:0;pointer-events:none;transition:clip-path .7s var(--ease-premium),opacity .45s ease}
.mmenu.open{clip-path:circle(150% at calc(100% - 42px) 42px);opacity:1;pointer-events:auto}
.mmenu a{font-family:var(--font-mono);font-weight:400;text-transform:uppercase;font-size:clamp(20px,5.5vw,28px);letter-spacing:.14em;
opacity:0;transform:translateY(16px);transition:opacity .4s ease,transform .5s var(--ease-premium)}
.mmenu a.mcta{font-size:clamp(14px,4vw,18px);letter-spacing:.22em;padding:16px 40px;border:1px solid var(--line-strong);margin-top:12px}
.mmenu.open a{opacity:1;transform:none;transition-delay:calc(180ms + var(--i)*70ms)}
.hero__body{display:flex;align-items:center;justify-content:flex-end;padding:0 var(--gutter);min-height:0;overflow-y:auto}
.panel{width:min(34vw,620px);min-width:380px;display:flex;flex-direction:column;align-items:flex-start}
.chip{font-family:var(--font-mono);font-weight:400;font-size:clamp(11px,.72vw,14px);letter-spacing:.2em;text-transform:uppercase;background:rgba(255,255,255,.09);padding:clamp(9px,.8vw,14px) clamp(14px,1.1vw,20px);line-height:1}
h1{font-weight:200;font-size:clamp(54px,6.2vw,118px);letter-spacing:.03em;line-height:.95;margin-top:clamp(28px,3vw,52px)}
.tag{font-family:var(--font-mono);font-weight:300;text-transform:uppercase;font-size:clamp(11px,.94vw,17px);letter-spacing:.14em;color:var(--text-dim);margin-top:clamp(14px,1.4vw,24px);line-height:1.4}
form{margin-top:clamp(38px,4.6vw,82px);display:flex;flex-direction:column;gap:clamp(14px,1.3vw,22px);width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input{background:transparent;border:0;border-bottom:1px solid var(--line-strong);border-radius:0;padding:0 2px clamp(12px,1.1vw,18px);font-family:var(--font-display);font-weight:300;font-size:clamp(16px,.95vw,18px);color:#fff;width:100%;transition:border-color .25s ease}
input::placeholder{color:var(--text-dim)}
input:focus{outline:none;border-bottom-color:rgba(255,255,255,.85)}
input:focus::placeholder{color:var(--text-dimmer)}
.btn{width:100%;border:0;border-radius:0;cursor:pointer;padding:clamp(17px,1.6vw,27px) 20px;font-family:var(--font-mono);font-weight:400;text-transform:uppercase;letter-spacing:.22em;font-size:clamp(11px,.78vw,14px);transition:background .25s ease,color .25s ease}
.btn--ghost{background:var(--fill-ghost);color:var(--text-dimmer)}
.btn--ghost:hover{background:rgba(255,255,255,.09);color:#fff}
.btn--solid{background:var(--fill-solid);color:#fff}
.btn--solid:hover{background:rgba(255,255,255,.17)}
.ref{align-self:center;font-family:var(--font-mono);font-weight:400;text-transform:uppercase;font-size:clamp(11px,.74vw,14px);letter-spacing:.18em;margin-top:clamp(26px,2.6vw,46px);transition:color .25s ease}
.ref:hover{color:var(--text-dim);text-decoration:underline;text-underline-offset:4px}
.legal{border-top:1px solid var(--line);padding:clamp(18px,1.7vw,30px) var(--gutter);padding-bottom:max(clamp(18px,1.7vw,30px),env(safe-area-inset-bottom));text-align:center;font-weight:300;font-size:clamp(12px,.82vw,16px);color:var(--text-dim);line-height:1.5}
.legal a{color:#fff;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;transition:color .25s ease}
.legal a:hover{color:var(--text-dim)}
:is(.btn,.cta,.toggle,.ref,input,.mmenu a):focus-visible{outline:1px solid rgba(255,255,255,.7);outline-offset:3px}
@media (max-width:1100px){.panel{width:min(70vw,520px);min-width:0}}
@media (max-width:900px){.nav__links,.nav__right>.cta{display:none}.toggle{display:block}}
@media (max-width:720px){
.hero__scrim{background:linear-gradient(to bottom,rgba(0,0,0,.6) 0%,rgba(0,0,0,.25) 30%,rgba(0,0,0,.75) 100%)}
.hero__body{justify-content:center}
.panel{width:100%}
}
@media (max-width:380px){h1{font-size:clamp(44px,15vw,64px)}}
@media (max-height:640px){
.nav{padding-top:14px;padding-bottom:14px}
h1{font-size:clamp(36px,7vw,64px);margin-top:16px}
form{margin-top:22px;gap:10px}
.btn{padding:12px 20px}
.legal{font-size:11px;padding-top:12px;padding-bottom:12px}
.mmenu{gap:16px}
}
@media (prefers-reduced-motion:reduce){
.hero__media video{display:none}
.hero__media{background:#000 url("https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260806_132328_5f9029c8-218f-4489-82b6-29ff2849920e.png") center/cover no-repeat}
*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<section class="hero">
  <div class="hero__media">
    <video autoplay muted loop playsinline preload="auto" poster="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260806_132328_5f9029c8-218f-4489-82b6-29ff2849920e.png" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260806_133255_956f653f-5d80-4b06-abd5-0f46c98b60fa.mp4"></video>
  </div>
  <div class="hero__scrim"></div>
  <header class="nav">
    <a class="logo" href="#">ECHOID</a>
    <div class="nav__right">
      <ul class="nav__links">
        <li><a href="#story">Story</a></li><li><a href="#platforms">Platforms</a></li><li><a href="#identity">Identity</a></li><li><a href="#contact">Contact</a></li>
      </ul>
      <a class="cta" href="#join">Join up</a>
      <button class="toggle" id="toggle" aria-expanded="false" aria-controls="mobileMenu" aria-label="Open menu"><span></span><span></span><span></span></button>
    </div>
  </header>
  <div class="mmenu" id="mobileMenu" role="dialog" aria-modal="true" aria-label="Site menu" aria-hidden="true" inert>
    <a href="#story" style="--i:0">Story</a><a href="#platforms" style="--i:1">Platforms</a><a href="#identity" style="--i:2">Identity</a><a href="#contact" style="--i:3">Contact</a><a class="mcta" href="#join" style="--i:4">Join up</a>
  </div>
  <main class="hero__body">
    <div class="panel">
      <span class="chip">[ Voice entry ]</span>
      <h1>ECHOID</h1>
      <p class="tag">Your voice ID to the E network.</p>
      <form action="#" method="post" novalidate>
        <label class="sr" for="email">Email</label>
        <input id="email" type="email" placeholder="Email" autocomplete="email">
        <button class="btn btn--ghost" type="submit">Proceed using email</button>
        <button class="btn btn--solid" type="submit">Access</button>
      </form>
      <a class="ref" href="#invite">I've got an invite key</a>
    </div>
  </main>
  <footer class="legal">Opening an e.xyz account signals that you accept our <a href="#privacy-notice">Privacy Notice</a> and <a href="#service-contract">Service Contract</a>.</footer>
</section>
<script>
(function(){
var t=document.getElementById('toggle'),m=document.getElementById('mobileMenu');
function set(o){m.classList.toggle('open',o);t.setAttribute('aria-expanded',o);t.setAttribute('aria-label',o?'Close menu':'Open menu');m.setAttribute('aria-hidden',!o);
if(o)m.removeAttribute('inert');else m.setAttribute('inert','');document.body.classList.toggle('menu-open',o);}
t.addEventListener('click',function(){var o=!m.classList.contains('open');set(o);if(!o)t.focus();});
m.addEventListener('click',function(e){if(e.target===m||e.target.tagName==='A'){set(false);t.focus();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&m.classList.contains('open')){set(false);t.focus();}});
window.addEventListener('resize',function(){if(innerWidth>=901&&m.classList.contains('open'))set(false);});
document.querySelector('form').addEventListener('submit',function(e){e.preventDefault();});
})();
</script>
</body>
</html>
