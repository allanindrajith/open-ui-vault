<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axon — Digital Workers for Mundane Workflows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;overflow-x:hidden}
body{font-family:'Inter',sans-serif;color:#1B133C;background:linear-gradient(#b9a9e0,#d9c9ec)}
.hero{position:relative;height:100vh;width:100%;overflow:hidden;display:flex;flex-direction:column}
.bg{position:absolute;inset:0;z-index:0}
.bg video{width:100%;height:130%;object-fit:cover;object-position:top;display:block}
.nav{position:relative;z-index:10;display:flex;justify-content:center;padding-top:16px}
.pill{display:flex;align-items:center;gap:24px;background:rgba(255,255,255,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:12px;padding:12px 16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pill svg{width:24px;height:24px;display:block}
.links{display:none;gap:24px}
.links a{font-size:14px;font-weight:500;color:rgba(27,19,60,.8);text-decoration:none;transition:color .2s}
.links a:hover{color:#1B133C}
.content{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:32px;padding:0 16px}
.badge{display:inline-flex;align-items:center;gap:8px;margin-bottom:24px;border-radius:12px;border:1px solid rgba(27,19,60,.1);background:rgba(255,255,255,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:8px 16px;font-size:14px;font-weight:500}
.badge i{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:#f97316;border-radius:4px;color:#fff;font-style:normal;font-weight:700;font-size:13px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:36px;line-height:.95;letter-spacing:-.025em;max-width:56rem}
.sub{margin-top:20px;max-width:48rem;font-size:12px;line-height:1.625;color:rgba(27,19,60,.7)}
.cta{margin-top:28px;border:0;cursor:pointer;font-family:inherit;border-radius:12px;background:#FEFEFE;padding:12px 24px;font-size:14px;font-weight:600;color:#1B133C;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:all .3s}
.cta:hover{box-shadow:0 6px 16px rgba(0,0,0,.2)}
@media(min-width:640px){
.links{display:flex}
h1{font-size:48px}
.sub{margin-top:24px;font-size:14px}
.cta{margin-top:32px;padding:14px 32px}
}
@media(min-width:768px){
.nav{padding-top:24px}
.pill{padding:12px 24px}
.content{margin-top:64px}
h1{font-size:72px}
.sub{font-size:16px}
}
@media(min-width:1024px){h1{font-size:96px}}
</style>
</head>
<body>
<section class="hero">
<div class="bg"><video autoplay muted loop playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260714_113715_c7e0daa0-8bdd-4486-a2da-040901f8f0ea.mp4"></video></div>
<nav class="nav"><div class="pill">
<svg viewBox="0 0 256 256" fill="#1B133C"><path d="M 256 256 L 128 256 L 0 128 L 128 128 Z"/><path d="M 256 128 L 128 128 L 0 0 L 128 0 Z"/></svg>
<div class="links"><a href="#">Features</a><a href="#">Plans</a><a href="#">Security</a><a href="#">About</a></div>
</div></nav>
<div class="content">
<div class="badge"><i>Y</i>Funded by Y Combinator</div>
<h1>Deploy digital workers<br>for mundane workflows</h1>
<p class="sub">Eliminate your tedious browser work and 10x your team's capacity. Put intelligent agents on every routine process so you grow faster and deliver more for clients — effortlessly.</p>
<button class="cta">Get Early Access</button>
</div>
</section>
</body>
</html>
