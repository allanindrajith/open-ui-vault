:root{
  --paper:#F6F3EA;--ink:#1C1A17;--ink2:#3B3731;--muted:#77716A;--terra:#C35933;--line:#1C1A17;
  --sans:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
canvas{display:block}

/* one 1440×810 frame, scaled to fit; the map and the story layer bleed past it to the screen edges */
.stage{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
.frame{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0}
.frame>*{position:absolute}

/* ---------- map view ---------- */
.mapview{inset:0;will-change:transform}
.mapview>*{position:absolute}
.ring{position:absolute}
.mapbox{left:0;top:0;width:1440px;height:810px}
.mapbox>*{position:absolute}
.map{left:0;top:0;width:1440px;height:810px;overflow:visible}
.map .ln{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.map .hit{fill:transparent;cursor:pointer}
.fill{left:0;top:0;width:1440px;height:810px;pointer-events:none;opacity:0}
.fill canvas{position:absolute}
.dot{width:0;height:0;cursor:pointer}
.dot i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--terra)}
.dot b{position:absolute;left:-24px;top:-24px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,rgba(195,89,51,.32) 0,rgba(195,89,51,0) 70%)}
.dot .hitd{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%}
.ring{left:0;top:0;width:0;height:0;pointer-events:none;opacity:0}
.ring .disc{position:absolute;left:-31px;top:-31px;width:62px;height:62px;border-radius:50%;background:#FFFDF8;display:grid;place-items:center}
.ring .disc svg{width:18px;height:18px}
.ring .txt{position:absolute;left:-58px;top:-58px;width:116px;height:116px;animation:spin 14s linear infinite}
.ring .txt text{font:500 9.6px var(--mono);letter-spacing:.06em;fill:#FFFDF8}
@keyframes spin{to{transform:rotate(360deg)}}

.intro{left:60px;top:219px;width:380px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.24em;color:var(--ink2);text-transform:uppercase}
.h1{margin-top:20px;font-weight:700;font-size:54px;line-height:50px;letter-spacing:-.022em;color:var(--ink)}
.h1 em{font-style:normal;color:var(--terra)}
.lede{margin-top:27px;font:400 13.2px/24px var(--mono);color:var(--ink2);letter-spacing:-.005em}
.coords{right:46px;top:28px;font:500 10.2px/17px var(--mono);color:var(--ink);text-align:right;white-space:pre;letter-spacing:.01em}
.zones{right:106px;top:440px;text-align:right}
.zones h2{font:500 11px var(--mono);letter-spacing:.24em;color:var(--ink2);margin-bottom:14px}
.zones ol{list-style:none}
.zones li button{display:block;margin-left:auto;font:400 25px/45px var(--mono);color:var(--ink2);letter-spacing:-.01em}
.zones li button.on{color:var(--terra);font-weight:500}
.ruler{right:54px;top:471px;width:24px;height:230px;pointer-events:none}
.ruler svg{width:100%;height:100%;overflow:visible}
.ruler .mark{stroke:var(--terra);stroke-width:1.3}

/* ---------- story view ---------- */
.story{left:0;top:0;pointer-events:none;visibility:hidden}
.story.is-open{pointer-events:auto;visibility:visible}
.strip{position:absolute;left:0;top:0;bottom:0;width:72px;background:var(--paper);border-right:1px solid rgba(28,26,23,.14);overflow:hidden;z-index:3}
.strip .back{position:absolute;left:6px;top:8px;padding:8px;min-height:32px;font:500 11px var(--mono);letter-spacing:.06em;color:var(--ink);display:flex;align-items:center;gap:5px;z-index:2}
.strip .back:hover{color:var(--terra)}
.strip svg{position:absolute;left:0;top:0;overflow:visible}
.track{position:absolute;left:72px;top:0;bottom:0;right:0;overflow:hidden;cursor:none;touch-action:pan-y}
.slides{position:absolute;left:0;top:0;bottom:0;will-change:transform}
.slide{position:absolute;top:0;bottom:0}
.photo{position:absolute;top:0;bottom:0;overflow:hidden;background:#cfc9bc}
.photo canvas{position:absolute;top:0;height:100%}
.card{position:absolute;top:0;bottom:0;overflow:hidden;color:#FFF8EE}
.card .count{position:absolute;left:0;right:0;top:22px;text-align:center;font:500 10px var(--mono);letter-spacing:.2em;display:flex;justify-content:center;align-items:center;gap:10px}
.card .count i{display:block;width:36px;height:1px;background:currentColor;opacity:.5;position:relative}
.card .count i b{position:absolute;left:0;top:-.5px;height:2px;background:currentColor;opacity:1}
.card .pic{position:absolute;left:62px;right:62px;top:62px;height:230px;overflow:hidden;background:rgba(0,0,0,.15)}
.card .pic img{width:100%;height:100%;object-fit:cover;display:block}
.card .shape{position:absolute;right:-30px;bottom:-40px;width:420px;height:420px;opacity:.16}
.card .shape path{fill:none;stroke:currentColor;stroke-width:1.2;vector-effect:non-scaling-stroke}
.card .meta{position:absolute;left:62px;right:110px;bottom:120px}
.card .kick{font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;opacity:.86}
.card .city{margin-top:12px;font:600 42px/1.05 var(--mono);letter-spacing:-.035em}
.card .body{margin-top:16px;font:400 15px/22px var(--sans);opacity:.94;max-width:330px}
.card .badge{position:absolute;right:52px;bottom:44px;width:96px;height:96px;display:grid;place-items:center;cursor:pointer;pointer-events:auto}
.card .badge .disc{width:40px;height:40px;border-radius:50%;background:#FFF1DC;display:grid;place-items:center;color:var(--ink)}
.card .badge .disc svg{width:14px;height:14px}
.card .badge .txt{position:absolute;inset:0;animation:spin 14s linear infinite}
.card .badge text{font:500 8.4px var(--mono);letter-spacing:.04em;fill:currentColor}

.cursor{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:20;opacity:0}
.cursor .c{position:absolute;left:-40px;top:-40px;width:80px;height:80px;border-radius:50%;background:#FFF1DC;color:var(--ink);display:grid;place-items:center;font:600 10.5px var(--mono);letter-spacing:.18em;box-shadow:0 0 0 1px rgba(28,26,23,.08)}
.cursor .c span{display:flex;align-items:center;gap:7px}
.cursor .c svg{width:9px;height:9px}

/* ---------- phones ---------- */
@media (max-width:820px),(orientation:portrait) and (max-width:1180px){
  .frame{transform:none!important;width:100vw;height:100svh}
  .mapview{inset:0}
  .mapbox{left:50%;top:calc(50% + 72px);transform:translate(-50%,-50%) scale(var(--ms,1)) translate(-70px,-30px)}
  .intro{left:0;right:0;top:0;width:auto;padding:68px 20px 46px;background:linear-gradient(var(--paper) 72%,rgba(246,243,234,0))}
  .h1{margin-top:12px;font-size:clamp(34px,5.6vw,58px);line-height:.97}
  .lede{display:none}
  .coords{right:20px;top:20px;font-size:9px;line-height:14px}
  .zones{left:0;right:0;bottom:18px;top:auto;text-align:left}
  .zones h2{display:none}
  .zones ol{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
  .zones li button{font-size:15px;line-height:34px;padding:0 14px;border:1px solid rgba(28,26,23,.2);border-radius:20px;white-space:nowrap}
  .zones li button.on{border-color:var(--terra)}
  .ruler{display:none}
  .strip{width:44px}
  .strip .back span{display:none}
  .track{left:44px;cursor:auto}
  .card .pic{left:22px;right:22px;top:44px;height:min(150px,22vh)}
  .card .meta{left:22px;right:22px;bottom:96px}
  .card .city{font-size:32px}
  .card .body{font-size:14px;line-height:20px}
  .card .badge{right:16px;bottom:16px;transform:scale(.8)}
  .card .count{top:14px}
  .card .shape{width:300px;height:300px}
  .cursor{display:none}
}
@media (prefers-reduced-motion:reduce){.ring .txt,.card .badge .txt{animation:none}}
</style>
</head>
<body>
<main class="stage">
<div class="frame" id="frame">
  <section class="mapview" id="mapview" aria-label="Map of North America">
    <div class="mapbox">

  else{st.style.left=(-OX/S)+'px';st.style.top=(-OY/S)+'px';st.style.width=FW+'px';st.style.height=FH+'px'}
  sizeFills();buildSlides();
}

/* ---------------- map: zone fills, dots, list, ruler ---------------- */
var fills={};
$$('.fill').forEach(function(f){fills[f.getAttribute('data-r')]=f});
var BOX={canada:[455,-150,1170,500],west:[480,340,740,645],midwest:[700,375,980,590],south:[655,495,1050,750],northeast:[965,365,1110,520]};
function sizeFills(){
  var dpr=Math.min(devicePixelRatio||1,2),k=PHONE?1:S;
  Object.keys(fills).forEach(function(id){
    var b=BOX[id],cv=fills[id].firstChild;
    cv.style.left=b[0]+'px';cv.style.top=b[1]+'px';cv.style.width=(b[2]-b[0])+'px';cv.style.height=(b[3]-b[1])+'px';
    cv.width=Math.round((b[2]-b[0])*k*dpr);cv.height=Math.round((b[3]-b[1])*k*dpr);
  });
}
var dotsWrap=$('.dots'),ring=$('#ring');
Z.forEach(function(z){
  var d=document.createElement('button');d.type='button';d.className='dot';d.setAttribute('aria-label','Open the '+z.name+' story');
  d.style.cssText='position:absolute;left:'+z.dot[0]+'px;top:'+z.dot[1]+'px;pointer-events:auto';
  d.innerHTML='<b></b><i></i><span class="hitd"></span>';d.dataset.r=z.id;dotsWrap.appendChild(d);z.dotEl=d;
  if(!REDUCE)d.querySelector('b').animate([{transform:'scale(.7)',opacity:.9},{transform:'scale(1.35)',opacity:0}],{duration:2200,iterations:Infinity,delay:IDX[z.id]*420,easing:'ease-out'});
});
var zl=$('#zlist');
Z.forEach(function(z){var li=document.createElement('li');li.innerHTML='<button type="button" data-r="'+z.id+'">'+z.name+'</button>';zl.appendChild(li);z.li=li.firstChild});
(function(){ /* ruler: minor ticks + a long tick beside each zone */
  var s='<path d="M12 0V230" stroke="#1C1A17" stroke-width="1"/>';
  for(var y=4;y<230;y+=9)s+='<path d="M'+(y%27<9?5:8)+' '+y+'H'+(y%27<9?19:16)+'" stroke="#1C1A17" stroke-width="1"/>';
  s+='<path class="mark" id="mark" d="M-12 0H34"/>';$('#ruler').innerHTML=s;
})();
var mark=$('#mark');

/* ---------------- tiny tween engine on the page clock ---------------- */
var tw=[];
var E={out:function(t){return 1-Math.pow(1-t,3)},inout:function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2},expo:function(t){return t>=1?1:1-Math.pow(2,-10*t)},
  io2:function(t){return t<.5?16*t*t*t*t*t:1-Math.pow(-2*t+2,5)/2}};
var V={};
function to(k,v,dur,ease,delay){var t0=now()+(delay||0);tw=tw.filter(function(x){return x.k!==k});tw.push({k:k,f:V[k]==null?v:V[k],t:v,t0:t0,d:dur,e:E[ease||'out']})}
function set(k,v){tw=tw.filter(function(x){return x.k!==k});V[k]=v}
function step(){var t=now();tw=tw.filter(function(x){var p=Math.max(0,Math.min(1,(t-x.t0)/x.d));if(t<x.t0)return true;V[x.k]=x.f+(x.t-x.f)*x.e(p);return p<1})}

/* ---------------- state ---------------- */
var active=0;Z.forEach(function(z,i){set('f'+z.id,i===0?1:0)});set('ring',1);set('view',0);
function activate(i){
  if(i===active)return;active=i;
  Z.forEach(function(z,j){to('f'+z.id,j===i?1:0,j===i?650:450,'out');z.li.classList.toggle('on',j===i)});
  set('ring',0);to('ring',1,620,'expo',60);
  $('#coords').textContent=Z[i].coord+'\n48° 21\' 36" N, 100° 27\' 12" W';
  to('mark',markY(i),420,'out');
  if(PHONE){var ol=zl,li=zl.children[i];ol.scrollTo({left:li.offsetLeft-(ol.clientWidth-li.offsetWidth)/2,behavior:REC?'auto':'smooth'})}
}
Z[0].li.classList.add('on');$('#coords').textContent=Z[0].coord+'\n48° 21\' 36" N, 100° 27\' 12" W';
function markY(i){var a=zl.children[i].getBoundingClientRect(),b=$('.ruler').getBoundingClientRect();return PHONE?0:((a.top+a.height/2)-b.top)/S}
set('mark',0);

/* map hover */
$$('.hit').forEach(function(h){h.addEventListener('pointerenter',function(){if(V.view<.01)activate(IDX[h.getAttribute('data-r')])})});
$$('.dot').forEach(function(d){d.addEventListener('pointerenter',function(){activate(IDX[d.dataset.r])});d.addEventListener('click',function(){activate(IDX[d.dataset.r]);openStory(IDX[d.dataset.r])})});
$$('.hit').forEach(function(h){h.addEventListener('click',function(){openStory(IDX[h.getAttribute('data-r')])})});
$$('#zlist button').forEach(function(b){b.addEventListener('pointerenter',function(){activate(IDX[b.dataset.r])});b.addEventListener('focus',function(){activate(IDX[b.dataset.r])});b.addEventListener('click',function(){activate(IDX[b.dataset.r]);openStory(IDX[b.dataset.r])})});

/* ---------------- story view ---------------- */
var story=$('#story'),slidesEl=$('#slides'),track=$('#track'),PW=0,CW=0,SW=0;
function regionShape(id){var p=$('#cp-'+id+' path');return p?p.getAttribute('d'):''}
function buildSlides(){
  var H=FH;
  if(PHONE){PW=FW-44;CW=PW;SW=PW}else{PW=Math.round(H*.74);CW=Math.round(H*.69);SW=PW+CW}
  if(!slidesEl.children.length){
    Z.forEach(function(z,i){
      var s=document.createElement('article');s.className='slide';s.setAttribute('aria-label',z.city);
      var b=BOX[z.id];
      s.innerHTML='<div class="photo"><canvas></canvas></div>'+
       '<div class="card" style="background:'+z.color+';color:'+z.ink+'">'+
        '<p class="count">'+String(i+1).padStart(2,'0')+'<i><b style="width:'+((i+1)/Z.length*100)+'%"></b></i>05</p>'+
        '<div class="pic"><img src="'+z.person+'" alt="" draggable="false"></div>'+
        '<svg class="shape" viewBox="'+b[0]+' '+b[1]+' '+(b[2]-b[0])+' '+(b[3]-b[1])+'" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="'+regionShape(z.id)+'"/></svg>'+
        '<div class="meta"><p class="kick">Fighting climate change</p><h2 class="city">'+z.city+'</h2><p class="body">'+z.body+'</p></div>'+
        '<button class="badge" type="button" aria-label="Discover more stories"><svg class="txt" viewBox="-48 -48 96 96" aria-hidden="true"><defs><path id="bp'+i+'" d="M0,-37a37,37 0 1,1 -.01,0"/></defs><text><textPath href="#bp'+i+'" textLength="229" lengthAdjust="spacing">DISCOVER STORIES · DISCOVER STORIES · </textPath></text></svg><span class="disc"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 1v12M1 7h12"/></svg></span></button>'+
       '</div>';
      slidesEl.appendChild(s);z.slide=s;
    });
  }
  var dpr=Math.min(devicePixelRatio||1,2),k=PHONE?1:S;
  Z.forEach(function(z,i){
    var s=z.slide,ph=s.querySelector('.photo'),cd=s.querySelector('.card'),cv=ph.firstChild;
    s.style.left=(i*SW)+'px';s.style.width=SW+'px';
    if(PHONE){ph.style.left='0px';ph.style.width=PW+'px';ph.style.height='42%';ph.style.bottom='auto';cd.style.left='0px';cd.style.width=CW+'px';cd.style.top='42%'}
    else{ph.style.left='0px';ph.style.width=PW+'px';cd.style.left=PW+'px';cd.style.width=CW+'px'}
    var extra=PHONE?0:120; /* room for parallax */
    cv.style.left=(-extra/2)+'px';cv.style.width=(PW+extra)+'px';
    var phH=PHONE?FH*.42:FH;
    cv.width=Math.round((PW+extra)*k*dpr);cv.height=Math.round(phH*k*dpr);cv.style.height=phH+'px';
  });
}
var cur=0;set('pos',0);set('drag',0);
function openStory(i){
  if(V.view>.01&&!closing)return;closing=false;cur=i;set('pos',i*SW);
  story.classList.add('is-open');story.setAttribute('aria-hidden','false');
  to('view',1,1250,'io2');
  var s=Z[i].slide;cardIn(s,380);
}
function cardIn(s,delay){
  if(REDUCE)return;
  var o={duration:820,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards',delay:delay};
  s.querySelector('.pic').animate([{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0 0 0 0)'}],Object.assign({},o,{delay:delay+250,duration:900}));
  s.querySelector('.pic img').animate([{transform:'scale(1.25)'},{transform:'scale(1)'}],Object.assign({},o,{delay:delay+250,duration:1300}));
  $$('.kick,.city,.body,.count,.badge',s).forEach(function(el,j){el.animate([{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],Object.assign({},o,{delay:delay+420+j*70}))});
}
var closing=false;
function closeStory(){closing=true;to('view',0,1100,'io2');story.setAttribute('aria-hidden','true')}
$('#back').addEventListener('click',closeStory);
addEventListener('keydown',function(e){
  if(V.view<.5){return}
  if(e.key==='Escape')closeStory();
  if(e.key==='ArrowRight')goTo(Math.min(Z.length-1,cur+1));
  if(e.key==='ArrowLeft')goTo(Math.max(0,cur-1));
});
function goTo(i){cur=i;to('pos',i*SW,900,'expo');activate(i)}

/* drag with momentum and snap */
var drag=null,cx=-200,cy=-200,cd=0;
function px(e){return PHONE?e.clientX:(e.clientX-OX)/S}
track.addEventListener('pointerdown',function(e){
  if(e.target.closest('.badge'))return;
  drag={x:px(e),p:V.pos,t:now(),v:0,lx:px(e),lt:now(),id:e.pointerId};track.setPointerCapture(e.pointerId);set('pos',V.pos);to('press',1,260,'out');
});
track.addEventListener('pointermove',function(e){
  cx=e.clientX;cy=e.clientY;
  if(!drag)return;var x=px(e),t=now();
  var p=drag.p-(x-drag.x);var max=(Z.length-1)*SW;
  if(p<0)p=p*.35;if(p>max)p=max+(p-max)*.35;set('pos',p);
  var dt=Math.max(1,t-drag.lt);drag.v=.8*drag.v+.2*((x-drag.lx)/dt);drag.lx=x;drag.lt=t;
});
function release(){
  if(!drag)return;var p=V.pos-drag.v*260;var i=Math.max(0,Math.min(Z.length-1,Math.round(p/SW)));
  drag=null;to('press',0,320,'out');goTo(i);
}
track.addEventListener('pointerup',release);track.addEventListener('pointercancel',release);
track.addEventListener('pointerenter',function(){if(!PHONE)to('cur',1,260,'out')});
track.addEventListener('pointerleave',function(){to('cur',0,200,'out')});
$('#strip').addEventListener('pointerenter',function(){to('cur',0,200,'out')});
addEventListener('pointermove',function(e){cx=e.clientX;cy=e.clientY});

/* ---------------- entrance ---------------- */
function entrance(){
  if(REDUCE)return;
  var o=function(d,del,e){return {duration:d,delay:del,easing:e||'cubic-bezier(.2,.8,.2,1)',fill:'backwards'}};
  $$('.draw').forEach(function(p,i){p.animate([{strokeDasharray:'1 1',strokeDashoffset:1},{strokeDasharray:'1 1',strokeDashoffset:0}],o(1700,i*120,'cubic-bezier(.5,0,.2,1)'))});
  $('.eyebrow').animate([{opacity:0,letterSpacing:'.6em'},{opacity:1,letterSpacing:'.24em'}],o(900,150));
  $('.h1').animate([{opacity:0,transform:'translateY(26px)',clipPath:'inset(0 0 100% 0)'},{opacity:1,transform:'none',clipPath:'inset(0 0 0 0)'}],o(1000,250));
  $('.lede').animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],o(800,520));
  $('.coords').animate([{opacity:0},{opacity:1}],o(700,600));
  $('.zones h2').animate([{opacity:0},{opacity:1}],o(600,640));
  $$('#zlist li').forEach(function(li,i){li.animate([{opacity:0,transform:'translateX(22px)'},{opacity:1,transform:'none'}],o(700,700+i*70))});
  $('.ruler').animate([{opacity:0,clipPath:'inset(0 0 100% 0)'},{opacity:1,clipPath:'inset(0 0 0 0)'}],o(900,700));
  $$('.dot i').forEach(function(d,i){d.animate([{transform:'scale(0)'},{transform:'scale(1.25)',offset:.6},{transform:'scale(1)'}],o(600,900+i*90,'ease-out'))});
  fills.midwest.animate([{opacity:0,clipPath:'url(#cp-midwest)'},{opacity:1,clipPath:'url(#cp-midwest)'}],o(900,1150));
  ring.animate([{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'none'}],o(700,1300));
}

/* ---------------- frame loop ---------------- */
var lastT=0,mini=$('#mini'),mapview=$('#mapview'),strip=$('#strip'),cursorEl=$('#cursor');
function frameLoop(){
  step();var t=now();
  /* map fills + ring */
  Z.forEach(function(z){var f=fills[z.id],v=V['f'+z.id];f.style.opacity=v.toFixed(3);if(v>.002)draw(f.firstChild,z)});
  var a=Z[active];ring.style.left=a.dot[0]+'px';ring.style.top=a.dot[1]+'px';
  var r=V.ring;ring.style.transform='scale('+(.55+.45*r).toFixed(3)+')';ring.style.opacity=Math.min(1,r*1.4).toFixed(3);
  Z.forEach(function(z,i){z.dotEl.querySelector('i').style.opacity=i===active?0:1});
  mark.setAttribute('transform','translate(0 '+V.mark.toFixed(1)+')');
  /* view transition: the map slides left under the strip, the stories come in from the right */
  var v=V.view;
  if(PHONE){mapview.style.transform='translateX('+(-v*FW*.3).toFixed(1)+'px)';mapview.style.opacity=(1-v).toFixed(3)}
  else mapview.style.transform='translateX('+(-v*520).toFixed(1)+'px)';
  story.style.transform='translateX('+((1-v)*(FW+40)).toFixed(1)+'px)';
  if(closing&&v<.001){closing=false;story.classList.remove('is-open')}
  mini.style.transform='translate('+(-470+(1-v)*0)+'px,'+(PHONE?-120:0)+'px)';
  /* track */
  slidesEl.style.transform='translateX('+(-V.pos).toFixed(1)+'px)';
  if(v>.001)Z.forEach(function(z,i){
    var x=i*SW-V.pos;if(x>FW||x+PW<-80)return;
    var par=Math.max(0,Math.min(1,.5-(x/(FW||1))*.35));draw(z.slide.querySelector('.photo canvas'),z,par);
  });
  /* custom cursor */
  var c=V.cur||0;cursorEl.style.opacity=(c*(v>.5?1:0)).toFixed(3);
  var pr=V.press||0;cursorEl.style.transform='translate('+cx+'px,'+cy+'px) scale('+(c*(1-.18*pr)).toFixed(3)+')';
  requestAnimationFrame(frameLoop);
}

/* ---------------- recording: a scripted visit on the page clock ---------------- */
var script=[];
if(REC){
  var path=[[0,1180,250],[.9,1180,250],[1.3,600,470],[1.7,600,470],[2.15,1295,631],[2.4,1300,631],[2.8,816,628],[2.95,814,626],[4.15,1050,420],[4.3,1050,420],[4.95,560,420],[6.5,540,420]];
  var fire=[[1.28,function(){activate(IDX.west)}],[2.1,function(){activate(IDX.south)}],[2.9,function(){activate(IDX.south)}],[2.95,function(){openStory(IDX.south)}],
    [4.0,function(){to('cur',1,250)}],[4.3,function(){to('press',1,260)}],[4.95,function(){to('press',0,320);goTo(IDX.northeast)}]];
  var cur2=document.createElement('div');cur2.style.cssText='position:fixed;left:0;top:0;width:14px;height:14px;margin:-2px 0 0 -2px;z-index:30;pointer-events:none';
  cur2.innerHTML='<svg width="18" height="22" viewBox="0 0 18 22"><path d="M1.5 1.5v16.2l4.3-4.1 2.9 6.6 2.7-1.2-2.8-6.4h6z" fill="#fff" stroke="#1C1A17" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  document.body.appendChild(cur2);
  var fired=0;
  var ptAt=function(tt){for(var i=0;i<path.length-1;i++){var a=path[i],b=path[i+1];if(tt<=b[0]){var k=Math.max(0,(tt-a[0])/(b[0]-a[0]));k=k*k*(3-2*k);return [a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k]}}var l=path[path.length-1];return [l[1],l[2]]};
  var recLoop=function(){
    var tt=now()/1000;
    while(fired<fire.length&&tt>=fire[fired][0]){fire[fired][1]();fired++}
    var p=ptAt(tt),sx=OX+p[0]*S,sy=OY+p[1]*S;
    var inStory=V.view>.5;
    cur2.style.transform='translate('+sx+'px,'+sy+'px)';cur2.style.opacity=(inStory?0:1);
    cx=sx;cy=sy;
    /* the scripted drag: pull the track with the cursor between 5.05 s and 5.95 s */
    if(tt>4.3&&tt<4.95){set('pos',IDX.south*SW+(1050-ptAt(tt)[0]))}
    requestAnimationFrame(recLoop);
  };
  recLoop();
}

layout();addEventListener('resize',function(){layout();set('mark',markY(active))});
set('mark',markY(0));document.fonts.ready.then(function(){set('mark',markY(active))});
activate(0);
if(!REC){entrance()}else entrance();
frameLoop();
})();
</script>
</body>
