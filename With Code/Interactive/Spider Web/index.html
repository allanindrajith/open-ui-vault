:root { color-scheme: dark; --blue: #1129e2; --ink: #ffffff; --ink-70: rgba(255,255,255,0.7); --glass: rgba(255,255,255,0.1);
  --u: min(calc(100vw / 2000), calc(100dvh / 1125)); --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
html, body { height: 100%; }
body { background: var(--blue); overflow: hidden; }
.page { position: relative; width: 100vw; height: 100dvh; overflow: hidden; }
.frame { position: absolute; inset: 0; color: var(--ink); font-family: var(--font); font-weight: 400; user-select: none; }
.frame > * { position: absolute; margin: 0; }
.frame p { margin: 0; }
img { display: block; max-width: none; }

/* навігація */
.top-nav { left: max(16px, 7vw); right: max(16px, 7vw); top: max(12px, calc(38 / 11.25 * 1dvh)); height: calc(56 * var(--u)); min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.logo { position: relative; flex: none; width: calc(157 * var(--u)); height: calc(44 * var(--u)); }
.logo-back { position: absolute; left: 0; top: calc(6.33 * var(--u)); width: calc(53 * var(--u)); height: calc(41 * var(--u)); }
.logo-front { position: absolute; left: 0; top: calc(12.33 * var(--u)); width: calc(53 * var(--u)); height: calc(34 * var(--u)); }
.logo-word { position: absolute; left: calc(70 * var(--u)); top: 0; font-size: calc(36 * var(--u)); line-height: calc(44 * var(--u)); letter-spacing: -0.08em; }
.links { display: flex; gap: calc(32 * var(--u)); list-style: none; margin: 0; padding: 0; font-size: calc(22 * var(--u)); letter-spacing: -0.08em; white-space: nowrap; }
.links li.on { font-weight: 500; text-decoration: line-through; }
.nav-icons { flex: none; display: flex; gap: calc(32 * var(--u)); justify-content: flex-end; width: calc(157 * var(--u)); }
.i24 { width: calc(26 * var(--u)); height: calc(26 * var(--u)); }
.controls .i24 { width: calc(24 * var(--u)); height: calc(24 * var(--u)); }
.i20 { width: calc(20 * var(--u)); height: calc(20 * var(--u)); }
.i16 { width: calc(16 * var(--u)); height: calc(16 * var(--u)); }
.i48 { width: calc(48 * var(--u)); height: calc(48 * var(--u)); }

/* велике слово */
.found { left: 50%; top: calc(547 / 11.25 * 1dvh - 48 * var(--u)); transform: translate(-50%, -50%); font-size: calc(350 * var(--u)); line-height: calc(240 * var(--u)); letter-spacing: -0.1em; text-indent: -0.1em; white-space: nowrap; }

/* предмети: ліві — від лівого краю, праві — від правого */
.mug { left: calc(205 / 20 * 1vw); top: calc(359 / 11.25 * 1dvh - 48 * var(--u)); width: calc(241 * var(--u)); height: auto; }
.ibook { right: calc(162 / 20 * 1vw); top: calc(323 / 11.25 * 1dvh); width: calc(312 * var(--u)); height: auto; }
.book { right: calc(376 / 20 * 1vw); top: calc(689.5 / 11.25 * 1dvh); width: calc(293 * var(--u)); height: auto; }
.tshirt { left: 50%; transform: translateX(-50%); bottom: 0; width: calc(250 * var(--u)); height: auto; }

/* плеєр */
.player { left: max(16px, 7vw); top: calc(509 / 11.25 * 1dvh - 48 * var(--u)); width: calc(291 * var(--u)); height: calc(172 * var(--u)); box-sizing: border-box; padding: calc(16 * var(--u)); border-radius: calc(24 * var(--u)); display: flex; flex-direction: column; gap: calc(12 * var(--u)); overflow: hidden;
  background: var(--glass); -webkit-backdrop-filter: blur(calc(12 * var(--u))); backdrop-filter: blur(calc(12 * var(--u))); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25); }
.p-head { display: flex; align-items: center; justify-content: space-between; }
.track { display: flex; align-items: center; gap: calc(12 * var(--u)); }
.art { width: calc(40 * var(--u)); height: calc(40 * var(--u)); border-radius: calc(12 * var(--u)); }
.titles { display: flex; flex-direction: column; gap: calc(2 * var(--u)); white-space: nowrap; }
.p-title { font-size: calc(18 * var(--u)); font-weight: 600; }
.p-sub { font-size: calc(12 * var(--u)); color: var(--ink-70); }
.progress { display: flex; flex-direction: column; gap: calc(8 * var(--u)); }
.track-bar { height: calc(4 * var(--u)); border-radius: calc(2 * var(--u)); background: rgba(255,255,255,0.2); overflow: hidden; }
.track-bar span { display: block; width: 46%; height: 100%; background: var(--ink); border-radius: inherit; }
.times { display: flex; justify-content: space-between; font-size: calc(10 * var(--u)); font-weight: 600; color: var(--ink-70); font-variant-numeric: tabular-nums; }
.controls { display: flex; align-items: center; justify-content: space-between; }
.icon-btn { all: unset; display: grid; place-items: center; border-radius: 50%; cursor: pointer; }
.icon-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.icon-btn:active img, .icon-btn:active .pause { transform: scale(0.92); }
.dim { opacity: 0.55; }
.pause { display: flex; gap: calc(5 * var(--u)); align-items: center; justify-content: center; width: calc(48 * var(--u)); height: calc(48 * var(--u)); border-radius: 50%; background: var(--ink); }
.pause i { display: block; width: calc(4.5 * var(--u)); height: calc(16 * var(--u)); border-radius: calc(1.5 * var(--u)); background: var(--blue); }
.live-tag { display: inline-flex; align-items: center; gap: calc(5 * var(--u)); text-transform: uppercase; letter-spacing: 0.04em; }
.dot { display: inline-block; width: calc(6 * var(--u)); height: calc(6 * var(--u)); border-radius: 50%; background: var(--ink-70); }
.dot.on { background: #ff5a5a; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
.track-bar.live span { width: 100%; animation: flow 2.4s linear infinite; background: linear-gradient(90deg, rgba(255,255,255,0.35), #fff 40%, rgba(255,255,255,0.35) 80%); background-size: 200% 100%; }
@keyframes flow { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .dot.on, .track-bar.live span { animation: none; } }

/* тексти зліва */
.cabinet { left: max(16px, 7vw); top: calc(775 / 11.25 * 1dvh); width: calc(396 * var(--u)); font-size: calc(80 * var(--u)); line-height: calc(80 * var(--u)); letter-spacing: -0.1em; }
.tagline { left: max(16px, 7vw); top: calc(959 / 11.25 * 1dvh); font-size: calc(24 * var(--u)); line-height: calc(26 * var(--u)); letter-spacing: -0.06em; white-space: nowrap; }

/* телефон горизонтально: низький екран — масштаб від висоти, щоб текст не дрібнів */
@media (min-aspect-ratio: 1/1) and (max-height: 560px) {
  :root { --u: calc(100dvh / 900); }
  .tagline, .mug { display: none; }
  .book { right: calc(120 / 20 * 1vw); }
}
/* вузький екран: прибираємо пункти меню, решту трохи збільшуємо */
@media (max-width: 1100px) and (min-aspect-ratio: 1/1) {
  .links { display: none; }
}

/* телефон / планшет вертикально: компоновка зверху вниз; розміри в --u, щоб нічого не наїжджало */
@media (max-aspect-ratio: 1/1) {
  :root { --u: min(calc(100vw / 560), 1px); }
  .links { display: none; }
  .top-nav { top: 16px; }
  /* знизу вгору: футболка → підпис → «the curiosity cabinet» → плеєр і книжка */
  .tshirt { width: calc(226 * var(--u)); bottom: 0; }
  .tagline { top: auto; bottom: calc(226 * var(--u) + 16px); left: 16px; right: 16px; white-space: normal; font-size: max(13px, calc(26 * var(--u))); line-height: 1.2; }
  .cabinet { top: auto; bottom: calc(288 * var(--u) + 32px); left: 16px; width: auto; font-size: calc(80 * var(--u)); line-height: calc(80 * var(--u)); }
  .player { left: 16px; top: auto; bottom: calc(448 * var(--u) + 56px); }
  .book { right: 3vw; top: auto; bottom: calc(440 * var(--u) + 50px); width: calc(210 * var(--u)); }
  /* слово — між верхніми предметами і плеєром */
  .found { top: min(31dvh, calc(100dvh - 700 * var(--u) - 56px)); font-size: calc(195 * var(--u)); line-height: calc(150 * var(--u)); }
  .mug { left: 2vw; top: calc(56px + 1dvh); width: calc(165 * var(--u)); }
  .ibook { right: 3vw; top: calc(50px + 1dvh); width: calc(165 * var(--u)); }
}
/* низькі телефони: верхні предмети ховаємо, щоб не налазили на слово */
@media (max-aspect-ratio: 1/1) and (max-height: 700px) {
  .mug, .ibook { display: none; }
}

.web-layer { position: absolute; inset: 0; pointer-events: none; }
/* «o» лежить над павуком — він пролазить під нею */
.over { position: absolute; inset: 0; pointer-events: none; color: var(--ink); font-family: var(--font); font-weight: 400; }
.over > * { position: absolute; margin: 0; }
.over .ghost, .frame .found .ghost { color: transparent; }
.found span { display: inline; }
</style>
