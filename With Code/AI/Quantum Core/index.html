<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apogee</title>
<link href="https://db.onlinewebfonts.com/c/13ab13418f633c1b0516fed6e30bedbc?family=Suisse+Int%27l" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#080A19}
body{font-family:'Suisse Intl','Suisse Int\'l',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
a{text-decoration:none}
@keyframes fade-up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade-down{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade-scale{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes bar-grow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
.a{opacity:0;animation-duration:.8s;animation-timing-function:cubic-bezier(.16,1,.3,1);animation-fill-mode:forwards}
.up{animation-name:fade-up}
.down{animation-name:fade-down;animation-duration:.7s}
.scale{animation-name:fade-scale;animation-duration:.9s}
.hero{position:relative;width:100%;height:100vh;height:100svh;min-height:600px;overflow:hidden;background:#080A19;color:#fff}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wrap{position:relative;z-index:10;height:100%;display:flex;flex-direction:column}
nav{width:100%;max-width:1800px;margin:0 auto;padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:50}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:28px;height:28px}
.logo span{color:#fff;font-size:22px;font-weight:450;line-height:1;letter-spacing:-.02em}
.pill{display:none;height:52px;align-items:center;backdrop-filter:blur(17px);-webkit-backdrop-filter:blur(17px)}
.pill.c{padding:0 24px;gap:30px;background:rgba(10,7,7,.35);border-radius:11px}
.pill.r{padding:3px;gap:5px;background:rgba(0,0,0,.35);border-radius:13px}
.pill.c>*{color:rgba(255,255,255,.8);font-size:14px;font-weight:450;line-height:14px;cursor:pointer;transition:color .2s}
.pill.c>*:hover{color:#fff}
.pill.c button{display:flex;align-items:center;gap:5px}
.pill.c svg{width:10px;height:10px;opacity:.8}
.pill.r button{height:46px;padding:0 24px;border-radius:11px;font-size:14px;font-weight:450;line-height:14px;color:#fff;transition:background .2s}
.pill.r .login:hover{background:rgba(255,255,255,.05)}
.pill.r .demo{background:#E9E9E9;color:#0A0707}
.pill.r .demo:hover{background:#fff}
.burger{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:rgba(10,7,7,.35);backdrop-filter:blur(17px);-webkit-backdrop-filter:blur(17px);transition:background .2s}
.burger:hover{background:rgba(255,255,255,.1)}
.ico{position:relative;width:20px;height:20px}
.ico svg{position:absolute;inset:0;width:20px;height:20px;color:#fff;transition:all .3s ease-out}
.ico .m{opacity:1;transform:none}.ico .x{opacity:0;transform:rotate(-90deg) scale(.75)}
.open .ico .m{opacity:0;transform:rotate(90deg) scale(.75)}.open .ico .x{opacity:1;transform:none}
.menu{position:fixed;inset:0;z-index:40;visibility:hidden;transition:all .5s cubic-bezier(.32,.72,0,1)}
.open.menu{visibility:visible}
.bd{position:absolute;inset:0;background:rgba(8,10,25,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);opacity:0;transition:opacity .5s}
.open .bd{opacity:1}
.panel{position:absolute;top:76px;left:16px;right:16px;background:rgba(17,16,15,.6);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:20px;border:1px solid rgba(255,255,255,.06);padding:24px;transition:all .5s cubic-bezier(.32,.72,0,1);transform-origin:top;opacity:0;transform:translateY(-16px) scale(.97)}
.open .panel{opacity:1;transform:none}
.links{display:flex;flex-direction:column;gap:4px}
.links a{display:flex;align-items:center;justify-content:space-between;padding:16px;border-radius:12px;color:rgba(255,255,255,.9);font-size:18px;font-weight:450;transition:all .3s;opacity:0;transform:translateX(-12px);transition-delay:0ms}
.open .links a{opacity:1;transform:none}
.links a:hover{background:rgba(255,255,255,.06)}
.links svg{width:16px;height:16px;opacity:.5}
.divider{height:1px;background:rgba(255,255,255,.1);margin:20px 0}
.ctas{display:flex;flex-direction:column;gap:12px;transition:all .3s;opacity:0;transform:translateY(8px)}
.open .ctas{opacity:1;transform:none;transition-delay:350ms}
.ctas button{width:100%;height:50px;border-radius:12px;font-size:15px;font-weight:450;transition:background .2s}
.ctas .d{background:#E9E9E9;color:#0A0707}.ctas .d:hover{background:#fff}
.ctas .l{border:1px solid rgba(255,255,255,.3);color:#fff}.ctas .l:hover{background:rgba(255,255,255,.05)}
.body{flex:1;display:flex;align-items:center;padding:32px 0}
.row{width:100%;max-width:1800px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:40px}
.copy{max-width:593px}
h1{color:#fff;font-size:36px;font-weight:400;line-height:.95;margin-bottom:20px}
.sub{color:rgba(255,255,255,.8);font-size:16px;font-weight:450;line-height:1.3;max-width:370px;margin-bottom:28px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btns button{height:46px;padding:0 20px;border-radius:12px;font-size:14px;font-weight:450;line-height:15.5px;transition:opacity .2s}
.btns .p{background:#E9E9E9;color:#0A0707}.btns .p:hover{opacity:.9}
.btns .s{border:1px solid #fff;color:#fff}.btns .s:hover{opacity:.8}
.cardw{width:100%;max-width:405px;margin:0 auto}
.card{width:100%;border-radius:24px;background:rgba(17,16,15,.35);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:20px}
.card .lbl{color:#fff;font-size:16px;font-weight:450;line-height:20px;margin-bottom:12px}
.amt{margin-bottom:8px}
.amt span{font-size:28px;font-weight:450;line-height:1;color:#fff}
.amt span+span{color:rgba(255,255,255,.2)}
.delta{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.delta .b{padding:7px 6px;background:rgba(255,255,255,.2);border-radius:6px;color:#fff;font-size:12px;font-weight:450;line-height:14px}
.delta .t{color:rgba(255,255,255,.8);font-size:12px;font-weight:450;line-height:14px;opacity:.7}
.chart{position:relative}
.bars{display:flex;align-items:flex-end;gap:1.5px;height:80px}
.bars i{flex:1;border-radius:.5px;transform-origin:bottom;opacity:0;animation:bar-grow .6s cubic-bezier(.16,1,.3,1) forwards}
.grid{position:absolute;inset:0;pointer-events:none}
.grid i{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.1)}
.axis{display:flex;justify-content:space-between;margin-top:12px}
.axis span{font-size:9px;font-weight:450;line-height:10px;color:rgba(255,255,255,.8)}
@media(min-width:640px){
 nav{padding:30px 32px 0}.logo svg{width:32px;height:32px}.logo span{font-size:26px}
 .panel{top:86px;left:24px;right:24px;padding:32px}
 .row{padding:0 32px}
 h1{font-size:52px;margin-bottom:32px}.sub{font-size:18px;margin-bottom:40px}
 .btns{gap:16px}.btns button{height:51px;padding:0 27px;font-size:15.5px}
 .card{border-radius:33px;padding:32px 32px 24px}
 .card .lbl{font-size:20px;margin-bottom:16px}.amt{margin-bottom:12px}.amt span{font-size:46px}
 .delta{margin-bottom:32px}.delta .b,.delta .t{font-size:14px}
 .bars{height:100px}.axis span{font-size:10px}
}
@media(min-width:768px){nav,.row{padding-left:82px;padding-right:82px}h1{font-size:64px}.sub{font-size:20px}}
@media(min-width:1024px){
 .pill{display:flex}.burger-w,.menu{display:none}
 .row{flex-direction:row;align-items:center;justify-content:space-between;gap:48px}
 h1{font-size:72px}.cardw{margin:0}
}
</style>
</head>
<body>
<section class="hero" id="hero">
<video src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260813_092641_de52eb87-daf2-41db-92cb-7a56eae012a5.mp4" autoplay loop muted playsinline></video>
<div class="wrap">
<nav>
 <div class="a down" style="animation-delay:0ms"><div class="logo">
  <svg viewBox="0 0 256 256" fill="none"><path d="M 256 256 L 178 256 C 150.386 256 128 233.614 128 206 L 128 256 L 0 256 L 0 192 C 0 156.654 28.654 128 64 128 C 99.346 128 128 156.654 128 192 L 128 128 L 256 128 Z M 78 0 C 105.614 0 128 22.386 128 50 L 128 0 L 256 0 L 256 64 C 256 99.346 227.346 128 192 128 C 156.654 128 128 99.346 128 64 L 128 128 L 0 128 L 0 0 Z" fill="#fff"/></svg>
  <span>Apogee</span></div></div>
 <div class="a down pill c" style="animation-delay:100ms">
  <button>Platform <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
  <span>Pricing</span><span>Resources</span><span>Blog</span>
 </div>
 <div class="a down pill r" style="animation-delay:200ms"><button class="login">Login</button><button class="demo">Book a demo</button></div>
 <div class="a down burger-w" style="animation-delay:100ms">
  <button class="burger" id="burger" aria-label="Toggle menu"><div class="ico">
   <svg class="m" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M4 6h16M4 18h16"/></svg>
   <svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </div></button>
 </div>
</nav>
<div class="menu" id="menu">
 <div class="bd" id="bd"></div>
 <div class="panel">
  <div class="links">
   <a href="#" style="transition-delay:0ms">Platform<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></a>
   <a href="#">Pricing</a><a href="#">Resources</a><a href="#">Blog</a>
  </div>
  <div class="divider"></div>
  <div class="ctas"><button class="d">Book a demo</button><button class="l">Login</button></div>
 </div>
</div>
<div class="body"><div class="row">
 <div class="copy">
  <div class="a up" style="animation-delay:300ms"><h1>Elevate your essential data to new heights</h1></div>
  <div class="a up" style="animation-delay:500ms"><p class="sub">Advanced reasoning systems and predictive models built for the unknown</p></div>
  <div class="a up" style="animation-delay:700ms"><div class="btns"><button class="p">Book a demo</button><button class="s">Talk with the team</button></div></div>
 </div>
 <div class="a scale cardw" style="animation-delay:900ms">
  <div class="card">
   <p class="lbl">Revenue Growth</p>
   <p class="amt"><span>$14,205,890</span><span>.00</span></p>
   <div class="delta"><span class="b">+32.4%</span><span class="t">vs. previous period ($10.7M)</span></div>
   <div class="chart"><div class="bars" id="bars"></div><div class="grid" id="grid"></div><div class="axis" id="axis"></div></div>
  </div>
 </div>
</div></div>
</div>
</section>
<script>
var H=[23,40,53,40,33,14,7,17,75,65,88,75,65,47,33,88,4,7,9,14,95,65,79,37,7,40,17,20,62,47,92,72];
var mx=Math.max.apply(null,H),b=document.getElementById('bars');
H.forEach(function(h,i){var e=document.createElement('i');e.style.height=(h/mx*100)+'%';e.style.backgroundColor=i>=28?'rgba(255,255,255,0.1)':'white';e.style.animationDelay=(1100+i*30)+'ms';b.appendChild(e)});
var g=document.getElementById('grid');
for(var i=0;i<5;i++){var l=document.createElement('i');l.style.left=((i+1)/5*100)+'%';g.appendChild(l)}
var ax=document.getElementById('axis');
['10:00','12:00','14:00','16:00','16:00'].forEach(function(t,i){var s=document.createElement('span');s.textContent=t;s.style.opacity=i>=3?0.4:1;ax.appendChild(s)});
var menu=document.getElementById('menu'),open=false;
function set(v){open=v;menu.classList.toggle('open',v);document.getElementById('burger').classList.toggle('open',v);
 document.querySelector('.ico').parentNode.classList.toggle('open',v);document.body.style.overflow=v?'hidden':'';
 document.querySelectorAll('.links a').forEach(function(a,i){a.style.transitionDelay=v?(100+i*50)+'ms':'0ms'})}
document.getElementById('burger').onclick=function(){set(!open)};
document.getElementById('bd').onclick=function(){set(false)};
</script>
<style>.open .links a{opacity:1;transform:none}.burger.open .ico .m{opacity:0;transform:rotate(90deg) scale(.75)}.burger.open .ico .x{opacity:1;transform:none}</style>
</body>
</html>
