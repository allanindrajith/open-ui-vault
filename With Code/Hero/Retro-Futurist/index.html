<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mainframe</title>
  <link href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" rel="stylesheet">
  <link href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-heading: 'HelveticaNowDisplay-Medium', 'Helvetica Neue', Arial, sans-serif;
      --font-body: 'HelveticaNowDisplayW01-Rg', 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Video background */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 70% center;
      z-index: 0;
    }

    /* Nav */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      z-index: 10;
    }
    @media (min-width: 640px) {
      .nav { padding: 20px 32px; }
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-text {
      font-family: var(--font-heading);
      font-size: 21px;
      letter-spacing: -0.02em;
      color: #000;
    }
    @media (min-width: 640px) {
      .logo-text { font-size: 26px; }
    }
    .logo-star {
      font-size: 25px;
      color: #000;
      user-select: none;
      letter-spacing: -0.02em;
    }
    @media (min-width: 640px) {
      .logo-star { font-size: 30px; }
    }

    .nav-links {
      display: none;
      align-items: center;
      font-size: 23px;
      color: #000;
    }
    @media (min-width: 768px) {
      .nav-links { display: flex; }
    }
    .nav-links a {
      color: #000;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 0.6; }
    .nav-links .sep {
      opacity: 0.4;
    }

    .nav-cta {
      display: none;
      font-size: 23px;
      color: #000;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: opacity 0.2s;
    }
    @media (min-width: 768px) {
      .nav-cta { display: block; }
    }
    .nav-cta:hover { opacity: 0.6; }

    /* Mobile hamburger */
    .hamburger {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      background: none;
      border: none;
    }
    @media (min-width: 768px) {
      .hamburger { display: none; }
    }
    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: #000;
      transition: transform 0.3s, opacity 0.3s;
      transform-origin: center;
    }
    .hamburger.open span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }
    .hamburger.open span:nth-child(2) {
      opacity: 0;
    }
    .hamburger.open span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* Mobile overlay */
    .mobile-menu {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 0 32px;
      gap: 32px;
      z-index: 9;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    @media (min-width: 768px) {
      .mobile-menu { display: none !important; }
    }
    .mobile-menu.open {
      opacity: 1;
      pointer-events: auto;
    }
    .mobile-menu a {
      font-size: 32px;
      font-weight: 500;
      color: #000;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .mobile-menu a:hover { opacity: 0.5; }
    .mobile-menu a.underlined {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* Hero */
    .hero {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 20px 48px;
      overflow: hidden;
    }
    @media (min-width: 640px) {
      .hero { padding: 0 32px 48px; }
    }
    @media (min-width: 768px) {
      .hero {
        justify-content: center;
        padding: 0 40px 0;
      }
    }

    .hero-content {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 576px;
    }

    /* Blurred label */
    .blurred-label {
      pointer-events: none;
      user-select: none;
      margin-bottom: 20px;
      font-size: clamp(18px, 4vw, 26px);
      line-height: 1.3;
      filter: blur(4px);
      color: #000;
      font-weight: 400;
    }
    @media (min-width: 640px) {
      .blurred-label { margin-bottom: 24px; }
    }

    /* Typewriter */
    .typewriter-text {
      color: #000;
      margin-bottom: 20px;
      font-size: clamp(18px, 4vw, 26px);
      line-height: 1.35;
      font-weight: 400;
      min-height: 54px;
    }
    @media (min-width: 640px) {
      .typewriter-text { margin-bottom: 24px; }
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: #000;
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Action buttons */
    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 0;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .action-buttons.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-size: 13px;
      padding: 0.3em 16px;
      margin: 0 0.2em 0.4em;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
      border: 1px solid rgba(0,0,0,0.1);
      background: #fff;
      color: #000;
    }
    @media (min-width: 640px) {
      .pill { font-size: 15px; padding: 0.3em 20px; }
    }
    .pill:hover {
      background: #000;
      color: #fff;
    }

    .pill-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 9999px;
      font-size: 13px;
      padding: 0.3em 16px;
      margin: 0 0.2em 0.4em;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
      border: 1px solid #fff;
      background: transparent;
      color: #fff;
    }
    @media (min-width: 640px) {
      .pill-outline { font-size: 15px; padding: 0.3em 20px; gap: 12px; }
    }
    .pill-outline:hover {
      background: #fff;
      color: #000;
    }
    .pill-outline .email-link {
      text-decoration: underline;
      text-underline-offset: 1px;
    }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video
    id="bgVideo"
    class="bg-video"
    muted
    playsinline
    preload="auto"
    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260530_042513_df96a13b-6155-4f6e-8b93-c9dee66fba08.mp4"
  ></video>

  <!-- Nav -->
  <nav class="nav">
    <div class="logo">
      <span class="logo-text">Mainframe&reg;</span>
      <span class="logo-star">&#10035;&#65038;</span>
    </div>

    <div class="nav-links">
      <a href="#">Labs</a><span class="sep">,&nbsp;</span>
      <a href="#">Studio</a><span class="sep">,&nbsp;</span>
      <a href="#">Openings</a><span class="sep">,&nbsp;</span>
      <a href="#">Shop</a>
    </div>

    <a href="#" class="nav-cta">Get in touch</a>

    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Mobile Menu -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="#" onclick="closeMenu()">Labs</a>
    <a href="#" onclick="closeMenu()">Studio</a>
    <a href="#" onclick="closeMenu()">Openings</a>
    <a href="#" onclick="closeMenu()">Shop</a>
    <a href="#" class="underlined" onclick="closeMenu()">Get in touch</a>
  </div>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-content">
      <div class="blurred-label">
        <span>Hey there, meet A.R.I.A,</span><br>
        <span>Mainframe's Adaptive Response Interface Agent</span>
      </div>

      <p class="typewriter-text" id="typewriterText"></p>

      <div class="action-buttons" id="actionButtons">
        <button class="pill">Pitch us an idea</button>
        <button class="pill">Come work here</button>
        <button class="pill">Send a brief hello</button>
        <button class="pill">See how we operate</button>
        <button class="pill-outline" onclick="copyEmail()">
          <span>Reach us: <span class="email-link">hello@mainframe.co</span></span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </div>
  </section>

  <script>
    // === Mobile Menu ===
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    let menuOpen = false;

    hamburgerBtn.addEventListener('click', () => {
      menuOpen = !menuOpen;
      hamburgerBtn.classList.toggle('open', menuOpen);
      mobileMenu.classList.toggle('open', menuOpen);
    });

    function closeMenu() {
      menuOpen = false;
      hamburgerBtn.classList.remove('open');
      mobileMenu.classList.remove('open');
    }

    // === Video Mouse Scrub ===
    const video = document.getElementById('bgVideo');
    const SENSITIVITY = 0.8;
    let targetTime = 0;
    let isSeeking = false;
    let prevX = -1;

    video.addEventListener('seeked', () => {
      isSeeking = false;
      if (Math.abs(targetTime - video.currentTime) > 0.01) {
        isSeeking = true;
        video.currentTime = targetTime;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!video.duration) return;
      const x = e.clientX;
      if (prevX < 0) { prevX = x; return; }
      const delta = x - prevX;
      prevX = x;
      const offset = (delta / window.innerWidth) * SENSITIVITY * video.duration;
      targetTime = Math.min(Math.max(targetTime + offset, 0), video.duration);
      if (!isSeeking) {
        isSeeking = true;
        video.currentTime = targetTime;
      }
    });

    // === Typewriter ===
    const MAIN_TEXT = "Glad you stopped in. Good taste tends to find us. Now, what are we building?";
    const typewriterEl = document.getElementById('typewriterText');
    let charIndex = 0;

    setTimeout(() => {
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      typewriterEl.appendChild(cursor);

      const interval = setInterval(() => {
        charIndex++;
        typewriterEl.textContent = MAIN_TEXT.slice(0, charIndex);
        if (charIndex < MAIN_TEXT.length) {
          typewriterEl.appendChild(cursor);
        } else {
          clearInterval(interval);
          cursor.remove();
        }
      }, 38);
    }, 600);

    // === Action Buttons (appear on load, independent of typewriter) ===
    setTimeout(() => {
      document.getElementById('actionButtons').classList.add('visible');
    }, 400);

    // === Copy Email ===
    function copyEmail() {
      if (navigator.clipboard) {
        navigator.clipboard.writeText('hello@mainframe.co');
      }
    }
  </script>
</body>
</html>
