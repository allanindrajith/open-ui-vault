<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: linear-gradient(to bottom, #FF8233, #FDAC55);
    }

    /* Background 404 layer */
    .bg-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.8;
      -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 95%);
      mask-image: linear-gradient(to bottom, black 40%, transparent 95%);
    }

    .bg-text-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    .bg-text {
      font-size: clamp(200px, 48vw, 800px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
      white-space: nowrap;
      color: #FFFFFF;
      -webkit-text-fill-color: #FFFFFF;
    }

    .bg-oval-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg-oval {
      width: clamp(120px, 20vw, 400px);
      height: 22vh;
      border-radius: 9999px;
      background: #FFFFFF;
      transform-origin: center;
    }

    /* Navigation */
    .nav {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-dots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
    }

    .logo-dot {
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
    }

    .logo-text {
      color: white;
      font-weight: 700;
      font-size: 18px;
      margin-left: 4px;
    }

    .nav-links {
      display: none;
      align-items: center;
      gap: 4px;
    }

    .nav-link {
      padding: 6px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 9999px;
      background: white;
      color: #F16524;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .nav-link:hover {
      opacity: 0.9;
    }

    .menu-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 9999px;
      background: #F16524;
      color: white;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s;
    }

    .menu-btn:hover {
      opacity: 0.9;
    }

    .menu-btn-text {
      font-size: 14px;
      font-weight: 500;
      display: none;
    }

    /* Menu Overlay */
    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      visibility: hidden;
      transition: visibility 0s 0.5s;
    }

    .menu-overlay.open {
      visibility: visible;
      transition: visibility 0s 0s;
    }

    .menu-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      transition: opacity 0.5s;
    }

    .menu-overlay.open .menu-backdrop {
      opacity: 1;
    }

    .menu-panel {
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      width: 100%;
      background: linear-gradient(135deg, #FF6B1A 0%, #FF9642 100%);
      transform: translateX(100%);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .menu-overlay.open .menu-panel {
      transform: translateX(0);
    }

    .menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
    }

    .menu-close-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .menu-close-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .menu-items {
      padding: 32px 24px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu-item {
      display: block;
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 600;
      color: white;
      text-decoration: none;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
      opacity: 0;
      transform: translateY(16px);
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .menu-overlay.open .menu-item {
      opacity: 1;
      transform: translateY(0);
    }

    .menu-overlay.open .menu-item:nth-child(1) { transition-delay: 150ms; }
    .menu-overlay.open .menu-item:nth-child(2) { transition-delay: 210ms; }
    .menu-overlay.open .menu-item:nth-child(3) { transition-delay: 270ms; }
    .menu-overlay.open .menu-item:nth-child(4) { transition-delay: 330ms; }
    .menu-overlay.open .menu-item:nth-child(5) { transition-delay: 390ms; }

    .menu-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px;
      opacity: 0;
      transform: translateY(24px);
      transition: all 0.5s;
    }

    .menu-overlay.open .menu-bottom {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 450ms;
    }

    .menu-bottom-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      border-radius: 9999px;
      background: white;
      color: #F16524;
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      transition: transform 0.2s;
    }

    .menu-bottom-btn:hover {
      transform: scale(1.02);
    }

    /* Video */
    .video-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      margin-top: calc(-6vh - 40px);
    }

    .video-wrapper {
      width: 120vw;
      height: 85vh;
      position: relative;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      mix-blend-mode: darken;
    }

    /* Bottom content */
    .bottom-content {
      position: relative;
      z-index: 30;
      margin-top: auto;
      padding-bottom: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-left: 16px;
      padding-right: 16px;
    }

    .bottom-heading {
      color: white;
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .bottom-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 9999px;
      background: #F16524;
      color: white;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .bottom-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    /* Responsive */
    @media (min-width: 640px) {
      .nav {
        padding: 20px 24px;
      }

      .logo-dot {
        width: 12px;
        height: 12px;
      }

      .logo-text {
        font-size: 20px;
      }

      .menu-btn {
        padding: 10px 20px;
      }

      .menu-btn-text {
        display: inline;
      }

      .menu-panel {
        width: 380px;
      }

      .video-wrapper {
        width: 70vw;
        height: 70vh;
      }

      .bg-oval {
        height: 26vh;
      }

      .bottom-content {
        padding-bottom: 64px;
      }

      .bottom-heading {
        font-size: 20px;
        margin-bottom: 16px;
      }

      .bottom-btn {
        padding: 16px 32px;
        font-size: 16px;
      }
    }

    @media (min-width: 768px) {
      .nav {
        padding: 20px 48px;
      }

      .nav-links {
        display: flex;
      }

      .video-wrapper {
        width: 62vw;
        height: 78vh;
      }

      .bg-oval {
        height: 50vh;
      }

      .bottom-heading {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- Background 404 text + oval -->
    <div class="bg-layer">
      <div class="bg-text-container">
        <span class="bg-text" id="bgText">404</span>
      </div>
      <div class="bg-oval-container">
        <div class="bg-oval" id="bgOval"></div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="nav">
      <div class="nav-left">
        <div class="logo-dots">
          <div class="logo-dot"></div>
          <div class="logo-dot"></div>
          <div class="logo-dot"></div>
          <div class="logo-dot"></div>
        </div>
        <span class="logo-text">TinyTrails</span>
      </div>

      <div class="nav-links">
        <a href="#" class="nav-link">About Us</a>
        <a href="#" class="nav-link">Programs</a>
        <a href="#" class="nav-link">Reviews</a>
        <a href="#" class="nav-link">FAQ</a>
        <a href="#" class="nav-link">Contacts</a>
      </div>

      <button class="menu-btn" onclick="openMenu()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        <span class="menu-btn-text">Menu</span>
      </button>
    </nav>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
      <div class="menu-backdrop" onclick="closeMenu()"></div>
      <div class="menu-panel">
        <div class="menu-header">
          <div class="nav-left">
            <div class="logo-dots">
              <div class="logo-dot"></div>
              <div class="logo-dot"></div>
              <div class="logo-dot"></div>
              <div class="logo-dot"></div>
            </div>
            <span class="logo-text">TinyTrails</span>
          </div>
          <button class="menu-close-btn" onclick="closeMenu()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="menu-items">
          <a href="#" class="menu-item">About Us</a>
          <a href="#" class="menu-item">Programs</a>
          <a href="#" class="menu-item">Reviews</a>
          <a href="#" class="menu-item">FAQ</a>
          <a href="#" class="menu-item">Contacts</a>
        </div>
        <div class="menu-bottom">
          <a href="/" class="menu-bottom-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            Back to Home
          </a>
        </div>
      </div>
    </div>

    <!-- Video -->
    <div class="video-container">
      <div class="video-wrapper">
        <video autoplay loop muted playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260713_234424_b1332b69-2e69-4302-8dbc-40f86846afbd.mp4"></video>
      </div>
    </div>

    <!-- Bottom content -->
    <div class="bottom-content">
      <h2 class="bottom-heading">Oops, something went wrong!</h2>
      <a href="/" class="bottom-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Back to Home
      </a>
    </div>
  </div>

  <script>
    const bgText = document.getElementById('bgText');
    const bgOval = document.getElementById('bgOval');
    const menuOverlay = document.getElementById('menuOverlay');

    function updateScale() {
      if (!bgText) return;
      const naturalHeight = bgText.offsetHeight;
      const viewportHeight = window.innerHeight;
      const scaleY = viewportHeight / naturalHeight;
      bgText.style.transform = `scale(1.15, ${scaleY * 1.4})`;
      bgOval.style.transform = `scaleY(${scaleY})`;
    }

    updateScale();
    window.addEventListener('resize', updateScale);

    function openMenu() {
      menuOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
      menuOverlay.classList.remove('open');
      document.body.style.overflow = '';
    }
  </script>
</body>
</html>
