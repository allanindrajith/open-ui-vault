<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VEX - Shaping Tomorrow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      margin: 0;
      padding: 0;
    }

    .liquid-glass {
      background: rgba(0, 0, 0, 0.4);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.1) 80%, rgba(255,255,255,0.3) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .char-span {
      display: inline-block;
      opacity: 0;
      transform: translateX(-18px);
      transition: opacity 500ms ease, transform 500ms ease;
    }

    .char-span.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .fade-in {
      opacity: 0;
      transition: opacity 1000ms ease;
    }

    .fade-in.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="min-h-screen bg-black text-white relative">
    <!-- Video Background - NO overlay, NO dimming -->
    <video
      autoplay
      loop
      muted
      playsinline
      class="absolute inset-0 w-full h-full object-cover"
    >
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260403_050628_c4e32401-fab4-4a27-b7a8-6e9291cd5959.mp4" type="video/mp4" />
    </video>

    <!-- Content Layer -->
    <div class="relative z-10 min-h-screen flex flex-col">
      <!-- Navbar -->
      <div class="px-6 md:px-12 lg:px-16 pt-6">
        <nav class="liquid-glass flex items-center justify-between px-4 py-2 rounded-xl">
          <div class="text-2xl font-semibold tracking-tight">VEX</div>

          <div class="hidden md:flex items-center gap-8 text-sm">
            <a href="#" class="hover:text-gray-300 transition-colors duration-200">Story</a>
            <a href="#" class="hover:text-gray-300 transition-colors duration-200">Investing</a>
            <a href="#" class="hover:text-gray-300 transition-colors duration-200">Building</a>
            <a href="#" class="hover:text-gray-300 transition-colors duration-200">Advisory</a>
          </div>

          <button class="bg-white text-black px-6 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 transition-colors duration-200">
            Start a Chat
          </button>
        </nav>
      </div>

      <!-- Hero Content -->
      <div class="px-6 md:px-12 lg:px-16 flex-1 flex flex-col justify-end lg:grid lg:grid-cols-2 lg:items-end pb-12 lg:pb-16">
        <!-- Left Column -->
        <div class="mb-8 lg:mb-0 w-full">
          <!-- Animated Heading -->
          <div id="animated-heading" class="text-4xl md:text-5xl lg:text-6xl xl:text-7xl font-normal mb-4" style="letter-spacing: -0.04em;"></div>

          <!-- Subheading -->
          <div id="subheading" class="fade-in">
            <p class="text-base md:text-lg text-gray-300 mb-5">
              We back visionaries and craft ventures that define what comes next.
            </p>
          </div>

          <!-- Buttons -->
          <div id="buttons" class="fade-in">
            <div class="flex flex-wrap gap-4">
              <button class="bg-white text-black px-8 py-3 rounded-lg font-medium hover:bg-gray-100 transition-colors duration-200">
                Start a Chat
              </button>
              <button class="liquid-glass border border-white/20 text-white px-8 py-3 rounded-lg font-medium hover:bg-white hover:text-black transition-colors duration-200">
                Explore Now
              </button>
            </div>
          </div>
        </div>

        <!-- Right Column -->
        <div class="flex items-end justify-start lg:justify-end">
          <div id="tag-card" class="fade-in">
            <div class="liquid-glass border border-white/20 px-6 py-3 rounded-xl">
              <p class="text-lg md:text-xl lg:text-2xl font-light">
                Investing. Building. Advisory.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const headingText = "Shaping tomorrow\nwith vision and action.";
      const lines = headingText.split('\n');
      const charDelay = 30;
      const initialDelay = 200;
      const headingEl = document.getElementById('animated-heading');

      lines.forEach((line, lineIndex) => {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'flex flex-wrap';

        line.split('').forEach((char, charIndex) => {
          const span = document.createElement('span');
          span.className = 'char-span';
          span.textContent = char === ' ' ? '\u00A0' : char;

          const totalDelay = (lineIndex * line.length * charDelay) + (charIndex * charDelay);
          span.style.transitionDelay = totalDelay + 'ms';

          lineDiv.appendChild(span);
        });

        headingEl.appendChild(lineDiv);
      });

      // Trigger heading animation
      setTimeout(() => {
        const chars = headingEl.querySelectorAll('.char-span');
        chars.forEach(char => char.classList.add('visible'));
      }, initialDelay);

      // Subheading fade-in at 800ms
      setTimeout(() => {
        document.getElementById('subheading').classList.add('visible');
      }, 800);

      // Buttons fade-in at 1200ms
      setTimeout(() => {
        document.getElementById('buttons').classList.add('visible');
      }, 1200);

      // Tag card fade-in at 1400ms
      setTimeout(() => {
        document.getElementById('tag-card').classList.add('visible');
      }, 1400);
    });
  </script>
</body>
</html>
