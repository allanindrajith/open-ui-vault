<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal</title>
<link href="https://db.onlinewebfonts.com/c/04e6981992c0e2e7642af2074ebe3901?family=Helvetica+Now+Display+Bold" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--font-heading:'Helvetica Now Display Bold',"Helvetica Neue",Helvetica,Arial,sans-serif;--font-body:'Inter',sans-serif;--color-text:#192837;--color-accent:#7342E2;--color-login-bg:#F2F2EE}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font-body);color:var(--color-text);overflow-x:hidden;background:#d9d4d0}
.page{position:relative;min-height:100vh;overflow:hidden}
.bg{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover}
a{text-decoration:none;color:inherit}
nav{position:relative;z-index:10;max-width:1280px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.links{display:none;gap:32px}
.links a{font-size:.875rem;font-weight:500;transition:opacity .15s}
.links a:hover{opacity:.7}
.btns{display:none;gap:12px}
.pill{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;font:600 .875rem var(--font-body);padding:10px 20px;border-radius:9999px;transition:transform .15s,box-shadow .15s}
.pill:hover{box-shadow:0 6px 18px rgba(25,40,55,.18)}
.pill:active{transform:scale(.95)}
.p1{background:#7342E2;color:#fff}
.p2{background:#F2F2EE;color:var(--color-text)}
.burger{background:none;border:0;padding:4px;cursor:pointer;color:var(--color-text);display:flex}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:640px){nav{padding:20px 32px}}
@media(min-width:768px){.links,.btns{display:flex}.burger{display:none}}
.hero{position:relative;z-index:10;max-width:1280px;margin:0 auto;padding:clamp(40px,8vw,72px) 20px 48px;text-align:center}
.inner{max-width:660px;margin:0 auto}
h1{font-family:var(--font-heading);font-weight:700;font-size:clamp(1.65rem,5vw,3rem);line-height:1.05;letter-spacing:-.01em;margin:0 0 20px;text-align:center}
h1 .nw{white-space:nowrap}
h1 svg{display:inline;vertical-align:middle;position:relative;top:-2px;margin:0 4px;color:#192837}
h1 svg.fp{margin:0 0 0 6px}
@media(max-width:520px){h1 .nw{white-space:normal}}
.sub{font-size:clamp(.9rem,2.5vw,1.1rem);opacity:.8;max-width:560px;line-height:1.65;margin:0 auto 28px}
.cta{display:inline-flex;align-items:center;justify-content:space-between;gap:32px;border:0;cursor:pointer;background:#7342E2;color:#fff;font:500 clamp(.9rem,2vw,1rem) var(--font-body);padding:17px 24px;min-width:210px;border-radius:50px;box-shadow:0 4px 24px rgba(115,66,226,.28);transition:transform .2s,filter .2s}
.cta:hover{transform:scale(1.04);filter:brightness(1.1)}
.cta:active{transform:scale(.96)}
.fu{opacity:0;transform:translateY(28px);animation:fu .6s cubic-bezier(.22,1,.36,1) forwards}
@keyframes fu{to{opacity:1;transform:none}}
/* mobile menu */
.back{position:fixed;inset:0;z-index:40;background:rgba(25,40,55,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.sheet{position:fixed;top:0;right:0;z-index:50;width:min(88vw,360px);height:100dvh;background:#CFC8C5;box-shadow:-12px 0 48px rgba(25,40,55,.18);transform:translateX(100%);visibility:hidden;transition:transform .35s cubic-bezier(.55,0,1,.45),visibility 0s .35s;display:flex;flex-direction:column}
body.open .back{opacity:1;visibility:visible;transition:opacity .3s}
body.open .sheet{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.22,1,.36,1)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:20px 24px}
.close{width:40px;height:40px;border-radius:50%;border:0;background:rgba(25,40,55,.1);color:var(--color-text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.close:active{transform:scale(.9)}
.div{height:1px;background:rgba(25,40,55,.12);margin:0 24px}
.sl{padding:16px 16px 8px;display:flex;flex-direction:column;gap:2px}
.sl a{font-size:1.1rem;padding:12px 16px;border-radius:12px;opacity:0;transform:translateX(24px);transition:background .15s}
.sl a:hover{background:rgba(0,0,0,.1)}
body.open .sl a{animation:si .4s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(.18s + var(--i)*.07s)}
@keyframes si{to{opacity:1;transform:none}}
.sc{padding:16px 24px;display:flex;flex-direction:column;gap:12px;margin-top:auto}
.sc .pill{width:100%;padding:14px 20px;font-size:.95rem}
</style>
</head>
<body>
<div class="page">
<video class="bg" autoplay muted loop playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260606_131516_eca35265-ea66-4fbd-8d52-22aae6e1a503.mp4"></video>

<nav>
  <svg width="32" height="32" viewBox="0 0 256 256" fill="#192837"><path d="M 64 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 L 128 64 L 128 64.5 L 161 32 L 192 0 L 256 0 L 256 64 L 192 128 L 128 128 L 128 192 L 96 223 L 63.5 256 L 0 256 L 0 192 Z M 256 192 L 224 223 L 191.5 256 L 128 256 L 128 192 L 192 128 L 256 128 Z"/></svg>
  <div class="links"><a href="#">Vault</a><a href="#">Plans</a><a href="#">Install</a><a href="#">News</a><a href="#">Help</a></div>
  <div class="btns"><button class="pill p1">Start For Free</button><button class="pill p2">Sign In</button></div>
  <button class="burger" id="burger" aria-label="Menu">
    <svg class="i" id="mi" width="24" height="24" viewBox="0 0 24 24"><path d="M4 12h16M4 6h16M4 18h16"/></svg>
  </button>
</nav>

<section class="hero">
  <div class="inner">
    <h1 class="fu" style="animation-delay:0s">
      <span class="nw">Lock <svg class="i" width="24" height="24" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg> Down Your <svg class="i" width="24" height="24" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><circle cx="12" cy="16" r="1"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Passwords</span><br>
      with Ironclad Security<svg class="i fp" width="24" height="24" viewBox="0 0 24 24"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>
    </h1>
    <p class="sub fu" style="animation-delay:.15s">Zero stress, total control. Unbreakable storage, one-tap access, and pro-grade tools for your non-stop world.</p>
    <button class="cta fu" style="animation-delay:.3s">Get It Free <svg class="i" width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 16l4-4-4-4"/></svg></button>
  </div>
</section>
</div>

<div class="back" id="back"></div>
<aside class="sheet" id="sheet" aria-hidden="true">
  <div class="sh">
    <svg width="32" height="32" viewBox="0 0 256 256" fill="#192837"><path d="M 64 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 L 128 64 L 128 64.5 L 161 32 L 192 0 L 256 0 L 256 64 L 192 128 L 128 128 L 128 192 L 96 223 L 63.5 256 L 0 256 L 0 192 Z M 256 192 L 224 223 L 191.5 256 L 128 256 L 128 192 L 192 128 L 256 128 Z"/></svg>
    <button class="close" id="close" aria-label="Close"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="div"></div>
  <div class="sl"><a href="#" style="--i:0">Vault</a><a href="#" style="--i:1">Plans</a><a href="#" style="--i:2">Install</a><a href="#" style="--i:3">News</a><a href="#" style="--i:4">Help</a></div>
  <div class="sc"><button class="pill p1">Start For Free</button><button class="pill p2">Sign In</button></div>
</aside>

<script>
(function(){
  var b=document.body,mi=document.getElementById('mi');
  var menu='<path d="M4 12h16M4 6h16M4 18h16"/>',x='<path d="M18 6 6 18M6 6l12 12"/>';
  function set(o){b.classList.toggle('open',o);mi.innerHTML=o?x:menu;document.getElementById('sheet').setAttribute('aria-hidden',!o)}
  document.getElementById('burger').onclick=function(){set(!b.classList.contains('open'))};
  document.getElementById('close').onclick=function(){set(false)};
  document.getElementById('back').onclick=function(){set(false)};
  window.addEventListener('resize',function(){if(innerWidth>=768)set(false)});
})();
</script>
</body>
</html>
