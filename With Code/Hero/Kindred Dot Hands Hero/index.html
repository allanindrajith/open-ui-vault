<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kindred — Reconnecting Human Creativity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f7f5;--ink:#111111;--mute:#9a9a9a;--sub:#7b7b7b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .hero{position:relative;height:100vh;min-height:660px;overflow:hidden}
  #dots{position:absolute;inset:0;width:100%;height:100%;display:block}

  nav{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:clamp(18px,2.6vw,40px);padding-top:36px;font-size:13.5px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:-.01em;margin-right:10px}
  .brand svg{width:16px;height:18px}
  nav a{color:#3a3a3a;text-decoration:none;transition:color .2s}
  nav a:hover{color:#000}
  .signin{background:var(--ink);color:#fff!important;padding:10px 21px;border-radius:999px;font-weight:500;margin-left:10px;transition:transform .25s}
  .signin:hover{transform:translateY(-1px)}

  .copy{position:absolute;z-index:3;left:50%;top:24.5%;transform:translateX(-50%);text-align:center;width:min(92vw,720px)}
  h1{font-weight:500;letter-spacing:-.035em;line-height:1.04;font-size:clamp(38px,3.75vw,68px)}
  h1 .g{color:var(--mute);display:block}
  .copy p{margin:20px auto 0;max-width:340px;color:var(--sub);font-size:clamp(13px,1.02vw,15.5px);line-height:1.4}
  .cta{position:relative;display:inline-block;margin-top:clamp(34px,3.6vw,52px)}
  .cta::before{content:"";position:absolute;left:10%;right:10%;bottom:-6px;height:16px;border-radius:50%;
    background:linear-gradient(90deg,#ffcf5a,#7dffa8,#5ad7ff,#9b7bff,#ff6fd8,#ffb36b);filter:blur(9px);opacity:.85;transition:opacity .3s,filter .3s,bottom .3s}
  .cta a{position:relative;display:block;background:var(--ink);color:#fff;text-decoration:none;font-size:13.5px;font-weight:500;padding:11px 20px;border-radius:999px;transition:transform .3s}
  .cta:hover::before{opacity:1;filter:blur(12px);bottom:-9px}
  .cta:hover a{transform:translateY(-1px)}

  .logos{position:absolute;z-index:3;left:0;right:0;bottom:clamp(28px,6vh,64px);display:flex;justify-content:center;gap:clamp(26px,4.6vw,66px);color:#8d8d8d;font-size:clamp(14px,1.18vw,17px);font-weight:500;letter-spacing:-.01em;flex-wrap:wrap;padding:0 16px}
  .logos span{display:flex;align-items:center;gap:7px}
  .logos svg{width:17px;height:17px;fill:currentColor}

  @media (max-width:760px){
    nav a:not(.signin){display:none}
    nav{justify-content:space-between;padding:22px 18px 0}
    .copy{top:20%}
    .logos{gap:14px 24px;font-size:13px}
  }
</style>
</head>
<body>
<section class="hero">
  <canvas id="dots"></canvas>

  <nav>
    <div class="brand"><svg viewBox="0 0 16 18"><path d="M2 0h4v18H2zM7 9c3-1 5-4 6-9h3c-1 5-3 8-6 9 3 1 5 4 6 9h-3c-1-5-3-8-6-9z"/></svg>Kindred</div>
    <a href="#">Platform</a><a href="#">Marketplace</a><a href="#">Creators</a><a href="#">Resources</a><a href="#">Company</a>
    <a href="#" class="signin">Sign In</a>
  </nav>

  <div class="copy">
    <h1><span class="g">Reconnecting</span>Human Creativity.</h1>
    <p>We’re not building another platform. We’re building a place where people belong.</p>
    <div class="cta"><a href="#">Join the circle</a></div>
  </div>

  <div class="logos">
    <span><svg viewBox="0 0 20 20"><path d="M3 15c0-7 5-12 14-12-1 9-6 14-13 13l-1 2-2-1z"/></svg>Lumenix</span>
    <span><svg viewBox="0 0 20 20"><path d="M10 1l8 4.5v9L10 19l-8-4.5v-9zM10 6l-4 2.3v4.4L10 15l4-2.3V8.3z"/></svg>Velora</span>
    <span><svg viewBox="0 0 20 20"><path d="M1 5q4.5-3 9 0t9 0v3q-4.5 3-9 0t-9 0zm0 7q4.5-3 9 0t9 0v3q-4.5 3-9 0t-9 0z"/></svg>Nimbus</span>
    <span><svg viewBox="0 0 20 20"><path d="M10 1a9 9 0 110 18 9 9 0 010-18zm0 3a6 6 0 100 12 6 6 0 000-12zm0 3a3 3 0 110 6 3 3 0 010-6z"/></svg>Quanta</span>
    <span><svg viewBox="0 0 20 20"><path d="M1 17L7 6l3 5 3-7 6 13z"/></svg>Solstice</span>
    <span><svg viewBox="0 0 20 20"><path d="M10 1l9 4-9 4-9-4zm-9 8l9 4 9-4v3l-9 4-9-4zm0 5l9 4 9-4v2l-9 4-9-4z"/></svg>Parallax</span>
  </div>
</section>

<script>
(() => {
  const SHEET = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261030_025250_100df7b8-31fd-4614-aa4a-c1b7d5b6b273.png&w=1600&q=85';
  // source rects on the 2x2 hand sheet, as fractions [x, y, w, h]
  const SRC = {
    LA: [0, .06, .47, .40],  RA: [.53, .06, .47, .40],   // pose A: pointing (Creation of Adam)
    LB: [0, .55, .47, .40],  RB: [.53, .55, .47, .40]    // pose B: open hands
  };
  const LOOP = 20;          // seconds
  const LEVELS = [0, .26, .52, .78, 1];  // quantised dot sizes, LED-halftone look

  const cv = document.getElementById('dots'), ctx = cv.getContext('2d');
  const fA = document.createElement('canvas'), fB = document.createElement('canvas');
  const cA = fA.getContext('2d', {willReadFrequently: true}), cB = fB.getContext('2d', {willReadFrequently: true});
  const tiles = {};
  let W, H, DPR, step, rowStep, cols, rows, seeds;

  const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
  const sm = (a, b, x) => { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); };
  // periodic pose mix: 0 = pose A, 1 = pose B, with glitchy dissolves at the given switch times
  const mixAt = (t, on, off, dur) => sm(on, on + dur, t) * (1 - sm(off, off + dur, t));

  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    step = Math.max(5, W / 205);            // horizontal dot pitch
    rowStep = step * 2.05;                  // rows read as scanlines
    cols = Math.ceil(W / step); rows = Math.ceil(H / rowStep);
    fA.width = fB.width = cols; fA.height = fB.height = rows;
    seeds = new Float32Array(cols * rows);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++)
      seeds[j * cols + i] = .55 * hash(i, j) + .45 * hash(j * 3.1, 7.7);   // dissolve order: mostly per-dot, slightly per-row
  }

  function layout() {
    const portrait = H > W;
    const hw = portrait ? W * .66 : W * .53;           // width of each hand block
    const hh = hw * (.40 * 1520) / (.47 * 2688);       // keep sheet aspect (2688x1520)
    const cy = portrait ? H * .66 : H * .54;
    return {hw, hh, cy};
  }

  function drawHand(c, key, side, t, L) {
    const img = tiles[key]; if (!img) return;
    const ph = side ? Math.PI : 0, a = 2 * Math.PI * t / LOOP;
    // slow reach + retreat, slight lift and roll — the hands drift toward and away from each other
    const reach = (.035 * Math.sin(a + ph) + .012 * Math.sin(2 * a + 1.3 + ph)) * W;
    const lift = (.018 * Math.sin(a * 2 + .7 + ph)) * H;
    const sc = 1 + .07 * Math.sin(a + .9 + ph);
    const rot = (side ? -1 : 1) * .045 * Math.sin(a + 2.1 + ph);
    const x = side ? W - L.hw + W * .045 - reach : reach - W * .045;   // arms run past the edge
    c.save();
    c.scale(cols / W, rows / H);
    c.translate(side ? W : 0, L.cy);
    c.rotate(rot);
    c.scale(sc, sc);
    c.translate(-(side ? W : 0), -L.cy);
    c.drawImage(img, x, L.cy - L.hh / 2, L.hw, L.hh);
    c.restore();
  }

  function render(t) {
    t = ((t % LOOP) + LOOP) % LOOP;
    const L = layout();
    for (const [c, l, r] of [[cA, 'LA', 'RA'], [cB, 'LB', 'RB']]) {
      c.fillStyle = '#fff'; c.fillRect(0, 0, cols, rows);
      c.imageSmoothingQuality = 'high';
      drawHand(c, l, 0, t, L); drawHand(c, r, 1, t, L);
    }
    const dA = cA.getImageData(0, 0, cols, rows).data, dB = cB.getImageData(0, 0, cols, rows).data;

    // left and right hands switch poses on offset schedules (dissolve 1.6s each way)
    const mL = mixAt(t, 6.2, 14.6, 1.6), mR = mixAt(t, 2.4, 10.4, 1.6);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0d0d0d';
    const R = step * .46, tick = Math.floor(t * 7), portrait = H > W;
    for (let j = 0; j < rows; j++) {
      // LED-row glitch: occasionally a whole row slides a few columns
      const g = hash(j, tick);
      const shift = g > .965 ? Math.round((hash(tick, j) - .5) * 8) : 0;
      const y = (j + .5) * rowStep;
      for (let i = 0; i < cols; i++) {
        const si = Math.min(cols - 1, Math.max(0, i - shift));
        const k = j * cols + si, p = k * 4;
        const m = i < cols / 2 ? mL : mR;
        // per-dot dissolve threshold; dots near the front flicker and shrink while a pose switches
        const s = seeds[k], useB = s < m;
        const lum = (useB ? dB[p] : dA[p]) / 255;
        let v = Math.min(1, Math.max(0, (1 - lum - .16) / .42));
        const edge = Math.abs(s - m);
        if (m > .001 && m < .999 && edge < .12) v *= edge / .12 * (hash(i + tick, j) > .4 ? 1 : .3);
        // shimmer
        v *= .86 + .14 * Math.sin(t * 3.2 + s * 40);
        // soft fade toward the centre so fingertips dissolve behind the CTA
        const cx = Math.abs((i + .5) / cols - .5);
        v *= sm(.035, .11, cx);
        // quiet zone around the copy block so dots never cross the subline
        const ex = cx / (portrait ? .44 : .2), ey = ((j + .5) * rowStep / H - (portrait ? .33 : .385)) / .085;
        v *= sm(.85, 1.25, Math.hypot(ex, ey));
        let q = 0;
        for (let n = LEVELS.length - 1; n >= 0; n--) if (v >= LEVELS[n] - .13) { q = LEVELS[n]; break; }
        if (q <= 0) continue;
        const r = R * (q < .3 ? .38 : q);
        ctx.beginPath(); ctx.arc((i + .5) * step, y, r, 0, 6.2832); ctx.fill();
      }
    }
  }

  // ---- load & slice the sheet into four pre-downscaled tiles ----
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    for (const k in SRC) {
      const [x, y, w, h] = SRC[k];
      const sw = img.width * w, shh = img.height * h;
      const c = document.createElement('canvas');
      c.width = 420; c.height = Math.round(420 * shh / sw);
      const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
      g.drawImage(img, img.width * x, img.height * y, sw, shh, 0, 0, c.width, c.height);
      tiles[k] = c;
    }
  };
  img.src = SHEET;

  resize(); addEventListener('resize', resize);
  const t0 = performance.now();
  window.__render = render;
  (function loop(now) { render((now - t0) / 1000); requestAnimationFrame(loop); })(t0);
})();
</script>
</body>
</html>
