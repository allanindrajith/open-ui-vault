:root{
  --magenta:#782956;
  --ink:#1d222b;
  --muted:#4b4f57;
  --panel:rgba(246,246,246,.94);
  --arrow:#ffe100;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--magenta)}
body{font-family:"Albert Sans",Arial,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.panel button:focus-visible{outline-color:var(--ink)}
svg{display:block}

.hero{--u:1px;position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;isolation:isolate;background:var(--magenta)}

/* back to front: dots, word, bikes, drag surface, UI */
.dots{position:absolute;left:0;right:0;top:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(255,255,255,.29) 0 1.15px,transparent 1.75px);
  -webkit-mask-image:linear-gradient(#000 25%,transparent);mask-image:linear-gradient(#000 25%,transparent)}
.word{position:absolute;z-index:1;pointer-events:none;user-select:none}
.word svg{width:100%;height:100%;overflow:visible}
.word text{font-family:"Albert Sans",Arial,sans-serif;font-weight:450;fill:#fff}
.bikes{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.drag{position:absolute;inset:0;z-index:3;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.drag.is-dragging{cursor:grabbing}

/* nav: pinned to the viewport edges */
.nav{position:absolute;z-index:4;left:0;right:0;top:0;height:calc(72*var(--u));pointer-events:none}
.nav button{pointer-events:auto}
.menu{position:absolute;left:calc(31.5*var(--u));top:calc(15.5*var(--u));width:max(30px,calc(40*var(--u)));height:max(30px,calc(40*var(--u)));border-radius:50%;background:#fff;display:grid;place-items:center}
.menu svg{width:max(10px,calc(12*var(--u)));height:max(8px,calc(10*var(--u)))}
.logo{position:absolute;left:50%;top:calc(35.8*var(--u));transform:translate(-50%,-50%);color:#fff;font-size:max(15px,calc(22.2*var(--u)));line-height:1;letter-spacing:.032em;margin-left:calc(-1.5*var(--u));white-space:nowrap}
.logo sup{font-size:.72em;line-height:0;vertical-align:.38em;letter-spacing:0}
.contact{position:absolute;right:calc(40*var(--u));top:calc(17*var(--u));width:max(92px,calc(127*var(--u)));height:max(28px,calc(39*var(--u)));border-radius:99px;background:#fff;font-size:max(11px,calc(12.6*var(--u)));font-weight:540;letter-spacing:.024em;white-space:nowrap}

.arrow{position:absolute;z-index:5;border-radius:50%;background:var(--arrow);color:#16140a;display:grid;place-items:center;transform:translate(-50%,-50%)}
.arrow::after{content:"";position:absolute;inset:-6px;border-radius:50%}
.arrow svg{width:40%;height:40%}

/* spec row */
.panel{position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(29*var(--u));width:min(calc(100% - 48px),max(calc(1313*var(--u)),880px));padding:calc(16*var(--u)) calc(29*var(--u)) calc(13.5*var(--u)) calc(32*var(--u));border-radius:max(12px,calc(17*var(--u)));background:var(--panel)}
.panel-head{height:max(24px,calc(30*var(--u)));display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel h2{font-size:max(13px,calc(18*var(--u)));line-height:1;font-weight:435;letter-spacing:-.013em;white-space:nowrap}
.full{height:max(24px,calc(30*var(--u)));width:max(100px,calc(135*var(--u)));border-radius:99px;background:#fff;box-shadow:0 2px 8px rgba(20,20,30,.07);font-size:max(11px,calc(12.5*var(--u)));font-weight:530;letter-spacing:.006em;white-space:nowrap}
.specs{list-style:none;margin-top:calc(20*var(--u));display:grid;grid-template-columns:minmax(max-content,186fr) minmax(max-content,223fr) minmax(max-content,223fr) minmax(max-content,212fr) minmax(max-content,229fr) minmax(max-content,176fr)}
.spec{display:grid;grid-template-columns:max(15px,calc(18*var(--u))) max-content;column-gap:calc(15*var(--u));align-items:center;padding:calc(2*var(--u)) calc(6*var(--u)) calc(2*var(--u)) calc(47*var(--u));position:relative}
.spec:first-of-type{padding-left:calc(3*var(--u))}
.spec + .spec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:rgba(29,34,43,.11)}
.spec svg{width:100%;height:auto;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
.spec dl{line-height:1.2}
.spec dt{font-size:max(11px,calc(12.9*var(--u)));color:var(--muted);letter-spacing:-.02em;white-space:nowrap}
.spec dd{margin-top:calc(7.5*var(--u));font-size:max(11.5px,calc(14.5*var(--u)));font-weight:560;letter-spacing:.008em;white-space:nowrap}

/* short landscape and narrow landscape */
.hero[data-tier="short"] .nav,.hero[data-tier="tall"] .nav{height:56px}
.hero[data-tier="short"] .menu{left:14px;top:9px;width:32px;height:32px}
.hero[data-tier="short"] .logo{top:25px;font-size:16px}
.hero[data-tier="short"] .contact{right:14px;top:10px;width:98px;height:30px;font-size:11.5px}
.hero[data-tier="short"] .panel{bottom:8px;width:min(calc(100% - 20px),960px);padding:6px 10px 7px;border-radius:12px}
.hero[data-tier="short"] .panel-head{height:26px}
.hero[data-tier="short"] .panel h2{font-size:13px}
.hero[data-tier="short"] .full{height:24px;width:100px;font-size:11px}
.hero[data-tier="short"] .specs{margin-top:4px;grid-template-columns:repeat(6,minmax(max-content,1fr))}
.hero[data-tier="short"] .spec{grid-template-columns:15px max-content;column-gap:6px;padding:1px 4px 1px 9px}
.hero[data-tier="short"] .spec:first-of-type{padding-left:2px}
.hero[data-tier="short"] .spec dt{font-size:11px}
.hero[data-tier="short"] .spec dd{margin-top:1px;font-size:11.5px}
.hero[data-tier="short"].cols-3 .specs{grid-template-columns:repeat(3,minmax(max-content,1fr));row-gap:3px}
.hero[data-tier="short"].cols-3 .spec:nth-of-type(3n+1)::before{display:none}
.hero[data-tier="short"].cols-3 .spec:nth-of-type(3n+1){padding-left:2px}

/* portrait: phones, tablets, near-square windows */
.hero[data-tier="tall"] .menu{left:16px;top:13px;width:34px;height:34px}
.hero[data-tier="tall"] .logo{top:30px;font-size:17px}
.hero[data-tier="tall"] .contact{right:16px;top:14px;width:98px;height:32px;font-size:11.5px}
.hero[data-tier="tall"] .panel{bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 20px);max-width:780px;padding:10px 12px 11px;border-radius:14px}
.hero[data-tier="tall"] .panel-head{height:30px}
.hero[data-tier="tall"] .panel h2{font-size:15px}
.hero[data-tier="tall"] .full{height:28px;width:108px;font-size:11.5px}
.hero[data-tier="tall"] .specs{margin-top:7px;grid-template-columns:repeat(2,minmax(0,1fr));row-gap:7px}
.hero[data-tier="tall"] .spec{grid-template-columns:16px max-content;column-gap:8px;padding:1px 2px 1px 12px}
.hero[data-tier="tall"] .spec:first-of-type{padding-left:2px}
.hero[data-tier="tall"] .spec dt{font-size:11.5px}
.hero[data-tier="tall"] .spec dd{margin-top:2px;font-size:13px}
.hero[data-tier="tall"]:not(.cols-3) .spec:nth-of-type(odd)::before{display:none}
.hero[data-tier="tall"]:not(.cols-3) .spec:nth-of-type(odd){padding-left:2px}
.hero[data-tier="tall"].cols-3 .specs{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:12px}
.hero[data-tier="tall"].cols-3 .spec:nth-of-type(3n+1)::before{display:none}
.hero[data-tier="tall"].cols-3 .spec:nth-of-type(3n+1){padding-left:2px}
.hero[data-tier="tall"].narrow .logo{font-size:14px;letter-spacing:.01em}

<script>
(() => {
'use strict';

/* ---------- measured constants ---------- */

// Measured swap: 1400 ms, custom bezier, side item 740 vs 1240 wide, layer blur 12 at 1920.
const DURATION = 1400;
const HOLD = 2000;                      // autoplay: rest on each bike, then the same swap
const CURVE = [0.51, 0, 0, 0.98];
const SIDE_SCALE = 740 / 1240;
const SIDE_SIGMA = 4.5;                 // blur 12 at 1920 = 6 px sigma = 4.5 px at 1440

// Mockup, 1440 x 810 frame.
const FRAME = {
  w: 1440, h: 810,
  word: { x: 22.5, top: 159, w: 1357, cap: 198.5 },
  bike: { cx: 710, cy: 427, w: 762, ground: 628 },
  step: 776,
  arrows: { left: 229, right: 1197.5, y: 433, d: 36 },
};
// Each letter's ink box in the mockup, left and right.
const GLYPHS = [['R', 22.5, 185], ['I', 214.5, 245.5], ['D', 282.5, 464], ['E', 495, 640], ['O', 760, 978], ['U', 1010, 1187], ['T', 1212, 1379.5]];

// The page colour is the paint. Rows of the frame, and how far each is shaded (<0) or tinted (>0).
const FADE = [[0, -.34], [70, -.26], [120, -.2], [200, -.08], [248, 0], [300, .08], [380, .21], [450, .36], [530, .53], [610, .66], [700, .755], [810, .82]];

const SLIDES = [
  { name: 'Magenta satin', hex: '#782956' },
  { name: 'Deep sapphire', hex: '#033878' },
  { name: 'Cocoa copper', hex: '#593429' },
  { name: 'Violet pearl', hex: '#5b44a7' },
].map(s => ({ ...s, rgb: [1, 3, 5].map(i => parseInt(s.hex.slice(i, i + 2), 16)) }));

// One generated sheet, used from its own result link. box = bike bounds on the 3840 x 2160 sheet.
const SHEET_PNG = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261122_131809_0c1477f1-f13a-4b07-84e4-6ad1f33c15c5.png';
const SHEET_URL = 'https://images.higgs.ai/?default=1&output=webp&url=' + encodeURIComponent(SHEET_PNG) + '&w=3840&q=85';
const CELLS = [
  // clean: centre lines of stray generated marks on the tank, refilled from the paint either side
  { box: [92, 122, 1749, 992], clean: [[1041, 265.5, 1120, 294.5, 7.5], [1053, 255, 1109, 275.5, 3.6]] },
  { box: [1972, 121, 3636, 996], clean: [[2921, 266, 3002, 294.5, 7.5], [2940, 257.5, 2984, 275, 3.6]] },
  { box: [91, 1113, 1748, 1992], clean: [[1035, 1258.5, 1118, 1288.5, 7.5], [1058, 1249.5, 1114, 1271.5, 3.6]] },
  { box: [1970, 1111, 3636, 1991], clean: [[2921, 1260.5, 3002, 1289, 7.5], [2939, 1252, 2995, 1272.5, 3.6]] },
];
// Each texture holds one bike and its contact shadow. Power of two, for mipmaps.
const TEX = { w: 2048, h: 1024, left: 134, bike: 1780, ground: 960 };
TEX.centre = TEX.ground - (FRAME.bike.ground - FRAME.bike.cy) * TEX.bike / FRAME.bike.w;

/* ---------- helpers ---------- */

const $ = id => document.getElementById(id);
const hero = $('hero'), dots = $('dots'), word = $('word'), dragEl = $('drag');
const prev = $('prev'), next = $('next'), panel = $('panel'), statusEl = $('status');
let canvas = $('bikes');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (n, m) => ((n % m) + m) % m;
const lerp = (a, b, t) => a + (b - a) * t;

const bez = (a, b, t) => 3 * (1 - t) * (1 - t) * t * a + 3 * (1 - t) * t * t * b + t * t * t;
function solve(a, b, v) {               // t where bez(a, b, t) = v
  let lo = 0, hi = 1;
  for (let i = 0; i < 24; i++) { const m = (lo + hi) / 2; if (bez(a, b, m) < v) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : bez(CURVE[1], CURVE[3], solve(CURVE[0], CURVE[2], x));
const easeInverse = y => y <= 0 ? 0 : y >= 1 ? 1 : bez(CURVE[0], CURVE[2], solve(CURVE[1], CURVE[3], y));

/* ---------- layout: one geometry object per screen ---------- */

let G = null;
function layout() {
  const W = hero.clientWidth, H = hero.clientHeight;
  if (!W || !H) return;
  const landscape = W / H >= 1.2;
  const tier = !landscape ? 'tall' : (H <= 500 || W < 900) ? 'short' : 'wide';
  hero.dataset.tier = tier;
  hero.classList.toggle('cols-3', (tier === 'tall' && W >= 560) || (tier === 'short' && W < 840));
  hero.classList.toggle('narrow', tier === 'tall' && W < 360);
  hero.classList.toggle('roomy', tier === 'tall' && W < 560 && H >= 720);
  const tablet = tier === 'tall' && W >= 580 && H >= 900;
  hero.classList.toggle('tablet', tablet);
  let u = Math.min(W / FRAME.w, H / FRAME.h);
  hero.style.setProperty('--u', (tier === 'wide' ? u : 1) + 'px');

  const panelTop = panel.offsetTop;
  const F = FRAME, g = { W, H, tier };

  if (tier === 'tall') {
    const navBottom = tablet ? 84 : 58, band = panelTop - navBottom;
    const wordK = (W - 14) / F.word.w;
    const bikeW = W * .92;
    const overlap = .34 * F.word.cap * wordK;     // the bike starts a third of the way down the word
    const bikeH = bikeW * .527;
    const d = tablet ? 54 : H >= 720 ? 44 : 38;
    const gap = 12 + d;                           // the arrow pair never scales
    const k = Math.min(1, (band - 16 - gap) / (overlap + bikeH));
    const top = navBottom + (band - (overlap + bikeH) * k - gap) / 2;
    const wk = wordK * k, bw = bikeW * k;
    g.word = { x: (W - F.word.w * wk) / 2, top, w: F.word.w * wk, cap: F.word.cap * wk };
    g.bike = { cx: W / 2, cy: top + overlap * k + bikeH * k / 2, w: bw, ground: top + (overlap + bikeH) * k };
    g.step = W / 2 - W * .022 + bw * SIDE_SCALE / 2;
    g.arrows = { left: W / 2 - d * .85, right: W / 2 + d * .85, y: g.bike.ground + 12 + d / 2, d };
  } else {
    let ox, oy;
    if (tier === 'wide') {
      oy = (H - F.h * u) * .5;
      const room = panelTop - 8 - (oy + F.bike.ground * u);
      if (room < 0) oy += room;
    } else {
      const navBottom = 46, band = panelTop - navBottom;
      u = Math.min(W / F.w, (band - 10) / (F.bike.ground - 150));
      oy = navBottom + (band - (F.bike.ground - 150) * u) / 2 - 150 * u;
    }
    ox = W / 2 - 720 * u;
    g.word = { x: ox + F.word.x * u, top: oy + F.word.top * u, w: F.word.w * u, cap: F.word.cap * u };
    g.bike = { cx: ox + F.bike.cx * u, cy: oy + F.bike.cy * u, w: F.bike.w * u, ground: oy + F.bike.ground * u };
    g.step = F.step * u;
    const d = Math.max(28, F.arrows.d * u);
    g.arrows = { left: ox + F.arrows.left * u, right: ox + F.arrows.right * u, y: oy + F.arrows.y * u, d };
  }

  // The fade follows the word and the bike on every screen: rows of the frame map to pixels of this screen.
  const anchors = [[0, 0], [159, g.word.top], [628, g.bike.ground], [810, H]];
  g.fade = FADE.map(([row, t]) => {
    let i = 0;
    while (i < 2 && row > anchors[i + 1][0]) i++;
    const [a, b] = anchors[i], [c, d] = anchors[i + 1];
    return [clamp(b + (row - a) / (c - a) * (d - b), 0, H).toFixed(1), t];
  });

  const px = v => v.toFixed(2) + 'px';
  Object.assign(word.style, { left: px(g.word.x), top: px(g.word.top), width: px(g.word.w), height: px(g.word.cap) });
  for (const [el, x] of [[prev, g.arrows.left], [next, g.arrows.right]]) {
    Object.assign(el.style, { left: px(x), top: px(g.arrows.y), width: px(g.arrows.d), height: px(g.arrows.d) });
  }
  const s = g.bike.w / F.bike.w, pitch = Math.max(22, 45.4 * s), rise = Math.max(20, 41 * s);
  dots.style.height = px(g.word.top + g.word.cap * .75);
  dots.style.backgroundSize = `${pitch}px ${rise}px`;
  dots.style.backgroundPosition = `${mod(W / 2 - pitch / 2, pitch)}px ${31 * s - rise / 2}px`;

  G = g;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  draw();
}

// Real type, with every letter fitted to its box in the mockup.
function fitWord() {
  const c = document.createElement('canvas').getContext('2d');
  c.font = '450 100px "Albert Sans"';
  const size = 100 * FRAME.word.cap / c.measureText('T').actualBoundingBoxAscent;
  c.font = `450 ${size}px "Albert Sans"`;
  const letters = GLYPHS.map(([ch, left, right]) => {
    const m = c.measureText(ch), sx = (right - left) / (m.actualBoundingBoxLeft + m.actualBoundingBoxRight);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.textContent = ch;
    t.setAttribute('font-size', size);
    t.setAttribute('transform', `translate(${left - FRAME.word.x + m.actualBoundingBoxLeft * sx} ${FRAME.word.cap}) scale(${sx} 1)`);
    return t;
  });
  $('wordSvg').replaceChildren(...letters);
}

/* ---------- textures ---------- */

function cleanMark(data, W, H, [x0, y0, x1, y1, half]) {
  const len = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / len, uy = (y1 - y0) / len;
  const bx = Math.max(0, Math.floor(x0 - 34)), by = Math.max(0, Math.floor(y0 - 34));
  const bw = Math.min(W, Math.ceil(x1 + 34)) - bx, bh = Math.min(H, Math.ceil(y1 + 34)) - by;
  const src = new Uint8ClampedArray(bw * bh * 4);
  for (let y = 0; y < bh; y++) src.set(data.subarray(((y + by) * W + bx) * 4, ((y + by) * W + bx + bw) * 4), y * bw * 4);
  const read = (x, y, c) => {
    const X = clamp(x - bx, 0, bw - 2), Y = clamp(y - by, 0, bh - 2), a = X | 0, b = Y | 0, i = (b * bw + a) * 4 + c;
    return lerp(lerp(src[i], src[i + 4], X - a), lerp(src[i + bw * 4], src[i + bw * 4 + 4], X - a), Y - b);
  };
  for (let y = Math.floor(y0 - 18); y < y1 + 18; y++) for (let x = Math.floor(x0 - 18); x < x1 + 18; x++) {
    const along = (x - x0) * ux + (y - y0) * uy, n = -(x - x0) * uy + (y - y0) * ux;
    const out = Math.max(-3 - along, along - len - 3, 0);
    const w = clamp((half + 1.5 - Math.abs(n)) / 2.5, 0, 1) * Math.max(0, 1 - out / 4);
    if (!w) continue;
    const f = clamp((n + half) / (2 * half), 0, 1), px = x + n * uy, py = y - n * ux, e = half + 2;
    for (let c = 0; c < 3; c++) {
      let a = 0, b = 0;
      for (const k of [-3, 0, 3]) {
        a += read(px + uy * e + k * ux, py - ux * e + k * uy, c) / 3;
        b += read(px - uy * e + k * ux, py + ux * e + k * uy, c) / 3;
      }
      const i = (y * W + x) * 4 + c;
      data[i] = lerp(data[i], lerp(a, b, f), w);
    }
  }
}

function buildTexture(image, cell) {
  const k = image.naturalWidth / 3840;
  const [l, t, r, b] = cell.box, w = r - l, h = b - t;
  const cut = document.createElement('canvas');
  cut.width = w; cut.height = h;
  const cg = cut.getContext('2d', { willReadFrequently: true });
  cg.drawImage(image, l * k, t * k, w * k, h * k, 0, 0, w, h);
  const pixels = cg.getImageData(0, 0, w, h), d = pixels.data;
  for (let i = 3; i < d.length; i += 4) d[i] = d[i] < 8 ? 0 : Math.min(255, (d[i] - 6) * 255 / 236);   // solid body, no haze
  for (const [x0, y0, x1, y1, half] of cell.clean) cleanMark(d, w, h, [x0 - l, y0 - t, x1 - l, y1 - t, half]);
  cg.putImageData(pixels, 0, 0);

  const tex = document.createElement('canvas');
  tex.width = TEX.w; tex.height = TEX.h;
  const g = tex.getContext('2d');
  const shadow = (cx, cy, rx, ry, a) => {
    g.save(); g.translate(cx, cy); g.scale(rx, ry);
    const q = g.createRadialGradient(0, 0, 0, 0, 0, 1);
    q.addColorStop(0, `rgba(10,7,10,${a})`); q.addColorStop(.45, `rgba(10,7,10,${a * .55})`); q.addColorStop(1, 'rgba(10,7,10,0)');
    g.fillStyle = q; g.fillRect(-1, -1, 2, 2); g.restore();
  };
  const at = f => TEX.left + TEX.bike * f, y = TEX.ground;
  shadow(1024, y - 6, 1010, 58, .3);
  shadow(1024, y - 4, 720, 34, .26);
  shadow(at(.158), y - 3, 300, 26, .85);
  shadow(at(.843), y - 3, 300, 26, .85);
  const bh = h * TEX.bike / w;
  g.imageSmoothingQuality = 'high';
  g.drawImage(cut, TEX.left, TEX.ground - bh, TEX.bike, bh);
  return tex;
}

/* ---------- renderer: WebGL, or plain canvas if there is none ---------- */

function makeGL(textures) {
  const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false });
  if (!gl) return null;
  const shader = (type, code) => { const s = gl.createShader(type); gl.shaderSource(s, code); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, `
    attribute vec2 p; uniform vec2 view; uniform vec4 quad; uniform vec4 uvr; varying vec2 v;
    void main(){
      vec2 s = quad.xy + p * quad.zw;
      v = uvr.xy + p * uvr.zw;
      gl_Position = vec4(s.x / view.x * 2. - 1., 1. - s.y / view.y * 2., 0., 1.);
    }`));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, `
    precision highp float;
    uniform sampler2D tex; uniform vec2 radius; uniform float bias; varying vec2 v;
    void main(){
      if (radius.x <= 0.) { gl_FragColor = texture2D(tex, v, -.35); return; }
      vec4 sum = vec4(0.); float total = 0.;
      for (int i = 0; i < 28; i++) {
        float f = float(i) + .5, r = sqrt(f / 28.), a = f * 2.399963;
        float w = exp(-2. * r * r);
        sum += texture2D(tex, v + vec2(cos(a), sin(a)) * r * radius, bias) * w;
        total += w;
      }
      gl_FragColor = sum / total;
    }`));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
  const p = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(p);
  gl.vertexAttribPointer(p, 2, gl.FLOAT, false, 0, 0);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  const aniso = gl.getExtension('EXT_texture_filter_anisotropic');
  const handles = textures.map(image => {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    if (aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, 4);
    gl.generateMipmap(gl.TEXTURE_2D);
    return t;
  });
  const U = {};
  for (const n of ['view', 'quad', 'uvr', 'radius', 'bias']) U[n] = gl.getUniformLocation(prog, n);

  return items => {
    const dpr = canvas.width / G.W;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(U.view, G.W, G.H);
    for (const it of items) {
      const pad = it.sigma * 2.2;
      gl.bindTexture(gl.TEXTURE_2D, handles[it.slide]);
      gl.uniform4f(U.quad, it.x - pad, it.y - pad, it.w + pad * 2, it.h + pad * 2);
      gl.uniform4f(U.uvr, -pad / it.w, -pad / it.h, 1 + 2 * pad / it.w, 1 + 2 * pad / it.h);
      gl.uniform2f(U.radius, it.sigma > .06 ? it.sigma * 2 / it.w : 0, it.sigma * 2 / it.h);
      gl.uniform1f(U.bias, Math.log2(Math.max(1, it.sigma * dpr * .55)));
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
  };
}

function make2D(textures) {
  let c = canvas.getContext('2d');
  if (!c) {                             // a canvas that has held WebGL cannot switch, so replace it
    const fresh = canvas.cloneNode();
    canvas.replaceWith(fresh);
    canvas = fresh;
    c = canvas.getContext('2d');
  }
  return items => {
    const dpr = canvas.width / G.W;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, G.W, G.H);
    for (const it of items) {
      c.filter = it.sigma > .06 ? `blur(${it.sigma * dpr}px)` : 'none';
      c.drawImage(textures[it.slide], it.x, it.y, it.w, it.h);
    }
    c.filter = 'none';
  };
}

/* ---------- one progress value drives everything ---------- */

let pos = 0, paint = null, textureSet = null;

function itemsAt(p) {
  const out = [], mid = Math.round(p), B = G.bike;
  const reach = Math.ceil((G.W / 2 + B.w * .4) / G.step) + 1;
  for (let i = mid - reach; i <= mid + reach; i++) {
    const o = i - p, t = Math.min(1, Math.abs(o));
    const s = lerp(1, SIDE_SCALE, t);
    const q = B.w * s / TEX.bike;       // screen px per texture px
    const x = B.cx + o * G.step;
    const it = { index: i, slide: mod(i, SLIDES.length), off: o, scale: s, cx: x,
      x: x - 1024 * q, y: B.cy - TEX.centre * q, w: TEX.w * q, h: TEX.h * q,
      sigma: SIDE_SIGMA * (B.w / FRAME.bike.w) * t };
    if (it.x < G.W + 20 && it.x + it.w > -20) out.push(it);
  }
  return out.sort((a, b) => Math.abs(b.off) - Math.abs(a.off));
}

function colourAt(p) {
  const i = Math.floor(p), a = SLIDES[mod(i, SLIDES.length)].rgb, b = SLIDES[mod(i + 1, SLIDES.length)].rgb;
  return a.map((v, k) => lerp(v, b[k], p - i));
}

function draw() {
  if (!G) return;
  const base = colourAt(pos);
  const stops = G.fade.map(([y, t]) => `rgb(${base.map(v => Math.round(t < 0 ? v * (1 + t) : lerp(v, 255, t))).join(',')}) ${y}px`);
  hero.style.background = `linear-gradient(${stops.join(',')})`;
  if (paint) paint(itemsAt(pos));
}

/* ---------- motion: arrows and drag ---------- */

let move = null, queued = 0, raf = 0;

// Autoplay. The wait only runs while a bike is at rest and nobody is holding it or tabbing through the controls.
let autoOn = false, autoTimer = 0, byAuto = false;

function keyboardInside() {
  const el = document.activeElement;
  return !!el && el.tagName === 'BUTTON' && el.matches(':focus-visible');
}
function schedule() {
  clearTimeout(autoTimer);
  if (!autoOn || !paint || move || drag || document.hidden || reduced.matches || keyboardInside()) return;
  autoTimer = setTimeout(() => go(1, true), HOLD);
}
document.addEventListener('visibilitychange', schedule);
reduced.addEventListener('change', schedule);
hero.addEventListener('focusin', schedule);
hero.addEventListener('focusout', () => setTimeout(schedule));   // after focus has landed

function tick(now) {
  raf = 0;
  if (!move) return;
  const x = clamp((now - move.start) / DURATION, 0, 1);
  pos = lerp(move.from, move.to, ease(x));
  if (x >= 1) {
    pos = move.to;
    move = null;
    settled();
    if (queued) { const q = queued; queued = 0; go(q); }
  }
  draw();
  if (move && !raf) raf = requestAnimationFrame(tick);
}

function run(from, to, start) {
  if (reduced.matches) { pos = to; move = null; draw(); settled(); return; }
  move = { from, to, start };
  if (!raf) raf = requestAnimationFrame(tick);
}

function settled() {
  pos = Math.round(pos);
  const s = SLIDES[mod(pos, SLIDES.length)];
  if (!byAuto) statusEl.textContent = s.name;   // only announce what the visitor did
  byAuto = false;
  schedule();
}

function go(dir, auto = false) {
  if (drag) return;
  clearTimeout(autoTimer);
  byAuto = auto;
  if (move) { queued = dir; return; }   // a click during a move waits its turn
  const from = Math.round(pos);
  run(from, from + dir, performance.now());
}

// Join the same curve at the point where the finger let go.
function finish(target) {
  const left = Math.min(1, Math.abs(target - pos));
  if (left < .0005) { pos = target; draw(); settled(); return; }
  const dir = Math.sign(target - pos);
  run(target - dir, target, performance.now() - easeInverse(1 - left) * DURATION);
}

let drag = null;
dragEl.addEventListener('pointerdown', e => {
  if (!G || (e.pointerType === 'mouse' && e.button !== 0) || drag) return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, base: pos, active: false, resume: move && move.to, trail: [[e.timeStamp, e.clientX]] };
  move = null; queued = 0; byAuto = false;
  clearTimeout(autoTimer);
  try { dragEl.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
});
dragEl.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x;
  if (!drag.active) {
    if (Math.abs(dx) < 5 || Math.abs(dx) < Math.abs(e.clientY - drag.y)) return;
    drag.active = true;
    dragEl.classList.add('is-dragging');
  }
  pos = drag.base - dx / G.step;
  drag.trail.push([e.timeStamp, e.clientX]);
  while (drag.trail.length > 2 && e.timeStamp - drag.trail[0][0] > 90) drag.trail.shift();
  draw();
});
function release(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  drag = null;
  dragEl.classList.remove('is-dragging');
  if (!d.active) { finish(typeof d.resume === 'number' ? d.resume : Math.round(pos)); return; }
  const [t0, x0] = d.trail[0], [t1, x1] = d.trail[d.trail.length - 1];
  const speed = t1 > t0 && e.timeStamp - t1 < 90 ? (x1 - x0) / (t1 - t0) : 0;   // px per ms
  let target = Math.round(pos);
  if (Math.abs(speed) > .45 && e.type !== 'pointercancel') target = speed < 0 ? Math.ceil(pos) : Math.floor(pos);
  finish(target);
}
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) dragEl.addEventListener(type, release);

prev.addEventListener('click', () => go(-1));
next.addEventListener('click', () => go(1));

/* ---------- start ---------- */

let revealed = false;
function reveal() {
  if (revealed) return;
  revealed = true;
  hero.classList.remove('pending');
  setTimeout(() => { autoOn = true; schedule(); }, reduced.matches ? 0 : 1000);   // the wait starts after the load-in
  if (reduced.matches) return;
  const rise = [[word, 0], [canvas, 60], [$('nav'), 120], [prev, 150], [next, 150], [panel, 150]];
  for (const [el, delay] of rise) {
    el.animate([{ opacity: 0, translate: '0 16px' }, { opacity: 1, translate: '0 0' }],
      { duration: 850, delay, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' });
  }
}

const loadImage = src => new Promise((resolve, reject) => {
  const im = new Image();
  im.crossOrigin = 'anonymous';
  im.onload = () => resolve(im);
  im.onerror = reject;
  im.src = src;
});

function startRenderer() {
  paint = makeGL(textureSet) || make2D(textureSet);
  draw();
  schedule();
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); paint = null; clearTimeout(autoTimer); });
canvas.addEventListener('webglcontextrestored', () => { if (textureSet) startRenderer(); });

layout();
new ResizeObserver(layout).observe(hero);
const failsafe = setTimeout(reveal, 6000);

const fontReady = document.fonts.load('450 100px "Albert Sans"').catch(() => {}).then(() => { fitWord(); layout(); });
const bikesReady = loadImage(SHEET_URL).catch(() => loadImage(SHEET_PNG)).then(image => {
  textureSet = CELLS.map(cell => buildTexture(image, cell));
  startRenderer();
});
Promise.allSettled([fontReady, bikesReady]).then(() => {
  clearTimeout(failsafe);
  requestAnimationFrame(reveal);
  window.__hero.ready = true;
});

// Read-only state plus a seek, for the timing checks and the frame-by-frame recording.
window.__hero = {
  ready: false,
  state: () => ({ pos, moving: !!move, dragging: !!drag, geometry: G, items: G ? itemsAt(pos).map(({ slide, off, scale, cx, sigma }) => ({ slide, off, scale, cx, sigma })) : [] }),
  autoplay: on => { autoOn = on; schedule(); },
  seek: p => { autoOn = false; clearTimeout(autoTimer); move = null; pos = p; draw(); },
};
})();
</script>
</body>
</html>
