<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Section Liquid Glass UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>
</head>
<body class="m-0 p-0">
  <div class="min-h-screen bg-black flex flex-col relative overflow-hidden">
    <video
      id="bgVideo"
      muted
      playsinline
      style="opacity: 0"
      class="absolute inset-0 w-full h-full object-cover translate-y-[17%]"
    >
      <source
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_115001_bcdaa3b4-03de-47e7-ad63-ae3e392c32d4.mp4"
        type="video/mp4"
      />
    </video>

    <nav class="relative z-20 pl-6 pr-6 py-6">
      <div class="rounded-full px-6 py-3 flex items-center justify-between max-w-5xl mx-auto">
        <div class="flex items-center gap-8">
          <div class="flex items-center gap-2 text-white font-semibold text-lg">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
            <span>Asme</span>
          </div>

          <div class="hidden md:flex items-center gap-8">
            <a href="#" class="text-white/80 hover:text-white transition-colors text-sm font-medium">Features</a>
            <a href="#" class="text-white/80 hover:text-white transition-colors text-sm font-medium">Pricing</a>
            <a href="#" class="text-white/80 hover:text-white transition-colors text-sm font-medium">About</a>
          </div>
        </div>

        <div class="flex items-center gap-4">
          <button class="text-white text-sm font-medium hover:text-white/80 transition-colors">Sign Up</button>
          <button class="liquid-glass rounded-full px-6 py-2 text-white text-sm font-medium hover:bg-white/5 transition-colors">Login</button>
        </div>
      </div>
    </nav>

    <div class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-12 text-center -translate-y-[20%]">
      <h1
        class="text-5xl md:text-6xl lg:text-7xl text-white mb-8 tracking-tight whitespace-nowrap"
        style="font-family: 'Instrument Serif', serif"
      >
        Built for the curious
      </h1>

      <div class="w-full max-w-xl space-y-4">
        <div class="liquid-glass rounded-full pl-6 pr-2 py-2 flex items-center gap-3">
          <input
            type="email"
            placeholder="Enter your email"
            class="flex-1 bg-transparent border-none outline-none text-white placeholder:text-white/40 text-base"
          />
          <button class="bg-white rounded-full p-3 text-black hover:bg-white/90 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </div>

        <p class="text-white text-sm leading-relaxed px-4">
          Stay updated with the latest news and insights. Subscribe to our newsletter today and never miss out on exciting updates.
        </p>

        <div class="flex justify-center">
          <button class="liquid-glass rounded-full px-8 py-3 text-white text-sm font-medium hover:bg-white/5 transition-colors">Manifesto</button>
        </div>
      </div>
    </div>

    <div class="relative z-10 flex justify-center gap-4 pb-12">
      <a href="#" class="liquid-glass rounded-full p-4 text-white/80 hover:text-white hover:bg-white/5 transition-all" aria-label="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
      </a>
      <a href="#" class="liquid-glass rounded-full p-4 text-white/80 hover:text-white hover:bg-white/5 transition-all" aria-label="Twitter">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></svg>
      </a>
      <a href="#" class="liquid-glass rounded-full p-4 text-white/80 hover:text-white hover:bg-white/5 transition-all" aria-label="Website">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      </a>
    </div>
  </div>

  <script>
    const video = document.getElementById('bgVideo');
    let rafId = 0;
    let fadingOut = false;

    function cancelFade() {
      cancelAnimationFrame(rafId);
      rafId = 0;
    }

    function fadeIn() {
      cancelFade();
      fadingOut = false;
      const startOpacity = parseFloat(video.style.opacity) || 0;
      const remaining = (1 - startOpacity) * 500;
      if (remaining <= 0) { video.style.opacity = '1'; return; }
      const start = performance.now();

      function step(now) {
        const progress = Math.min((now - start) / remaining, 1);
        video.style.opacity = String(startOpacity + (1 - startOpacity) * progress);
        if (progress < 1) {
          rafId = requestAnimationFrame(step);
        }
      }
      rafId = requestAnimationFrame(step);
    }

    function fadeOut() {
      cancelFade();
      const startOpacity = parseFloat(video.style.opacity) || 1;
      const remaining = startOpacity * 500;
      if (remaining <= 0) { video.style.opacity = '0'; return; }
      const start = performance.now();

      function step(now) {
        const progress = Math.min((now - start) / remaining, 1);
        video.style.opacity = String(startOpacity * (1 - progress));
        if (progress < 1) {
          rafId = requestAnimationFrame(step);
        }
      }
      rafId = requestAnimationFrame(step);
    }

    video.addEventListener('timeupdate', function() {
      if (!video.duration) return;
      const remaining = video.duration - video.currentTime;
      if (remaining <= 0.55 && !fadingOut) {
        fadingOut = true;
        fadeOut();
      }
    });

    video.addEventListener('ended', function() {
      cancelFade();
      video.style.opacity = '0';
      fadingOut = false;
      setTimeout(function() {
        video.currentTime = 0;
        video.play();
        fadeIn();
      }, 100);
    });

    video.style.opacity = '0';
    function handleCanPlay() {
      video.play();
      fadeIn();
    }
    if (video.readyState >= 3) {
      handleCanPlay();
    } else {
      video.addEventListener('canplay', handleCanPlay, { once: true });
    }
  </script>
</body>
</html>
