<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'instrument-serif': ['"Instrument Serif"', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; overflow-x: hidden; }
  </style>
</head>
<body>
  <div class="relative w-full h-screen overflow-hidden">
    <!-- Background Video -->
    <video class="absolute inset-0 w-full h-full object-cover" autoplay muted loop playsinline>
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_204103_f607742e-09da-4cf5-bb06-4e67b0a531de.mp4" type="video/mp4" />
    </video>

    <!-- Content Layer -->
    <div class="relative z-10 flex flex-col h-full">
      <!-- Navbar -->
      <nav class="flex items-center justify-between px-6 md:px-12 lg:px-16 py-5 md:py-6">
        <div class="flex items-center gap-8 lg:gap-12">
          <a href="/" class="text-white font-semibold text-lg tracking-tight font-sans">Atelier</a>
          <div class="hidden md:flex items-center gap-6 lg:gap-8">
            <a href="#work" class="text-white/80 hover:text-white text-sm font-light transition-colors duration-200">Projects</a>
            <a href="#services" class="text-white/80 hover:text-white text-sm font-light transition-colors duration-200">Expertise</a>
            <a href="#about" class="text-white/80 hover:text-white text-sm font-light transition-colors duration-200">Studio</a>
            <a href="#journal" class="text-white/80 hover:text-white text-sm font-light transition-colors duration-200">Insights</a>
          </div>
        </div>
        <div class="flex items-center gap-3 md:gap-4">
          <a href="#contact" class="text-white/80 hover:text-white text-sm font-light transition-colors duration-200 hidden md:block">Reach Out</a>
          <button class="bg-white text-black text-sm font-medium px-5 py-2 rounded-full hover:bg-white/90 transition-colors duration-200 hidden md:block">Let's Talk</button>
          <!-- Hamburger Button - Mobile -->
          <button id="hamburgerBtn" class="md:hidden relative w-10 h-10 flex items-center justify-center" aria-label="Toggle menu">
            <div class="flex flex-col items-end gap-[6px]">
              <span id="line1" class="block h-[2px] w-6 bg-white rounded-full transition-all duration-500" style="transition-timing-function: cubic-bezier(0.76,0,0.24,1);"></span>
              <span id="line2" class="block h-[2px] w-4 bg-white rounded-full transition-all duration-500" style="transition-timing-function: cubic-bezier(0.76,0,0.24,1);"></span>
              <span id="line3" class="block h-[2px] w-6 bg-white rounded-full transition-all duration-500" style="transition-timing-function: cubic-bezier(0.76,0,0.24,1);"></span>
            </div>
          </button>
        </div>
      </nav>

      <!-- Mobile Menu Overlay -->
      <div id="mobileMenu" class="fixed inset-0 z-50 md:hidden pointer-events-none transition-all duration-700" style="transition-timing-function: cubic-bezier(0.76,0,0.24,1);">
        <!-- Backdrop -->
        <div id="menuBackdrop" class="absolute inset-0 bg-black/90 backdrop-blur-xl opacity-0 transition-opacity duration-700" style="transition-timing-function: cubic-bezier(0.76,0,0.24,1);"></div>
        <!-- Menu Content -->
        <div id="menuContent" class="relative h-full flex flex-col opacity-0 transition-all duration-700" style="transition-timing-function: cubic-bezier(0.76,0,0.24,1);">
          <!-- Mobile Menu Header -->
          <div class="flex items-center justify-between px-6 py-5">
            <a href="/" class="text-white font-semibold text-lg tracking-tight font-sans">Atelier</a>
            <button id="closeBtn" class="w-10 h-10 flex items-center justify-center" aria-label="Close menu">
              <div class="flex flex-col items-end gap-[6px]">
                <span class="block h-[2px] w-6 bg-white rounded-full transition-all duration-500" style="transform: rotate(45deg) translateY(8px); transition-timing-function: cubic-bezier(0.76,0,0.24,1);"></span>
                <span class="block h-[2px] w-6 bg-white rounded-full opacity-0 transition-all duration-500" style="transition-timing-function: cubic-bezier(0.76,0,0.24,1);"></span>
                <span class="block h-[2px] w-6 bg-white rounded-full transition-all duration-500" style="transform: rotate(-45deg) translateY(-8px); transition-timing-function: cubic-bezier(0.76,0,0.24,1);"></span>
              </div>
            </button>
          </div>
          <!-- Mobile Nav Links -->
          <div class="flex-1 flex flex-col justify-center px-8">
            <a href="#projects" class="menu-link block text-white text-4xl sm:text-5xl font-instrument-serif py-4 border-b border-white/10 transition-all duration-700 opacity-0 translate-y-8 hover:pl-4 hover:text-white/80" style="transition-timing-function: cubic-bezier(0.76,0,0.24,1);">Projects</a>
            <a href="#expertise" class="menu-link block text-white text-4xl sm:text-5xl font-instrument-serif py-4 border-b border-white/10 transition-all duration-700 opacity-0 translate-y-8 hover:pl-4 hover:text-white/80" style="transition-timing-function: cubic-bezier(0.76,0,0.24,1);">Expertise</a>
            <a href="#studio" class="menu-link block text-white text-4xl sm:text-5xl font-instrument-serif py-4 border-b border-white/10 transition-all duration-700 opacity-0 translate-y-8 hover:pl-4 hover:text-white/80" style="transition-timing-function: cubic-bezier(0.76,0,0.24,1);">Studio</a>
            <a href="#insights" class="menu-link block text-white text-4xl sm:text-5xl font-instrument-serif py-4 border-b border-white/10 transition-all duration-700 opacity-0 translate-y-8 hover:pl-4 hover:text-white/80" style="transition-timing-function: cubic-bezier(0.76,0,0.24,1);">Insights</a>
            <a href="#reach-out" class="menu-link block text-white text-4xl sm:text-5xl font-instrument-serif py-4 border-b border-white/10 transition-all duration-700 opacity-0 translate-y-8 hover:pl-4 hover:text-white/80" style="transition-timing-function: cubic-bezier(0.76,0,0.24,1);">Reach Out</a>
          </div>
          <!-- Mobile Menu Footer -->
          <div id="menuFooter" class="px-8 pb-10 opacity-0 translate-y-4 transition-all duration-700" style="transition-timing-function: cubic-bezier(0.76,0,0.24,1);">
            <button class="w-full bg-white text-black text-base font-medium py-4 rounded-full hover:bg-white/90 transition-colors duration-200">Let's Talk</button>
          </div>
        </div>
      </div>

      <!-- Hero Content -->
      <div class="flex-1 flex flex-col items-center justify-start pt-4 sm:pt-6 md:pt-8 lg:pt-10 px-6 text-center">
        <h1 class="font-instrument-serif text-white text-3xl sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl leading-[1.1] max-w-5xl">
          UX <span class="italic font-instrument-serif">and</span> APP
          <br />
          DESIGN <span class="italic font-instrument-serif">for</span> BOLD
          <br />
          VENTURES
        </h1>

        <p class="mt-4 md:mt-5 text-white/70 text-sm md:text-base font-light max-w-md leading-relaxed">
          We shape digital products that define brands
          <br class="hidden sm:block" />
          and unlock exponential growth.
        </p>

        <div class="mt-5 md:mt-6 flex flex-col sm:flex-row items-center gap-4">
          <button class="group flex items-center gap-2 bg-white text-black text-sm font-medium px-7 py-3 rounded-full hover:bg-white/90 transition-all duration-200">
            See Cases
            <svg class="w-4 h-4 group-hover:translate-x-0.5 transition-transform duration-200" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
          <button class="group flex items-center gap-2 border border-white/40 text-white text-sm font-medium px-7 py-3 rounded-full hover:bg-white/10 hover:border-white/60 transition-all duration-200">
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
            Watch Reel
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const closeBtn = document.getElementById('closeBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const menuBackdrop = document.getElementById('menuBackdrop');
    const menuContent = document.getElementById('menuContent');
    const menuFooter = document.getElementById('menuFooter');
    const menuLinks = document.querySelectorAll('.menu-link');
    const line1 = document.getElementById('line1');
    const line2 = document.getElementById('line2');
    const line3 = document.getElementById('line3');

    let menuOpen = false;

    function openMenu() {
      menuOpen = true;
      mobileMenu.classList.remove('pointer-events-none');
      mobileMenu.classList.add('pointer-events-auto');
      menuBackdrop.classList.remove('opacity-0');
      menuBackdrop.classList.add('opacity-100');
      menuContent.classList.remove('opacity-0');
      menuContent.classList.add('opacity-100');
      line1.style.transform = 'rotate(45deg) translateY(8px)';
      line1.classList.remove('w-6'); line1.classList.add('w-6');
      line2.classList.add('opacity-0'); line2.classList.remove('w-4'); line2.classList.add('w-6');
      line3.style.transform = 'rotate(-45deg) translateY(-8px)';
      menuLinks.forEach((link, index) => {
        setTimeout(() => {
          link.classList.remove('opacity-0', 'translate-y-8');
          link.classList.add('opacity-100', 'translate-y-0');
        }, 150 + index * 80);
      });
      setTimeout(() => {
        menuFooter.classList.remove('opacity-0', 'translate-y-4');
        menuFooter.classList.add('opacity-100', 'translate-y-0');
      }, 550);
    }

    function closeMenu() {
      menuOpen = false;
      mobileMenu.classList.add('pointer-events-none');
      mobileMenu.classList.remove('pointer-events-auto');
      menuBackdrop.classList.add('opacity-0');
      menuBackdrop.classList.remove('opacity-100');
      menuContent.classList.add('opacity-0');
      menuContent.classList.remove('opacity-100');
      line1.style.transform = '';
      line2.classList.remove('opacity-0', 'w-6'); line2.classList.add('w-4');
      line3.style.transform = '';
      menuLinks.forEach((link) => {
        link.classList.add('opacity-0', 'translate-y-8');
        link.classList.remove('opacity-100', 'translate-y-0');
      });
      menuFooter.classList.add('opacity-0', 'translate-y-4');
      menuFooter.classList.remove('opacity-100', 'translate-y-0');
    }

    hamburgerBtn.addEventListener('click', () => { menuOpen ? closeMenu() : openMenu(); });
    closeBtn.addEventListener('click', closeMenu);
    menuBackdrop.addEventListener('click', closeMenu);
    menuLinks.forEach(link => link.addEventListener('click', closeMenu));
  </script>
</body>
</html>
