<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VaultShield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://db.onlinewebfonts.com/c/04e6981992c0e2e7642af2074ebe3901?family=Helvetica+Now+Display+Bold" rel="stylesheet">
<style>
:root{--font-heading:'Helvetica Now Display Bold','Helvetica Neue',Helvetica,Arial,sans-serif;--font-body:'Inter',sans-serif;--color-text:#192837;--color-accent:#7342E2;--color-login-bg:#F2F2EE}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;background:#E9E5E0}
body{font-family:var(--font-body);color:var(--color-text);-webkit-font-smoothing:antialiased}
.root{position:relative;width:100%;min-height:100vh;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:linear-gradient(160deg,#ece8e3,#d9d3ce)}
.wrap{position:relative;z-index:10;max-width:1280px;margin:0 auto}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 32px}
.logo{display:block;width:32px;height:32px}
.links{display:none;gap:40px;position:absolute;left:50%;transform:translateX(-50%)}
.links a{font-size:.875rem;font-weight:500;color:inherit;text-decoration:none;transition:opacity .2s}
.links a:hover{opacity:.6}
.right{display:none;gap:10px}
.btn{border:0;border-radius:9999px;padding:10px 20px;font:500 .875rem var(--font-body);cursor:pointer;color:var(--color-text);background:var(--color-login-bg)}
.btn.p{background:var(--color-accent);color:#fff}
.burger{background:none;border:0;cursor:pointer;color:var(--color-text);display:flex;padding:4px}
@media(min-width:768px){.links,.right{display:flex}.burger{display:none}}
@media(max-width:639px){nav{padding:16px 20px}}
.hero{padding:clamp(40px,8vw,72px) 32px 80px}
@media(max-width:639px){.hero{padding-left:20px;padding-right:20px}}
.inner{max-width:560px}
.fu{opacity:0;transform:translateY(28px);animation:fu .6s cubic-bezier(.22,1,.36,1) forwards}
@keyframes fu{to{opacity:1;transform:none}}
h1{font-family:var(--font-heading);font-weight:700;font-size:clamp(1.65rem,5vw,3rem);line-height:1.05;letter-spacing:-.01em;margin-bottom:24px;color:#192837}
h1 svg{width:24px;height:24px;vertical-align:middle;position:relative;top:-2px;margin:0 4px}
h1 svg:first-child{margin-left:0}
p.sub{font-size:clamp(.9rem,2.5vw,1.1rem);line-height:1.65;opacity:.8;max-width:560px;margin-bottom:32px}
.cta{display:inline-flex;align-items:center;justify-content:space-between;gap:32px;min-width:210px;background:var(--color-accent);color:#fff;border:0;border-radius:50px;padding:17px 24px;font:600 clamp(.9rem,2vw,1rem) var(--font-body);box-shadow:0 4px 24px rgba(115,66,226,.28);cursor:pointer;transition:transform .2s,filter .2s}
.cta:hover{transform:scale(1.04);filter:brightness(1.1)}
.cta:active{transform:scale(.96)}
.cta svg{width:20px;height:20px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bd{position:fixed;inset:0;background:rgba(25,40,55,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:40;opacity:0;pointer-events:none;transition:opacity .45s}
#sheet{position:fixed;right:0;top:0;width:min(88vw,360px);height:100dvh;background:#CFC8C5;box-shadow:-12px 0 48px rgba(25,40,55,.18);z-index:50;transform:translateX(100%);transition:transform .45s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;padding:20px}
body.open #bd{opacity:1;pointer-events:auto}
body.open #sheet{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid rgba(25,40,55,.15)}
.sl{display:flex;flex-direction:column;gap:6px;padding:24px 0;flex:1}
.sl a{font:700 1.75rem var(--font-heading);color:inherit;text-decoration:none;padding:8px 0;opacity:0;transform:translateX(24px);transition:opacity .4s,transform .4s cubic-bezier(.22,1,.36,1)}
body.open .sl a{opacity:1;transform:none}
.sb{display:flex;flex-direction:column;gap:10px}
.sb .btn{padding:14px 20px;font-size:1rem}
</style>
</head>
<body>
<div class="root">
<video class="bg" autoplay muted loop playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260518_003132_8b7edcb6-c64d-4a52-a9ca-879942e122ad.mp4"></video>
<div class="wrap">
<nav>
<svg class="logo" xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" overflow="visible" viewBox="0 0 256 256"><path d="M 64 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 L 128 64 L 128 64.5 L 161 32 L 192 0 L 256 0 L 256 64 L 192 128 L 128 128 L 128 192 L 96 223 L 63.5 256 L 0 256 L 0 192 Z M 256 192 L 224 223 L 191.5 256 L 128 256 L 128 192 L 192 128 L 256 128 Z" fill="#192837"/></svg>
<div class="links"><a href="#">Vault</a><a href="#">Plans</a><a href="#">Install</a><a href="#">News</a><a href="#">Help</a></div>
<div class="right"><button class="btn p">Start For Free</button><button class="btn">Sign In</button></div>
<button class="burger" id="mb" aria-label="Open menu"><svg class="i" width="24" height="24" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</nav>
<div class="hero"><div class="inner">
<h1 class="fu" style="animation-delay:0s">
<svg class="i" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>Lock Down Your Passwords <svg class="i" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><circle cx="12" cy="16" r="1"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> with Ironclad Security <svg class="i" viewBox="0 0 24 24"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>
</h1>
<p class="sub fu" style="animation-delay:.15s">Zero stress, total control. VaultShield keeps you covered with unbreakable storage, one-tap access, and pro-grade tools for your non-stop world.</p>
<button class="cta fu" style="animation-delay:.3s">Get It Free <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="m12 16 4-4-4-4"/></svg></button>
</div></div>
</div>
</div>
<div id="bd"></div>
<aside id="sheet" aria-hidden="true">
<div class="sh"><svg width="32" height="32" fill="none" viewBox="0 0 256 256"><path d="M 64 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 L 128 64 L 128 64.5 L 161 32 L 192 0 L 256 0 L 256 64 L 192 128 L 128 128 L 128 192 L 96 223 L 63.5 256 L 0 256 L 0 192 Z M 256 192 L 224 223 L 191.5 256 L 128 256 L 128 192 L 192 128 L 256 128 Z" fill="#192837"/></svg>
<button class="burger" id="cb" aria-label="Close menu"><svg class="i" width="24" height="24" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
<div class="sl"><a href="#">Vault</a><a href="#">Plans</a><a href="#">Install</a><a href="#">News</a><a href="#">Help</a></div>
<div class="sb"><button class="btn p">Start For Free</button><button class="btn">Sign In</button></div>
</aside>
<script>
document.querySelectorAll('.sl a').forEach(function(a,i){a.style.transitionDelay=(0.18+i*0.07)+'s'});
function t(o){document.body.classList.toggle('open',o);document.getElementById('sheet').setAttribute('aria-hidden',!o)}
document.getElementById('mb').onclick=function(){t(true)};
document.getElementById('cb').onclick=function(){t(false)};
document.getElementById('bd').onclick=function(){t(false)};
</script>
</body>
</html>
