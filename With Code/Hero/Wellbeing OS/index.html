<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flowpath</title>
<style>
@font-face{font-family:"Helvetica Now Text";src:url("https://db.onlinewebfonts.com/c/08e020de1811ec4489f82d1247a42c09?family=Helvetica+Now+Text");font-display:swap}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Helvetica Now Text",-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
html,body{background:#000;color:#fff;overflow-x:hidden}
a,button{color:inherit;text-decoration:none;background:none;border:0;cursor:pointer;font:inherit}
.liquid-glass{background:rgba(255,255,255,.01);background-blend-mode:luminosity;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.1);position:relative;overflow:hidden}
.liquid-glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
@keyframes dropdown-in{from{opacity:0;transform:translateY(-4px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
section{position:relative;height:100vh;height:100svh;width:100%;overflow:hidden;display:flex;flex-direction:column}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.1)}
nav{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:500;letter-spacing:-.025em}
.desk{display:none;align-items:center}
.items{gap:4px}
.dd{position:relative}
.nb{display:flex;align-items:center;gap:4px;padding:8px 14px;font-size:14px;font-weight:500;color:rgba(255,255,255,.9)}
.nb:hover{color:#fff}
.nb svg{width:14px;height:14px;transition:transform .2s}
.dd.open .nb svg{transform:rotate(180deg)}
.menu{display:none;position:absolute;top:100%;left:0;border-radius:12px;padding:12px 8px;min-width:160px;box-shadow:0 20px 25px -5px rgba(0,0,0,.4);z-index:30;animation:dropdown-in .2s ease-out}
.dd.open .menu{display:block}
.menu a{display:block;padding:8px 12px;font-size:14px;color:rgba(255,255,255,.8);border-radius:8px}
.menu a:hover{color:#fff;background:rgba(255,255,255,.05)}
.right{gap:16px}
.right .login{font-size:14px;font-weight:500;color:rgba(255,255,255,.9)}
.right .try{border-radius:999px;padding:8px 20px;font-size:14px;font-weight:500}
.mb{display:block;position:relative;width:24px;height:24px}
.mb svg{position:absolute;inset:0;width:24px;height:24px;transition:all .3s}
.mb .x{opacity:0;transform:rotate(-90deg) scale(.5)}
.mb.open .x{opacity:1;transform:none}
.mb.open .m{opacity:0;transform:rotate(90deg) scale(.5)}
.mm{position:absolute;top:100%;left:16px;right:16px;margin-top:4px;background:rgba(44,34,28,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:16px;padding:24px;opacity:0;transform:translateY(-12px);pointer-events:none;transition:all .4s cubic-bezier(.16,1,.3,1);z-index:40;max-height:calc(100svh - 80px);overflow:auto}
.mm.open{opacity:1;transform:none;pointer-events:auto}
.mm .g{margin-bottom:12px}
.mm .t{color:#fff;font-size:15px;font-weight:500;padding:6px 0;display:block}
.mm .s{display:block;padding:5px 0 5px 16px;font-size:14px;color:rgba(255,255,255,.7)}
.mm .f{border-top:1px solid rgba(255,255,255,.15);margin-top:12px;padding-top:16px;display:flex;flex-direction:column;gap:12px}
.mm .f .try{border-radius:999px;padding:10px 20px;text-align:center;font-size:14px;font-weight:500}
.hero{position:relative;z-index:10;flex:1;display:flex;align-items:flex-start;justify-content:center;padding:64px 20px 0}
.tw{text-align:center;max-width:48rem}
h1{font-weight:400;font-size:30px;line-height:1.05;letter-spacing:-.02em}
h1 .d{color:rgba(255,255,255,.6)}
.sub{color:rgba(255,255,255,.8);font-size:14px;line-height:1.625;max-width:28rem;margin:24px auto 0}
.cta{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin-top:24px}
.cta a{border-radius:999px;font-size:14px;font-weight:600;padding:10px 20px}
.cta .w{background:#fff;color:#111827}
.cta .w:hover{background:rgba(255,255,255,.9)}
.cta .gl{color:#fff}
.cta .gl:hover{background:rgba(255,255,255,.1)}
@media(min-width:640px){nav{padding:20px 24px}.logo{font-size:20px}.hero{padding-top:80px}h1{font-size:36px}.sub{font-size:16px;margin-top:32px}.cta{gap:16px;margin-top:32px}.cta a{padding:12px 24px}}
@media(min-width:768px){nav{padding:20px 48px}.desk{display:flex}.mb{display:none}.hero{padding-top:96px}h1{font-size:48px}.sub{font-size:18px}.mm{display:none}}
@media(min-width:1024px){nav{padding:20px 64px}h1{font-size:60px}}
@media(min-width:1280px){h1{font-size:72px}}
</style>
</head>
<body>
<section>
<video autoplay muted loop playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260703_053131_1ec3dd1c-d627-44fb-ab20-6e1fce41b0d5.mp4"></video>
<div class="ov"></div>
<nav>
  <a class="logo" href="#"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M14 2 L26 14 L14 26 L2 14 Z" fill="#fff" fill-opacity=".9"/><path d="M14 8 L20 14 L14 20 L8 14 Z" fill="#fff" fill-opacity=".5"/></svg><span>flowpath</span></a>
  <div class="desk items" id="items"></div>
  <div class="desk right"><a class="login" href="#">Log in</a><a class="try liquid-glass" href="#" style="color:#fff">Try it free</a></div>
  <button class="mb" id="mb" aria-label="Menu">
    <svg class="m" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    <svg class="x" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="mm" id="mm"></div>
</nav>
<div class="hero"><div class="tw">
  <h1>Bridge the<br>gaps. <span class="d">Ditch the</span><br><span class="d">grindwork.</span></h1>
  <p class="sub">Flowpath unifies your complete wellness tools, so your crew spends less energy plugging gaps and more on real progress.</p>
  <div class="cta"><a class="w" href="#">Begin your journey</a><a class="gl liquid-glass" href="#">See it live</a></div>
</div></div>
</section>
<script>
var N=[["Product",["Connections","Workflows","Insights"]],["Solutions",["Guides","Use cases","API reference"]],["About",["Our story","Open roles","Reach us"]],["Plans",null]];
var chev='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
var it=document.getElementById('items'),mm=document.getElementById('mm'),h='';
N.forEach(function(n){
  var d=document.createElement('div');d.className='dd';
  if(n[1]){d.innerHTML='<button class="nb">'+n[0]+chev+'</button><div class="menu liquid-glass">'+n[1].map(function(s){return '<a href="#">'+s+'</a>'}).join('')+'</div>';
    d.onmouseenter=function(){d.classList.add('open')};d.onmouseleave=function(){d.classList.remove('open')};}
  else d.innerHTML='<a class="nb" href="#">'+n[0]+'</a>';
  it.appendChild(d);
  h+='<div class="g"><a class="t" href="#">'+n[0]+'</a>'+(n[1]?n[1].map(function(s){return '<a class="s" href="#">'+s+'</a>'}).join(''):'')+'</div>';
});
mm.innerHTML=h+'<div class="f"><a class="t" href="#">Log in</a><a class="try liquid-glass" href="#" style="color:#fff">Try it free</a></div>';
var mb=document.getElementById('mb');
mb.onclick=function(){mb.classList.toggle('open');mm.classList.toggle('open')};
</script>
</body>
</html>
