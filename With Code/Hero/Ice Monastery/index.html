:root{--ink:#14182A;--lilac-1:#E1DEDF;--lilac-2:#C3C3CD;--lilac-3:#AFB8CA}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--lilac-2)}
body{background:linear-gradient(180deg,var(--lilac-1) 0%,var(--lilac-3) 100%) fixed;font-family:'Jost',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.dive{position:relative;height:420vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.card{position:absolute;inset:0;overflow:hidden;background:var(--lilac-2);transform-origin:50% 50%;opacity:0;transition:opacity .9s ease-out}
.ready .card{opacity:1}
.frame{position:absolute;left:50%;top:0;width:max(100%,177.78vh);width:max(100%,177.78svh);aspect-ratio:16/9;transform:translateX(-50%)}
.layer{position:absolute;left:0;top:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;will-change:transform}
.cave{position:absolute;inset:0}
.cave-in{position:absolute;inset:0;transform-origin:50% 50%}
.nav{position:absolute;left:0;right:0;bottom:clamp(14px,3.4vh,34px);display:flex;align-items:center;justify-content:center;gap:clamp(18px,4.2vw,64px);z-index:5}
.nav a{font-size:clamp(11px,.78vw,12.5px);letter-spacing:.34em;text-transform:uppercase;color:var(--ink);text-decoration:none;padding:6px 0;white-space:nowrap;text-shadow:0 0 6px rgba(240,238,244,.95),0 0 14px rgba(225,222,236,.9),0 0 22px rgba(225,222,236,.7)}
.nav .logo{display:block;width:clamp(36px,3.1vw,48px);padding:6px 0;margin:-6px 0}
.nav .logo svg{display:block;width:100%;height:auto;filter:drop-shadow(0 0 4px rgba(240,238,244,.95)) drop-shadow(0 0 10px rgba(225,222,236,.85))}
.nav>*{opacity:0;transform:translateY(10px)}
.ready .nav>*{animation:rise 1s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(.25s + var(--i)*.07s)}
@keyframes rise{to{opacity:1;transform:none}}
@media (max-width:820px){
  .nav{flex-wrap:wrap;row-gap:6px;column-gap:clamp(14px,5vw,26px);padding:0 16px;bottom:max(14px,env(safe-area-inset-bottom))}
  .nav .logo{order:-1;flex-basis:100%;display:flex;justify-content:center;margin:0}
  .nav .logo svg{width:40px}
  .nav a{letter-spacing:.24em;padding:8px 0}
}
@media (max-height:480px) and (orientation:landscape){
  .nav{flex-wrap:nowrap;gap:clamp(10px,2.6vw,22px);bottom:10px}
  .nav .logo{order:0;flex-basis:auto}
  .nav .logo svg{width:34px}
  .nav a{letter-spacing:.2em;padding:6px 0}
}
@media (prefers-reduced-motion:reduce){
  .dive{height:100vh;height:100svh}
  .card,.nav>*{transition:none;animation:none!important;opacity:1;transform:none}
}
</style>

    {k:'stairs',f:'050711_a8f1e754-6cb0-4763-b6a4-e7acd19f6d16', y:[0,-.1,-.6]},
    {k:'hall',  f:'032131_a39a98b6-be3d-473c-a0a1-5ad2850557e7', y:[0,-.1,-.6]},
    // the lower stair bands (with their monks) ride IN FRONT of the hall and the upper stairs, so no monk is ever cut
    {k:'stairs2',f:'050711_a8f1e754-6cb0-4763-b6a4-e7acd19f6d16', y:[0,-.15,-.63], top:66, fade:5, fk:40},
    {k:'people2',f:'050913_015b6505-badf-4834-b44e-dca4af03c966', y:[0,-.15,-.63], mask:'linear-gradient(to bottom,transparent 66.8%,#000 67.2%,#000 67.5%,transparent 68%)'},
    {k:'stairs3',f:'050711_a8f1e754-6cb0-4763-b6a4-e7acd19f6d16', y:[0,-.2,-.66], top:72, fade:7, fk:30},
    {k:'people3',f:'050913_015b6505-badf-4834-b44e-dca4af03c966', y:[0,-.2,-.66], mask:'linear-gradient(to bottom,transparent 67.5%,#000 68%)'},
    {k:'larch', f:'032234_5b1a89ba-826e-4bdd-9416-0faf5b650f82', y:[0,-.2,-.8], dx:.07, fade:30},
    {k:'pav',   f:'032301_6b8aa813-522f-412c-b90d-0bfaf40c7590', y:[0,-.2,-.85], fade:14},
    {k:'mid',   f:'032324_f9cb6fb0-9f9d-4f42-adcb-cfeae0e153da', y:[0,-.27,-.95], dx:.05, fade:18},
    {k:'near',  f:'032346_c94ad70e-0a0f-4a4e-99f8-39e0200da791', y:[0,-.36,-1.2], dx:.06, fade:34}
  ];
  var CAVE=[
    {k:'lake',  f:'032412_9f658303-9bca-4653-a7e8-7fcb3788f887'},
  ];
  var WALLS={k:'walls', f:'032423_d01ee5a9-9ec6-424c-93bb-9972ecf2f3cf'};
  var FLAGS={k:'flags', f:'032437_291e3d42-e769-437c-abcf-ecf2965a8feb', y:[.14,.14,0], o:1, oAt:[.55,.9], mask:'linear-gradient(to bottom,transparent 1%,#000 13%)'};
  var CAVE_GROUP={y:[.22,.2,0], s:[.8,.8,1]};          // the whole cave interior (origin: frame centre)
  var ARCH={k:'arch', f:'025152_784dec8b-ad51-476d-9e19-dbca11ca8d01', y:[1,.16,-.07], s:[1,1,1.75]};   // origin: bottom centre
  var ARCH_SEAL=.6;   // in the arch image: the rock band spans .44-.61, the opening starts below .61
  var UB=.42;         // where stage B falls on the continuous A->C path

  var doc=document.documentElement, dive=document.getElementById('dive'), card=document.getElementById('card'), frame=document.getElementById('frame');
  function img(src,parent,clip){var i=new Image();i.className='layer';i.alt='';i.decoding='async';i.src=src;if(clip)i.style.clipPath=clip;parent.appendChild(i);return i}
  function mk(L,parent){var s=IMG(L.f);
    // tree layers split into a left and a right half that each sit a little further out
    L.els=L.dx?[img(s,parent,'inset(0 50% 0 0)'),img(s,parent,'inset(0 0 0 50%)')]:[img(s,parent)];
    if(L.mask)L.els.forEach(function(e){e.style.webkitMaskImage=e.style.maskImage=L.mask});
    L.el=L.els[0];L.sx=L.dx?[-L.dx*100,L.dx*100]:[0]}
  MON.forEach(function(L){mk(L,frame)});
  var cave=document.createElement('div');cave.className='cave';frame.appendChild(cave);
  var caveIn=document.createElement('div');caveIn.className='cave-in';cave.appendChild(caveIn);
  CAVE.forEach(function(L){mk(L,caveIn)});
  mk(WALLS,cave);
  mk(ARCH,frame);ARCH.el.style.transformOrigin='50% 100%';
  mk(FLAGS,frame);
  var ALL=MON.concat(CAVE,[WALLS,ARCH,FLAGS]);

  var shown=false;function show(){if(shown)return;shown=true;doc.classList.add('ready')}
  Promise.all(ALL.map(function(L){return L.el.decode?L.el.decode().catch(function(){}):Promise.resolve()})).then(show);
  setTimeout(show,5000);

  var clamp=function(v,a,b){return v<a?a:v>b?b:v};
  var seg=function(p,a,b){return clamp((p-a)/(b-a),0,1)};
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var vh=card.clientHeight, fh=frame.offsetHeight;

  // one smooth curve through the three keys [A,B,C] at u = 0, UB, 1: monotone cubic Hermite, zero speed at both ends,
  // continuous speed through B (nothing stops at B, nothing overshoots)
  function key(k,u){if(!k)return 0;var a=k[0],b=k[1],c=k[2],h0=UB,h1=1-UB,d0=(b-a)/h0,d1=(c-b)/h1;
    var m1=(d0*d1>0)?(h0+h1)/(h0/d0+h1/d1):0;
    var p0,p1,m0,m2,h,t;
    if(u<=UB){p0=a;p1=b;m0=0;m2=m1;h=h0;t=u/h0}else{p0=b;p1=c;m0=m1;m2=0;h=h1;t=(u-UB)/h1}
    var t2=t*t,t3=t2*t;return (2*t3-3*t2+1)*p0+(t3-2*t2+t)*h*m0+(-2*t3+3*t2)*p1+(t3-t2)*h*m2}

  function render(p){
    var u=seg(p,.03,.97), tC=seg(u,UB,1);

    // a 16:9 frame taller than the viewport pans from its top (stage A) towards the lake (stage B on)
    var spare=Math.min(0,vh-fh);
    frame.style.transform='translate3d(-50%,'+(spare*.6*key([0,1,1],u)).toFixed(2)+'px,0)';

    for(var i=0;i<ALL.length;i++){var L=ALL[i];if(L===ARCH)continue;var y=key(L.y,u);
      if(L.fade){var f=L.fade*Math.min(1,-y*(L.fk||6)),tp=L.top?'transparent '+L.top+'%,#000 '+(L.top+1.2)+'%,':'#000 0%,';
        var fm=(f>0||L.top)?'linear-gradient(to bottom,'+tp+'#000 '+(100-f).toFixed(2)+'%,'+(f>0?'transparent':'#000')+' 100%)':'none';
        for(var q=0;q<L.els.length;q++)L.els[q].style.webkitMaskImage=L.els[q].style.maskImage=fm}
      for(var j=0;j<L.els.length;j++)L.els[j].style.transform='translate3d('+L.sx[j]+'%,'+(y*100).toFixed(3)+'%,0)';
      if(L.o)L.el.style.opacity=seg(u,L.oAt[0],L.oAt[1]).toFixed(3)}

    // the arch: rises, then zooms from its base so its opening becomes the cave frame
    var ay=key(ARCH.y,u), as=key(ARCH.s,u);
    ARCH.el.style.transform='translate3d(0,'+(ay*100).toFixed(3)+'%,0) scale('+as.toFixed(4)+')';
    // its bottom edge dissolves into the cave walls once its base lifts off the frame bottom
    var fb=26*seg(tC,0,.35);
    ARCH.el.style.webkitMaskImage=ARCH.el.style.maskImage=fb>0?'linear-gradient(to bottom,#000 '+(100-fb).toFixed(2)+'%,transparent 100%)':'none';

    // the cave interior rises into the middle and zooms in
    caveIn.style.transform='translate3d(0,'+(key(CAVE_GROUP.y,u)*100).toFixed(3)+'%,0) scale('+key(CAVE_GROUP.s,u).toFixed(4)+')';
    // ...and is only seen through the arch opening: a soft gradient that follows the moving, zooming arch
    var seal=(1+(ARCH_SEAL-1)*as+ay)*100, feather=11*as;
    var m='linear-gradient(to bottom,transparent '+(seal-feather).toFixed(2)+'%,#000 '+seal.toFixed(2)+'%)';
    cave.style.webkitMaskImage=cave.style.maskImage=m;
    cave.style.visibility=seal-feather>=100?'hidden':'visible';
  }
  window.__render=render;

  function measure(){vh=card.clientHeight;fh=frame.offsetHeight}
  if(reduce){render(.42);window.addEventListener('resize',function(){measure();render(.42)});return}

  var lenis=window.Lenis?new Lenis({lerp:.085,wheelMultiplier:.9,smoothWheel:true}):null;
  function progress(){var y=lenis?lenis.scroll:window.scrollY;var max=dive.offsetHeight-window.innerHeight;return max>0?clamp((y-dive.offsetTop)/max,0,1):0}
  var last=-1;
  function loop(now){if(lenis)lenis.raf(now);var p=progress();if(Math.abs(p-last)>1e-5){render(p);last=p}requestAnimationFrame(loop)}
  render(0);requestAnimationFrame(loop);
  window.addEventListener('resize',function(){measure();last=-1});
})();
</script>
</body>
