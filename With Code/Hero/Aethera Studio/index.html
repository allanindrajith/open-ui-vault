<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aethera Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;color:#000;font-family:'Inter',system-ui,sans-serif;overflow-x:hidden}
.wrap{position:relative;min-height:100vh;width:100%;overflow:hidden;background:#fff}
video{position:absolute;top:300px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 300px);object-fit:cover;opacity:0;z-index:0}
.overlay{position:absolute;inset:0;z-index:0;background:linear-gradient(to bottom,#fff,transparent,#fff);pointer-events:none}
nav{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:24px 32px;max-width:80rem;margin:0 auto}
.logo{font-family:'Instrument Serif',serif;font-size:1.875rem;line-height:2.25rem;letter-spacing:-.025em;color:#000}
.logo sup{font-size:.5em;vertical-align:super;line-height:0}
.menu{display:none;gap:32px;list-style:none}
.menu a{font-size:.875rem;color:#6F6F6F;text-decoration:none;transition:color .2s}
.menu a:hover,.menu a.on{color:#000}
.btn{background:#000;color:#fff;border:0;border-radius:9999px;font-family:inherit;cursor:pointer;transition:transform .2s}
.btn:hover{transform:scale(1.03)}
.btn.sm{padding:10px 24px;font-size:.875rem}
.btn.lg{padding:20px 56px;font-size:1rem;margin-top:48px}
.hero{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(8rem - 75px) 24px 160px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:3rem;line-height:.95;letter-spacing:-2.46px;max-width:80rem;color:#000}
h1 em{font-style:italic;color:#6F6F6F}
.desc{font-size:1rem;line-height:1.625;max-width:42rem;margin-top:32px;color:#6F6F6F}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.r1{animation:rise .8s ease-out both}
.r2{animation:rise .8s ease-out .2s both}
.r3{animation:rise .8s ease-out .4s both}
@media(min-width:640px){h1{font-size:4.5rem}.desc{font-size:1.125rem}}
@media(min-width:768px){h1{font-size:6rem}.menu{display:flex}}
@media(max-width:420px){h1{letter-spacing:-1.5px}.btn.lg{padding:18px 44px}nav{padding:24px 20px}}
</style>
</head>
<body>
<div class="wrap">
  <video id="bg" muted playsinline preload="auto" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_083109_283f3553-e28f-428b-a723-d639c617eb2b.mp4"></video>
  <div class="overlay"></div>
  <nav>
    <div class="logo">Aethera<sup>®</sup></div>
    <ul class="menu">
      <li><a class="on" href="#">Home</a></li>
      <li><a href="#">Studio</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Journal</a></li>
      <li><a href="#">Reach Us</a></li>
    </ul>
    <button class="btn sm">Begin Journey</button>
  </nav>
  <section class="hero">
    <h1 class="r1">Beyond <em>silence,</em> we build <em>the eternal.</em></h1>
    <p class="desc r2">Building platforms for brilliant minds, fearless makers, and thoughtful souls. Through the noise, we craft digital havens for deep work and pure flows.</p>
    <button class="btn lg r3">Begin Journey</button>
  </section>
</div>
<script>
(function(){
  var v=document.getElementById('bg'),F=0.5,restarting=false;
  function tick(){
    var d=v.duration,t=v.currentTime,o=0;
    if(d&&isFinite(d)&&!restarting){
      if(t<F)o=t/F;else if(t>d-F)o=Math.max(0,(d-t)/F);else o=1;
    }
    v.style.opacity=o;
    requestAnimationFrame(tick);
  }
  v.addEventListener('ended',function(){
    v.style.opacity=0;restarting=true;
    setTimeout(function(){v.currentTime=0;var p=v.play();if(p&&p.catch)p.catch(function(){});restarting=false;},100);
  });
  var p=v.play();if(p&&p.catch)p.catch(function(){});
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
