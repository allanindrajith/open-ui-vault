<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alwayzz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&family=Cedarville+Cursive&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--text:#0a0a0a;--muted:#6b6b6b;--button-bg:#0a0a0a;--button-text:#fff;--border-soft:rgba(0,0,0,.08);--green:#17c964}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;letter-spacing:-.04em;overflow-x:hidden}
button{font:inherit;letter-spacing:inherit;cursor:pointer;border:0;background:none;color:inherit}
.serif{font-family:'Source Serif 4',Georgia,serif;font-style:italic;font-weight:600;letter-spacing:-.08em}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:19px 36px;max-width:1200px;margin:0 auto}
.logo{font-family:'Source Serif 4',serif;font-size:30px;font-weight:600;font-style:italic;letter-spacing:-.08em}
.logo sup{font-family:Inter;font-style:normal;font-size:14px;font-weight:600;letter-spacing:0;vertical-align:baseline;position:relative;top:-.3em}
.menu{display:flex;align-items:center;gap:6px;background:var(--button-bg);color:#fff;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:500;position:relative;z-index:201}
.menu svg{width:16px;height:16px;transition:transform .3s}
.drawer-open .menu svg{transform:rotate(180deg)}
.drawer{position:fixed;inset:0;background:#fff;z-index:200;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .4s}
.drawer-open .drawer{opacity:1;pointer-events:auto}
.drawer a{font-size:48px;font-weight:500;letter-spacing:-.04em;color:var(--text);text-decoration:none;line-height:1.15}
.drawer small{position:absolute;bottom:28px;color:var(--muted);font-size:13px;letter-spacing:0}
.hero{position:relative;min-height:850px;padding:160px 36px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:#fff}
.hero::before{content:"";position:absolute;inset:0;background:url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260626_041422_4a459e05-abce-4150-9fb7-4ededc423cd1.png&w=1280&q=85") center/cover no-repeat;background-color:#fff}
.hero>*{position:relative;z-index:2}
.lines{position:absolute!important;inset:0;z-index:1!important;pointer-events:none}
.lines i{position:absolute;top:0;bottom:0;border:2.5px solid #FCFAF8;opacity:0;animation:line-pulse 5s ease-in-out infinite}
.lines.l i{left:0;border-left:0;border-radius:0 80% 80% 0}
.lines.r i{right:0;border-right:0;border-radius:80% 0 0 80%}
.lines.l i{transform-origin:left center}.lines.r i{transform-origin:right center}
.lines.t{display:none}
@keyframes line-pulse{0%{opacity:0;transform:scale(1)}15%{opacity:.9}70%{opacity:.4}100%{opacity:0;transform:scale(.85)}}
@keyframes marquee-left{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.mask{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 12%,#000 88%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 12%,#000 88%,transparent 100%)}
.track{display:flex;width:max-content;animation:marquee-left 30s linear infinite}
.ticker{max-width:500px;width:100%;height:36px;margin-bottom:34px}
.ticker .track{align-items:center;height:36px}
.ticker span{font-size:13px;font-weight:500;color:var(--muted);padding:6px 14px;border-radius:999px;background:rgb(251,251,251);margin-right:14px;white-space:nowrap;letter-spacing:-.02em}
h1{max-width:550px;font-size:82px;line-height:1.03;letter-spacing:-.07em;font-weight:600}
h1 sup{font-family:Inter;font-size:24px;font-weight:600;font-style:normal;vertical-align:super;letter-spacing:0;line-height:0}
.sub{max-width:476px;font-size:17px;line-height:1.45;font-weight:400;color:var(--muted);margin-top:26px;letter-spacing:-.03em}
.cta{display:flex;gap:16px;justify-content:center;align-items:center;margin-top:34px}
.primary{height:56px;padding:18px 30px;border-radius:999px;background:var(--button-bg);color:#fff;font-size:15px;font-weight:600;transition:transform .2s,box-shadow .2s}
.primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.12)}
.book{display:flex;align-items:center;gap:12px;background:#fff;border:4px solid rgb(248,248,248);border-radius:999px;padding:8px 24px 8px 8px;text-align:left}
.book img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#ddd}
.book b{display:block;font-size:14px;font-weight:600;color:#000;letter-spacing:-.03em}
.book em{display:flex;align-items:center;gap:6px;font-style:normal;font-size:12px;font-weight:500;color:rgb(152,152,152);letter-spacing:-.02em}
.book em:before{content:"";width:8px;height:8px;border-radius:50%;background:rgb(29,204,93)}
.blur{position:absolute!important;left:0;right:0;bottom:0;height:178px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.4) 40%,#fff);z-index:3!important;pointer-events:none}
.trusted{display:flex;align-items:center;gap:40px;padding:36px;max-width:1200px;margin:0 auto}
.trusted p{max-width:163px;flex:none;font-size:14px;font-weight:500;color:var(--muted);line-height:1.2}
.trusted .mask{flex:1;min-width:0}
.trusted .track span{font-size:16px;font-weight:600;color:#000;margin-right:48px;white-space:nowrap;letter-spacing:-.02em}
@media(max-width:1199px){.hero{padding:140px 32px}h1{font-size:clamp(60px,8vw,72px)}.nav{padding:19px 32px}.drawer a{font-size:40px}}
@media(max-width:809px){
.hero{min-height:760px;padding:120px 24px 96px}
.hero::before{inset:auto;top:50%;left:50%;width:max(100vh,760px);height:100vw;width:760px;height:100vw;transform:translate(-50%,-50%) rotate(90deg);width:max(760px,100%);}
.hero::before{width:760px;height:100vw;min-width:0}
h1{font-size:clamp(44px,13vw,52px)}
.lines.l,.lines.r{display:none}
.lines.t{display:block}
.lines.t i{top:0;left:0;right:0;bottom:auto;border:0;border-bottom:2.5px solid #FCFAF8;border-radius:0 0 80% 80%;transform-origin:center top}
.cta{flex-direction:column;width:100%;max-width:320px}
.cta>*{width:100%}.book{justify-content:flex-start}.primary{display:flex;align-items:center;justify-content:center}
.trusted{flex-direction:column;align-items:flex-start;gap:20px;padding:36px 24px}.trusted .mask{width:100%}
.drawer a{font-size:32px}.nav{padding:20px}}
</style>
</head>
<body>
<header class="nav">
  <div class="logo">Alwayzz<sup>®</sup></div>
  <button class="menu" id="menu" aria-expanded="false">Menu <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></button>
</header>
<nav class="drawer" id="drawer">
  <a href="#">Projects</a><a href="#">Plans</a><a href="#">Team</a><a href="#">FAQs</a><a href="#">Get in Touch</a>
  <small>© 2026 Alwayzz. All rights reserved.</small>
</nav>
<section class="hero">
  <div class="lines l" id="ll"></div><div class="lines r" id="lr"></div><div class="lines t" id="lt"></div>
  <div class="ticker mask"><div class="track" id="tick"></div></div>
  <h1>Premium creative <span class="serif">alwayzz</span><sup>®</sup> on demand.</h1>
  <p class="sub">A flexible design partnership for founders, brands, and agencies who want top craft delivered on their timeline.</p>
  <div class="cta">
    <button class="primary">View Plans</button>
    <button class="book"><img src="https://framerusercontent.com/images/hfneFL6CHBi5BnNvCeOaqU9HqE4.png" alt=""><span><b>Chat for 15 minutes</b><em>Pick a slot</em></span></button>
  </div>
  <div class="blur"></div>
</section>
<section class="trusted">
  <p>Partnered with top-tier companies globally</p>
  <div class="mask"><div class="track" id="logos"></div></div>
</section>
<script>
(function(){
  var b=document.body;
  document.getElementById('menu').onclick=function(){b.classList.toggle('drawer-open');this.setAttribute('aria-expanded',b.classList.contains('drawer-open'))};
  document.querySelectorAll('.drawer a').forEach(function(a){a.onclick=function(e){e.preventDefault();b.classList.remove('drawer-open')}});
  function lines(id,horiz){var h='';for(var i=0;i<20;i++){var s=horiz?'height:'+(60+i*10)+'px':'width:'+(60+i*10)+'px';h+='<i style="'+s+';animation-delay:'+(i*.25)+'s"></i>'}document.getElementById(id).innerHTML=h}
  lines('ll');lines('lr');lines('lt',true);
  var items=['Brand Identity','App Development','Visual Design','Creative Video','Iconography'];
  var t='';for(var k=0;k<4;k++)items.forEach(function(x){t+='<span>'+x+'</span>'});
  document.getElementById('tick').innerHTML=t;
  var logos=[['Airbnb',"'Cedarville Cursive',cursive",700],['Shopify','system-ui',800],['Notion','Georgia,serif',500],['Linear','Inter',600],['Webflow','Inter',700],['Figma','system-ui',600],['Slack','Georgia,serif',700],['Stripe','system-ui',800],['Vercel','Inter',600],['Framer',"'Source Serif 4',serif",600]];
  var l='';for(var j=0;j<4;j++)logos.forEach(function(x){l+='<span style="font-family:'+x[1]+';font-weight:'+x[2]+'">'+x[0]+'</span>'});
  document.getElementById('logos').innerHTML=l;
})();
</script>
</body>
</html>
