<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Measured</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
html,body{height:100%;overflow:hidden;background:#fff}
button{background:none;border:0;cursor:pointer;color:inherit}
.liquid-glass{background:rgba(255,255,255,.01);background-blend-mode:luminosity;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.1);position:relative;overflow:hidden}
.liquid-glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.hero{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#000;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.layer{position:absolute;inset:0}
#grid{z-index:0;opacity:.1;width:100%;height:100%}
#bg{z-index:10;background:url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260713_140344_79e1296a-86d7-43fd-9b5f-63ffe560f291.png&w=1280&q=85") center/cover no-repeat}
h1{position:absolute;z-index:20;left:0;right:0;top:5rem;text-align:center;color:#fff;font-family:'Instrument Serif',serif;font-weight:400;text-transform:uppercase;line-height:.9;font-size:4.5rem;pointer-events:none}
h1,h1 *{font-family:'Instrument Serif',serif}
#overlay{z-index:25;width:100%;height:100%;object-fit:cover;pointer-events:none}
#reveal{z-index:30;pointer-events:none;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:100% 100%;mask-size:100% 100%}
#reveal video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:inset(40% 0 0 0)}
nav{position:fixed;z-index:50;top:0;left:0;right:0;pointer-events:none}
.logo{position:fixed;top:20px;left:20px;pointer-events:auto;width:28px;height:28px}
.pill{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:none;gap:4px;padding:4px;border-radius:999px;pointer-events:auto}
.pill button{padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;color:rgba(255,255,255,.7);transition:color .2s}
.pill button:hover{color:#fff}
.cta{position:fixed;top:16px;right:20px;display:none;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;color:#fff;font-size:14px;font-weight:500;pointer-events:auto}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80}
.burger{position:fixed;top:14px;right:16px;width:48px;height:40px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;pointer-events:auto}
.burger i{display:block;height:1.5px;background:#fff}
.burger i:first-child{width:20px}.burger i:last-child{width:14px}
#menu{position:fixed;inset:0;z-index:55;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;visibility:hidden;opacity:0;transition:opacity .4s cubic-bezier(.77,0,.18,1),visibility .4s}
#menu.open{visibility:visible;opacity:1}
#menu .item{color:rgba(255,255,255,.9);font-weight:500;font-size:1.875rem;opacity:0;transform:translateY(24px);transition:opacity .5s cubic-bezier(.77,0,.18,1),transform .5s cubic-bezier(.77,0,.18,1)}
#menu.open .item{opacity:1;transform:none}
#menu .cta2{display:flex;align-items:center;gap:8px;padding:14px 28px;border-radius:999px;color:#fff;font-weight:500;margin-top:24px}
#close{position:absolute;top:14px;right:16px;width:48px;height:40px;border-radius:999px;transform:rotate(-90deg) scale(.8);transition:transform .5s cubic-bezier(.77,0,.18,1)}
#menu.open #close{transform:none}
#close i{position:absolute;left:14px;top:19px;width:20px;height:1.5px;background:#fff}
#close i:first-child{transform:rotate(45deg)}#close i:last-child{transform:rotate(-45deg)}
@media(min-width:420px){h1{font-size:5.5rem}}
@media(min-width:640px){h1{font-size:10rem;top:7rem}#menu .item{font-size:2.25rem}}
@media(min-width:768px){h1{font-size:13rem;top:8rem}.pill{display:flex}.cta{display:flex}.burger{display:none}}
@media(min-width:1024px){h1{font-size:16rem}}
</style>
</head>
<body>
<section class="hero">
  <svg id="grid" class="layer" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="gp" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#64748b" stroke-width="0.6"/></pattern></defs><rect x="-48" y="-48" width="200%" height="200%" fill="url(#gp)" id="gridrect"/></svg>
  <div id="bg" class="layer"></div>
  <h1>Measured</h1>
  <img id="overlay" class="layer" src="https://soft-zoom-63098134.figma.site/_assets/v11/3f10f1876e118f72a396e05a6c2d099569478272.png" alt="">
  <div id="reveal" class="layer"><video src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260713_162101_0d7498c5-29bb-47bf-a99f-2773c0a880a9.mp4" autoplay loop muted playsinline></video></div>
</section>

<nav>
  <svg class="logo" viewBox="0 0 256 256" fill="#fff"><path d="M 256 64 L 256 128 L 192.5 128 L 160 95 L 128 64 L 96 95 L 63.5 128 L 64 128 L 128 192 L 128 256 L 64.5 256 L 32 223 L 0 192 L 0 64 L 64 0 L 192 0 Z M 256 192 L 256 256 L 192.5 256 L 160 223 L 128 192 L 128 128 L 192 128 Z"/></svg>
  <div class="pill liquid-glass"><button>Device</button><button>Real Stories</button><button>Science</button><button>Plans</button><button>Reach Us</button></div>
  <button class="cta liquid-glass"><span class="dot"></span>Reserve Yours</button>
  <button class="burger liquid-glass" id="open" aria-label="Menu"><i></i><i></i></button>
</nav>

<div id="menu">
  <button id="close" class="liquid-glass" aria-label="Close"><i></i><i></i></button>
  <button class="item">Device</button><button class="item">Real Stories</button><button class="item">Science</button><button class="item">Plans</button><button class="item">Reach Us</button>
  <button class="item cta2 liquid-glass"><span class="dot"></span>Reserve Yours</button>
</div>

<script>
(function(){
  var hero=document.querySelector('.hero'),rev=document.getElementById('reveal'),rect=document.getElementById('gridrect');
  var cv=document.createElement('canvas'),ctx=cv.getContext('2d');
  var R=260,W=0,H=0;
  var t={x:-1000,y:-1000},s={x:-1000,y:-1000},g={x:0,y:0},gt={x:0,y:0};
  function size(){W=hero.clientWidth;H=hero.clientHeight;cv.width=W;cv.height=H}
  size();addEventListener('resize',size);
  addEventListener('mousemove',function(e){t.x=e.clientX;t.y=e.clientY;
    gt.x=(e.clientX-W/2)/(W/2)*16;gt.y=(e.clientY-H/2)/(H/2)*16});
  function frame(){
    s.x+=(t.x-s.x)*.1;s.y+=(t.y-s.y)*.1;
    g.x+=(gt.x-g.x)*.06;g.y+=(gt.y-g.y)*.06;
    rect.setAttribute('transform','translate('+(g.x%48).toFixed(2)+','+(g.y%48).toFixed(2)+')');
    ctx.clearRect(0,0,W,H);
    var gr=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,R);
    gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.4,'rgba(255,255,255,1)');
    gr.addColorStop(.6,'rgba(255,255,255,.75)');gr.addColorStop(.75,'rgba(255,255,255,.4)');
    gr.addColorStop(.88,'rgba(255,255,255,.12)');gr.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
    var u='url('+cv.toDataURL()+')';
    rev.style.webkitMaskImage=u;rev.style.maskImage=u;
    requestAnimationFrame(frame);
  }
  frame();
  var m=document.getElementById('menu'),items=m.querySelectorAll('.item');
  items.forEach(function(el,i){el.style.transitionDelay=(100+i*60)+'ms'});
  function setMenu(o){m.classList.toggle('open',o);document.body.style.overflow=o?'hidden':''}
  document.getElementById('open').onclick=function(){setMenu(true)};
  document.getElementById('close').onclick=function(){setMenu(false)};
  items.forEach(function(el){el.addEventListener('click',function(){setMenu(false)})});
})();
</script>
</body>
</html>
