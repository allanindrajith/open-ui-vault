:root{--ink:#5a2e1f;--head:#c8653f;--sky1:#fbeee3;--sky2:#f0c9ae;--field:#e9a17c;--prod:#f4d2bb;--white:#fff8f0}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--sky1);overscroll-behavior:none;scrollbar-width:none}html::-webkit-scrollbar{display:none}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}
body{-webkit-user-select:none;user-select:none;font-family:'Marcellus',Georgia,serif;color:var(--ink)}
#stage{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#track{position:relative;width:1px;pointer-events:none}
.bg{position:absolute;inset:0}
#bgSky{background:linear-gradient(180deg,var(--sky1) 0%,#f8e2d1 45%,var(--sky2) 100%)}
#bgField{background:var(--field);opacity:0}
#bgProd{background:var(--prod);opacity:0}
.L{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform,opacity;pointer-events:none}
.spr{background-repeat:no-repeat}
.word{font-family:'Marcellus',Georgia,serif;white-space:nowrap;line-height:1;transform-origin:0 0}
#headline{color:var(--head);line-height:.86;letter-spacing:.01em;opacity:.92}
#headline span{display:block}
#blends{color:var(--white);text-align:center;transform-origin:50% 50%}
.lbl{font-family:'Marcellus',Georgia,serif;letter-spacing:.06em;white-space:nowrap;color:var(--ink);transform-origin:50% 50%}
#mark{font-family:'Marcellus',Georgia,serif;color:var(--ink);white-space:nowrap;transform-origin:50% 50%}
#funnel canvas{display:block;width:100%;height:100%}
.dn{position:absolute;left:50%;transform-origin:50% 0}
nav{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:var(--navY) var(--navX) 0}
nav .brand{font-family:'Marcellus',Georgia,serif;font-size:var(--brandFs);color:var(--ink);text-decoration:none;letter-spacing:.01em;display:inline-flex;align-items:center;min-height:30px}
nav ul{display:flex;list-style:none;gap:var(--linkGap)}
nav a.l{font-size:var(--linkFs);letter-spacing:.08em;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;min-height:28px;padding:0 2px}
nav a:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
html.pre nav,html.pre #headline{opacity:0}
@media (max-aspect-ratio:9/10){nav{flex-wrap:wrap;row-gap:4px}nav ul{width:100%;justify-content:space-between}}
@media (prefers-reduced-motion:reduce){html.pre nav,html.pre #headline{opacity:1}}
</style>

  for(const id of ['fl_l','fl_r']){const e=$(id);e.style.width=FLW+'px';e.style.height=FLW*ASP[id]+'px';}
}
let FLW=300,NAVB=60,BELOW=900,ABOVE=0;

/* ---------- states ---------- */
const sx=x=>L.W/2+(x-L.W/2)*spread;
function tinRow(P,rise,midBig){
  const o={};const asp=ASP.tin_l,la=ASP.lid_l;
  ['l','m','r'].forEach((s,i)=>{
    const pk='p_'+s,pw=P.pW[i],ph=pw*ASP[pk],pt=P.pTop[i]+rise;
    o[pk]={x:sx(P.cx[i]),y:pt+ph/2,w:pw,o:1};
    const tw=P.tW[i],th=tw*asp,tb=P.pTop[i]+rise+6,tt=tb-th;
    o['tin_'+s]={x:sx(P.cx[i]),y:tt+th/2,w:tw,o:1};
    const lw=tw*P.lidK,lh=lw*la,lb=tt+.05*th;
    o['lid_'+s]={x:sx(P.cx[i]),y:lb-lh/2,w:lw,o:1};
  });
  return o;
}
function state(i){
  const s={};const G=L.grid;
  // backgrounds
  s.bgField={o:(i>=2&&i<=4)?1:0}; s.bgProd={o:i>=5?1:0};
  // dunes + flowers + headline (move together)
  const dTop=(+$('dunes').dataset.top-oy)/u;const down=i>=1?(BELOW-dTop)+40:0;
  s.dunes={dy:down,o:1}; s.fl_l={dy:i>=1?BELOW+40:0,o:1}; s.fl_r={dy:i>=1?BELOW+40:0,o:1};
  s.headline={x:L.head.x,y:L.head.y+down,o:1};
  // ingredients
  ING.forEach((k,j)=>{
    let v;
    if(i===0){const t=L.tuck[k];v={x:sx(t[0]),y:t[1],w:t[2],r:t[3],o:1};}
    else if(i===1){let c,r;if(G.rows3){c=j%2;r=Math.floor(j/2);}else{c=j%3;r=Math.floor(j/3);}v={x:sx(G.cols[c]),y:G.item[r],w:G.w[k],r:0,o:1};}
    else if(i===2){const g=L.gather,t=g.o[k];v={x:g.c[0]+t[0],y:g.c[1]+t[1],w:t[2],r:t[3],o:1};}
    else{const t=L.inF[k];const dy=i===3?0:i===4?L.shift4:L.shift5-200;v={x:t[0],y:t[1]+dy,w:t[2],r:t[3],o:i>=5?0:1};}
    s[k]=v;
    let lv;const tk='t'+k.slice(1);
    if(G.rows3){const c=j%2,r=Math.floor(j/2);lv={x:sx(G.cols[c]),y:G.lbl[r],o:i===1?1:0};}
    else{const c=j%3,r=Math.floor(j/3);lv={x:sx(G.cols[c]),y:G.lbl[r],o:i===1?1:0};}
    if(i!==1)lv.y+=i<1?24:-14;
    s[tk]=lv;
  });
  // funnel (rim width w; layer height = w*asp; y = centre)
  const fw=L.funW,fh=fw*ASP.funnel;
  const fTop=i<=1?BELOW+60:i===2?L.funTop2:i===3?L.funTop3:i===4?L.funTop3+L.shift4:L.funTop3+L.shift5-fh*.4;
  s.funnel={x:L.W/2,y:fTop+fh/2,w:fw,o:i<=1?0:1};
  if(i<=1)s.funnel.o=1;
  const spout=L.funTop3+fh;
  // BLENDS
  const by=i<=2?Math.max(L.blends.y2,BELOW+L.blends.fs*.7):i===3?L.blends.y3:i===4?L.blends.y3+L.shift4:L.blends.y3+L.shift5-300;
  s.blends={x:L.W/2,y:by,o:i>=2&&i<=4?1:0};
  // drop
  const dw=L.dropW,dh=dw*ASP.drop,B=L.big;
  if(i<=3)s.drop={x:L.W/2,y:spout-dh*.2,w:dw*.35,o:0};
  else if(i===4)s.drop={x:L.W/2,y:spout+L.shift4+dh*.5,w:dw,o:1};
  else s.drop={x:L.W/2,y:B.top+dh*.2,w:dw*.8,o:0};
  // products
  const P=L.prod;
  const fin=tinRow(P,0),low=tinRow(P,P.rise+Math.max(0,BELOW-L.H)),gone=tinRow(P,BELOW-Math.min(...P.pTop)+Math.max(...P.tW)*(ASP.tin_l+P.lidK*ASP.lid_l)+60);
  const bh=B.w*ASP.tin_m,blw=B.w*P.lidK,blh=blw*ASP.lid_m;
  for(const k in fin){
    const mid=k.endsWith('_m');
    if(i===7)s[k]=fin[k];
    else if(i===6)s[k]=mid?null:low[k];
    else s[k]=mid?null:gone[k];
  }
  // middle tin + lid in big close-up
  const bigTin={x:L.W/2,y:B.top+bh/2,w:B.w,o:1},bigLid={x:L.W/2,y:B.top+.05*bh-blh/2,w:blw,o:1};
  if(i<=4){s.tin_m={x:L.W/2,y:BELOW+40+bh/2,w:B.w,o:1};s.lid_m={x:L.W/2,y:ABOVE-blh,w:blw,o:1};s.p_m=gone.p_m;}
  else if(i===5){s.tin_m=bigTin;s.lid_m={x:L.W/2,y:ABOVE-blh*.9,w:blw,o:1};s.p_m=gone.p_m;}
  else if(i===6){s.tin_m=bigTin;s.lid_m=bigLid;s.p_m=low.p_m;}
  // wordmark
  const my=Math.max(P.mark[1],(NAVB+6-oy)/u+P.mark[2]*.62);s.mark={x:L.W/2,y:my+(i===7?0:-18),o:i===7?1:0};
  return s;
}

/* ---------- render ---------- */
/* Figma "On drag -> Smart Animate, Ease out, 1000 ms": the layers follow the
   scroll/drag while it moves; when the gesture stops the step completes with
   the reel's ease-out over (remaining fraction x 1000 ms). */
const N=7,REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches,DUR=REDUCED?0:1000;
let S=[],cur={},step=0,P=0,stepPx=900,lastW=0;
function put(k,v){
  const e=$(k);if(!e||!v)return;
  if(k==='bgField'||k==='bgProd'){e.style.opacity=v.o;return;}
  if(k==='dunes'){e.style.transform='translate3d(0,'+(+e.dataset.top+v.dy*u)+'px,0)';e.style.opacity=v.o;return;}
  if(k==='fl_l'||k==='fl_r'){const h=FLW*ASP[k],x=k==='fl_l'?-FLW*.06:vw-FLW*.94;e.style.transform='translate3d('+x+'px,'+(vh-h*.86+v.dy*u)+'px,0)';e.style.opacity=v.o;return;}
  if(k==='headline'){e.style.transform='translate3d('+(ox+v.x*u)+'px,'+(oy+v.y*u)+'px,0)';e.style.opacity=v.o;return;}
  if(TXT.includes(k)){const w=e.offsetWidth,h=e.offsetHeight;e.style.transform='translate3d('+(ox+v.x*u-w/2)+'px,'+(oy+v.y*u-h/2)+'px,0)';e.style.opacity=v.o;return;}
  const bw=BASE*u,bh=bw*ASP[k],sc=v.w/BASE;
  e.style.transform='translate3d('+(ox+v.x*u-bw/2)+'px,'+(oy+v.y*u-bh/2)+'px,0) rotate('+(v.r||0)+'deg) scale('+(e.dataset.flip?-sc:sc)+','+sc+')';
  e.style.opacity=v.o;
}
function buildStates(){S=[];for(let i=0;i<=N;i++)S.push(state(i));}
function renderAt(p){
  p=Math.max(0,Math.min(N,p));const i=Math.min(N-1,Math.floor(p)),f=p-i,A=S[i],B=S[i+1];
  for(const k in B){const a=A[k]||B[k],b=B[k];if(!b)continue;const v={};for(const q in b){const x=a[q]===undefined?b[q]:a[q];v[q]=x+(b[q]-x)*f;}cur[k]=v;put(k,v);}
  step=Math.round(p);document.documentElement.dataset.step=step;
}
/* Figma "Ease out" = cubic-bezier(0,0,0.58,1) */
function bez(x1,y1,x2,y2){const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const X=t=>((ax*t+bx)*t+cx)*t,Y=t=>((ay*t+by)*t+cy)*t,dX=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{let t=x;for(let i=0;i<8;i++){const d=X(t)-x;if(Math.abs(d)<1e-5)break;const s=dX(t);if(Math.abs(s)<1e-6)break;t-=d/s;}return Y(Math.min(1,Math.max(0,t)));};}
const ease=bez(0,0,.58,1);

/* ---------- scroll: Lenis smooth wheel, native touch, settle on release ---------- */
const lenis=(window.Lenis&&!REDUCED)?new Lenis({lerp:.1,wheelMultiplier:1,smoothWheel:true,syncTouch:false,autoRaf:false}):null;
const scrollY_=()=>lenis?lenis.scroll:(window.scrollY||document.documentElement.scrollTop);
let lastMove=performance.now(),lastWheel=0,lastY=0,dir=1,touching=false,settling=false;
function scrollToPx(y,d){
  y=Math.max(0,Math.min(N*stepPx,y));
  if(lenis){settling=true;lenis.scrollTo(y,{duration:d/1000,easing:ease,lock:false,force:true,onComplete:()=>{settling=false;}});}
  else window.scrollTo({top:y,behavior:d?'smooth':'auto'});
}
function goTo(n){n=Math.max(0,Math.min(N,n));const d=DUR?Math.max(350,Math.abs(n-P)*DUR):0;scrollToPx(n*stepPx,Math.min(d,DUR*1.6||0));}
function settle(){
  const f=P-Math.floor(P);if(f<.001||f>.999)return;
  /* finish in the gesture's direction once it is 12% in (Figma drag threshold feel) */
  const n=dir>0?(f>.12?Math.ceil(P):Math.floor(P)):(f<.88?Math.floor(P):Math.ceil(P));
  scrollToPx(n*stepPx,DUR?Math.max(250,Math.abs(n-P)*DUR):0);
}
addEventListener('touchstart',()=>{touching=true;settling=false;},{passive:true});
addEventListener('touchend',()=>{touching=false;lastMove=performance.now();},{passive:true});
addEventListener('touchcancel',()=>{touching=false;},{passive:true});
addEventListener('wheel',e=>{lastWheel=performance.now();if(e.deltaY)dir=e.deltaY>0?1:-1;settling=false;},{passive:true});
addEventListener('keydown',e=>{
  if(['ArrowDown','PageDown',' ','Spacebar'].includes(e.key)){e.preventDefault();goTo(Math.floor(P+.02)+1);}
  else if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();goTo(Math.ceil(P-.02)-1);}
  else if(e.key==='Home'){e.preventDefault();goTo(0);}else if(e.key==='End'){e.preventDefault();goTo(N);}
});
function frame(now){
  if(window.__rec){requestAnimationFrame(frame);return;}
  if(lenis)lenis.raf(now);
  const y=scrollY_();
  if(Math.abs(y-lastY)>.5){if(now-lastWheel>300)dir=y>lastY?1:-1;lastMove=now;lastY=y;}
  P=y/stepPx;renderAt(P);
  const wheelDriven=lenis&&lenis.isScrolling==='smooth'&&now-lastWheel<1200;
  if(!touching&&!settling&&(wheelDriven?now-lastWheel>140:now-lastMove>140))settle();
  requestAnimationFrame(frame);
}
function sizeTrack(){
  if(vw!==lastW||!stepPx){stepPx=Math.max(320,vh);lastW=vw;}
  $('track').style.height=(N*stepPx+vh)+'px';
}
function snap(){buildStates();sizeTrack();renderAt(scrollY_()/stepPx);}
addEventListener('resize',()=>{const p=P;layout();buildStates();sizeTrack();
  if(Math.abs(p*stepPx-scrollY_())>1){if(lenis)lenis.scrollTo(p*stepPx,{immediate:true,force:true});else scrollTo(0,p*stepPx);}
  renderAt(p);});

/* ---------- funnel: key out the flat apricot backdrop at runtime ---------- */
function keyFunnel(img){
  const S=img.naturalWidth,k=S/FUN.full,cx=FUN.x*k,cy=FUN.y*k,cw=FUN.w*k,ch=FUN.h*k;
  const c=document.createElement('canvas');c.width=S;c.height=S;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0);
  const corner=g.getImageData(4,4,24,24).data;let br=0,bg=0,bb=0,n=0;for(let i=0;i<corner.length;i+=4){br+=corner[i];bg+=corner[i+1];bb+=corner[i+2];n++;}br/=n;bg/=n;bb/=n;
  const out=$('funnel').querySelector('canvas');out.width=Math.round(cw);out.height=Math.round(ch);
  const og=out.getContext('2d');og.drawImage(c,cx,cy,cw,ch,0,0,out.width,out.height);
  const id=og.getImageData(0,0,out.width,out.height),d=id.data;
  for(let i=0;i<d.length;i+=4){
    const dr=d[i]-br,dg=d[i+1]-bg,db=d[i+2]-bb;
    const dist=Math.sqrt(dr*dr+dg*dg+db*db);
    let a=Math.min(1,Math.max(0,(dist-5)/70));
    if(a<=0){d[i+3]=0;continue;}
    a=Math.min(1,a*1.05+.04);
    d[i]=Math.min(255,Math.max(0,br+dr/a));d[i+1]=Math.min(255,Math.max(0,bg+dg/a));d[i+2]=Math.min(255,Math.max(0,bb+db/a));d[i+3]=a*255;
  }
  og.putImageData(id,0,0);
}

/* white-backdrop key: alpha from distance to white, un-mix the white from edge pixels */
function keyed(src,done){return new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{try{
  const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0);
  const id=g.getImageData(0,0,c.width,c.height),d=id.data;
  for(let i=0;i<d.length;i+=4){const r=255-d[i],gg=255-d[i+1],b=255-d[i+2];const m=Math.max(r,gg,b);let a=Math.min(1,Math.max(0,(m-14)/46));
    if(a<=0){d[i+3]=0;continue;}if(a<1){d[i]=255-r/a;d[i+1]=255-gg/a;d[i+2]=255-b/a;}d[i+3]=a*255;}
  g.putImageData(id,0,0);done(c);}catch(e){}res();};im.onerror=res;im.src=src;});}

/* ---------- boot ---------- */

if("scrollRestoration" in history)history.scrollRestoration="manual";scrollTo(0,0);
layout();snap();requestAnimationFrame(frame);
const fimg=new Image();fimg.crossOrigin='anonymous';fimg.onload=()=>{try{keyFunnel(fimg);}catch(err){}};fimg.src=URL_.funnel;
const loads=[URL_.ingr,URL_.tins].map(s=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=s;}));
loads.push(keyed(URL_.dunes,c=>{const d=$('dunes');d.width=c.width;d.height=c.height;d.getContext('2d').drawImage(c,0,0);}));
loads.push(keyed(URL_.flowers,c=>{for(const k in FLB){const [x,y,w,h]=FLB[k],e=$(k);e.width=w;e.height=h;e.getContext('2d').drawImage(c,x,y,w,h,0,0,w,h);}}));
const fonts=document.fonts?document.fonts.ready:Promise.resolve();
let shown=false;
function reveal(){
  if(shown)return;shown=true;layout();snap();
  const html=document.documentElement;
  if(DUR&&html.animate){
    const o={duration:1000,easing:'cubic-bezier(0,0,.58,1)',fill:'backwards'};
    const n=document.querySelector('nav').animate([{opacity:0,transform:'translateY(-10px)'},{opacity:1,transform:'none'}],o);
    $('headline').animate([{opacity:0,translate:'0 24px'},{opacity:1,translate:'0 0'}],{...o,delay:120});
  }
  html.classList.remove('pre');
}
Promise.all([fonts,...loads]).then(reveal);
setTimeout(reveal,2500);
window.__ember={goTo,get step(){return step},get P(){return P},get stepPx(){return stepPx},get anim(){return settling},state,layout,snap,lenis,renderAt};
})();
</script>
