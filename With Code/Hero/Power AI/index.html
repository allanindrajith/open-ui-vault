<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root{--bg:hsl(260 87% 3%);--fg:hsl(40 6% 95%);--sub:hsl(40 6% 82%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:'Geist','Geist Sans',system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.page{position:relative;min-height:100vh;overflow:hidden;background:var(--bg)}
.page video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.hero{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;overflow:visible}
.blur{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:984px;height:527px;max-width:100vw;opacity:.9;background:#030712;filter:blur(82px);pointer-events:none}
nav{position:relative;display:flex;justify-content:space-between;align-items:center;padding:20px 32px}
.logo{display:flex;align-items:center;gap:8px;height:32px;font-family:'General Sans',sans-serif;font-weight:600;font-size:20px}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#a855f7,#fcd34d)}
.links{display:flex;gap:32px}
.links button{display:flex;align-items:center;gap:4px;color:rgba(242,241,239,.9);font-size:14px;transition:color .2s}
.links button:hover{color:var(--fg)}
.links svg{width:16px;height:16px}
.liquid-glass{background:rgba(255,255,255,.01);background-blend-mode:luminosity;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.1);position:relative;overflow:hidden}
.liquid-glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.btn{border-radius:9999px;font-size:14px;font-weight:500;transition:background .2s}
.btn:hover{background:rgba(255,255,255,.08)}
.signup{padding:8px 16px}
.divider{height:1px;margin-top:3px;background:linear-gradient(to right,transparent,rgba(242,241,239,.2),transparent)}
.content{position:relative;flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 16px}
.inner{display:flex;flex-direction:column;align-items:center}
h1{font-family:'General Sans',sans-serif;font-weight:400;font-size:220px;line-height:1.02;letter-spacing:-.024em;white-space:nowrap}
h1 span{background:linear-gradient(to left,#6366f1,#a855f7,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.sub{color:var(--sub);font-size:18px;line-height:32px;max-width:28rem;margin-top:9px;opacity:.8}
.cta{padding:24px 29px;margin-top:25px}
.marq{position:relative;padding:0 16px 40px}
.marq .row{max-width:64rem;margin:0 auto;display:flex;align-items:center;gap:48px}
.marq p{color:rgba(242,241,239,.5);font-size:14px;white-space:nowrap}
.mask{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent)}
.track{display:flex;gap:64px;width:max-content;animation:m 20s linear infinite}
.track .it{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600}
.track .ic{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px}
@keyframes m{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(max-width:1100px){h1{font-size:clamp(72px,19vw,220px)}}
@media(max-width:768px){
 nav{padding:16px 20px}.links{display:none}
 .marq .row{flex-direction:column;gap:16px;text-align:center}.marq .mask{width:100%}
 .sub{font-size:16px;line-height:28px}.cta{padding:18px 26px}
}
</style>
</head>
<body>
<div class="page">
<video id="v" muted playsinline preload="auto" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_065045_c44942da-53c6-4804-b734-f9e07fc22e08.mp4"></video>
<div class="hero">
 <div class="blur"></div>
 <nav>
  <div class="logo"><i></i>Power</div>
  <div class="links">
   <button>Features <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
   <button>Solutions</button>
   <button>Plans</button>
   <button>Learning <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
  <button class="btn liquid-glass signup">Sign Up</button>
 </nav>
 <div class="divider"></div>
 <div class="content"><div class="inner">
  <h1>Power <span>AI</span></h1>
  <p class="sub">The most powerful AI ever deployed<br>in talent acquisition</p>
  <button class="btn liquid-glass cta">Schedule a Consult</button>
 </div></div>
 <div class="marq"><div class="row">
  <p>Relied on by brands<br>across the globe</p>
  <div class="mask"><div class="track" id="t"></div></div>
 </div></div>
</div>
</div>
<script>
var names=['Vortex','Nimbus','Prysma','Cirrus','Kynder','Halcyn'],h='';
for(var k=0;k<2;k++)names.forEach(function(n){h+='<div class="it"><div class="ic liquid-glass">'+n[0]+'</div>'+n+'</div>'});
document.getElementById('t').innerHTML=h;
(function(){
 var v=document.getElementById('v'),F=.5,raf;
 function tick(){
  var d=v.duration,t=v.currentTime,o=1;
  if(d){o=Math.min(1,t/F,Math.max(0,(d-t)/F));}
  v.style.opacity=Math.max(0,o);
  raf=requestAnimationFrame(tick);
 }
 v.addEventListener('play',function(){cancelAnimationFrame(raf);tick()});
 v.addEventListener('ended',function(){
  v.style.opacity=0;
  setTimeout(function(){v.currentTime=0;v.play().catch(function(){})},100);
 });
 v.play().catch(function(){});
})();
</script>
</body>
</html>
