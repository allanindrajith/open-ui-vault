<style>
:root{
  --tile:rgba(112,101,94,.66);       /* taupe glass, like the reference */
  --tile-hi:rgba(150,139,131,.84);   /* popped / hovered */
  --frame:rgba(133,122,114,.80);
  --edge:rgba(255,255,255,.22);
  --ink:#fff;
  --ink-2:rgba(255,255,255,.8);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a120c;color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#room{position:fixed;inset:-2%;background:center/cover no-repeat;will-change:transform}
#shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 95% at 50% 45%,transparent 55%,rgba(10,6,3,.42) 100%)}
.corner{position:fixed;font-weight:300;z-index:20;letter-spacing:.01em}
#brand{left:3.1vw;top:4.4vh;font-size:clamp(16px,1.5vw,27px)}
#ar{left:3.1vw;bottom:4.4vh;font-size:clamp(14px,1.25vw,22px)}
#yr{right:3.1vw;bottom:4.4vh;font-size:clamp(14px,1.25vw,22px)}

/* 16:9 scene, contained; --u = 1% of scene width */
#scene{position:fixed;left:50%;top:50%;width:min(100vw,177.78vh);height:min(56.25vw,100vh);transform:translate(-50%,-50%);--u:calc(min(100vw,177.78vh)/100);perspective:calc(var(--u)*140)}
#plane{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(var(--py,0deg)) rotateX(var(--px,0deg));will-change:transform}

/* glass surfaces: tinted, no backdrop blur (keeps it smooth) */
.g{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,0) 40%),var(--tile);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 24px 50px -26px rgba(0,0,0,.65)}

/* ---------- window (near-frontal, slight turn) ---------- */
#win{position:absolute;left:19.4%;top:20.5%;width:32.4%;height:58%;transform:rotateY(-7deg) rotateZ(-.8deg);transform-origin:0 50%;transform-style:preserve-3d}
#frame{position:absolute;inset:0;border-radius:calc(var(--u)*1.45);background:linear-gradient(165deg,rgba(255,255,255,.16),rgba(255,255,255,0) 35%),var(--frame);border:1px solid rgba(255,255,255,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 40px 70px -30px rgba(0,0,0,.7)}
#photo{position:absolute;left:2.6%;right:2.6%;top:3.4%;bottom:3.4%;border-radius:calc(var(--u)*.55);overflow:hidden;background:#3b3029}
.ph{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity .7s ease}
.ph.on{opacity:1}
.ph.cat{background:radial-gradient(70% 80% at 35% 50%,#8a7d70 0%,#5c5047 60%,#3f352e 100%)}
.ph.cat .big{position:absolute;left:5%;top:14%;width:40%;height:68%;background-repeat:no-repeat;filter:drop-shadow(0 20px 26px rgba(0,0,0,.45));transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.ph.cat:not(.on) .big{transform:translateY(6%) scale(.96)}
#photo::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(18,12,8,.55),rgba(18,12,8,.1) 55%,transparent),linear-gradient(0deg,rgba(18,12,8,.35),transparent 45%)}
.cap{position:absolute;left:4.5%;bottom:8.5%;z-index:2;transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1)}
.cap.out{opacity:0;transform:translateY(10px)}
.cap small{display:block;font-size:calc(var(--u)*.5);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:calc(var(--u)*.6)}
.cap h2{font-family:Fraunces,"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:calc(var(--u)*2.15);line-height:1.08;letter-spacing:-.015em}
.cap.side{left:49%;right:auto;bottom:auto;top:50%;transform:translateY(-50%);text-align:left;width:30%}
.cap.side.out{transform:translateY(-44%)}
.cap .row{display:flex;gap:6px;margin-top:calc(var(--u)*1.1)}
.cap .row button{white-space:nowrap;height:calc(var(--u)*2);padding:0 calc(var(--u)*1);border-radius:999px;font-size:calc(var(--u)*.62);border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);transition:background .2s}
.cap .row button:hover{background:rgba(255,255,255,.28)}
.cap .row button.s{background:#fff;color:#2b1f16}

/* tabs: hang along the window top edge, rising to the right */
#tabs{position:absolute;left:3%;bottom:100%;margin-bottom:calc(var(--u)*1.15);display:flex;align-items:flex-end;gap:calc(var(--u)*.9);transform:rotateZ(-4deg);transform-origin:0 100%}
.tab{position:relative;flex:none;margin-bottom:calc(var(--u)*.35);height:calc(var(--u)*2.05);padding:0 calc(var(--u)*1.25);border-radius:999px;font-family:Montserrat,Inter,sans-serif;font-weight:500;font-size:calc(var(--u)*.55);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);
  transition:all .5s cubic-bezier(.3,1.25,.5,1)}
.tab:hover{color:#fff;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,0) 40%),var(--tile-hi)}
.tab.on{height:calc(var(--u)*3.1);padding:0 calc(var(--u)*1.7);font-size:calc(var(--u)*1.05);font-weight:600;letter-spacing:.12em;color:#fff;margin-bottom:0;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,0) 40%),var(--tile-hi)}
.tab .stem{position:absolute;left:50%;top:100%;width:calc(var(--u)*1.6);height:calc(var(--u)*1.25);transform:translateX(-50%) scaleY(0);transform-origin:top;background:var(--frame);border-left:1px solid var(--edge);border-right:1px solid var(--edge);transition:transform .35s .1s}
.tab.on .stem{transform:translateX(-50%) scaleY(1)}

/* ---------- tile wall: one turned plane, right side nearer ---------- */
#wall{position:absolute;left:52.2%;top:2.5%;width:28.6%;height:88%;transform:rotateY(-24deg);transform-origin:0 50%;transform-style:preserve-3d}
.tile{position:absolute;border-radius:calc(var(--u)*1.05);display:block;transform:translateZ(var(--z,0px));transition:transform .45s cubic-bezier(.25,1.3,.45,1),background .3s,opacity .4s}
.tile .pi{position:absolute;left:14%;right:14%;top:10%;bottom:30%;background-repeat:no-repeat;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.tile .lb{position:absolute;left:0;right:0;bottom:11%;text-align:center;font-size:calc(var(--u)*.78);font-weight:400;text-shadow:0 1px 5px rgba(0,0,0,.3)}
.tile:hover{--z:calc(var(--u)*2.4);background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,0) 40%),var(--tile-hi)}
.tile.lifted{opacity:.0}

/* popped card: frontal, overlaps the window's right edge */
#pop{position:absolute;z-index:30;left:45.3%;top:41%;width:18.2%;height:28.5%;border-radius:calc(var(--u)*1.25);
  background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%),var(--tile-hi);border:1px solid rgba(255,255,255,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 40px 70px -28px rgba(0,0,0,.75);
  transform-origin:0 0;will-change:transform;cursor:pointer;transform:translate3d(var(--ox,0px),var(--oy,0px),0)}
#pop .pi{position:absolute;left:18%;right:18%;top:8%;bottom:34%;background-repeat:no-repeat;filter:drop-shadow(0 10px 14px rgba(0,0,0,.4))}
#pop .lb{position:absolute;left:0;right:0;bottom:17%;text-align:center;font-size:calc(var(--u)*1.25);font-weight:500}
#pop .ct{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-size:calc(var(--u)*.72);color:var(--ink-2)}
#pop svg{position:absolute;right:7%;top:6%;width:calc(var(--u)*1.55);height:calc(var(--u)*1.55);transition:transform .3s}
#pop:hover svg{transform:translate(3px,-3px)}

@media (max-aspect-ratio:1/1){
  #scene{width:100vw;height:100vh;--u:calc(100vw/52)}
  #win{left:5%;top:14%;width:90%;height:34%;transform:none}
  #wall{left:6%;top:56%;width:88%;height:40%;transform:none}
  #pop{left:56%;top:30%;width:38%;height:24%}
}
</style>
</head>

function relayTabs(){}
let tab=1;
function caption(kick,html,side){const c=$('#cap');c.classList.add('out');setTimeout(()=>{$('#kick').textContent=kick;$('#head').innerHTML=html;c.classList.toggle('side',side);requestAnimationFrame(()=>c.classList.remove('out'));},300);}
function setTab(i,instant){tab=i;$$('.tab').forEach((b,k)=>b.classList.toggle('on',k===i));relayTabs(i);
  $$('.ph').forEach(p=>p.classList.toggle('on',p.dataset.t==String(i)));
  if(instant){$('#kick').textContent=TABS[i].k;$('#head').innerHTML=TABS[i].h;}else caption(TABS[i].k,TABS[i].h,false);}

/* ---------- product sheet 2048x1360 → clipped sprite ---------- */
const PSW=2048,PSH=1360;
function sprite(el,b){const w=el.offsetWidth||100,h=el.offsetHeight||100,bw=b[2]-b[0],bh=b[3]-b[1],k=Math.min(w/bw,h/bh),ix=(w-bw*k)/2,iy=(h-bh*k)/2;
  el.style.backgroundImage=`url('${PS}')`;el.style.backgroundSize=`${PSW*k}px ${PSH*k}px`;el.style.backgroundPosition=`${ix-b[0]*k}px ${iy-b[1]*k}px`;el.style.clipPath=`inset(${iy}px ${ix}px ${iy}px ${ix}px)`;}
/* wall slots (% of #wall): left column smaller/further, right column larger/nearer */
const CATS=[
 {n:'Jewelry',ct:128,b:[36,132,469,580],s:[0,9,46,19]},
 {n:'Outerwear',ct:87,b:[1066,681,1498,1297],s:[0,30,46,19]},
 {n:'Clothing',ct:345,b:[1045,89,1519,622],s:[0,51,46,19]},
 {n:'Editorial',ct:24,b:[43,753,479,1239],s:[0,72,46,19]},
 {n:'Shoes',ct:212,b:[546,152,993,567],s:[52,2,48,22]},
 {n:'Accessories',ct:96,b:[1623,67,1983,624],s:[52,26,48,22]},
 {n:'Bags',ct:158,b:[550,753,986,1239],s:[52,52,48,22]},
 {n:'Sale',ct:63,b:[1576,818,2008,1207],s:[52,76,48,22]}];
CATS.forEach((c,i)=>{const t=document.createElement('button');t.className='tile g';t.dataset.i=i;
  Object.assign(t.style,{left:c.s[0]+'%',top:c.s[1]+'%',width:c.s[2]+'%',height:c.s[3]+'%'});
  t.innerHTML=`<span class="pi"></span><span class="lb">${c.n}</span>`;t.onclick=()=>pick(i);$('#wall').appendChild(t);});

/* ---------- popped card: glides from the clicked tile to the front ---------- */
let cur=2;
function fillPop(i){const c=CATS[i],p=$('#pop');p.querySelector('.lb').textContent=c.n;p.querySelector('.ct').textContent=c.ct+' items';sprite(p.querySelector('.pi'),c.b);}
function pick(i){if(i===cur){openCat(i);return;}
  const tiles=$$('.tile'),from=tiles[i],pop=$('#pop');
  const a=from.getBoundingClientRect(),b=pop.getBoundingClientRect();
  tiles.forEach(t=>t.classList.toggle('lifted',+t.dataset.i===i));
  fillPop(i);cur=i;
  const sx=a.width/b.width,sy=a.height/b.height,dx=a.left-b.left,dy=a.top-b.top;
  pop.animate([{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,opacity:.6},{transform:'none',opacity:1}],{duration:650,easing:'cubic-bezier(.2,.85,.25,1.05)'});
  openCat(i);}
function openCat(i){const c=CATS[i];sprite($('#big'),c.b);
  $$('.ph').forEach(p=>p.classList.toggle('on',p.id==='catView'));$$('.tab').forEach(b=>b.classList.remove('on'));
  caption('Category · '+c.ct+' items',`${c.n}<div class="row"><button class="s">Shop now</button><button onclick="setTab(tab)">← Back</button></div>`,true);}
$('#pop').onclick=()=>openCat(cur);

/* ---------- light cursor parallax: one eased transform ---------- */
let tx=0,ty=0,cx=0,cy=0;addEventListener('pointermove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5;});
(function loop(){const ex=tx-cx,ey=ty-cy;
  if(Math.abs(ex)>1e-4||Math.abs(ey)>1e-4){cx+=ex*.06;cy+=ey*.06;const pl=$('#plane').style;pl.setProperty('--py',(cx*5).toFixed(3)+'deg');pl.setProperty('--px',(-cy*3).toFixed(3)+'deg');
    $('#room').style.transform=`translate3d(${(-cx*18).toFixed(1)}px,${(-cy*10).toFixed(1)}px,0)`;
    const po=$('#pop').style;po.setProperty('--ox',(cx*14).toFixed(1)+'px');po.setProperty('--oy',(cy*8).toFixed(1)+'px');}
  requestAnimationFrame(loop);})();

/* ---------- boot ---------- */
setTab(1,true);
function layout(){$$('.tile').forEach((t,i)=>sprite(t.querySelector('.pi'),CATS[i].b));fillPop(cur);$$('.tile').forEach(t=>t.classList.toggle('lifted',+t.dataset.i===cur));sprite($('#big'),CATS[cur].b);}
requestAnimationFrame(layout);addEventListener('resize',layout);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')setTab((tab+1)%3);if(e.key==='ArrowLeft')setTab((tab+2)%3);if(e.key==='Escape')setTab(tab);});
</script>
</body>
</html>
