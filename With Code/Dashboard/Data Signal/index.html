<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stop Digging Through Dashboards</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<script>
(function(){var d=document.documentElement;if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;d.classList.add('motion-pending');window.__mt=setTimeout(function(){d.classList.remove('motion-pending')},3500);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;font-family:"Reference Sans","Geist",Arial,sans-serif}
html,body{height:100%;overflow:hidden;background:#000;color:#fff}
button,a{font:inherit;color:inherit;text-decoration:none;border:0;background:none;cursor:pointer;transition:filter 140ms,opacity 140ms}
button:hover,a:hover{filter:brightness(1.08)}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.viewport{position:fixed;inset:0;isolation:isolate;background:#000}
.screen{
--gutter-start:clamp(36px,4.177vw,96px);--gutter-end:clamp(36px,4.04vw,96px);
--header-top:clamp(20px,2.264vh,30px);--hero-bottom:clamp(34px,5.19vh,64px);
--display-size:clamp(58px,7.64vh,88px);--display-leading:clamp(72px,9.34vh,106px);
--copy-size:clamp(14px,1.70vh,19px);--copy-leading:clamp(19px,2.17vh,24px);
--title-copy-gap:clamp(15px,2.08vh,24px);--copy-cta-gap:clamp(24px,3.11vh,36px);
--cta-width:clamp(142px,15.09vh,168px);--cta-height:clamp(38px,3.96vh,44px);
--card-width:clamp(150px,18.96vh,215px);
position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;height:100%;background:#000;overflow:hidden}
.background{position:absolute;inset:0;z-index:-3;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none;user-select:none;background:
 radial-gradient(ellipse at 55% 50%,#d9a14a 0,#c8431a 18%,#6b1a08 42%,#000 75%)}
.screen::before{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.03),transparent 24%,transparent 82%,rgba(0,0,0,.05)),radial-gradient(ellipse at 44% 54%,transparent 30%,rgba(0,0,0,.055) 100%)}
.header{position:absolute;inset:var(--header-top) var(--gutter-end) auto var(--gutter-start);height:48px;display:flex;align-items:flex-start;white-space:nowrap;z-index:5}
.brand{position:relative;top:10px;width:25px;height:25px;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.brand svg{display:block}
.header-actions{display:flex;align-items:flex-start;flex:1;min-width:0}
.nav{display:flex;margin-left:clamp(36px,3.03vw,48px);gap:clamp(32px,2.9vw,43px);position:relative;top:9px}
.nav a{position:relative;font-size:16px;font-weight:430;letter-spacing:-.36px;color:rgba(229,229,230,.77);text-shadow:0 1px 3px rgba(0,0,0,.55)}
.nav a:first-child{top:-3px}
.nav a:nth-child(4){margin-left:1px}
.nav a.active{color:#fff}
.nav a.active::after{content:"";position:absolute;left:0;bottom:-6px;width:44px;height:2px;background:rgba(255,255,255,.82)}
.time-panel{margin-left:auto;width:211px;height:48px;padding-left:8px;border-left:2px solid rgba(230,230,230,.52);display:flex;flex-direction:column;justify-content:center;gap:1px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.time-panel label{font-size:15px;font-weight:420;color:rgba(240,240,240,.77)}
.time-panel span{font-size:15px;font-weight:440;color:rgba(255,255,255,.93)}
.sign-up{width:109px;height:42px;border-radius:7px;background:#fff;color:#101010;font-weight:460;font-size:16px;letter-spacing:-.34px;box-shadow:inset 0 1px 0 rgba(255,255,255,.72),0 1px 5px rgba(0,0,0,.34);margin-left:clamp(20px,1.95vw,29px);flex:none}
.menu-toggle{display:none}
.hero-content{position:absolute;left:var(--gutter-start);bottom:var(--hero-bottom);display:flex;flex-direction:column;align-items:flex-start}
.hero-title{font-family:"Reference Display","Instrument Serif","Reference Sans",Georgia,serif;font-weight:500;font-optical-sizing:auto;font-size:var(--display-size);line-height:var(--display-leading);letter-spacing:-2.1px;-webkit-text-stroke:.12px currentColor;white-space:nowrap;text-shadow:0 2px 2px rgba(0,0,0,.44)}
.line{display:block;transform-origin:left center;overflow:hidden}
.line-reveal{display:block}
.line-one{color:#fff;transform:scaleX(.775)}
.line-two{color:rgba(211,207,207,.78);transform:scaleX(.793)}
.hero-copy{position:relative;left:1px;width:clamp(390px,31.67vw,500px);margin-top:var(--title-copy-gap);font-size:var(--copy-size);line-height:var(--copy-leading);color:rgba(226,229,228,.84);font-weight:350;letter-spacing:.13px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.primary-cta{position:relative;margin-top:var(--copy-cta-gap);width:var(--cta-width);height:var(--cta-height);border-radius:7px;background:#fff;color:#111;box-shadow:0 1px 5px rgba(0,0,0,.38);text-align:left}
.primary-cta .label{position:absolute;left:8.125%;top:50%;transform:translateY(-50%);font-weight:450;letter-spacing:-.3px;font-size:clamp(15px,1.77vh,17px);white-space:nowrap}
.arrow-box{position:absolute;right:3.125%;top:14.286%;width:20.625%;height:71.429%;border-radius:7px;background:#070909;display:grid;place-items:center}
.demo-card{position:absolute;right:var(--gutter-end);bottom:var(--hero-bottom);width:var(--card-width);aspect-ratio:201/265;container-type:inline-size;border:1px solid rgba(255,255,255,.13);border-radius:clamp(12px,1.52vh,18px);background:linear-gradient(145deg,rgba(24,22,20,.80),rgba(5,12,14,.86));box-shadow:0 2px 10px rgba(0,0,0,.44),0 0 0 3px rgba(255,255,255,.035) inset,0 0 0 1px rgba(0,0,0,.9);backdrop-filter:blur(14px) saturate(108%);-webkit-backdrop-filter:blur(14px) saturate(108%)}
.demo-visual{position:absolute;left:3.5cqw;top:4cqw;width:92.5cqw;height:92cqw;border-radius:4cqw;background:#101a1e;overflow:hidden}
.demo-visual .thumb{position:absolute;inset:0;filter:brightness(.89) saturate(.93) contrast(1.03);background:
 radial-gradient(circle at 20% 30%,#d9503f 0,transparent 30%),
 radial-gradient(circle at 70% 25%,#c43a3a 0,transparent 28%),
 radial-gradient(circle at 45% 60%,#e0705a 0,transparent 26%),
 radial-gradient(circle at 85% 70%,#3b6a9a 0,transparent 25%),
 radial-gradient(circle at 15% 85%,#7a2a34 0,transparent 30%),
 radial-gradient(circle at 60% 90%,#a23030 0,transparent 25%),#1b2a3a}
.play{position:absolute;left:50%;top:50%;width:29cqw;height:29cqw;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,255,255,.34);background:rgba(3,5,7,.47);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center}
.play svg{width:34%;height:34%;margin-left:6%}
.watch-button{position:absolute;left:3.5cqw;right:3.5cqw;bottom:3.5cqw;height:14.5cqw;border-radius:2.6cqw;border:1px solid rgba(255,255,255,.21);background:linear-gradient(145deg,rgba(26,34,36,.86),rgba(16,29,33,.9));font-weight:430;font-size:clamp(13px,8cqw,17px);color:#fff;display:grid;place-items:center;padding-bottom:1px}

/* entrance */
@keyframes entrance-brand{from{opacity:0;transform:translateY(7px) scale(.94)}to{opacity:1;transform:none}}
@keyframes entrance-nav{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes entrance-action{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes entrance-line{from{transform:translate3d(0,110%,0) skewY(2deg)}to{transform:none}}
@keyframes entrance-copy{from{opacity:0;transform:translateY(10px) scale(.992)}to{opacity:1;transform:none}}
@keyframes entrance-card{from{opacity:0;transform:translateY(12px) scale(.968)}to{opacity:1;transform:none}}
.motion-pending .brand,.motion-pending .nav a,.motion-pending .time-panel,.motion-pending .sign-up,.motion-pending .menu-toggle,.motion-pending .hero-copy,.motion-pending .primary-cta,.motion-pending .demo-card{opacity:0}
.motion-pending .line-reveal{transform:translate3d(0,110%,0) skewY(2deg)}
.motion-pending .brand{animation:entrance-brand 580ms cubic-bezier(.16,1,.3,1) 60ms both}
.motion-pending .nav a{animation:entrance-nav 480ms cubic-bezier(.16,1,.3,1) both}
.motion-pending .nav a:nth-child(1){animation-delay:130ms}.motion-pending .nav a:nth-child(2){animation-delay:175ms}.motion-pending .nav a:nth-child(3){animation-delay:220ms}.motion-pending .nav a:nth-child(4){animation-delay:265ms}
.motion-pending .time-panel{animation:entrance-nav 520ms cubic-bezier(.16,1,.3,1) 180ms both}
.motion-pending .sign-up{animation:entrance-action 520ms cubic-bezier(.16,1,.3,1) 220ms both}
.motion-pending .menu-toggle{animation:entrance-action 520ms cubic-bezier(.16,1,.3,1) 140ms both}
.motion-pending .line-one .line-reveal{animation:entrance-line 800ms cubic-bezier(.22,1,.36,1) 300ms both}
.motion-pending .line-two .line-reveal{animation:entrance-line 850ms cubic-bezier(.22,1,.36,1) 440ms both}
.motion-pending .hero-copy{animation:entrance-copy 620ms cubic-bezier(.16,1,.3,1) 740ms both}
.motion-pending .primary-cta{animation:entrance-action 560ms cubic-bezier(.16,1,.3,1) 960ms both}
.motion-pending .demo-card{transform-origin:82% 50%;animation:entrance-card 920ms cubic-bezier(.22,1,.36,1) 1040ms both}

/* tablet + mobile menu */
@media (min-width:620px) and (max-width:790px),(min-width:620px) and (max-width:1100px) and (orientation:portrait),(max-width:619px){
 .menu-toggle{display:grid;place-items:center;position:absolute;right:0;top:0;width:46px;height:46px;border-radius:11px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(145deg,rgba(26,34,36,.8),rgba(10,18,20,.86));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
 .menu-toggle svg line{transition:transform 240ms,opacity 240ms;transform-origin:center;transform-box:fill-box}
 .header.menu-open .menu-toggle .l1{transform:translateY(3px) rotate(45deg)}
 .header.menu-open .menu-toggle .l2{transform:translateY(-3px) rotate(-45deg)}
 .header-actions{position:absolute;right:0;top:56px;flex:none;flex-direction:column;align-items:stretch;gap:18px;width:min(324px,calc(100vw - 2*var(--gutter-end)));padding:20px;border-radius:16px;border:1px solid rgba(255,255,255,.15);background:linear-gradient(145deg,rgba(24,22,20,.86),rgba(5,12,14,.92));backdrop-filter:blur(18px) saturate(110%);-webkit-backdrop-filter:blur(18px) saturate(110%);opacity:0;visibility:hidden;transform:translateY(-8px) scale(.985);transition:opacity 220ms,transform 220ms,visibility 220ms}
 .header.menu-open .header-actions{opacity:1;visibility:visible;transform:none}
 .nav{margin:0;top:0;flex-direction:column;gap:16px}
 .nav a,.nav a:first-child{top:0;margin:0}
 .nav a.active::after{bottom:-4px}
 .time-panel{margin:0;width:auto}
 .sign-up{margin:0;width:100%}
}
@media (max-width:619px){
 .screen{--gutter-start:max(20px,env(safe-area-inset-left));--gutter-end:max(20px,env(safe-area-inset-right));--display-size:clamp(44px,13.4vw,60px);--display-leading:clamp(52px,15.5vw,68px);--hero-bottom:max(28px,env(safe-area-inset-bottom))}
 .header-actions{width:min(340px,calc(100vw - 2*var(--gutter-end)))}
 .hero-title{letter-spacing:-1.4px}
 .line-one{transform:scaleX(.78)}.line-two{transform:scaleX(.78)}
 .hero-copy{width:calc(100vw - 2*var(--gutter-start));max-width:420px;font-size:15px;line-height:21px}
 .hero-copy br{display:none}
 .demo-card{top:clamp(176px,32svh,300px);bottom:auto;width:clamp(130px,38vw,160px)}
 .primary-cta{width:150px;height:42px}
}
@media (max-width:619px) and (max-height:520px){.demo-card{top:90px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="viewport">
<section class="screen" id="screen">
 <video class="background" autoplay muted loop playsinline disablepictureinpicture aria-hidden="true">
  <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260808_064556_051587f1-74a1-4336-8c05-4dde3594ed05.mp4" type="video/mp4">
 </video>
 <header class="header" id="header">
  <a class="brand" href="#" aria-label="Vantage home">
   <svg width="25" height="25" viewBox="0 0 25 25"><defs><clipPath id="c"><circle cx="12.5" cy="12.5" r="12.5"/></clipPath></defs><g clip-path="url(#c)"><rect width="25" height="25" fill="#ededed"/><path d="M0 0L14 0L6 11Z" fill="#050606"/><path d="M14 0L25 0L25 9L17 8Z" fill="#737778"/><path d="M0 12L10 9L16 18L5 25L0 25Z" fill="#0a0b0b"/><path d="M12 25L18 14L25 17L25 25Z" fill="#050606"/><path d="M8 4L16 6L11 12Z" fill="#fafafa"/></g></svg>
  </a>
  <div class="header-actions" id="tablet-navigation">
   <nav class="nav"><a class="active" href="#">Home</a><a href="#">About</a><a href="#">Services</a><a href="#">Contact</a></nav>
   <div class="time-panel"><label>Timezone</label><span>9:47 PM&nbsp; • &nbsp;14 July 2026</span></div>
   <button class="sign-up">Sign Up</button>
  </div>
  <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="tablet-navigation" aria-label="Menu"><svg width="20" height="14" viewBox="0 0 20 14"><line class="l1" x1="2" y1="4" x2="18" y2="4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><line class="l2" x1="2" y1="10" x2="18" y2="10" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></button>
 </header>
 <section class="hero">
  <div class="hero-content">
   <h1 class="hero-title"><span class="line line-one"><span class="line-reveal">Stop Digging</span></span><span class="line line-two"><span class="line-reveal">Through Dashboards.</span></span></h1>
   <p class="hero-copy">Your metrics are scattered across a dozen dashboards.<br>
Vantage bring them into one clear signal, so every<br>
decision is backed by data you actually trust.</p>
   <button class="primary-cta"><span class="label">Get Started</span><span class="arrow-box"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7h9M7.5 3l4 4-4 4"/></svg></span></button>
  </div>
  <article class="demo-card" id="demo-card">
   <div class="demo-visual"><div class="thumb" role="img" aria-label="Abstract red and blue smoke"></div>
    <button class="play" aria-label="Play demo"><svg viewBox="0 0 14 14"><path d="M2 .5v13l11-6.5z" fill="#fff"/></svg></button></div>
   <button class="watch-button">Watch Demo</button>
  </article>
 </section>
</section>
</main>
<script>
(function(){
 var d=document.documentElement,card=document.getElementById('demo-card');
 card.addEventListener('animationend',function(){d.classList.remove('motion-pending');clearTimeout(window.__mt)});
 var h=document.getElementById('header'),t=document.getElementById('menu-toggle'),nav=document.getElementById('tablet-navigation');
 function vis(){return getComputedStyle(t).display!=='none'}
 function sync(){var o=h.classList.contains('menu-open');t.setAttribute('aria-expanded',o);if(vis()&&!o)nav.setAttribute('inert','');else nav.removeAttribute('inert')}
 function set(o,f){h.classList.toggle('menu-open',o);sync();if(o&&f){var a=nav.querySelector('a');a&&a.focus()}}
 t.addEventListener('click',function(){set(!h.classList.contains('menu-open'),true)});
 document.addEventListener('keydown',function(e){if(e.key==='Escape')set(false)});
 document.addEventListener('pointerdown',function(e){if(!h.contains(e.target))set(false)});
 nav.addEventListener('click',function(e){if(e.target.closest('a'))set(false)});
 addEventListener('resize',sync);sync();
})();
</script>
</body>
