<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff}
body{font-family:"Inter",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:rgba(255,255,255,.3)}
button,input{font:inherit;color:inherit}
main{display:flex;min-height:100vh;width:100%;background:#000;padding:8px}
.hero{display:none;position:relative;width:52%;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 48px 128px;border-radius:24px;overflow:hidden;box-shadow:0 25px 50px -12px rgba(0,0,0,.5);height:100%;
background:linear-gradient(180deg,#e2d4f4 0%,#a883e0 14%,#6a43c4 30%,#4a2c96 50%,#1c1040 75%,#0c0618 100%)}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-content{position:relative;z-index:10;width:100%;max-width:320px;display:flex;flex-direction:column;gap:32px}
.hero-content>*{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.go .hero-content>*{opacity:1;transform:none}
.go .hero-content>*:nth-child(1){transition-delay:.2s}
.go .hero-content>*:nth-child(2){transition-delay:.35s}
.go .hero-content>*:nth-child(3){transition-delay:.5s}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;font-size:20px;font-weight:600;letter-spacing:-.025em}
.brand svg{width:24px;height:24px}
.head{text-align:center}
.head h1{font-size:36px;line-height:40px;font-weight:500;letter-spacing:-.025em;white-space:nowrap}
.head p{margin-top:16px;color:rgba(255,255,255,.6);font-size:14px;line-height:1.625;padding:0 16px}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;align-items:center;gap:12px;padding:0 16px;height:54px;border-radius:12px;font-size:15px;font-weight:500;background:#1A1A1A;color:#fff}
.step .n{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:rgba(255,255,255,.1);color:rgba(255,255,255,.4)}
.step.active{background:#fff;color:#000;border:1px solid #fff}
.step.active .n{background:#000;color:#fff}
.right{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px;overflow-y:auto;min-width:0}
.form-wrap{width:100%;max-width:576px;display:flex;flex-direction:column;gap:32px;opacity:0;transition:opacity .8s ease-out}
.go .form-wrap{opacity:1}
.title{text-align:center}
.title h2{font-size:30px;line-height:36px;font-weight:500;letter-spacing:-.025em}
.title p{margin-top:8px;color:rgba(255,255,255,.4);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.social{display:flex;align-items:center;justify-content:center;gap:12px;height:48px;background:#000;border:1px solid rgba(255,255,255,.1);border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s}
.social:hover{background:rgba(255,255,255,.05)}
.social svg{width:20px;height:20px}
.divider{position:relative;display:flex;justify-content:center;align-items:center}
.divider:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid rgba(255,255,255,.1)}
.divider span{position:relative;background:#000;padding:0 16px;font-size:12px;font-weight:500;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em}
form{display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field label{font-size:14px;font-weight:500}
.field input{width:100%;height:44px;background:#1A1A1A;border:none;border-radius:12px;padding:0 16px;color:#fff;font-size:16px;outline:none;transition:box-shadow .2s}
.field input::placeholder{color:rgba(255,255,255,.2)}
.field input:focus{box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.pw{position:relative}
.pw input{padding-right:48px}
.eye{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(255,255,255,.6);display:flex}
.eye:hover{color:#fff}
.eye svg{width:20px;height:20px}
.hint{font-size:11px;color:rgba(255,255,255,.4)}
.submit{width:100%;height:56px;margin-top:16px;background:#fff;color:#000;font-weight:600;border:none;border-radius:12px;cursor:pointer;transition:background .2s,transform .1s}
.submit:hover{background:rgba(255,255,255,.9)}
.submit:active{transform:scale(.98)}
.foot{text-align:center;font-size:14px;color:rgba(255,255,255,.4)}
.foot a{color:#fff;text-decoration:none;font-weight:500}
@media(min-width:640px){.right{padding:48px 48px}.form-wrap{gap:40px}}
@media(min-width:1024px){
main{height:100vh;overflow:hidden;padding:16px}
.hero{display:flex}
.right{padding:24px 64px;overflow:hidden}
.form-wrap{gap:24px}
.field input{font-size:15px}
}
@media(min-width:1280px){.right{padding:24px 96px}}
@media(max-width:1023px){.hero-mobile{display:block}}
</style>
</head>
<body>
<main id="app">
  <section class="hero">
    <video autoplay muted loop playsinline><source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260506_081238_406ed0e3-5d83-436e-a512-0bbff7ec5b95.mp4" type="video/mp4"></video>
    <div class="hero-content">
      <div class="brand"><svg viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg><span>Aurora</span></div>
      <div class="head"><h1>Join Aurora</h1><p>Follow these 3 quick phases to activate your space.</p></div>
      <div class="steps">
        <div class="step active"><span class="n">1</span>Register your identity</div>
        <div class="step"><span class="n">2</span>Configure your studio</div>
        <div class="step"><span class="n">3</span>Finalize your profile</div>
      </div>
    </div>
  </section>
  <section class="right">
    <div class="form-wrap">
      <div class="title"><h2>Create New Profile</h2><p>Input your basic details to begin the journey.</p></div>
      <div class="grid2">
        <button class="social" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="21.17" x2="12" y1="8" y2="8"/><line x1="3.95" x2="8.54" y1="6.06" y2="14"/><line x1="10.88" x2="15.46" y1="21.94" y2="14"/></svg>Google</button>
        <button class="social" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>Github</button>
      </div>
      <div class="divider"><span>Or</span></div>
      <form id="f" onsubmit="return false">
        <div class="grid2">
          <div class="field"><label for="fn">First Name</label><input id="fn" type="text" placeholder="ex. Alex"></div>
          <div class="field"><label for="ln">Last Name</label><input id="ln" type="text" placeholder="ex. Sterling"></div>
        </div>
        <div class="field"><label for="em">Email</label><input id="em" type="email" placeholder="ex. alex.s@aurora.io"></div>
        <div class="field"><label for="pw">Password</label>
          <div class="pw"><input id="pw" type="password" placeholder="Secure your account">
            <button class="eye" type="button" id="eye" aria-label="Toggle password visibility"><svg id="eyeic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          <span class="hint">Requires at least 8 symbols.</span>
        </div>
        <button class="submit" type="submit">Create Account</button>
      </form>
      <p class="foot">Member of the team? <a href="#">Log in</a></p>
    </div>
  </section>
</main>
<script>
requestAnimationFrame(function(){requestAnimationFrame(function(){document.getElementById('app').classList.add('go')})});
var pw=document.getElementById('pw'),ic=document.getElementById('eyeic');
document.getElementById('eye').onclick=function(){
  var show=pw.type==='password';pw.type=show?'text':'password';
  ic.innerHTML=show?'<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>':'<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>';
};
</script>
</body>
</html>
