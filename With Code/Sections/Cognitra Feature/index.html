<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cognitra Feature</title>
<style>
@import url('https://db.onlinewebfonts.com/c/e66905e07608167a84e6ad52f638c3c6?family=Helvetica+Now+Var');
*{box-sizing:border-box;font-family:'Helvetica Now Var','Helvetica Neue',Helvetica,Arial,sans-serif}
html,body{margin:0;background:#0a0a0f;overflow-x:hidden}
.bg{position:fixed;top:0;left:0;width:100%;height:100vh;object-fit:cover;z-index:0;background:radial-gradient(ellipse at 70% 30%,#2a2f5c,#0a0a0f 70%)}
section{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;height:100vh;padding:70px 32px 32px 32px}
.wrap{display:flex;flex-direction:column;align-items:flex-start;max-width:720px}
h2{display:flex;flex-wrap:wrap;gap:.25em;margin:0;font-size:clamp(26px,3vw,42px);font-weight:700;line-height:1.08;letter-spacing:-.01em;text-transform:uppercase;color:#fff}
.fu{opacity:0;transform:translateY(32px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}
.fu.in{opacity:1;transform:none}
p{margin:24px 0 0;font-size:14px;line-height:1.65;color:rgba(255,255,255,.85);max-width:260px}
p.fu{transform:translateY(24px)}
p.fu.in{transform:none}
@media(max-width:900px){section{padding:90px 18px 32px 18px}}
</style>
</head>
<body>
<video class="bg" autoplay muted loop playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260514_135830_bb6491d1-9b66-4aec-9722-13b4dfe3fb46.mp4"></video>
<section>
  <div class="wrap">
    <h2 id="h"></h2>
    <p class="fu" data-d="0.9">We provide all-in-one AI automation services in one place.</p>
  </div>
</section>
<script>
(function(){
  var h=document.getElementById('h');
  "WE BUILD END-TO-END AI AUTOMATION SYSTEMS.".split(' ').forEach(function(w,i){
    var s=document.createElement('span');s.className='fu';s.textContent=w;
    s.dataset.d=(0.15+0.08*i).toFixed(2);h.appendChild(s);
  });
  var els=document.querySelectorAll('.fu');
  function show(e){e.style.transitionDelay=e.dataset.d+'s';e.classList.add('in');}
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){show(x.target);io.unobserve(x.target);}})},{threshold:0.2});
    els.forEach(function(e){io.observe(e)});
  } else els.forEach(show);
})();
</script>
</body>
</html>
