body.stacked .divider{margin-bottom:20px}
body.stacked .divider i{flex:1 1 0!important}
body.stacked .divider b{flex:0 0 auto;padding:0 14px}

/* entrance */
.entry-pending .card,.entry-pending .badge,.entry-pending #hl1,.entry-pending #hl2,.entry-pending #h1,.entry-pending #sub,.entry-pending #email,.entry-pending #pw,.entry-pending #loginBtn,.entry-pending .divider,.entry-pending #gBtn,.entry-pending #bottom{opacity:0;will-change:transform,opacity,clip-path}
.entry-pending .card{transform:translateY(12px) scale(.988)}
.entry-pending .badge{transform:translateY(8px)}
.entry-pending #hl1,.entry-pending #hl2{transform:translateY(16px);clip-path:inset(100% 0 0 0)}
.entry-pending #h1,.entry-pending #sub{transform:translateY(10px)}
.entry-pending #email,.entry-pending #pw,.entry-pending #loginBtn,.entry-pending #gBtn{transform:translateY(8px)}
.entry-pending .divider,.entry-pending #bottom{transform:translateY(6px)}
@media (max-width:699px){.entry-pending .card{transform:translateY(14px)}.entry-pending #hl1,.entry-pending #hl2{transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
.entry-pending .card,.entry-pending .badge,.entry-pending #hl1,.entry-pending #hl2,.entry-pending #h1,.entry-pending #sub,.entry-pending #email,.entry-pending #pw,.entry-pending #loginBtn,.entry-pending .divider,.entry-pending #gBtn,.entry-pending #bottom{opacity:1;transform:none;clip-path:none;will-change:auto}
}
</style>

<script>
(function(){
var REF_W=1464,PHOTO_W=836,PANE_W=628,CARD_W=613,CARD_H=922,CONTENT_H=697;
var IMG_W=1177,IMG_H=1336,IMG_REF_SCALE=836/1177;
var PANE_RATIO=PANE_W/REF_W,HERO_W=681;
var RAMP_HI=1280,RAMP_LO=1000,PHOTO_MIN=0.42,RAMP_LO2=820,PHOTO_MIN2=0.36;
var photo=document.getElementById('photo'),pane=document.getElementById('pane'),card=document.getElementById('card'),cardIn=document.getElementById('cardIn'),hero=document.getElementById('hero');
var mqLandscape=window.matchMedia('(min-width:700px) and (min-aspect-ratio:51/50)');
var mqPortrait=window.matchMedia('(min-width:700px) and (max-aspect-ratio:51/50)');
var mode='';
function clearInline(){[photo,pane,card,cardIn,hero].forEach(function(e){e.style.cssText=''});document.body.style.removeProperty('--band-h')}
function setMode(m){
  if(m!==mode){clearInline();mode=m}
  document.body.classList.toggle('tabport',m==='tabport');
  document.body.classList.toggle('stacked',m==='phone');
}
function photoRatio(vw){
  var full=1-PANE_RATIO;
  if(vw>=RAMP_HI)return full;
  if(vw>=RAMP_LO){var t=(RAMP_HI-vw)/(RAMP_HI-RAMP_LO);return full+(PHOTO_MIN-full)*t}
  if(vw>=RAMP_LO2){var u=(RAMP_LO-vw)/(RAMP_LO-RAMP_LO2);return PHOTO_MIN+(PHOTO_MIN2-PHOTO_MIN)*u}
  return PHOTO_MIN2;
}
function seatHero(photoW,bandH){
  var imgScale=Math.max(photoW/IMG_W,bandH/IMG_H);
  var s=Math.min(imgScale/IMG_REF_SCALE,photoW*0.92/HERO_W);
  hero.style.transform='scale('+s+')';
}
function layout(){
  var vw=window.innerWidth,vh=window.innerHeight;
  if(vw<700){setMode('phone');return}
  if(mqLandscape.matches){
    setMode('land');
    var pr=photoRatio(vw),pw=vw*pr,paneW=vw-pw;
    photo.style.width=pw+'px';
    pane.style.left=pw+'px';
    var cs=Math.min(paneW/PANE_W,vh/CONTENT_H);
    var gapL=1*cs,mT=14*cs,mB=13*cs,mR=14*cs;
    var cw=Math.max(CARD_W*cs,paneW-gapL-mR),ch=vh-mT-mB;
    card.style.cssText='left:'+gapL+'px;top:'+mT+'px;width:'+cw+'px;height:'+ch+'px;border-radius:'+26*cs+'px;border-width:'+Math.max(1,cs)+'px';
    cardIn.style.transform='translate('+((cw-CARD_W*cs)/2)+'px,0) scale('+cs+')';
    seatHero(pw,vh);
  }else{
    setMode('tabport');
    var band=Math.round(vh*0.425),side=Math.round(vw*0.0525),foot=Math.round(vh*0.0297);
    document.body.style.setProperty('--band-h',band+'px');
    var cw2=vw-2*side,ch2=vh-band-foot-side*0.4;
    pane.style.cssText='';
    card.style.cssText='left:'+side+'px;top:'+Math.round(-side*0.5)+'px;width:'+cw2+'px;height:'+(ch2+side*0.5)+'px;border-radius:26px';
    var cs2=Math.min(cw2/CARD_W,(ch2+side*0.5)/CARD_H*1.0);
    cs2=Math.min(cw2/CARD_W,(ch2+side*0.5)/CONTENT_H);
    cardIn.style.transform='translate('+((cw2-CARD_W*cs2)/2)+'px,0) scale('+cs2+')';
    var hs=Math.min(band*0.0742/37*1.6,2);
    hero.style.cssText='width:'+vw+'px;height:'+band+'px;transform:scale('+Math.min(vw/HERO_W*0.75,band/260)+');transform-origin:left bottom;left:'+side*0.5+'px';
  }
}
window.addEventListener('resize',layout,{passive:true});
window.addEventListener('orientationchange',layout);
if(mqLandscape.addEventListener){mqLandscape.addEventListener('change',layout);mqPortrait.addEventListener('change',layout)}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
layout();
})();
</script>
<script>
(function(){
function releaseEntrance(){document.documentElement.classList.remove('entry-pending');clearTimeout(window.__entryFallback)}
var reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
if(reduce||!Element.prototype.animate){releaseEntrance();return}
var ease='cubic-bezier(.16,1,.3,1)',softEase='cubic-bezier(.22,1,.36,1)';
var compact=window.matchMedia('(max-width:699px)').matches;
var anims=[];
function step(sel,delay,dur,easing,from,extra){
  var el=document.querySelector(sel);if(!el)return;
  var f={opacity:0,transform:from},t={opacity:1,transform:'none'};
  if(extra){f.clipPath='inset(100% 0 0 0)';t.clipPath='inset(0 0 0 0)'}
  anims.push(el.animate([f,t],{delay:delay,duration:dur,easing:easing,fill:'both'}));
}
function run(){
  var hy=compact?'translateY(12px)':'translateY(16px)';
  step('.card',40,820,ease,compact?'translateY(14px)':'translateY(12px) scale(.988)');
  step('.badge',120,480,softEase,'translateY(8px)');
  step('#hl1',240,760,ease,hy,true);
  step('#hl2',330,760,ease,hy,true);
  step('#h1',470,620,ease,'translateY(10px)');
  step('#sub',570,560,ease,'translateY(10px)');
  step('#email',720,520,softEase,'translateY(8px)');
  step('#pw',790,520,softEase,'translateY(8px)');
  step('#loginBtn',930,560,ease,'translateY(8px)');
  step('.divider',1060,440,softEase,'translateY(6px)');
  step('#gBtn',1150,540,ease,'translateY(8px)');
  step('#bottom',1260,500,softEase,'translateY(6px)');
  document.documentElement.classList.remove('entry-pending');
  Promise.allSettled(anims.map(function(a){return a.finished})).then(function(){
    anims.forEach(function(a){a.cancel()});anims=[];releaseEntrance();
  });
}
Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(function(r){setTimeout(r,650)})]).then(function(){
  requestAnimationFrame(function(){requestAnimationFrame(run)});
});
})();
</script>
