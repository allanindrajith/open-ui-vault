<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexaCore Results</title>
<style>
@font-face{font-family:'Mazzard H';font-weight:400;font-style:normal;src:url('https://db.onlinewebfonts.com/t/eb5b5ee332420add9a40ee988cb6ac37.woff2') format('woff2'),url('https://db.onlinewebfonts.com/t/eb5b5ee332420add9a40ee988cb6ac37.woff') format('woff'),url('https://db.onlinewebfonts.com/t/eb5b5ee332420add9a40ee988cb6ac37.ttf') format('truetype');}
@font-face{font-family:'Mazzard H';font-weight:500;font-style:normal;src:url('https://db.onlinewebfonts.com/t/875fffdfa62169a0f131e90f37f1faf4.woff2') format('woff2'),url('https://db.onlinewebfonts.com/t/875fffdfa62169a0f131e90f37f1faf4.woff') format('woff'),url('https://db.onlinewebfonts.com/t/875fffdfa62169a0f131e90f37f1faf4.ttf') format('truetype');}
*,*::before,*::after{box-sizing:border-box;border:0 solid #e5e7eb}
html,body,*{font-family:'Mazzard H','Inter','Helvetica Neue',Arial,sans-serif}
html,body{margin:0;overflow-x:hidden;background:#f3ecff}
:root{--line:linear-gradient(rgb(28,78,255),rgb(254,136,27) 0%,rgb(172,36,255) 25%,rgb(247,159,255) 50%,rgb(255,214,0) 66%,rgb(254,136,27) 84%,rgba(254,136,27,0) 102%);}
.section{
  background-color:#efe6ff;
  background-image:url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260418_125638_553b96dc-a1fd-4b2b-81a9-ed7daa80006e.png&w=1280&q=85");
  background-size:cover;background-position:center;background-repeat:no-repeat;
  width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:clamp(48px,8vw,120px) clamp(16px,4vw,60px) clamp(48px,5.56vw,80px);
  gap:clamp(32px,4vw,56px);
}
.hdr{display:flex;flex-direction:column;align-items:center;gap:36px;max-width:100%}
.badge{background-color:rgb(249,249,249);display:flex;align-items:center;gap:8px;font-size:clamp(14px,1.1vw,18px);font-weight:500;border-radius:36px;padding:clamp(8px,.9vw,14px) clamp(12px,1.25vw,20px);color:rgb(26,11,84);white-space:nowrap}
.badge svg{flex-shrink:0}
.hd{display:flex;flex-direction:column;align-items:center;max-width:clamp(700px,60vw,900px);gap:22px}
h2{font-size:clamp(28px,4vw,56px);font-weight:500;color:rgb(26,11,84);line-height:1.15;margin:0}
h2 span{display:block}
h2 .g{background-image:linear-gradient(90deg,rgb(43,167,255),rgb(202,69,255) 50%,rgb(254,136,27));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;padding-bottom:.3vw}
.sub{font-size:clamp(15px,1.2vw,20px);color:rgb(169,151,206);margin:0}
.pc{width:100%;max-width:82.292vw;margin:0 auto}
.desk{display:none}
.mob{display:flex;flex-direction:column;width:100%;color:rgb(26,11,84);gap:0}
@media(min-width:640px){
  .desk{display:block;position:relative;width:82.292vw;height:31.94vw;color:rgb(26,11,84);text-align:left}
  .mob{display:none}
  h2 .nw{white-space:nowrap}
}
.p{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.chip{display:flex;align-items:center;justify-content:center;background-image:linear-gradient(135deg,rgb(255,255,255),rgba(255,255,255,.6));font-size:18px;font-weight:500;border-radius:20px;padding:.972vw 1.736vw;white-space:nowrap;gap:8px}
.chip img{width:1.111vw;height:auto;display:inline-block}
.lw{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.items{position:absolute;top:.56vw;left:1.94vw;display:flex;flex-direction:column;gap:4px;font-size:16px;align-items:flex-start;justify-content:space-between}
.it{padding:.69vw 1.04vw;display:flex;align-items:flex-start}
.vl{background-image:var(--line);width:1px;height:14.24vw}
/* mobile */
.mp{display:flex;flex-direction:column;width:100%;padding-bottom:8px}
.mp.r{align-items:flex-end}.mp.l{align-items:flex-start}
.mchip{display:inline-flex;align-items:center;background-image:linear-gradient(135deg,rgb(255,255,255),rgba(255,255,255,.6));font-size:15px;font-weight:500;border-radius:20px;padding:10px 18px;white-space:nowrap;gap:7px}
.mchip img{width:16px;height:auto}
.row{display:flex;align-items:stretch;width:100%}
.r .row{flex-direction:row-reverse}
.mvl{width:1px;flex-shrink:0;background-image:var(--line);min-height:120px}
.l .mvl{margin-left:22px}.r .mvl{margin-right:22px}
.mi{display:flex;flex-direction:column;gap:0;padding-top:8px;padding-bottom:8px}
.l .mi{padding-left:20px;align-items:flex-start}.r .mi{padding-right:20px;align-items:flex-end}
.mi div{font-size:14px;color:rgb(100,80,160);padding:8px 0}
</style>
</head>
<body>
<section class="section">
  <div class="hdr">
    <div class="badge">
      <svg width="19" height="18" viewBox="0 0 17 16" fill="none"><g clip-path="url(#prec-clip)"><circle cx="8.5" cy="8" r="7" stroke="#c86fff" fill="none"/><path d="M9.5 11.5V10.5H7.5V11.5H9.5ZM7.5 14.5C7.5 15.0523 7.94772 15.5 8.5 15.5C9.05228 15.5 9.5 15.0523 9.5 14.5H7.5ZM8.5 11.5H7.5V14.5H8.5H9.5V11.5H8.5Z" fill="rgb(200, 111, 255)"/><path d="M12 7H11V9H12V7ZM15 9C15.5523 9 16 8.55228 16 8C16 7.44772 15.5523 7 15 7V9ZM12 8V9H15V8V7L12 7V8Z" fill="rgb(200, 111, 255)"/><path d="M5 9H6V7H5V9ZM2 7C1.44772 7 1 7.44772 1 8C1 8.55228 1.44772 9 2 9V7ZM5 8V7H2V8V9H5V8Z" fill="rgb(200, 111, 255)"/><path d="M7.5 4.5V5.5H9.5V4.5H7.5ZM9.5 1.5C9.5 0.947715 9.05228 0.5 8.5 0.5C7.94772 0.5 7.5 0.947715 7.5 1.5H9.5ZM8.5 4.5H9.5V1.5H8.5H7.5V4.5H8.5Z" fill="rgb(200, 111, 255)"/></g><defs><clipPath id="prec-clip"><rect width="16" height="16" fill="white" transform="translate(0.5)"/></clipPath></defs></svg>
      Structured Delivery
    </div>
    <div class="hd">
      <h2><span class="nw">One integrated, end-to-end system.</span><span class="g">Compounding operational value.</span></h2>
      <p class="sub">NexaCore teams capture, align, validate and deliver exactly what keeps your programs on track.</p>
    </div>
  </div>
  <div class="pc">
    <div class="desk" id="desk"></div>
    <div class="mob" id="mob"></div>
  </div>
</section>
<script>
var LOGO='https://cdn.prod.website-files.com/6720dd1ab6df0da205830ab1/6870f623cf3df417ce45df05_icon%20logo%20eternacloud.png';
var P=[
{l:'Scopes',i:['conditions','capacity','specs','timelines'],x:2.8,b:7},
{l:'Integrates',i:['civil','mechanical','electrical','controls'],x:22.4,b:9.08},
{l:'Certifies',i:['redundancy','testing','compliance','sign-offs'],x:41.2,b:11.16},
{l:'Activates',i:['cutover','runbooks','handoff','SLAs'],x:61.1,b:13.24}];
document.getElementById('desk').innerHTML=P.map(function(p){
 return '<div class="p" style="bottom:'+p.b+'vw;left:'+p.x+'vw"><div class="chip"><img src="'+LOGO+'" alt="">'+p.l+'</div><div class="lw"><div class="items">'+p.i.map(function(t){return '<div class="it">'+t+'</div>'}).join('')+'</div><div class="vl"></div></div></div>';
}).join('');
document.getElementById('mob').innerHTML=P.map(function(p,n){
 return '<div class="mp '+(n%2?'r':'l')+'"><div class="mchip"><img src="'+LOGO+'" alt="">'+p.l+'</div><div class="row"><div class="mvl"></div><div class="mi">'+p.i.map(function(t){return '<div>'+t+'</div>'}).join('')+'</div></div></div>';
}).join('');
</script>
</body>
</html>
