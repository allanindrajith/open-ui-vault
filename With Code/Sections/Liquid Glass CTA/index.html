<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Glass CTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{overflow-x:hidden}
body{font-family:'Barlow',sans-serif;background:#000;color:#fff;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Instrument Serif',serif;font-weight:400}
a{text-decoration:none}
button{font:inherit;border:0;cursor:pointer}
.spacer{min-height:40vh}
.cta{position:relative;padding:8rem 1.5rem;text-align:center;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.fade{position:absolute;left:0;right:0;height:200px;z-index:1;pointer-events:none}
.fade.top{top:0;background:linear-gradient(to bottom,#000,transparent)}
.fade.bottom{bottom:0;background:linear-gradient(to top,#000,transparent)}
.content{position:relative;z-index:10}
h2{font-style:italic;font-size:3rem;letter-spacing:-0.025em;line-height:.85;max-width:48rem;margin:0 auto 1rem}
.sub{color:rgba(255,255,255,.6);font-weight:300;font-size:.875rem;line-height:1.5;max-width:36rem;margin:0 auto 2rem}
.btns{display:flex;align-items:center;justify-content:center;gap:1.5rem;flex-wrap:wrap}
.btn{border-radius:9999px;padding:.75rem 1.5rem;font-size:.875rem;line-height:1.25rem;font-weight:500;display:flex;align-items:center;gap:.5rem;font-family:'Barlow',sans-serif}
.glass{color:#fff;transition:all .15s;background:rgba(255,255,255,.01);background-blend-mode:luminosity;-webkit-backdrop-filter:blur(50px);backdrop-filter:blur(50px);box-shadow:4px 4px 4px rgba(0,0,0,.05),inset 0 1px 1px rgba(255,255,255,.15);position:relative;overflow:hidden}
.glass:hover{background:rgba(255,255,255,.1)}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.2) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.2) 80%,rgba(255,255,255,.5) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.solid{background:#fff;color:#000;transition:background .15s}
.solid:hover{background:rgba(255,255,255,.9)}
.glass svg{width:1.25rem;height:1.25rem}
.solid svg{width:1rem;height:1rem}
.footer{margin-top:8rem;padding-top:2rem;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:1rem}
.footer p,.footer a{color:rgba(255,255,255,.4);font-weight:300;font-size:.75rem;line-height:1rem}
.footer a{transition:color .15s}
.footer a:hover{color:rgba(255,255,255,.7)}
.links{display:flex;align-items:center;gap:1.5rem}
@media(min-width:768px){.cta{padding-left:4rem;padding-right:4rem}h2{font-size:3.75rem}.sub{font-size:1rem}.footer{flex-direction:row}}
@media(min-width:1024px){.cta{padding-left:6rem;padding-right:6rem}h2{font-size:4.5rem}}
</style>
</head>
<body>
<div class="spacer"></div>
<section class="cta">
  <video class="bg" id="v" autoplay loop muted playsinline></video>
  <div class="fade top"></div>
  <div class="fade bottom"></div>
  <div class="content">
    <h2>Your next website starts here.</h2>
    <p class="sub">Book a free strategy call. See what AI&#8209;powered design can do. No commitment, no pressure. Just possibilities.</p>
    <div class="btns">
      <button class="btn glass">Book a Call
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
      </button>
      <button class="btn solid">View Pricing
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
      </button>
    </div>
    <div class="footer">
      <p>&copy; 2026 Studio. All rights reserved.</p>
      <div class="links"><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Contact</a></div>
    </div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(function(){
  var v=document.getElementById('v');
  var src="https://stream.mux.com/8wrHPCX2dC3msyYU9ObwqNdm00u3ViXvOSHUMRYSEe5Q.m3u8";
  if(window.Hls&&Hls.isSupported()){
    var h=new Hls();h.loadSource(src);h.attachMedia(v);
    h.on(Hls.Events.MANIFEST_PARSED,function(){v.play().catch(function(){});});
  }else if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src=src;v.play&&v.play().catch(function(){});
  }
})();
</script>
</body>
</html>
