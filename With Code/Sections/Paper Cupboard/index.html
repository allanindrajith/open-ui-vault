:root{
  --paper:#ddd0bd; --paper-hi:#e3d8c7; --paper-lo:#d2c3ae;
  --interior:#61301c; --ink:#3a1d10; --text:#5a4535; --muted:#6e5948; --accent:#b0784f;
  --handle-closed:#6b4a33; --handle-open:#d9c9b4;
  --u:max(calc(min(100vw / 1440, 100vh / 900)), .8px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#2a160c;overflow:hidden}
body{font-family:"Instrument Sans",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.stage{position:fixed;inset:0;overflow:hidden;background:var(--interior)}

/* interior */
.interior{position:absolute;inset:0;overflow:hidden}
.plate-frame{position:absolute;left:50%;top:50%;width:1440px;height:900px;transform-origin:50% 50%}
.plate{position:absolute;left:-2px;top:9px;width:1444px;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.dim{position:absolute;inset:0;background:#1d0e06;opacity:.78;pointer-events:none}
.gapshade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 70% at 50% 45%,transparent 30%,rgba(25,10,3,.35) 100%)}
canvas.three{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
#cvIn{z-index:1}

/* doors */
.doors{position:absolute;inset:0;z-index:2;transform-style:preserve-3d;perspective-origin:50% 50%}
.door{position:absolute;top:0;height:100%;width:50%;transform-style:preserve-3d;will-change:transform}
.door.left{left:0;transform-origin:0 50%}
.door.right{right:0;transform-origin:100% 50%}
.face{position:absolute;inset:0;background:var(--paper);overflow:hidden;backface-visibility:hidden}
.door.left .face{background:linear-gradient(90deg,var(--paper-lo) 0%,var(--paper) 55%,var(--paper-hi) 100%)}
.door.right .face{background:linear-gradient(90deg,var(--paper-hi) 0%,var(--paper) 45%,var(--paper-hi) 100%)}
.grain{position:absolute;inset:0;opacity:.95;mix-blend-mode:multiply;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .37  0 0 0 0 .28  0 0 0 .3 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");background-size:240px 240px}
.shade{position:absolute;inset:0;background:#2b160a;opacity:0;pointer-events:none}
.door.left .shade{background:linear-gradient(90deg,rgba(43,22,10,.0),rgba(43,22,10,1))}
.door.right .shade{background:linear-gradient(270deg,rgba(43,22,10,.0),rgba(43,22,10,1))}
.edge{position:absolute;top:0;height:100%;width:18px;background:linear-gradient(90deg,#bba68e,#cdbba5 40%,#b39c83);}
.door.left .edge{left:100%;transform-origin:0 50%;transform:rotateY(90deg)}
.door.right .edge{right:100%;transform-origin:100% 50%;transform:rotateY(-90deg)}
.seamline{position:absolute;top:0;height:100%;width:1px;background:rgba(60,35,18,.28)}
.door.left .seamline{right:0}
.door.right .seamline{left:0;background:rgba(255,248,236,.35)}

/* door content */
.copy{position:absolute;left:calc(55 * var(--u));top:calc(180 * var(--u))}
.copy .cr{font-size:max(11px, calc(12.6 * var(--u)));letter-spacing:.035em;color:var(--accent);font-weight:500}
.copy .tag{margin-top:calc(9 * var(--u));margin-left:calc(8 * var(--u));font-size:max(12px, calc(14 * var(--u)));line-height:calc(19 * var(--u));color:var(--text)}
.links{position:absolute;left:calc(190 * var(--u));top:calc(180 * var(--u));display:flex}
.col h4{font-size:max(12px, calc(14 * var(--u)));font-weight:500;color:var(--ink);line-height:1;margin-bottom:calc(11 * var(--u))}
.col a{display:block;font-size:max(12px, calc(14 * var(--u)));line-height:max(20px, calc(24 * var(--u)));color:var(--muted);transition:color .25s}
.col a:hover{color:var(--ink)}
.col.c1{width:calc(185 * var(--u))}
.col.c2{width:calc(180 * var(--u))}
.emboss{position:absolute;bottom:0;overflow:visible;pointer-events:none}
.door.left .emboss{left:calc(38 * var(--u));width:min(calc(580 * var(--u)), calc(50vw - 60 * var(--u)));height:calc(200 * var(--u))}
.door.right .emboss{left:calc(156 * var(--u));width:min(calc(520 * var(--u)), calc(50vw - 176 * var(--u)));height:calc(200 * var(--u))}

/* handles */
.handle{position:absolute;top:calc(307 * var(--u));width:calc(33 * var(--u));height:calc(205 * var(--u));border:0;border-radius:999px;cursor:pointer;
  background:var(--handle-closed);
  box-shadow:inset calc(2 * var(--u)) calc(2 * var(--u)) calc(3 * var(--u)) rgba(255,250,240,.28),inset calc(-2 * var(--u)) calc(-3 * var(--u)) calc(5 * var(--u)) rgba(40,20,8,.35),calc(3 * var(--u)) calc(6 * var(--u)) calc(9 * var(--u)) rgba(50,28,12,.32),calc(-1 * var(--u)) calc(-1 * var(--u)) calc(2 * var(--u)) rgba(255,250,240,.5);
  transition:background .2s ease,box-shadow .2s ease;outline-offset:4px}
.door.left .handle{right:calc(21 * var(--u))}
.door.right .handle{left:calc(21 * var(--u))}
.handle svg{position:absolute;left:50%;bottom:calc(18 * var(--u));width:calc(15 * var(--u));transform:translateX(-50%);opacity:.75}
.handle .mk{stroke:#8e6f55}
.stage.lit .handle{background:var(--handle-open)}
.stage.lit .handle .mk{stroke:#a88b70}
.handle:focus-visible{outline:2px solid var(--accent)}

/* nav */
nav{position:absolute;z-index:4;left:0;right:0;top:0;height:calc(58 * var(--u));display:flex;align-items:center;justify-content:space-between;padding:0 calc(42 * var(--u));pointer-events:none}
nav>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:calc(9 * var(--u));font-family:"Newsreader",serif;font-size:calc(25 * var(--u));letter-spacing:-.01em;color:var(--ink)}
.logo svg{width:calc(33 * var(--u))}
.navlinks{position:relative;margin-left:calc(-10 * var(--u));display:flex;gap:calc(26 * var(--u));font-size:max(12px, calc(14.5 * var(--u)));color:#3e2a1c}
.navband{position:absolute;left:0;right:0;top:0;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none;--gl:50vw;--gr:50vw;-webkit-mask-image:linear-gradient(90deg,#000 var(--gl),transparent var(--gl),transparent var(--gr),#000 var(--gr));mask-image:linear-gradient(90deg,#000 var(--gl),transparent var(--gl),transparent var(--gr),#000 var(--gr))}
.navband .navlinks{pointer-events:auto}
.navband.lite{color:#f0e5d4;-webkit-mask-image:linear-gradient(90deg,transparent var(--gl),#000 var(--gl),#000 var(--gr),transparent var(--gr));mask-image:linear-gradient(90deg,transparent var(--gl),#000 var(--gl),#000 var(--gr),transparent var(--gr))}
.navband.lite .navlinks{color:inherit;pointer-events:none}
.navlinks a{transition:opacity .25s;padding:8px 0;margin:-8px 0}
.logo{padding:5px 0;margin:-5px 0}
.navlinks a:hover{opacity:.6}
.navlinks .arr{display:inline-block;margin-left:calc(5 * var(--u));font-size:.9em}
.cta{background:#b7784f;color:#fbf1e6;font-size:max(11.5px, calc(13 * var(--u)));padding:0 max(12px, calc(16 * var(--u)));height:max(28px, calc(30 * var(--u)));display:flex;align-items:center;border-radius:999px;transition:background .25s}
.cta:hover{background:#a86c45}
#cvFront{z-index:3}

/* load reveal (once) */
.rv{opacity:0;transform:translateY(10px)}
.ready .rv{opacity:1;transform:none;transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}

/* small desktops / landscape tablets: tighter columns */
@media (max-width:1279px){
  .links{left:calc(120 * var(--u))}
  .col.c1{width:calc(150 * var(--u))} .col.c2{width:calc(140 * var(--u))}
  .copy{left:calc(40 * var(--u))}
}
/* stacked layout: phones, portrait tablets, landscape phones */
@media (max-width:820px), (max-width:1180px) and (orientation:portrait), (orientation:landscape) and (max-height:520px){
  :root{--u:min(calc(100vw / 390), 1.35px)}
  nav{height:auto;padding:calc(14 * var(--u)) calc(16 * var(--u)) 0;flex-wrap:wrap;align-items:flex-start;row-gap:calc(10 * var(--u))}
  .logo{font-size:calc(21 * var(--u))} .logo svg{width:calc(26 * var(--u))}
  .cta{font-size:max(11.5px, calc(12 * var(--u)));height:max(28px, calc(28 * var(--u)));padding:0 calc(13 * var(--u))}
  .navband{top:calc(58 * var(--u));height:calc(24 * var(--u))}

      const bank = (fromLow ? -0.32 : 0.28) * (1 - s2) + Math.sin(t * Math.PI * 3.2) * 0.13 * (1 - t);
      qRoll.setFromAxisAngle(xAxis, bank); qFly.multiply(qRoll);
      const blend = THREE.MathUtils.smoothstep(s2, 0.62, 1);
      mesh.quaternion.copy(qFly).slerp(qLand, blend);
      mesh.position.copy(pos);
      if (!inside && pos.z < doorZAt(pos.x) - 6) { inside = true; sceneFront.remove(mesh); sceneIn.add(mesh); }
      const h = Math.max(0, pos.y - land.y);
      shadow.material.opacity = inside ? THREE.MathUtils.clamp(1 - h / (L * 1.4), 0, 1) : 0;
    } else {
      if (!inside) { inside = true; sceneFront.remove(mesh); sceneIn.add(mesh); }
      const k = Math.min(1, (el - dur) / settle);
      const drop = L * 0.06 * (1 - k) - Math.sin(k * Math.PI) * L * 0.018;
      mesh.position.copy(land).add(new THREE.Vector3(0, drop, 0));
      const rock = Math.sin(k * Math.PI * 2) * 0.05 * (1 - k);
      mesh.quaternion.copy(qLand).multiply(qRoll.setFromAxisAngle(xAxis, rock));
      shadow.material.opacity = 1;
      if (k >= 1) { flying--; landed.push(mesh); needsRender = true; return; }
    }
    needsRender = true;
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
let flying = 0;

function loop() {
  if (needsRender) { rIn.render(sceneIn, camera); rFront.render(sceneFront, camera); needsRender = false; }
  requestAnimationFrame(loop);
}
addEventListener('resize', layout);
layout(); loop();
window.__footer = { openDoors, closeDoors, get angle() { return angle; } };
</script>
