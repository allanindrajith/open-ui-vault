<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behind the lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{background:#fff;color:#000;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
.blog{max-width:1200px;margin:0 auto;padding:60px 20px}
.badge-blog{display:inline-block;background:#f4f4f4;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;color:#333;margin-bottom:20px}
h1{font-family:'Outfit',sans-serif;font-size:64px;font-weight:500;letter-spacing:-2.5px;line-height:1.05}
.header-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-top:20px;margin-bottom:40px}
.sub{max-width:480px;color:#666;font-size:18px;font-weight:500;opacity:.8;line-height:1.5}
.btn{background:#000;color:#fff;border:0;border-radius:40px;padding:14px 26px;font:600 14px 'Inter',sans-serif;cursor:pointer;transition:transform .3s;white-space:nowrap}
.btn:hover{transform:scale(1.02)}
.vid{position:relative;overflow:hidden;border-radius:20px;background:#e9e9e9}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.33,1,.68,1)}
.vid:hover video{transform:scale(1.08)}
.vid::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.25);opacity:0;transition:opacity .4s;pointer-events:none}
.vid:hover::after{opacity:1}
.plus{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:300;z-index:3;opacity:0;transform:scale(.7);transition:transform .3s,opacity .3s;pointer-events:none}
.vid:hover .plus{opacity:1;transform:scale(1)}
.c{position:absolute;width:12px;height:12px;z-index:3;border:0 solid #fff;pointer-events:none}
.c.tl{top:15px;left:15px;border-top-width:1.5px;border-left-width:1.5px}
.c.tr{top:15px;right:15px;border-top-width:1.5px;border-right-width:1.5px}
.c.bl{bottom:15px;left:15px;border-bottom-width:1.5px;border-left-width:1.5px}
.c.br{bottom:15px;right:15px;border-bottom-width:1.5px;border-right-width:1.5px}
.featured{display:grid;grid-template-columns:1fr 1fr;border:1px solid #f0f0f0;border-radius:20px;min-height:520px;background:#fcfcfc;overflow:hidden;margin-bottom:25px}
.featured .vid{border-radius:0;min-height:520px}
.fc{padding:60px;display:flex;flex-direction:column;align-items:flex-start}
.must{background:#000;color:#fff;font-size:12px;font-weight:600;border-radius:20px;padding:5px 14px;margin-bottom:24px}
.fc h2{font-family:'Outfit',sans-serif;font-size:48px;font-weight:500;letter-spacing:-1.5px;line-height:1.1;margin-bottom:20px}
.fc p{color:#666;font-size:17px;line-height:1.55}
.ffoot{margin-top:auto;padding-top:30px;display:flex;align-items:center;gap:14px;font-size:14px;font-weight:500}
.cat{display:inline-block;color:#fff;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;text-transform:capitalize;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}
.card .vid{aspect-ratio:16/10}
.ct{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:16px}
.ct h3{font-family:'Outfit',sans-serif;font-size:17px;font-weight:600;line-height:1.35}
@media(max-width:1024px){
.featured{grid-template-columns:1fr}
.featured .vid{min-height:0;aspect-ratio:16/10}
.fc{padding:40px}
.grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
h1{font-size:48px;letter-spacing:-1.8px}
.header-bottom{flex-direction:column;align-items:flex-start}
.grid{grid-template-columns:1fr}
.fc h2{font-size:32px}
}
</style>
</head>
<body>
<section class="blog">
  <span class="badge-blog">Blog</span>
  <h1>Behind the lens</h1>
  <div class="header-bottom">
    <p class="sub">Thoughts, insights, and stories from my photography journey. Take a peek into my creative process and recent projects.</p>
    <button class="btn">View all posts</button>
  </div>
  <div id="root"></div>
</section>
<script>
const posts=[
{type:'featured',badge:'Must Read',title:"Full-Frame vs. Crop Sensor: Which for Photography?",description:"An honest look at the real-world differences between these camera systems to help you choose what's actually right for your photography needs.",author:"By August Renner (c)",category:"Gear",color:"#7d1a4a",video:"https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260507_155500_808e6fdd-761f-4acd-b3be-cb7e6e700def.mp4",order:1},
{type:'standard',title:"Finding Natural Light in Unexpected Places",category:"Lighting",color:"#2c4c34",video:"https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260506_030111_a9e15665-d379-4a7f-8116-695bbe452ad1.mp4",order:2},
{type:'standard',title:"My Approach to Editing: Creating a Consistent Photography Style",category:"Editing",color:"#a63e2d",video:"https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260508_064122_c4750c0e-7476-4b44-94a2-a85a65c63bf2.mp4",order:3},
{type:'standard',title:"Pricing Your Photography: Strategies That Work",category:"Business",color:"#1a2b8c",video:"https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260507_154232_f8809bd2-a6c3-4a38-908d-2005e5b3cb3e.mp4",order:4}
].sort((a,b)=>a.order-b.order);
const vid=u=>`<div class="vid"><video src="${u}" autoplay loop muted playsinline></video><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span><div class="plus">+</div></div>`;
const f=posts.find(p=>p.type==='featured'), rest=posts.filter(p=>p.type!=='featured');
document.getElementById('root').innerHTML=
`<article class="featured">${vid(f.video)}<div class="fc"><span class="must">${f.badge}</span><h2>${f.title}</h2><p>${f.description}</p><div class="ffoot"><span>${f.author}</span><span class="cat" style="background:${f.color}">${f.category}</span></div></div></article>`+
`<div class="grid">${rest.map(p=>`<article class="card">${vid(p.video)}<div class="ct"><h3>${p.title}</h3><span class="cat" style="background:${p.color}">${p.category}</span></div></article>`).join('')}</div>`;
document.querySelectorAll('video').forEach(v=>{v.muted=true;v.play().catch(()=>{})});
</script>
</body>
</html>
