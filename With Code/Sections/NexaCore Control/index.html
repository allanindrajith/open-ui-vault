<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexaCore Control</title>
<style>
@font-face{font-family:'Mazzard H';font-weight:400;font-style:normal;src:url('https://db.onlinewebfonts.com/t/eb5b5ee332420add9a40ee988cb6ac37.woff2') format('woff2'),url('https://db.onlinewebfonts.com/t/eb5b5ee332420add9a40ee988cb6ac37.woff') format('woff'),url('https://db.onlinewebfonts.com/t/eb5b5ee332420add9a40ee988cb6ac37.ttf') format('truetype');}
@font-face{font-family:'Mazzard H';font-weight:500;font-style:normal;src:url('https://db.onlinewebfonts.com/t/875fffdfa62169a0f131e90f37f1faf4.woff2') format('woff2'),url('https://db.onlinewebfonts.com/t/875fffdfa62169a0f131e90f37f1faf4.woff') format('woff'),url('https://db.onlinewebfonts.com/t/875fffdfa62169a0f131e90f37f1faf4.ttf') format('truetype');}
*{box-sizing:border-box}
html,body,*{font-family:'Mazzard H',system-ui,-apple-system,'Segoe UI',sans-serif}
body{margin:0;background:#fff;overflow-x:hidden}
.section{width:100%;display:flex;flex-direction:column;align-items:center;background:#fff;padding:clamp(48px,6vw,80px) clamp(16px,3vw,40px);gap:36px}
.header{display:flex;flex-direction:column;align-items:center;gap:36px;text-align:center}
.badge{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:500;border-radius:9999px;background:rgb(249,249,249);padding:max(0.9vw,10px) max(1.25vw,16px);color:rgb(26,11,84)}
.badge svg{width:19px;height:18px;flex-shrink:0}
h2{font-weight:500;font-size:clamp(32px,4vw,56px);color:rgb(26,11,84);line-height:1.15;margin:0}
.grad{background-image:linear-gradient(90deg,rgb(43,167,255),rgb(202,69,255) 50%,rgb(254,136,27));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;padding-bottom:0.3vw;display:inline-block}
.grid{width:100%;display:flex;flex-direction:column;gap:24px;padding:0 clamp(0px,2.92vw,40px);align-items:start}
.col{display:flex;flex-direction:column;gap:12px;font-size:clamp(13px,1.15vw,17px);min-width:0;width:100%}
.neg{color:rgb(131,121,158)}
.card{display:flex;flex-direction:column;gap:12px;padding:clamp(12px,0.97vw,16px) clamp(14px,1.25vw,20px);border-radius:18px;background:#fff;box-shadow:0 3px 9.1px #3f4a7e0d,0 1px 29px #3f4a7e1a}
.card img{width:clamp(16px,1.25vw,20px);flex-shrink:0}
.pos .card div{color:rgb(26,11,84)}
.center{display:flex;align-items:center;justify-content:center;order:-1;align-self:center}
.circle{position:relative;border-radius:50%;overflow:hidden;width:clamp(200px,22vw,400px);height:clamp(200px,22vw,400px);flex-shrink:0;background:radial-gradient(circle at 35% 30%,#cfe6ff,#c986ff 55%,#ffb778)}
.circle video{width:160%;height:160%;object-fit:cover;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
@media(min-width:1024px){
 .grid{display:grid;grid-template-columns:26vw 1fr 26vw;column-gap:36px;row-gap:24px}
 .center{order:0}
}
</style>
</head>
<body>
<section class="section">
  <div class="header">
    <div class="badge">
      <svg viewBox="0 0 17 16" fill="none" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#freedom-clip)"><path fill-rule="evenodd" clip-rule="evenodd" d="M8.50037 3.66955C7.53221 2.82462 6.41758 2.275 5.333 2.07887C4.11096 1.85888 2.84987 2.0826 1.96658 2.95885C1.10056 3.81944 0.866218 5.04172 1.06751 6.23193C1.24778 7.29835 1.7803 8.39907 2.60501 9.35959C2.41536 10.1071 2.46371 10.8946 2.7434 11.6137C3.02308 12.3327 3.52035 12.9481 4.16678 13.375C4.81321 13.802 5.57702 14.0195 6.35308 13.9976C7.12915 13.9758 7.87933 13.7157 8.50037 13.2531C9.12146 13.7161 9.87183 13.9765 10.6482 13.9985C11.4245 14.0205 12.1886 13.8029 12.8352 13.3758C13.4819 12.9487 13.9792 12.3331 14.2588 11.6137C14.5384 10.8943 14.5865 10.1065 14.3965 9.35884C15.2204 8.39832 15.753 7.29835 15.9325 6.23119C16.1338 5.04098 15.8994 3.81944 15.0334 2.9596C14.1501 2.0826 12.889 1.85888 11.667 2.07962C10.5824 2.275 9.46854 2.82537 8.50037 3.66955Z" fill="rgb(200, 111, 255)"/></g><defs><clipPath id="freedom-clip"><rect width="16" height="16" fill="white" transform="translate(0.5)"/></clipPath></defs></svg>
      Control
    </div>
    <h2>Stop absorbing the chaos.<br><span class="grad">Run with confidence.</span></h2>
  </div>
  <div class="grid">
    <div class="col neg" id="neg"></div>
    <div class="center"><div class="circle"><video id="v" autoplay loop muted playsinline></video></div></div>
    <div class="col pos" id="pos"></div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
var HLS_SRC='https://stream.mux.com/bnYL6x5cAX6WiJv2pOKpITehZd3NVdXpj3ylJFpX5Lk.m3u8';
var CROSS='https://cdn.prod.website-files.com/6720dd1ab6df0da205830ab1/686cc0f520a992816d8b15dc_bullet-list-cross.svg';
var CHECK='https://cdn.prod.website-files.com/6720dd1ab6df0da205830ab1/686cc068490683bbb3377d04_bullet-list.svg';
var negatives=['Reactive firefighting when foundational issues surface too late','Bloated coordination overhead drains bandwidth from core teams',"Constant re-verification because source data can't be trusted",'Fragmented vendor relations produce mismatched deliverables','Scattered specs and decisions buried across siloed systems'];
var positives=['Layered dependency maps eliminate costly surprises at every phase','Streamlined team handoffs deliver production-ready outcomes fast','Live validation loops keep requirements locked across all stages','Unified vendor management through a single accountable contact','Centralized context and clear records accelerate every decision'];
function fill(id,list,icon){var el=document.getElementById(id);list.forEach(function(t){var c=document.createElement('div');c.className='card';var i=document.createElement('img');i.src=icon;i.alt='';i.setAttribute('aria-hidden','true');var d=document.createElement('div');d.textContent=t;c.appendChild(i);c.appendChild(d);el.appendChild(c);});}
fill('neg',negatives,CROSS);fill('pos',positives,CHECK);
var video=document.getElementById('v');
try{
if(window.Hls&&Hls.isSupported()){
 var hls=new Hls({startLevel:-1,capLevelToPlayerSize:false,maxMaxBufferLength:60,enableWorker:true});
 hls.loadSource(HLS_SRC);hls.attachMedia(video);
 hls.on(Hls.Events.MANIFEST_PARSED,function(){hls.currentLevel=hls.levels.length-1;video.play().catch(function(){});});
}else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=HLS_SRC;video.play().catch(function(){});}
}catch(e){}
</script>
</body>
</html>
