<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glow Features</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0A0A0B;overflow-x:hidden}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.page{min-height:100vh;background:#0A0A0B;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.grid{display:grid;grid-template-columns:1fr;gap:40px;width:100%;max-width:936px}
.wrap{position:relative;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;width:100%;max-width:260px;margin:0 auto;opacity:0;transform:translateY(30px);animation:in .8s ease-out forwards}
.glow{position:absolute;top:0;left:0;width:100%;height:260px;opacity:.6;border-radius:40px;pointer-events:none;filter:blur(45px)}
.card{position:relative;align-self:stretch;width:100%;height:260px;border-radius:40px;z-index:10;overflow:hidden;border:8px solid transparent}
.inner{width:100%;height:100%;padding:28px;display:flex;flex-direction:column;justify-content:space-between}
.icon{color:rgba(255,255,255,.9);display:flex}
h3{color:#fff;font-weight:500;font-size:20px;line-height:28px;margin-bottom:12px;letter-spacing:-.025em}
p{color:#9ca3af;font-size:14px;line-height:1.6;font-weight:400}
p::selection{background:rgba(255,255,255,.2)}
@keyframes in{to{opacity:1;transform:none}}
@media(min-width:768px){
.page{padding:48px}
.grid{grid-template-columns:repeat(3,1fr);gap:12px}
.wrap{max-width:300px}
.glow,.card{height:300px}
}
@media(prefers-reduced-motion:reduce){.wrap{animation-duration:.01s}}
</style>
</head>
<body>
<div class="page"><div class="grid" id="grid"></div></div>
<script>
var I={
Monitor:'<rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>',
Palette:'<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>',
Zap:'<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>'
};
var D=[
["Hardware","Monitor","My entire desktop setup is built for power. It is silent, durable, and holds my focus.","linear-gradient(137deg, #FF3D77 0%, #FFB1CE 45%, #FF9D3C 100%)",.1],
["Studio","Palette","Studio is where I define every single pixel. It is the hub for each canvas I deliver.","linear-gradient(137deg, #FFFFFF 0%, #7DD3FC 45%, #06B6D4 100%)",.2],
["Motion","Zap","I use Motion to build lively prototypes, bridging the gap between views and code.","linear-gradient(137deg, #4361EE 0%, #E0AEFF 45%, #F72585 100%)",.3]
];
var g=document.getElementById('grid');
D.forEach(function(d){
var w=document.createElement('div');w.className='wrap';w.style.animationDelay=d[4]+'s';
w.innerHTML='<div class="glow" style="background:'+d[3]+'"></div>'+
'<div class="card" style="background:linear-gradient(#1A1A1C,#1A1A1C) padding-box,'+d[3]+' border-box"><div class="inner">'+
'<div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'+I[d[1]]+'</svg></div>'+
'<div><h3>'+d[0]+'</h3><p>'+d[2]+'</p></div></div></div>';
g.appendChild(w);
});
</script>
</body>
</html>
