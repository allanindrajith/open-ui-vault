:root{
  --bg:#0c0907; --accent:#ff8f5a; --ink:#f3ead8;
  --u:calc(100vw / 1440);
  --covers:url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261117_055020_74d6a446-0656-45bc-a43a-0ed29d2826c2.png&w=1744&q=85");
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}

/* ---------- Section 2: revealed hero ---------- */
.hero{position:relative;height:100vh;height:100svh;min-height:calc(560 * var(--u));overflow:hidden;background:var(--bg)}
.logo{position:absolute;z-index:5;left:calc(39 * var(--u));top:calc(7 * var(--u));width:calc(46 * var(--u));height:calc(46 * var(--u));color:var(--accent);display:block}
.logo svg{width:100%;height:100%;display:block}
.nav{position:absolute;z-index:5;right:calc(40 * var(--u));top:calc(16 * var(--u));display:flex;gap:calc(34 * var(--u));font-size:max(14px,calc(19 * var(--u)));font-weight:500;letter-spacing:-.01em;line-height:1.2}
.nav a{border-bottom:1px solid transparent;padding-bottom:2px;transition:border-color .2s}
.nav a:hover,.nav a[aria-current="page"]{border-bottom-color:currentColor}

/* wordmark: font-size, position and horizontal scale are fitted in JS so the caps
   land exactly on the mockup box (45..1405 x 78..440 at 1440 wide) */
.word{position:absolute;z-index:1;left:0;right:0;top:0;height:1em;white-space:nowrap;font-family:"Anton",Impact,sans-serif;font-weight:400;line-height:1;color:var(--accent);text-transform:uppercase;font-size:300px;pointer-events:none}
.word span{position:absolute;top:0;left:0;display:block;transform-origin:0 0;clip-path:inset(-5% 100% -5% 0);transition:clip-path .5s cubic-bezier(.65,0,.35,1)}
.eye-loaded .word span{clip-path:inset(-5% -2% -5% 0)}
.word span:nth-of-type(1){transition-delay:.00s}.word span:nth-of-type(2){transition-delay:.07s}
.word span:nth-of-type(3){transition-delay:.14s}.word span:nth-of-type(4){transition-delay:.21s}
.word span:nth-of-type(5){transition-delay:.28s}.word span:nth-of-type(6){transition-delay:.35s}

/* magazine covers: one 2x2 generated sheet, shown with background-position crops */
.covers{position:absolute;inset:0;z-index:2;pointer-events:none}
.cover{position:absolute;aspect-ratio:872/1168;background-image:var(--covers);background-size:200% 200%;background-repeat:no-repeat;transform-origin:50% 0;
  transform:translateY(var(--drop,0)) rotate(var(--r));--drop:calc(100vh + 20%);
  box-shadow:0 calc(14 * var(--u)) calc(40 * var(--u)) rgba(0,0,0,.55);
  transition:transform 1s cubic-bezier(.16,1,.3,1)}
.eye-loaded .cover{--drop:0px}
/* desktop positions: top-edge midpoint, width and tilt measured on the 1440x900 mockup */
.c1{--r:-8.3deg;width:calc(487 * var(--u));left:calc((251 - 243.5) * var(--u));top:calc(433 * var(--u));background-position:0 0;z-index:1;transition-delay:.45s}
.c3{--r:6deg;width:calc(429 * var(--u));left:calc((1216 - 214.5) * var(--u));top:calc(427 * var(--u));background-position:0 100%;z-index:2;transition-delay:.69s}
.c2{--r:-4.4deg;width:calc(459 * var(--u));left:calc((741 - 229.5) * var(--u));top:calc(397 * var(--u));background-position:100% 0;z-index:3;transition-delay:.57s}

/* portrait phones and tablets: same parts, re-stacked to fill a tall screen */
@media (max-width:819px) and (max-aspect-ratio:1/1){
  :root{--u:calc(100vw / 390)}
  .hero{min-height:560px}
  .logo{left:16px;top:18px;width:28px;height:28px}
  .nav{right:16px;top:22px;gap:22px;font-size:15px}
  .cover{box-shadow:0 10px 30px rgba(0,0,0,.55);--w:min(60vw,46svh)}
  .c1{--r:-6deg;width:var(--w);left:4vw;top:calc(var(--covers-top) + 0px)}
  .c2{--r:4deg;width:var(--w);left:auto;right:4vw;top:calc(var(--covers-top) + var(--w) * .42)}
  .c3{--r:-3deg;width:var(--w);left:12vw;top:calc(var(--covers-top) + var(--w) * .86);z-index:4}
}

/* reduced motion or loader skipped: show the finished state, no transitions */
.eye-static .word span,.eye-static .cover{transition:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<script>
/* =====================================================================
   UNIT/0 robot-eye ASCII loader
   Plays once over the page: a monospace-character robot eye opens its
   shutters, looks around, blinks, zooms in, morphs into a 4-point star,

<script>
/* Fit the wordmark so its caps fill the mockup box exactly: caps 78..440 at 1440 wide, and each
   letter stretched onto its own measured box (x ranges below, 1440-wide units). */
(function () {
  var word = document.querySelector('.word'), root = document.documentElement;
  var spans = [].slice.call(word.querySelectorAll('span'));
  // glyph boxes solved from pixel-measured ink extents of the mockup (U 45-313, N 339-621, I 648-755, T 774-1007, / 993-1153, 0 1155-1403)
  var TGT = [[27, 332], [312, 648], [628, 776], [768, 1014], [971, 1166], [1144, 1416]];
  var portrait = window.matchMedia('(max-width:819px) and (max-aspect-ratio:1/1)');
  var m = null;
  function metrics() {
    var c = document.createElement('canvas').getContext('2d');
    c.font = '100px Anton';
    var f = c.measureText('UNIT/0'), h = c.measureText('H');
    return { asc: f.fontBoundingBoxAscent / 100, desc: f.fontBoundingBoxDescent / 100, cap: h.actualBoundingBoxAscent / 100 };
  }
  function fit() {
    if (!m) m = metrics();
    var W = window.innerWidth, left, capTop, width, capH;
    if (portrait.matches) { left = 16; width = W - 32; capH = width * 364 / 1360; capTop = 70; }
    else { var u = W / 1440; left = 45 * u; width = 1360 * u; capH = 364 * u; capTop = 79 * u; }
    var fs = capH / m.cap;
    word.style.fontSize = fs + 'px';
    var half = (fs - (m.asc + m.desc) * fs) / 2, base = half + m.asc * fs, capOffset = base - m.cap * fs;
    word.style.top = (capTop - capOffset) + 'px';
    var k = width / 1360;
    spans.forEach(function (s, i) {
      s.style.transform = 'none';
      var w = s.getBoundingClientRect().width;
      s.style.left = (left + (TGT[i][0] - 45) * k) + 'px';
      s.style.transform = 'scaleX(' + ((TGT[i][1] - TGT[i][0]) * k / w) + ')';
    });
    root.style.setProperty('--covers-top', (capTop + capH * 0.82) + 'px');
  }
  (document.fonts ? document.fonts.load('100px Anton') : Promise.resolve()).then(function () { m = null; fit(); });
  fit();
  window.addEventListener('resize', fit);
})();
</script>
