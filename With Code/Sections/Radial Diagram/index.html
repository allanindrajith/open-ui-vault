<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Comprehensive Branding Approach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css?family=DM+Sans:300,400,500,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#fff;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
section{overflow-x:hidden;background:#0f0f0f;color:#fff;font-family:'DM Sans',sans-serif}
.wrap{margin:0 auto;max-width:80rem;padding:6rem 1.5rem}
@media(min-width:640px){.wrap{padding-left:2.5rem;padding-right:2.5rem}}
@media(min-width:1024px){.wrap{padding:8rem 4rem}}
.rv{opacity:0;transition:opacity var(--d,.7s) cubic-bezier(.22,1,.36,1) var(--dl,0s),transform var(--d,.7s) cubic-bezier(.22,1,.36,1) var(--dl,0s);transform:translateY(var(--y,20px)) scale(var(--s,1))}
.in .rv{opacity:1;transform:none}
header{display:flex;align-items:flex-start;gap:1rem;margin-bottom:5rem}
.h{font-weight:300;font-size:clamp(2rem,3.4vw,2.6rem);line-height:1.18;letter-spacing:-.01em}
.gray{color:#6e6e6e}
.plus{height:1.75rem;width:1.75rem;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;margin-top:.25rem;cursor:pointer;transition:background .2s,color .2s;--y:0px;--s:.8}
.plus:hover{background:rgba(255,255,255,.1);color:#fff}
.row{display:flex;flex-direction:column;gap:3rem}
.left{display:flex;min-width:0;flex:1;flex-direction:column;gap:2rem}
@media(min-width:640px){.left{flex-direction:row;align-items:flex-start;gap:2.5rem}}
@media(min-width:1024px){.row{flex-direction:row;align-items:flex-start;gap:2.5rem}}
.portrait{position:relative;flex-shrink:0;width:250px;height:310px}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.g{position:absolute;background:#fff;opacity:0;transform:scale(0)}
.in .g{animation:gl .35s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(.5s + var(--i)*.05s)}
@keyframes gl{0%{opacity:0;transform:scale(0)}60%{opacity:1}100%{opacity:.9;transform:scale(1)}}
.quote{min-width:0;max-width:420px}
.qm{display:block;color:#555;font-family:Georgia,'Times New Roman',serif;font-size:3.2rem;line-height:.7;--y:14px}
.qp{color:rgba(255,255,255,.9);font-size:clamp(1.05rem,1.5vw,1.28rem);font-weight:400;line-height:1.58;margin-top:.5rem}
.attr{margin-top:2.5rem;--y:14px}
.name{font-size:1.15rem;font-weight:500;letter-spacing:.01em}
.title{margin-top:.25rem;font-size:.85rem;letter-spacing:.025em;color:#6e6e6e}
.dwrap{display:flex;width:100%;max-width:360px;flex-shrink:0;align-items:center;justify-content:center;align-self:center}
@media(min-width:640px){.dwrap{max-width:400px}}
@media(min-width:1024px){.dwrap{max-width:440px}}
.dia{position:relative;width:100%;aspect-ratio:1/1;--y:0px;--d:.8s}
.dia svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dia line{stroke:#fff;stroke-width:.18;opacity:.45;transition:stroke-width .3s,opacity .3s}
.dia line.on{stroke-width:.6;opacity:1}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:clamp(1.25rem,2.8vw,2.4rem);letter-spacing:-.01em;white-space:nowrap;font-weight:300;transition:font-weight .25s;cursor:default}
.lbl.on{font-weight:700}
.lbl span{display:block;--y:16px;--d:.7s}
.lbl:hover{font-weight:700}
</style>
</head>
<body>
<section id="s">
<div class="wrap">
  <header>
    <div>
      <div class="h gray rv" style="--dl:0s">Our Comprehensive</div>
      <div class="h rv" style="--dl:.1s">Branding Approach</div>
    </div>
    <button class="plus rv" style="--dl:.25s" aria-label="Expand"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 0.5v11M0.5 6h11" stroke="currentColor" stroke-width="1.3"/></svg></button>
  </header>
  <div class="row">
    <div class="left">
      <div class="portrait rv" style="--dl:.2s;--d:.8s;--y:24px">
        <img src="https://images.pexels.com/photos/3778212/pexels-photo-3778212.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Alex West">
        <div id="glitch"></div>
      </div>
      <div class="quote">
        <span class="qm rv" style="--dl:.3s">&ldquo;</span>
        <p class="qp rv" style="--dl:.4s">We kept seeing the same pattern &mdash; brands with potential lost between messy processes, scattered visuals, and forgettable websites. This studio exists to align it all into one clear, consistent story.</p>
        <div class="attr rv" style="--dl:.55s">
          <div class="name">Alex West</div>
          <div class="title">Founder &amp; Creative Director</div>
        </div>
      </div>
    </div>
    <div class="dwrap">
      <div class="dia rv" style="--dl:.4s" id="dia">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="none" stroke="#fff" stroke-width=".18" opacity=".45"/><g id="lines"></g></svg>
      </div>
    </div>
  </div>
</div>
</section>
<script>
(function(){
  var G=[[2,-3,22,22],[12,-5,14,10],[28,-2,10,10],[82,22,8,8],[-4,75,16,12],[8,82,10,10],[-2,88,18,16],[56,82,12,14],[70,90,10,10],[42,94,8,6]];
  var gl=document.getElementById('glitch');
  G.forEach(function(g,i){var d=document.createElement('div');d.className='g';d.style.cssText='left:'+g[0]+'%;top:'+g[1]+'%;width:'+g[2]+'px;height:'+g[3]+'px;--i:'+i;gl.appendChild(d)});
  var L=[['websites',215],['brands',335],['ui/ux design',110]];
  var lines=document.getElementById('lines'),dia=document.getElementById('dia'),els=[];
  L.forEach(function(l,i){
    var a=l[1]*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
    var ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',50);ln.setAttribute('y1',50);ln.setAttribute('x2',50+36*c);ln.setAttribute('y2',50+36*s);
    lines.appendChild(ln);
    var lb=document.createElement('div');lb.className='lbl';
    lb.style.left=(50+46*c)+'%';lb.style.top=(50+46*s)+'%';
    lb.innerHTML='<span class="rv" style="--dl:'+(0.6+i*0.15)+'s">'+l[0]+'</span>';
    function on(){lb.classList.add('on');ln.classList.add('on')}
    function off(){lb.classList.remove('on');ln.classList.remove('on')}
    lb.addEventListener('mouseenter',on);lb.addEventListener('mouseleave',off);
    dia.appendChild(lb);
  });
  var s=document.getElementById('s');
  function go(){s.classList.add('in')}
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(e){if(e[0].isIntersecting){go();io.disconnect()}},{rootMargin:'0px 0px -60px 0px'});
    io.observe(s);
  }else go();
})();
</script>
</body>
</html>
