/* ---------- Design tokens (all measured on the 1672×941 reference) ---------- */
:root{
  --ref-w:1672; --ref-h:941;
  --bg:#1E0A00;             /* darkest corner of the texture, used behind the image */
  --ink:#FEFEFE;            /* headline white, sampled 253.8 avg */
  --nav-ink:#FFFFFF;
  --rule:rgba(255,236,220,.62); /* nav divider, 1px, sampled ~#949fa0 over #001a10 */
  --graffiti:#FB923C;       /* graffiti core, sampled rgb(154,228,159) */
  --graffiti-glow:#EA580C;
  /* --u: one reference pixel. Fit-to-width or fit-to-height, whichever is smaller */
  --u:min(calc(100vw / 1672), calc(100svh / 941));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
a{color:inherit;text-decoration:none}

/* ---------- Hero shell: always exactly one viewport, no blank bands ---------- */
.hero{
  position:relative; width:100vw; height:100vh; height:100svh; overflow:hidden; isolation:isolate;
  background:var(--bg) url(https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/a9f1e939-234a-4481-9706-3b0675e7aed2.webp) center / cover no-repeat;
}

/* ---------- Stage: horizontally centred column, 1672u wide, full height ---------- */
.stage{position:absolute; top:0; bottom:0; left:50%; width:calc(1672 * var(--u)); transform:translateX(-50%)}

/* NAV — text x: 63 / 360 / 649 / 950 / 1177 / 1491 ; right edge 1615 ; cap-top 46, cap 21px */
.nav{
  position:absolute; z-index:3;
  left:calc(63 * var(--u)); right:calc(58 * var(--u));
  top:calc(var(--nav-top, 44.2) * var(--u));
  display:flex; align-items:center; justify-content:space-between;
  font:700 calc(28.77 * var(--u))/1 "Roboto Condensed", "Arial Narrow", sans-serif;
  letter-spacing:calc(-0.82 * var(--u));
  text-transform:uppercase; color:var(--nav-ink); white-space:nowrap;
}
.nav a{flex:none; transition:opacity .2s; letter-spacing:calc((var(--ls, 0) - .82) * var(--u))}
.nav a:hover,.nav a:focus-visible{opacity:.7}
/* rules: 20px gap each side, lengths 143/142/136/130/152 → used as flex weights */
.nav i{display:block; height:max(1px, calc(1.4 * var(--u))); background:var(--rule);
  margin:0 calc(var(--mr) * var(--u)) 0 calc(var(--ml) * var(--u)); flex:0 1 calc(var(--w) * var(--u)); min-width:calc(12 * var(--u));
  transform:translateY(calc(var(--rule-dy, -2) * var(--u)))}

/* TITLE — Anton 288.6px; flat caps 91→339 (248px), round caps 88→342; ink 63→1610.
   Each glyph is pinned to its measured ink box: left edge + horizontal scale (see --x / --sx). */
.title{
  position:absolute; z-index:1; left:0; right:0; top:0; height:0;
  font:400 calc(288.6 * var(--u))/1 "Anton", Impact, sans-serif; color:var(--ink);
}
.title b{position:absolute; top:calc(73.14 * var(--u)); left:calc(var(--x) * var(--u));
  font-weight:400; transform:scaleX(var(--sx)); transform-origin:0 0; white-space:pre}

/* ---------- Bottom group: platform + tagline. Grows into any spare height ---------- */
.group{
  position:absolute; z-index:2; left:0; right:0; bottom:0;
  height:calc(100svh - 342 * var(--u));  /* = 599u on a 16:9 screen */

<script>
(() => {
  const root = document.documentElement;
  if (!root.classList.contains('entrance-prep')) return;

  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const animations = [];
  let complete = false;
  const finish = () => {
    if (complete) return;
    complete = true;
    root.classList.remove('entrance-prep');
    animations.forEach(animation => animation.cancel());
    reducedMotion.removeEventListener('change', onPreferenceChange);
    clearTimeout(window.entranceFallback);
  };
  const onPreferenceChange = () => {
    if (reducedMotion.matches) finish();
  };
  reducedMotion.addEventListener('change', onPreferenceChange);

  const play = (element, frames, delay, duration, easing) => {
    animations.push(element.animate(frames, {
      delay, duration, easing, fill: 'both'
    }));
  };

  const start = () => {
    if (complete || reducedMotion.matches) return finish();

    play(document.querySelector('.nav'), [
      {opacity: 0, transform: 'translateY(-6px)'},
      {opacity: 1, transform: 'none'}
    ], 100, 490, 'cubic-bezier(.22,1,.36,1)');

    document.querySelectorAll('.title b').forEach((glyph, index) => {
      const delay = index < 2 ? 100 + index * 70 : 260 + (index - 2) * 42;
      play(glyph, [
        {clipPath: 'inset(100% 0 0 0)'},
        {clipPath: 'inset(0 0 0 0)'}
      ], delay, 790, 'cubic-bezier(.19,1,.22,1)');
    });

    play(document.querySelector('.plat img'), [
      {opacity: 0}, {opacity: 1}
    ], 620, 830, 'cubic-bezier(.25,.8,.25,1)');

    play(document.querySelector('.plat svg'), [
      {clipPath: 'inset(0 100% 0 0)'},
      {clipPath: 'inset(0 0 0 0)'}
    ], 920, 810, 'cubic-bezier(.22,1,.36,1)');

    document.querySelectorAll('.tag span').forEach((line, index) => {
      play(line, [
        {opacity: 0, clipPath: 'inset(100% 0 0 0)'},
        {opacity: 1, clipPath: 'inset(0 0 0 0)'}
      ], 1270 + index * 130, 570, 'cubic-bezier(.22,1,.36,1)');
    });

    Promise.all(animations.map(animation => animation.finished)).then(finish, finish);
  };

  // Wait briefly for the authored fonts and hero image so the reveal has no font swap.
  const image = document.querySelector('.plat img');
  let readinessTimeout;
  const readiness = Promise.all([
    document.fonts.ready,
    image.decode().catch(() => {})
  ]);
  Promise.race([
    readiness,
    new Promise(resolve => { readinessTimeout = setTimeout(resolve, 1200); })
  ]).then(() => {
    clearTimeout(readinessTimeout);
    try { start(); } catch { finish(); }
  }, finish);
})();
</script>

<script id="magnet">
/* Magnet: the hanging ring drifts toward the pointer (max ~34px), leans a few degrees toward it and eases back when the pointer leaves.

(function(){
  var plat=document.querySelector('.plat'),swing=document.querySelector('.plat .swing');
  if(!plat||!swing||!Element.prototype.animate)return;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)'),fine=matchMedia('(hover: hover) and (pointer: fine)');
