:root{--blue:#5f93cf;--paper:#f3f3f2;--ink:#151515;--accent:#2f62e0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#e7e8ea}
body{font-family:"Lexend","Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
/* square post, 1em = 1% of its side */
#post{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:var(--paper);touch-action:pan-y;cursor:grab}
#post.drag{cursor:grabbing}
#track{position:absolute;inset:0;display:flex;will-change:transform}
.slide{position:relative;flex:0 0 100%;height:100%;overflow:hidden;background:var(--paper)}

/* ---------- cover ---------- */
.cover{background:var(--blue)}
.cover .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cover .t{position:absolute;color:#fff;font-weight:300;text-transform:uppercase;line-height:1.16;pointer-events:none}
.cover .kick{left:5.4%;top:8.6%;font-size:2.55em;letter-spacing:.01em}
.cover .design{left:4.6%;top:11.4%;font-size:11.2em;text-transform:none;letter-spacing:-.025em;line-height:1}
.cover .script{left:53%;top:5.4%;font:400 16em/1 "Pinyon Script",cursive;text-transform:none;color:#fff}
.cover .arent{right:6.2%;top:27.6%;font-size:3.05em;text-align:right}
.cover .found{left:5.2%;top:72.4%;font-size:3.05em}
.cover .nts{left:78.6%;top:72.4%;font-size:3.05em}
.cover .arrow{position:absolute;right:6.5%;bottom:5.6%;width:9.5%;pointer-events:none}
/* band of image cards scrolling left across her middle */
.band{position:absolute;left:0;right:0;top:39.4%;height:29.4%;overflow:hidden}
.band .row{position:absolute;left:0;top:0;height:100%;display:flex;gap:.55em;will-change:transform}
.band .card{flex:0 0 auto;height:100%;width:29.4em;background-repeat:no-repeat}

/* ---------- trend slides ---------- */
.copy{position:absolute;left:7.6%;right:7.6%;top:7.4%;font-size:2.28em;line-height:1.3;font-weight:300;text-align:justify;hyphens:none}
.num{position:absolute;left:7.6%;top:66.6%;font-size:2.6em;font-weight:400;color:var(--accent)}
.head{position:absolute;left:7.4%;top:71.2%;font-size:8.75em;font-weight:400;text-transform:uppercase;line-height:1.1;letter-spacing:-.012em;z-index:1}
.head span{display:block;overflow:hidden}
.head span i{display:block;font-style:normal;transform:translateY(105%);transition:transform .9s cubic-bezier(.2,.75,.2,1)}
.slide.on .head span i{transform:none}
.slide.on .head span+span i{transition-delay:.08s}
.piece{position:absolute;background-repeat:no-repeat;box-shadow:0 .25em .8em rgba(0,0,0,.08);cursor:move;touch-action:none;
  clip-path:inset(100% 0 0 0);transition:clip-path .8s cubic-bezier(.65,0,.25,1),box-shadow .25s,scale .25s}
.slide.on .piece{clip-path:inset(0 0 0 0)}
.piece.lift{box-shadow:0 1.6em 3em rgba(0,0,0,.22);scale:1.04;transition:clip-path .8s cubic-bezier(.65,0,.25,1),box-shadow .25s,scale .25s}
.deco{position:absolute;pointer-events:none}

/* ---------- end card ---------- */
.end{background:linear-gradient(180deg,#86b1e2 0%,#a5c6ec 48%,#d4e3f3 100%);color:#fff}
.end .grid{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(90deg,transparent calc(8.6% - 1px),rgba(255,255,255,.16) 8.6%,transparent calc(8.6% + 1px)),
  linear-gradient(180deg,transparent calc(42% - 1px),rgba(255,255,255,.16) 42%,transparent calc(42% + 1px))}
.end h2{position:absolute;left:13.4%;top:10%;font-size:7.4em;font-weight:300;line-height:1.08;text-transform:uppercase;letter-spacing:-.01em}
.end p{position:absolute;left:13.4%;width:55%;top:50.4%;font-size:3.55em;font-weight:300;line-height:1.24;text-align:justify}
.end .cta{position:absolute;left:13.4%;top:83.6%;font-size:3.6em;font-weight:300;text-transform:uppercase;letter-spacing:.01em;cursor:pointer}
.end .cta svg{position:absolute;left:-20%;top:-62%;width:150%;height:220%;overflow:visible;pointer-events:none}
.end .cta svg path{fill:none;stroke:#2d6ee8;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s cubic-bezier(.6,0,.2,1) .35s}
.end.on .cta svg path{stroke-dashoffset:0}
.end .cta:hover{animation:wig .5s}
@keyframes wig{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.end .brand{position:absolute;right:6.6%;top:84.6%;font-size:2.7em;font-weight:500;letter-spacing:.18em}

/* ---------- chrome ---------- */
.nav{position:absolute;top:50%;width:6.4em;height:6.4em;margin-top:-3.2em;border:0;border-radius:50%;background:rgba(255,255,255,.88);color:#151515;cursor:pointer;
  display:grid;place-items:center;box-shadow:0 .3em 1.2em rgba(0,0,0,.12);opacity:0;transition:opacity .3s,transform .3s;z-index:5}
.nav svg{width:42%;height:42%}
#prev{left:2.4%}#next{right:2.4%}
#post:hover .nav{opacity:1}
.nav[disabled]{opacity:0!important;pointer-events:none}
.nav:active{transform:scale(.92)}
#dots{position:absolute;left:50%;bottom:2.6%;transform:translateX(-50%);display:flex;gap:1.1em;z-index:5}
#dots b{width:1.25em;height:1.25em;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 .12em rgba(0,0,0,.08);transition:background .3s,transform .3s;cursor:pointer}
#dots b.on{background:#fff;transform:scale(1.25)}
#post.light #dots b{background:rgba(0,0,0,.18)}
#post.light #dots b.on{background:var(--ink)}
</style>
</head>

  p:[['A6',8.5,23,22,30,.5,.25],['A5',27,40,21,27],['A7',51,23,32,41],['A4',69,57,25,34]],
  deco:'<svg class="deco" style="left:21%;top:20%;width:17%;height:14%" viewBox="0 0 100 80"><path d="M8 60C30 10 40 70 55 25S80 50 92 12M14 72C34 30 52 66 68 30" fill="none" stroke="#f3cf2a" stroke-width="6" stroke-linecap="round"/></svg>'},
 {n:'03',h:['Punk/','grunge'],c:'Smudged type, xerox grain and ripped-paper layouts pull straight from homemade zines and gig flyers. Today that noise is how brands say independent, urgent and not interested in blending in.',
  p:[['A8',8,23,24,36],['A9',28.5,29,24,40,.5,.35],['A11',69,20,19,25],['A10',63,54,27,36,.5,.5]]},
 {n:'04',h:['Curated','objects'],c:'Things are shot, scanned or drawn, then laid out like a private collection. Instead of one perfect hero image, brands build a world out of what they keep: ingredients, tools, references, products and the small details that show taste.',
  p:[['B0',8,43.5,36,22],['B1',33,26,22,31],['B3',77,21,15.5,18],['B2',63,51,28,32]]},
 {n:'05',h:['Distorted','portraits'],c:'Stretched faces, warped proportions and digital edits turn a familiar portrait into something you can\'t scroll past. The distortion adds humour, tension and a touch of the surreal, a sharper way for fashion, music and culture brands to show who they are.',
  p:[['B4',8,22,29,32,.35,.4],['B5',36,40,22,27],['B6',64,20,30,31],['B7',69,52,27,44,.5,.3]]}];
const track=document.getElementById('track');
TRENDS.forEach(t=>{const s=document.createElement('section');s.className='slide';
  s.innerHTML=`<p class="copy">${t.c}</p>${t.deco||''}<div class="num">${t.n}</div><h2 class="head"><span><i>${t.h[0]}</i></span><span><i>${t.h[1]}</i></span></h2>`;
  t.p.forEach(([id,x,y,w,h,fx,fy],k)=>{const d=document.createElement('div');d.className='piece';
    Object.assign(d.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%',transitionDelay:(.12+k*.09)+'s'});paint(d,id,w,h,fx,fy);s.appendChild(d)});
  track.appendChild(s)});
const end=document.createElement('section');end.className='slide end';
end.innerHTML=`<div class="grid"></div><h2>Which one<br>belongs in your<br>brand's world?</h2>
<p>Spotting a trend is easy. Deciding what to take, what to skip and how to make it feel like yours is the real design work.</p>
<div class="cta">Let's talk<svg viewBox="0 0 200 80" preserveAspectRatio="none"><path pathLength="1" d="M150 14C112 2 34 6 12 30c-18 20 22 38 82 38 62 0 104-12 102-32C194 16 140 8 96 10 58 12 28 20 22 28"/></svg></div>
<div class="brand">HALFTONE.</div>`;
track.appendChild(end);

/* cover band: cards taken from the trend images, scrolling left forever */
const BAND=['A1','B0','B8','A4','B9','A10','B11','A6'];
const row=document.getElementById('row');
for(let r=0;r<2;r++)BAND.forEach(id=>{const c=document.createElement('div');c.className='card';paint(c,id,29.4,29.4);row.appendChild(c)});

/* ---------- sizing ---------- */
const post=document.getElementById('post');let S=0;
function size(){S=Math.min(innerWidth,innerHeight);post.style.width=post.style.height=S+'px';post.style.fontSize=S/100+'px';place(false)}
addEventListener('resize',size);

/* ---------- carousel: drag / swipe, arrows, dots, keys ---------- */
const slides=[...track.children],N=slides.length;let cur=0,dx=0;
const dots=document.getElementById('dots');slides.forEach((_,i)=>{const b=document.createElement('b');b.onclick=()=>go(i);dots.appendChild(b)});
function place(anim){track.style.transition=anim?'transform .62s cubic-bezier(.22,.8,.2,1)':'none';track.style.transform=`translateX(${-cur*S+dx}px)`}
function go(i){cur=Math.max(0,Math.min(N-1,i));dx=0;place(true);
  slides.forEach((s,k)=>s.classList.toggle('on',k===cur));
  [...dots.children].forEach((b,k)=>b.classList.toggle('on',k===cur));
  post.classList.toggle('light',cur>0&&cur<N-1);
  document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===N-1}
document.getElementById('prev').onclick=e=>{e.stopPropagation();go(cur-1)};
document.getElementById('next').onclick=e=>{e.stopPropagation();go(cur+1)};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});

let sw=null,piece=null;
post.addEventListener('pointerdown',e=>{if(e.target.closest('.nav,#dots'))return;
  const p=e.target.closest('.piece');
  if(p&&p.closest('.slide.on')){ // collage pieces can be moved around like a moodboard
    const r=p.parentElement.getBoundingClientRect();piece={el:p,ox:e.clientX,oy:e.clientY,l:parseFloat(p.style.left),t:parseFloat(p.style.top),w:r.width,h:r.height};
    p.classList.add('lift');p.style.zIndex=++zTop;p.setPointerCapture(e.pointerId);return}
  sw={x:e.clientX,y:e.clientY,t:performance.now(),lock:null};post.setPointerCapture(e.pointerId)});
let zTop=10;
addEventListener('pointermove',e=>{
  if(piece){const p=piece;p.el.style.left=p.l+(e.clientX-p.ox)/p.w*100+'%';p.el.style.top=p.t+(e.clientY-p.oy)/p.h*100+'%';
    p.el.style.rotate=Math.max(-6,Math.min(6,(e.clientX-p.ox)/40))+'deg';return}
  if(!sw)return;const mx=e.clientX-sw.x,my=e.clientY-sw.y;
  if(sw.lock===null&&Math.abs(mx)+Math.abs(my)>6)sw.lock=Math.abs(mx)>Math.abs(my);
  if(!sw.lock)return;post.classList.add('drag');
  dx=(cur===0&&mx>0)||(cur===N-1&&mx<0)?mx*.28:mx;place(false)});
const release=e=>{
  if(piece){piece.el.classList.remove('lift');piece.el.style.rotate='0deg';piece=null;return}
  if(!sw)return;const mx=e.clientX-sw.x,v=mx/Math.max(1,performance.now()-sw.t);post.classList.remove('drag');
  if(sw.lock&&(Math.abs(mx)>S*.18||Math.abs(v)>.45))go(cur+(mx<0?1:-1));else{dx=0;place(true)}sw=null};
addEventListener('pointerup',release);addEventListener('pointercancel',release);

/* band motion: one card every ~2 s; slows right down while the pointer is over it */
const band=document.querySelector('.band');let off=0,spd=1,hov=false,last=performance.now();
band.addEventListener('pointerenter',()=>hov=true);band.addEventListener('pointerleave',()=>hov=false);
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  spd+=((hov?.22:1)-spd)*Math.min(1,dt*3);
  const unit=(29.4+.55)*S/100,loop=unit*BAND.length;off=(off+unit/2.05*spd*dt)%loop;
  row.style.transform=`translateX(${-off}px)`;requestAnimationFrame(tick)}
size();go(0);requestAnimationFrame(tick);
window.__post={go,get cur(){return cur}};
</script>
</body>
